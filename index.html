<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Vigie Portefeuille</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1220">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<!--
  VIGIE PORTEFEUILLE — version PWA hébergée (code seul, AUCUNE donnée embarquée).
  Générée par outillage/build_pwa.js depuis calendrier_portefeuille.html : ne pas éditer à la main.
  Les données arrivent par la synchronisation GitHub (dépôt privé) ou par import de fichier.
-->
<style>
:root{
  --bg:#0B1220;
  --panel:#131E31;
  --panel2:#0F1830;
  --line:#233450;
  --txt:#E7EEFB;
  --muted:#8CA0C4;
  --accent:#4EA1F3;
  --warn:#F0B24E;
  --crit:#E0526B;
  --ok:#46C48A;
  --accent-dim:rgba(78,161,243,.14);
  --warn-dim:rgba(240,178,78,.14);
  --crit-dim:rgba(224,82,107,.14);
  --ok-dim:rgba(70,196,138,.14);
  --ombre:rgba(0,0,0,.45);
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:48px}
/* Largeur FLUIDE, sans palier : la page suit le redimensionnement en continu.
   La largeur gagnée sert à ajouter des COLONNES (voir .grille-cartes), jamais à
   étirer les lignes de texte — au-delà de ~90 caractères, l'œil perd la ligne
   suivante en revenant à la marge. */
#app{width:min(100% - 20px,1800px);margin:0 auto}
/* Onglets à flux unique : plafonnés à une largeur lisible et centrés, sinon
   leurs paragraphes s'étireraient sur toute la dalle. */
#onglet-vigie,#onglet-parametres{max-width:78rem;margin:0 auto}
header#entete{padding:14px 4px 8px}
header#entete h1{margin:0;font-size:19px;letter-spacing:.3px}
/* Deux lignes réservées : l'état de synchronisation s'y réécrit pendant la MAJ
   (« ⟳ envoi… » → « ✓ synchronisé (26/07/26 17:31) ») et un simple renvoi à la
   ligne de plus faisait descendre TOUTE la page d'un cran. */
header#entete .sous-titre{color:var(--muted);font-size:12px;margin-top:2px;min-height:35px}
header#entete .sous-titre b{color:var(--txt);font-weight:600}
#sync-etat{display:inline-block;min-width:19ch}
nav#nav-onglets{display:flex;gap:4px;position:sticky;top:0;z-index:40;background:var(--bg);padding:6px 0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav#nav-onglets::-webkit-scrollbar{display:none}
.onglet-btn{flex:1 0 112px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:40px}
.onglet-btn.actif{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
/* Pastille de l'onglet Découverte : place réservée même à vide, pour que son
   apparition après une MAJ ne redimensionne pas le libellé de l'onglet. */
.nav-n{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--warn);margin-left:3px;display:inline-block;min-width:1.1em}
main{padding-top:10px}
.onglet{display:none}
.onglet.actif{display:block}
.carte{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.carte-titre{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.panneau-tete{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;color:var(--txt);font:inherit;font-weight:700;font-size:13.5px;padding:2px 0;cursor:pointer;min-height:36px;text-align:left}
.panneau-tete .chevron{color:var(--muted);font-size:12px;transition:transform .15s}
.panneau-tete.ouvert .chevron{transform:rotate(90deg)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.petit{font-size:12px}
.tres-petit{font-size:11px}
hr.sep{border:none;border-top:1px solid var(--line);margin:10px 0}
.btn{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:38px}
.btn:disabled{opacity:.5;cursor:default}
.btn-accent{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.btn-ok{background:var(--ok-dim);border-color:var(--ok);color:var(--ok)}
/* Double-tap : le libellé bascule vers « Confirmer ? ». Largeur réservée pour
   que la rangée de boutons ne se réagence pas entre les deux états. */
.btn-danger{background:none;border-color:var(--line);color:var(--muted);min-width:12ch}
.btn-danger.arme{background:var(--crit-dim);border-color:var(--crit);color:var(--crit)}
.btn-large{width:100%;padding:11px;font-size:14px}
.rang-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:20px;vertical-align:1px}
.badge-crit{background:var(--crit-dim);color:var(--crit)}
.badge-warn{background:var(--warn-dim);color:var(--warn)}
.badge-info{background:var(--accent-dim);color:var(--accent)}
.badge-ok{background:var(--ok-dim);color:var(--ok)}
.badge-neutre{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pastille{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.p-ok{background:var(--ok)}.p-warn{background:var(--warn)}.p-crit{background:var(--crit)}.p-info{background:var(--accent)}.p-neutre{background:var(--muted)}
/* ---- héro ---- */
.hero{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero .hero-lib{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
.hero .hero-titre{font-size:16.5px;font-weight:700;margin:4px 0 2px}
.hero .hero-date{font-family:var(--mono);font-size:13px;color:var(--muted)}
/* Largeur réservée pour le plus long libellé (« AUJOURD'HUI ») : le tic d'une
   fois par minute réécrit ces compteurs sans jamais réagencer leur ligne. */
.compteur{font-family:var(--mono);font-weight:700;display:inline-block;min-width:11ch;font-variant-numeric:tabular-nums}
.compteur.auj{color:var(--warn)}
.compteur.retard{color:var(--crit)}
.compteur.futur{color:var(--accent)}
.compteur.fait{color:var(--muted);font-weight:400}
/* ---- calendrier ---- */
.cal-entete{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.cal-entete div{text-align:center;font-size:10px;color:var(--muted);text-transform:uppercase}
.cal-grille{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-jour{position:relative;min-width:0;overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:3px 4px 13px;cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.cal-jour .cal-mois{display:block;font-size:9px;color:var(--muted);line-height:1}
.cal-date{display:block;font-size:9px;line-height:1.25;font-weight:700;color:var(--txt)}
.cal-evt{display:block;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:8.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-evt-crit{color:var(--crit)}.cal-evt-warn{color:var(--warn)}.cal-evt-info{color:var(--accent)}.cal-evt-fait{color:var(--muted)}
.cal-jour.cal-passe{opacity:.45}
.cal-jour.cal-auj{border-color:var(--warn);color:var(--txt)}
.cal-jour.cal-crit{border-color:var(--crit);background:var(--crit-dim);opacity:1;color:var(--txt)}
/* Jour filtré : fond PLEIN accent, prioritaire sur tout autre état de case */
.cal-jour.cal-sel{background:var(--accent);border-color:var(--accent);color:var(--bg);opacity:1}
.cal-sel .cal-date,.cal-sel .cal-evt,.cal-sel .cal-mois,.cal-sel .cal-n{color:var(--bg)}
.cal-sel .cal-dot{background:var(--bg)}
.cal-dot{position:absolute;left:4px;bottom:4px;width:8px;height:8px;border-radius:50%}
.cal-n{position:absolute;right:4px;bottom:2px;font-size:10px;font-weight:700;color:var(--txt)}
/* ---- chips ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;min-height:32px}
.chip.actif{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.chip .pastille{width:7px;height:7px;margin-right:2px}
.chip-n{font-family:var(--mono);font-size:10.5px;margin-left:4px;color:var(--txt);opacity:.85}
.bandeau-filtre{display:flex;align-items:center;justify-content:space-between;background:var(--accent-dim);border:1px solid var(--accent);border-radius:9px;padding:6px 10px;margin-bottom:8px;font-size:12.5px}
/* ---- timeline ---- */
.sem-tete{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sem-tete b{color:var(--txt)}
.sem-tete .s-crit{color:var(--crit)}
.ev{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:11px;padding:11px 12px;margin-bottom:8px}
.ev.sev-Crit{border-left-color:var(--crit)}
.ev.sev-Warn{border-left-color:var(--warn)}
.ev.sev-Info{border-left-color:var(--accent)}
.ev.traite{opacity:.55}
.ev-haut{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ev-date{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ev-titre{font-size:14.5px;font-weight:700;margin:3px 0 4px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.3px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:1px 6px}
.mets{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
/* inline-block obligatoire : en inline pur, un .met qui revient à la ligne voit
   sa bordure se scinder, et ni son padding ni sa bordure ne poussent la hauteur
   de ligne — l'encadré chevauche alors les lignes voisines. */
.met{display:inline-block;vertical-align:middle;font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--muted)}
.met b{color:var(--txt);font-weight:600}
/* Zones de seuil : la valeur DOIT se colorer avec l'étiquette, sinon la règle
   .met b la laisse blanche et l'alerte passe inaperçue. */
.met.z-ok,.met.z-ok b{border-color:var(--ok);color:var(--ok)}
.met.z-warn,.met.z-warn b{border-color:var(--warn);color:var(--warn)}
.met.z-crit,.met.z-crit b{border-color:var(--crit);color:var(--crit)}
/* Surveiller / Arbitrage / Pratique — les trois registres de décision.
   Ce sont trois choses de nature différente : un indicateur à LIRE, une décision à
   TRANCHER, une règle de métier à APPLIQUER. Empilés en paragraphes séparés d'un
   simple tiret, ils se lisaient comme un seul bloc et l'œil ne savait plus lequel
   il parcourait. Chacun devient donc une carte à liseré coloré, avec sa vignette
   et son étiquette en tête, et un texte aéré (interligne 1,65, mesure plafonnée à
   92 caractères — au-delà, l'œil perd la ligne suivante en revenant à la marge).
   Présentation SEULE : aucun texte n'est réécrit, la logique de fond est intacte. */
.svap{display:flex;flex-direction:column;gap:6px;margin:9px 0 4px}
.svap-carte{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:9px;padding:8px 11px}
.svap-tete{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.svap-ico{font-family:var(--mono);font-size:12px;line-height:1.2;width:14px;text-align:center;flex:none}
.svap-lib{font-weight:700;letter-spacing:.45px;font-size:10.5px;text-transform:uppercase;color:var(--muted)}
.svap-txt{font-size:12.5px;line-height:1.65;max-width:92ch}
/* Un arbitrage porte souvent deux ou trois alternatives (« si X → A ; si Y → B ») :
   en puces, la comparaison se fait d'un coup d'œil au lieu de se lire en phrase. */
.svap-liste{margin:2px 0 0;padding-left:16px;font-size:12.5px;line-height:1.6;max-width:92ch}
.svap-liste li{margin:3px 0;padding-left:2px}
.svap-liste li::marker{color:var(--muted)}
.svap-surv{border-left-color:var(--accent)}
.svap-surv .svap-ico,.svap-surv .svap-lib{color:var(--accent)}
.svap-arb{border-left-color:var(--warn)}
.svap-arb .svap-ico,.svap-arb .svap-lib{color:var(--warn)}
.svap-prat{border-left-color:var(--ok)}
.svap-prat .svap-ico,.svap-prat .svap-lib{color:var(--ok)}
.svap-crit{border-left-color:var(--crit)}
.svap-crit .svap-ico,.svap-crit .svap-lib{color:var(--crit)}
/* Cotation : pré-ouverture / séance / après-clôture se lisent ENSEMBLE, chacune
   avec sa variation et son heure. Blocs de largeur libre qui se replient sur
   mobile plutôt qu'une ligne unique tronquée. */
.cote-rang{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.cote-bloc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;min-width:0}
.cote-lib{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);line-height:1.4}
.cote-val{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.cote-h{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cote-bloc.cote-vide .cote-val{color:var(--muted);font-weight:400}
.v-pos{color:var(--ok)}
.v-neg{color:var(--crit)}
/* Valorisation : une grille de couples étiquette/valeur, colonnes suivant la
   largeur. En rangée inline, les huit multiples formaient un pavé illisible. */
.valo-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:5px;margin:5px 0}
.valo-grille .met{display:flex;justify-content:space-between;gap:6px;min-width:0}
.valo-grille .met b{font-variant-numeric:tabular-nums;white-space:nowrap}
/* Lien vers la page réellement consultée par la consolidation. L'URL brute est
   validée en JS (http/https seulement) avant d'atteindre l'attribut. */
.lien{color:var(--accent);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.lien::after{content:" ↗";font-size:.85em;text-decoration:none}
.ev-actions{display:flex;gap:8px;margin-top:8px}
.ev-actions .btn{padding:6px 11px;min-height:34px;font-size:12px}
/* ---- notes ---- */
.note{border-radius:9px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.note-warn{background:var(--warn-dim);border:1px solid var(--warn);color:var(--warn)}
.note-crit{background:var(--crit-dim);border:1px solid var(--crit);color:var(--crit)}
.note-ok{background:var(--ok-dim);border:1px solid var(--ok);color:var(--ok)}
.note-info{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent)}
/* ---- formulaires ---- */
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font:inherit;font-size:13.5px;padding:8px 9px;min-height:38px}
textarea{min-height:56px;resize:vertical}
label.champ{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin:8px 0 3px}
.form-grille{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-grille .col2{grid-column:1/3}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);vertical-align:-4px}
/* Champs de code (clé API, jeton) : police à chasse fixe pour distinguer d'un
   coup d'œil O de 0 et l de 1 ou I, et interlettrage aéré pour relire un code
   long affiché en clair. Une erreur de casse ou de caractère ne se voit pas
   autrement, et le message d'erreur ne vient qu'au premier appel. */
.champ-code{font-family:var(--mono);letter-spacing:.03em}
/* ---- jauges & discipline ---- */
.jauge{position:relative;display:flex;height:8px;border-radius:5px;overflow:visible;margin:7px 0 3px}
.jz{height:100%}
.jz:first-child{border-radius:5px 0 0 5px}.jz:last-child{border-radius:0 5px 5px 0}
.jz-ok{background:var(--ok)}.jz-warn{background:var(--warn)}.jz-crit{background:var(--crit)}
.jauge-marq{position:absolute;top:-4px;width:3px;height:16px;background:var(--txt);border-radius:2px;box-shadow:0 0 4px var(--ombre)}
.ind-valeur{font-family:var(--mono);font-size:19px;font-weight:700}
.ind-seuils{font-size:11px;color:var(--muted);font-family:var(--mono)}
.score-rang{display:flex;align-items:center;gap:14px}
.score-val{font-family:var(--mono);font-size:34px;font-weight:800}
.bloc-titre{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--accent);margin:16px 0 8px;text-transform:uppercase}
/* ---- tableaux compacts ---- */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--muted);text-align:left;font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px}
/* ---- MAJ ----
   STABILITÉ DE MISE EN PAGE : pendant une consolidation, phases, compteurs et
   requêtes web changent de texte plusieurs fois par seconde. Toute variation de
   HAUTEUR déplace ce que l'utilisateur est en train de lire. Règle appliquée
   ci-dessous : chaque zone vivante occupe une hauteur RÉSERVÉE et constante,
   fixée par le conteneur et jamais par la longueur du contenu. */
/* Diagramme de contrôle du flux : l'état des 9 étapes d'un seul coup d'œil, et
   au-dessus la barre qui agrège l'avancement. La liste détaillée reste en
   dessous pour qui veut le message exact de chaque étape. */
.flux-barre{position:relative;height:8px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:8px 0 6px}
.flux-jauge{height:100%;width:0;background:var(--accent);transition:width .35s ease}
.flux-jauge.f-ok{background:var(--ok)}
.flux-jauge.f-echec{background:var(--crit)}
.flux{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.flux-etape{display:flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap}
.flux-etape .f-ico{font-family:var(--mono);font-weight:700}
.flux-etape.f-ok{border-color:var(--ok);color:var(--ok)}
.flux-etape.f-encours{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);animation:vp-pulse 1.4s ease-in-out infinite}
.flux-etape.f-echec{border-color:var(--crit);color:var(--crit);background:var(--crit-dim)}
@keyframes vp-pulse{0%,100%{opacity:1}50%{opacity:.55}}
/* Bilan de traitement : ce qui a été intégré, et ce qui était déjà connu. */
.bilan-trait{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:5px;margin:6px 0}
.bilan-trait .bt{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--panel2)}
.bilan-trait .bt-n{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--txt)}
.bilan-trait .bt-lib{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.maj-phases{list-style:none;margin:8px 0;padding:0}
/* Une phase = exactement une ligne. Les libellés s'allongent en direct
   (« Recherche web n° 3 : « … » ») : sans troncature, chaque message repoussait
   verticalement toute la suite de la page. Le texte entier reste lisible en
   infobulle et dans le journal « Requêtes web » ci-dessous. */
.maj-phases li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:3px 0}
.maj-phases .ph-ico{font-family:var(--mono);width:16px;flex:none;line-height:1.4}
/* DEUX lignes réservées par phase, toujours — pas une, pas trois. Une seule ligne
   tronquait les messages utiles (« Recherche web n° 3 : « … » ») au tiers ; une
   hauteur libre faisait sauter la page à chaque message plus long. Deux lignes de
   hauteur FIXE donnent la place de lire sans jamais déplacer ce qui suit. Le
   message intégral reste en infobulle. */
.maj-phases .ph-txt{flex:1;min-width:0;line-height:1.4;height:2.8em;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.ph-ok .ph-ico{color:var(--ok)}
.ph-encours .ph-ico{color:var(--warn)}
.ph-echec .ph-ico{color:var(--crit)}
.ph-attente{color:var(--muted)}
.ph-attente .ph-ico{color:var(--muted)}
/* Compteurs : grille dont le nombre de colonnes dépend de la largeur disponible
   et non du contenu — un compteur qui gagne un chiffre ne peut plus réagencer la
   rangée ni la faire passer sur une ligne de plus. */
.maj-compteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:8px;margin:8px 0}
.maj-compteurs .met{display:flex;justify-content:space-between;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.maj-compteurs .met b{font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
/* « dernier signal » occupe toute la largeur de la grille : sa valeur est la plus
   longue (« il y a 123 s ») et il se retrouvait seul, à demi-largeur, sur la
   dernière rangée. Aligné bord à bord avec les cases du dessus. */
.maj-compteurs .met-large{grid-column:1/-1}
/* Verdict de santé : deux lignes réservées, le libellé variant du court
   (« ✓ tout se passe normalement ») au long (« ✗ silence de plus de 5 min… »). */
.maj-sante{min-height:34px;margin:2px 0 6px}
.maj-sante .badge{white-space:normal;line-height:1.5}
/* Journal des requêtes web : hauteur figée dès le lancement, défilement interne
   calé sur la dernière ligne — la liste s'allonge sans pousser la page.
   46 px ne montraient qu'une requête et demie, coupée en plein milieu : c'est
   pourtant LE détail qui dit ce que la MAJ est en train de chercher. Une requête
   par ligne, et la hauteur d'environ six lignes — toujours constante. */
.maj-requetes{height:132px;overflow-y:auto;overscroll-behavior:contain}
.maj-req-l{line-height:1.5;padding:1px 0;overflow-wrap:anywhere}
.maj-req-l b{color:var(--txt)}
/* Ligne de résumé et ligne d'état de l'export : deux à trois lignes réservées,
   leur texte étant remplacé par un autre de longueur très différente. */
.maj-resume{min-height:32px}
/* L'appui long ouvre l'aide de la commande : sans ceci, le navigateur mobile
   ouvrirait par-dessus son menu « copier / sélectionner ». Les champs de saisie
   ne sont pas concernés — on doit pouvoir y sélectionner du texte. */
button[data-action],label[data-action],[data-action="onglet"],[data-action="chip"],[data-action="cal-jour"]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:vp-rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes vp-rot{to{transform:rotate(360deg)}}
.doc-slot{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.doc-slot:last-child{border-bottom:none}
.doc-slot input[type=file]{display:none}
.doc-slot>div{min-width:0}
/* Nom de fichier choisi : longueur imprévisible — tronqué plutôt que renvoyé à
   la ligne, sinon la pièce jointe grandit et décale les suivantes. */
.doc-etat{font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- glossaire ---- */
.gloss{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
#gloss-popover{position:fixed;z-index:100;max-width:min(320px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:0 6px 22px var(--ombre);font-size:12.5px}
#gloss-popover .gloss-long{font-weight:700;color:var(--accent);margin-bottom:4px}
#gloss-popover .gloss-def{color:var(--txt)}
.gloss-liste dt{font-weight:700;color:var(--accent);margin-top:9px;font-size:13px}
.gloss-liste dd{margin:1px 0 0;font-size:12.5px;color:var(--muted)}

/* ---- découverte d’opportunités ---- */
.opp-resume{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.opp-carte{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px;margin-bottom:10px}
.opp-carte.opp-verrouille{border-left-color:var(--warn)}
.opp-carte.opp-archivee{opacity:.55;border-left-color:var(--muted)}
/* Le verdict de cohérence prime sur les autres liserés : c'est le signal de risque */
.opp-carte.opp-conditions{border-left-color:var(--warn)}
.opp-carte.opp-incoherente{border-left-color:var(--crit)}
.opp-tete{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.opp-titre{font-size:15px;font-weight:750;line-height:1.25}
.opp-score{font-family:var(--mono);font-size:22px;font-weight:800;white-space:nowrap}
.opp-meta{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.opp-section{font-size:12.5px;margin:7px 0}
.opp-section b{font-size:10.5px;text-transform:uppercase;letter-spacing:.35px;color:var(--muted)}
.opp-source{font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
.opp-edition{margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.opp-edition textarea{min-height:70px}
.opp-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}

/* ---- divers ---- */
.avalider{border-left:4px solid var(--warn)}
.prio{font-family:var(--mono);font-weight:800;border-radius:6px;padding:1px 7px;font-size:11.5px}
.prio-1{background:var(--crit-dim);color:var(--crit)}
.prio-2{background:var(--warn-dim);color:var(--warn)}
.prio-3{background:var(--accent-dim);color:var(--accent)}
.instr-ligne{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.instr-ligne:last-child{border-bottom:none}
.vide{color:var(--muted);font-size:13px;padding:8px 2px}
/* Bloc de fiche. L'étiquette passe SUR SA PROPRE LIGNE : en flux inline, elle se
   soudait aux valeurs (« Cours pré — · séance 536,25 · post — 27/07/26… ») et la
   fiche entière se lisait comme une seule phrase, sans début ni fin. Un filet
   sépare les blocs et l'interligne s'ouvre : l'œil retrouve des points d'accroche. */
.cours-ligne{font-size:12.5px;line-height:1.55;margin:0;padding:9px 0;border-top:1px solid var(--line);max-width:92ch}
.cours-ligne:first-of-type{border-top:none;padding-top:2px}
.cours-ligne .lib{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:3px}
/* Lignes du cadre d'exposition : les pastilles y sont nombreuses et reviennent à
   la ligne sur mobile — le flux flex garantit un espacement constant en hauteur
   comme en largeur, quel que soit le nombre de retours. L'étiquette y reste sur
   la même ligne (le display:block ci-dessus ne s'applique pas à un enfant flex). */
.expo-ligne{display:flex;flex-wrap:wrap;align-items:center;gap:5px;max-width:none}
.expo-ligne .lib{margin-bottom:0}
/* Provenance : la partie la plus longue et la moins consultée d'une fiche.
   Reléguée sur sa propre ligne, en retrait derrière un filet — présente pour qui
   vérifie, transparente pour qui lit. */
.src{display:block;margin-top:5px;padding-left:9px;border-left:2px solid var(--line);color:var(--muted);font-size:10.5px;line-height:1.5;max-width:88ch}
/* Couples étiquette/valeur : l'œil descend une colonne d'étiquettes au lieu de
   traverser une phrase à séparateurs « · ». */
.faits{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0}
.faits dt{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;padding-top:2px}
.faits dd{margin:0;min-width:0}
/* Mesure de lecture : sans plafond, un écran large étire les paragraphes bien
   au-delà de ce que l'œil suit d'une ligne à l'autre. */
.carte>.petit,.carte>.tres-petit{max-width:92ch}
@media (min-width:520px){
  .form-grille{grid-template-columns:1fr 1fr 1fr}
  .form-grille .col2{grid-column:auto}
  .form-grille .col3{grid-column:1/4}
}
@media (min-width:768px){
  .cal-date{font-size:10px}
  .cal-evt{font-size:10px}
}
/* Listes de fiches : le nombre de colonnes suit la largeur EN CONTINU, sans
   palier. `min(100%,32rem)` évite le débordement sous 32rem — la colonne s'y
   réduit à la largeur disponible au lieu d'imposer son minimum. */
.grille-cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,32rem),1fr));gap:10px;align-items:start}
.grille-cartes>.carte{margin-bottom:0}
/* En-têtes, titres de bloc et messages occupent toute la largeur : ce sont des
   séparateurs de lecture, pas des fiches à mettre en colonne. */
.grille-cartes>.hero,.grille-cartes>.bloc-titre,.grille-cartes>.tres-petit,.grille-cartes>.vide,.grille-cartes>.note{grid-column:1/-1}
</style>
</head>

<script>

/* ================================================================
   CONSTANTES

const Cst_SeedEtat = { releveAsOf: null, margin: null, positions: [], orders: [] };
const Cst_SeedEvents = [];

/* ================================================================
   ÉTAT — unique variable globale mutable
   ================================================================ */
const Var_State = {
  version: Cst_VersionEtat,
  etatTs: 0, // horodatage de dernière modification — départage état du navigateur vs état embarqué dans le fichier

  quotes: {},        // {pre,preVar,preAs,last,chgPct,ouv,haut,bas,clotPrec,post,postVar,postAs,vol,adv,h52,b52,devise,place,asOf,url,src,dateMaj}

  actions: [],       // {id,ticker,priorite,proposition,declencheur,coutBenefice,horizon,invalidation,statut,dateDecision}

/* ================================================================
   PERSISTANCE — window.storage (artefact) avec repli localStorage
   ================================================================ */
async function Fn_StorageGet() {
  if (Cst_IsArtifact) {
    try {
      const v = await window.storage.get(Cst_CleStockage);
      if (v == null) return null;
      if (typeof v === 'string') return v;
      if (typeof v === 'object' && typeof v.value === 'string') return v.value;
      return JSON.stringify(v);
    } catch (e) { /* repli */ }
  }
  try { return localStorage.getItem(Cst_CleStockage); } catch (e) { return null; }
}
async function Fn_StorageSet(chaine) {
  if (Cst_IsArtifact) {
    try { await window.storage.set(Cst_CleStockage, chaine); return true; } catch (e) { /* repli */ }
  }
  try { localStorage.setItem(Cst_CleStockage, chaine); return true; } catch (e) { return false; }
}
// Unique point de sauvegarde : état ENTIER sérialisé (clés « _ » exclues).
// etatTs n'est tamponné QUE lors d'une modification réelle — jamais au simple
// chargement, sinon un appareil vierge se croirait « plus récent » que l'état
// du dépôt distant et l'écraserait.
function Fn_Save() {
  try {
    Var_State.etatTs = Date.now();
    const chaine = JSON.stringify(Var_State, (k, v) => (k && k.charAt && k.charAt(0) === '_') ? undefined : v);
    Fn_StorageSet(chaine);
    Fn_SyncPlanifier();
  } catch (e) { /* stockage indisponible : l'app reste utilisable en session */ }
}
function Fn_PersisterSansHorodatage() {
  try {
    Fn_StorageSet(JSON.stringify(Var_State, (k, v) => (k && k.charAt && k.charAt(0) === '_') ? undefined : v));
  } catch (e) { /* session seulement */ }
}
async function Fn_Load() {
  // Une seule source d'état local : le stockage de CE navigateur. Le partage
  // entre appareils passe UNIQUEMENT par le dépôt privé GitHub (Fn_SyncTirer),
  // jamais par un fichier recopié à la main.
  let s = null;
  try {
    const brut = await Fn_StorageGet();
    if (brut) s = JSON.parse(brut);
  } catch (e) { s = null; }
  {
    if (s && typeof s === 'object') {
      // Fusion : la sauvegarde locale est prioritaire (coches, décisions, réglages).
      ['onglet', 'events', 'instruments', 'positions', 'orders', 'trades', 'margin', 'releveAsOf',
       'derniereConsolidation', 'actions', 'opportunites', 'filtreOpportunites', 'aValider', 'majJournaux', 'filtreTag', 'filtreJour',
       'zbId', 'freqRappel', 'sitesRecherche', 'sitesBloques'].forEach(c => { if (s[c] !== undefined) Var_State[c] = s[c]; });
      ['quotes', 'fundamentals', 'valuation', 'expertise', 'theses'].forEach(c => {
        if (s[c] && typeof s[c] === 'object') Var_State[c] = s[c];
      });
      ['seuils', 'tarifs', 'cumulApi', 'panneaux'].forEach(c => {
        if (s[c] && typeof s[c] === 'object') Var_State[c] = Object.assign({}, Var_State[c], s[c]);
      });
    }
  }
  if (!Array.isArray(Var_State.opportunites)) Var_State.opportunites = [];
  if (!Array.isArray(Var_State.sitesRecherche)) Var_State.sitesRecherche = [];
  if (Var_State.filtreOpportunites !== 'toutes') Var_State.filtreOpportunites = 'recentes';
  // Injection des événements embarqués par id — sans doublon, coches locales préservées.
  Cst_SeedEvents.forEach(ev => {
    if (!Var_State.events.some(e => e.id === ev.id)) Var_State.events.push(JSON.parse(JSON.stringify(ev)));
  });
  // Injection de l'état du jour (relevé + ordres + marge) UNIQUEMENT si l'état local
  // n'en a pas déjà (première ouverture) — un état issu d'une MAJ plus récente prime.
  if (!Var_State.positions.length && Cst_SeedEtat.positions) Var_State.positions = JSON.parse(JSON.stringify(Cst_SeedEtat.positions));
  if (!Var_State.orders.length && Cst_SeedEtat.orders) Var_State.orders = JSON.parse(JSON.stringify(Cst_SeedEtat.orders));
  if (!Var_State.margin && Cst_SeedEtat.margin) Var_State.margin = JSON.parse(JSON.stringify(Cst_SeedEtat.margin));
  if (!Var_State.releveAsOf && Cst_SeedEtat.releveAsOf) Var_State.releveAsOf = Cst_SeedEtat.releveAsOf;
  Fn_ReparerJournauxOrphelins();
  Fn_ElaguerEtat(); // borne les cartes déjà décidées héritées des versions précédentes
  Fn_PersisterSansHorodatage(); // persister SANS tamponner etatTs : charger n'est pas modifier
}
// Un journal « en cours » n'est PAS une preuve qu'une MAJ tourne : le statut est
// persisté (et synchronisé), alors que l'appel HTTP, lui, meurt avec le contexte
// de la page. Seul _runtime.enCours atteste qu'une MAJ vit dans CET onglet.
// Tout journal « en cours » sans exécution locale est donc un fantôme — c'est ce
// qui laissait une MAJ figée sur « Recherche web n° 16 », sans chrono ni signal,
// que rien ne venait jamais terminer. Appelée au chargement ET après toute
// adoption d'état (distant ou importé), qui peut réintroduire un tel fantôme.
function Fn_ReparerJournauxOrphelins() {
  if (Var_State._runtime.enCours) return 0; // une MAJ tourne ici : ne pas y toucher
  let n = 0;
  (Var_State.majJournaux || []).forEach(j => {
    if (j.statut !== 'en cours') return;
    j.statut = 'interrompue';
    j.finTs = j.finTs || Date.now();
    j.message = 'MAJ interrompue : l’onglet a été rechargé, fermé, ou la page libérée par le navigateur pendant l’appel. Une requête en cours ne survit pas au rechargement de la page. Les pièces jointes, elles, ont été conservées : vous pouvez relancer directement.';
    (j.phases || []).forEach(p => { if (p.statut === 'en cours') p.statut = 'echec'; });
    Fn_CloturerBilan(j); // le coût déjà consommé reste dû : il doit rester visible
    n++;
  });
  return n;
}
// Bilan financier d'une MAJ, quelle que soit son issue. Un appel interrompu a
// consommé des jetons : les masquer rendrait la dépense réelle invisible.
// Idempotent (drapeau bilanFait) — jamais compté deux fois dans le cumul.
function Fn_CloturerBilan(journal) {
  if (!journal || journal.bilanFait) return;
  journal.bilanFait = true;
  journal.finTs = journal.finTs || Date.now();
  const t = Var_State.tarifs;
  const entree = Fn_Num(journal.jetonsEntree) || 0;
  const sortie = Fn_Num(journal.jetonsSortie) || 0;
  const rech = Fn_Num(journal.recherches) || 0;
  journal.coutUsd = entree / 1e6 * (Fn_Num(t.entreeParM) || 0)
    + sortie / 1e6 * (Fn_Num(t.sortieParM) || 0)
    + rech / 1000 * (Fn_Num(t.recherchePour1000) || 0);
  const c = Var_State.cumulApi;
  c.appels++; c.jetonsEntree += entree; c.jetonsSortie += sortie; c.recherches += rech; c.coutUsd += journal.coutUsd;
}

/* ----------------------------------------------------------------
   PIÈCES JOINTES PERSISTANTES (IndexedDB)
   Le relevé PDF et les captures pèsent plusieurs Mo : trop pour localStorage,
   et hors de question de les synchroniser (ils restent sur CET appareil, ils
   ne quittent la machine que vers api.anthropic.com, sur action explicite).
   Sans cette persistance, le moindre rechargement d'onglet effaçait les pièces
   jointes : la MAJ suivante repartait en « cours seuls » avec un bandeau ambre,
   et il fallait tout re-sélectionner. Chaque échec de la base est absorbé :
   l'application reste utilisable, les pièces vivent alors le temps de la session.
   ---------------------------------------------------------------- */
const Cst_DocsBase = 'vigie-docs';
const Cst_DocsMagasin = 'docs';
function Fn_DocsOuvrir() {
  return new Promise((resoudre, rejeter) => {
    if (typeof indexedDB === 'undefined') { rejeter(new Error('indexedDB indisponible')); return; }
    const req = indexedDB.open(Cst_DocsBase, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(Cst_DocsMagasin)) req.result.createObjectStore(Cst_DocsMagasin);
    };
    req.onsuccess = () => resoudre(req.result);
    req.onerror = () => rejeter(req.error || new Error('ouverture impossible'));
  });
}
function Fn_DocsTransaction(mode, action) {
  return Fn_DocsOuvrir().then(base => new Promise((resoudre, rejeter) => {
    const tr = base.transaction(Cst_DocsMagasin, mode);
    const req = action(tr.objectStore(Cst_DocsMagasin));
    tr.oncomplete = () => { base.close(); resoudre(req ? req.result : null); };
    tr.onerror = () => { base.close(); rejeter(tr.error || new Error('transaction échouée')); };
  }));
}
// Écrit une pièce jointe. `ts` sert à signaler plus tard une pièce qui n'est
// plus du jour — une MAJ lancée sur un relevé de la veille produirait une
// analyse fausse en silence.
function Fn_DocEnregistrer(cle, doc) {
  return Fn_DocsTransaction('readwrite', m => m.put(doc, cle)).catch(() => null);
}
function Fn_DocSupprimer(cle) {
  return Fn_DocsTransaction('readwrite', m => m.delete(cle)).catch(() => null);
}
// Recharge les pièces jointes dans _runtime au démarrage.
async function Fn_DocsRestaurer() {
  try {
    const cles = ['positions', 'ordres', 'executes', 'marge', 'aucuneTransac'];
    for (const cle of cles) {
      const v = await Fn_DocsTransaction('readonly', m => m.get(cle));
      if (!v) continue;
      if (cle === 'aucuneTransac') Var_State._runtime.aucuneTransac = !!v.valeur;
      else Var_State._runtime.docs[cle] = v;
    }
  } catch (e) { /* base indisponible : pièces jointes le temps de la session */ }
}
function Fn_DocsVider() {
  Var_State._runtime.docs = {};
  Var_State._runtime.aucuneTransac = false;
  ['positions', 'ordres', 'executes', 'marge', 'aucuneTransac'].forEach(c => Fn_DocSupprimer(c));
}
/* ----------------------------------------------------------------
   SYNCHRONISATION GITHUB (version PWA) — l'état complet voyage via le
   dépôt privé ci-dessous ; « le plus récent gagne » par etatTs. La clé
   API Anthropic n'est JAMAIS synchronisée (stockage local par appareil).
   ---------------------------------------------------------------- */
const Cst_SyncDepot = 'juliencalland/vigie-donnees';
const Cst_SyncChemin = 'etat.json';
const Cst_CleSyncToken = 'vigie-portefeuille-ghtoken';
function Fn_GetSyncToken() { try { return localStorage.getItem(Cst_CleSyncToken) || ''; } catch (e) { return ''; } }
function Fn_SetSyncToken(t) { try { if (t) localStorage.setItem(Cst_CleSyncToken, t); else localStorage.removeItem(Cst_CleSyncToken); return true; } catch (e) { return false; } }
function Fn_SyncLibelle() { if (!Fn_GetSyncToken()) return 'sync non configurée'; return Var_State._runtime.syncLibelle || 'sync prête'; }
function Fn_SyncStatut(txt, ok) {
  Var_State._runtime.syncLibelle = txt;
  const el = document.getElementById('sync-etat');
  if (el) { el.textContent = txt; el.style.color = ok === false ? 'var(--crit)' : (ok === true ? 'var(--ok)' : ''); }
  const el2 = document.getElementById('p-sync-etat');
  if (el2) el2.textContent = txt;
}
function Fn_B64VersTexte(b64) {
  const bin = atob(String(b64).replace(/\n/g, ''));
  const oct = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) oct[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(oct);
}
function Fn_TexteVersB64(txt) {
  const oct = new TextEncoder().encode(txt);
  let bin = '';
  for (let i = 0; i < oct.length; i += 8192) bin += String.fromCharCode.apply(null, oct.subarray(i, i + 8192));
  return btoa(bin);
}
function Fn_SyncRequete(methode, corps) {
  const token = Fn_GetSyncToken();
  const entetes = { 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  if (corps) entetes['Content-Type'] = 'application/json';
  return fetch('https://api.github.com/repos/' + Cst_SyncDepot + '/contents/' + Cst_SyncChemin,
    { method: methode, headers: entetes, body: corps ? JSON.stringify(corps) : undefined });
}
function Fn_SerialiserEtat() {
  return JSON.stringify(Var_State, (k, v) => (k && k.charAt && k.charAt(0) === '_') ? undefined : v);
}
// Adoption d'un état complet (distant ou importé) SANS toucher etatTs (sinon boucle de poussée).
function Fn_AdopterEtat(s) {
  ['onglet', 'events', 'instruments', 'positions', 'orders', 'trades', 'margin', 'releveAsOf',
   'derniereConsolidation', 'actions', 'opportunites', 'filtreOpportunites', 'aValider', 'majJournaux', 'filtreTag', 'filtreJour',
   'zbId', 'freqRappel', 'sitesRecherche', 'sitesBloques', 'etatTs'].forEach(c => { if (s[c] !== undefined) Var_State[c] = s[c]; });
  ['quotes', 'fundamentals', 'valuation', 'expertise', 'theses'].forEach(c => { if (s[c] && typeof s[c] === 'object') Var_State[c] = s[c]; });
  ['seuils', 'tarifs', 'cumulApi', 'panneaux'].forEach(c => { if (s[c] && typeof s[c] === 'object') Var_State[c] = Object.assign({}, Var_State[c], s[c]); });
  // L'état adopté peut contenir un journal « en cours » d'un autre appareil ou
  // d'une session morte : il serait affiché comme une MAJ vivante que rien ne
  // termine. Même règle qu'au chargement — seule une exécution locale fait foi.
  Fn_ReparerJournauxOrphelins();
  try { Fn_StorageSet(Fn_SerialiserEtat()); } catch (e) { /* session seulement */ }
}
async function Fn_SyncTirer(silencieux) {
  const rt = Var_State._runtime;
  if (!Fn_GetSyncToken()) return;
  try {
    Fn_SyncStatut('⟳ synchronisation…');
    const rep = await Fn_SyncRequete('GET');
    if (rep.status === 404) { rt.syncSha = null; Fn_SyncStatut('dépôt vide — envoi au prochain enregistrement', true); Fn_SyncPlanifier(); return; }
    if (rep.status === 401 || rep.status === 403) { Fn_SyncStatut('jeton refusé (' + rep.status + ') — vérifier le jeton', false); return; }
    if (!rep.ok) { Fn_SyncStatut('erreur GitHub ' + rep.status, false); return; }
    const d = await rep.json();
    rt.syncSha = d.sha || null;
    let distant = null;
    try { distant = JSON.parse(Fn_B64VersTexte(d.content)); } catch (e) { distant = null; }
    const tsDistant = distant ? (Fn_Num(distant.etatTs) || 0) : 0;
    const tsLocal = Fn_Num(Var_State.etatTs) || 0;
    // Ceinture de sécurité : un appareil sans substance locale (ni événement, ni
    // position, ni consolidation) ADOPTE toujours un distant rempli, quels que
    // soient les horodatages — on n'écrase jamais des données par du vide.
    const localVide = !Var_State.events.length && !Var_State.positions.length && !Var_State.derniereConsolidation;
    const distantPlein = !!(distant && (((distant.events || []).length) || ((distant.positions || []).length)));
    if (distant && (tsDistant > tsLocal || (localVide && distantPlein))) {
      Fn_AdopterEtat(distant);
      rt.syncDernierPushTs = tsDistant;
      Fn_SyncStatut('✓ état distant repris (' + Fn_FmtHeure(tsDistant) + ')', true);
      Fn_RenderVigie(); Fn_RenderCours(); Fn_RenderDiscipline(); Fn_RenderOpportunites(); Fn_RenderParametres();
    } else if (distant && tsDistant < tsLocal) {
      Fn_SyncStatut('état local plus récent — envoi…');
      Fn_SyncPousser();
    } else {
      rt.syncDernierPushTs = tsLocal;
      Fn_SyncStatut('✓ synchronisé (' + Fn_FmtHeure(tsLocal) + ')', true);
    }
  } catch (e) { Fn_SyncStatut('hors ligne — sync différée', false); }
}
function Fn_SyncPlanifier() {
  const rt = Var_State._runtime;
  if (!Fn_GetSyncToken()) return;
  if (rt.timers.syncPush) clearTimeout(rt.timers.syncPush);
  rt.timers.syncPush = setTimeout(() => { rt.timers.syncPush = null; Fn_SyncPousser(); }, 2500);
}
async function Fn_SyncPousser() {
  const rt = Var_State._runtime;
  if (!Fn_GetSyncToken()) return;
  if (rt.syncEnvoiEnCours) { rt.syncReplanifier = true; return; }
  if (rt.syncDernierPushTs === Var_State.etatTs) return; // rien de neuf à envoyer
  rt.syncEnvoiEnCours = true;
  try {
    Fn_SyncStatut('⟳ envoi…');
    const corps = { message: 'MAJ état Vigie ' + new Date().toISOString(), content: Fn_TexteVersB64(Fn_SerialiserEtat()) };
    if (rt.syncSha) corps.sha = rt.syncSha;
    let rep = await Fn_SyncRequete('PUT', corps);
    if (rep.status === 409 || rep.status === 422) {
      // Conflit d'écriture : re-tirer (le plus récent gagne) puis retenter si l'état local prime encore.
      await Fn_SyncTirer(true);
      if ((Fn_Num(Var_State.etatTs) || 0) > (rt.syncDernierPushTs || 0)) {
        const corps2 = { message: 'MAJ état Vigie (après conflit) ' + new Date().toISOString(), content: Fn_TexteVersB64(Fn_SerialiserEtat()) };
        if (rt.syncSha) corps2.sha = rt.syncSha;
        rep = await Fn_SyncRequete('PUT', corps2);
      } else { rt.syncEnvoiEnCours = false; return; }
    }
    if (rep && rep.ok) {
      const d = await rep.json();
      rt.syncSha = (d.content && d.content.sha) || rt.syncSha;
      rt.syncDernierPushTs = Var_State.etatTs;
      Fn_SyncStatut('✓ synchronisé (' + Fn_FmtHeure(Var_State.etatTs) + ')', true);
    } else if (rep) {
      Fn_SyncStatut('erreur envoi GitHub ' + rep.status, false);
    }
  } catch (e) { Fn_SyncStatut('hors ligne — sync différée', false); }
  finally {
    rt.syncEnvoiEnCours = false;
    if (rt.syncReplanifier) { rt.syncReplanifier = false; Fn_SyncPlanifier(); }
  }
}
// Import d'un état : le fichier etat.json du dépôt privé, seule voie de
// restauration manuelle (récupérer une version antérieure depuis l'historique
// GitHub, ou repartir d'un état sain après incident).
function Fn_SyncImporterFichier(fichier) {
  const lecteur = new FileReader();
  lecteur.onload = () => {
    try {
      const s = JSON.parse(String(lecteur.result || ''));
      if (s && typeof s === 'object' && (Fn_Num(s.etatTs) || 0) > (Fn_Num(Var_State.etatTs) || 0)) {
        Fn_AdopterEtat(s);
        Fn_RenderVigie(); Fn_RenderCours(); Fn_RenderDiscipline(); Fn_RenderOpportunites(); Fn_RenderParametres();
        Fn_SyncStatut('✓ fichier importé (' + Fn_FmtHeure(s.etatTs) + ')', true);
        Fn_SyncPlanifier();
      } else {
        Fn_SyncStatut(s ? 'fichier plus ancien que l’état actuel — ignoré' : 'fichier illisible', false);
      }
    } catch (e) { Fn_SyncStatut('fichier illisible', false); }
  };
  lecteur.readAsText(fichier);
}

/* ================================================================
   UTILITAIRES
   ================================================================ */
function Fn_Esc(v) {
  if (v == null) return '';
  return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function Fn_Num(v) {
  if (v == null || v === '') return null;
  const n = typeof v === 'number' ? v : Number(String(v).replace(/\s/g, '').replace(',', '.'));
  return isNaN(n) ? null : n;
}
function Fn_FmtEur(v, dec) {
  const n = Fn_Num(v);
  if (n == null) return '—';
  const d = (dec != null) ? dec : (Math.abs(n) >= 1000 ? 0 : 2);
  try {
    return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
  } catch (e) { return n.toFixed(d) + ' €'; }
}
function Fn_FmtNb(v, dec) {
  const n = Fn_Num(v);
  if (n == null) return '—';
  try {
    return new Intl.NumberFormat('fr-FR', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec == null ? 2 : dec }).format(n);
  } catch (e) { return String(n); }
}
function Fn_FmtPct(v, dec, signe) {
  const n = Fn_Num(v);
  if (n == null) return '—';
  const s = (signe && n > 0) ? '+' : '';
  return s + Fn_FmtNb(n, dec == null ? 1 : dec) + ' %';
}
function Fn_FmtX(v) {
  const n = Fn_Num(v);
  return n == null ? '—' : Fn_FmtNb(n, 1) + '×';
}
// Classement d'une valeur dans les zones vert / ambre / rouge des seuils de
// Paramètres. AUCUNE couleur ne vient du modèle : la MAJ ne fournit que des
// chiffres bruts, l'application les compare ici, localement et à l'identique
// d'une consolidation à l'autre.
// sens 'haut' : la valeur est mauvaise quand elle MONTE (levier, concentration).
// sens 'bas'  : la valeur est mauvaise quand elle DESCEND (coussin de marge).
// Donnée absente ou seuil manquant : null — jamais de zone par défaut, jamais
// de vert par ignorance (même règle que le score de discipline).
function Fn_ZoneSeuil(valeur, vert, rouge, sens) {
  const v = Fn_Num(valeur), sVert = Fn_Num(vert), sRouge = Fn_Num(rouge);
  if (v == null || sVert == null || sRouge == null) return null;
  if (sens === 'bas') return v < sRouge ? 'crit' : (v >= sVert ? 'ok' : 'warn');
  return v > sRouge ? 'crit' : (v <= sVert ? 'ok' : 'warn');
}
function Fn_ParseDate(iso) {
  if (!iso) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}
function Fn_Auj() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function Fn_DateISO(d) {
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function Fn_AujISO() { return Fn_DateISO(Fn_Auj()); }
function Fn_JoursDepuis(iso) {
  const d = Fn_ParseDate(iso);
  if (!d) return null;
  return Math.round((d.getTime() - Fn_Auj().getTime()) / 86400000);
}
// NORMALISATION : toutes les dates affichées sont en JJ/MM/AA (jamais MM/JJ),
// construites manuellement depuis les composantes locales — aucune ambiguïté jour/mois.
function Fn_FmtDateCourt(iso) {
  const d = Fn_ParseDate(iso);
  if (!d) return '—';
  const p = n => (n < 10 ? '0' : '') + n;
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2);
}
function Fn_FmtDate(iso) {
  const d = Fn_ParseDate(iso);
  if (!d) return '—';
  let js = '';
  try { js = new Intl.DateTimeFormat('fr-FR', { weekday: 'short' }).format(d) + ' '; } catch (e) { js = ''; }
  return js + Fn_FmtDateCourt(iso);
}
function Fn_FmtDateLong(iso) {
  return Fn_FmtDateCourt(iso); // même norme JJ/MM/AA partout (en-têtes de semaine incluses)
}
function Fn_FmtHeure(ts) {
  if (!ts) return '—';
  try {
    const d = new Date(ts);
    const p = n => (n < 10 ? '0' : '') + n;
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  } catch (e) { return String(ts); }
}
// Compteur temporel : futurs « J+x », jour même « AUJOURD'HUI », passés non traités « RETARD xj » en rouge.
function Fn_Compteur(iso, traite) {
  const j = Fn_JoursDepuis(iso);
  if (j == null) return { label: '—', cls: 'fait' };
  if (traite) return { label: 'traité', cls: 'fait' };
  if (j === 0) return { label: 'AUJOURD’HUI', cls: 'auj' };
  if (j > 0) return { label: 'J+' + j, cls: 'futur' };
  return { label: 'RETARD ' + (-j) + 'j', cls: 'retard' };
}
// Libellé compact pour les cases du calendrier : abréviations usuelles quand
// l'événement ne porte pas de libellé court dédié (champ `court` / labelCourt de la MAJ).
function Fn_AbregerTitre(titre) {
  let t = String(titre || '').split(' — ')[0];
  t = t.replace(/\([^)]*\)/g, ' ');
  const dico = [
    [/r[ée]sultats?/gi, 'Rés.'], [/trimestriels?/gi, 'trim.'], [/semestriels?/gi, 'sem.'],
    [/fiscal/gi, 'fisc.'], [/publications?/gi, 'publ.'], [/d[ée]cisions?/gi, 'Déc.'],
    [/d[ée]tachements?/gi, 'Détach.'], [/couvertures?/gi, 'couv.'], [/dividendes?/gi, 'div.'],
    [/ajustements?/gi, 'ajust.'], [/attendue?s?/gi, 'att.'], [/ex[ée]cut[ée]e?s?/gi, 'exéc.'],
    [/toujours/gi, ''], [/ concernant /gi, ' '], [/ depuis le /gi, ' dep. ']
  ];
  dico.forEach(d => { t = t.replace(d[0], d[1]); });
  t = t.replace(/\s+/g, ' ').trim();
  return t.length > 42 ? t.slice(0, 41) + '…' : t;
}
function Fn_Slug(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'evt';
}
function Fn_Uid(prefixe) {
  return (prefixe || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
}
function Fn_SemaineLundi(iso) {
  const d = Fn_ParseDate(iso);
  if (!d) return null;
  const jour = (d.getDay() + 6) % 7; // lundi = 0
  d.setDate(d.getDate() - jour);
  return Fn_DateISO(d);
}
function Fn_DureeFmt(ms) {
  if (ms == null) return '—';
  const s = Math.round(ms / 1000);
  return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s';
}
function Fn_FmtUsd(v, dec) {
  const n = Fn_Num(v);
  if (n == null) return '—';
  try {
    return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'USD', minimumFractionDigits: dec == null ? 2 : dec, maximumFractionDigits: 4 }).format(n);
  } catch (e) { return n.toFixed(2) + ' $'; }
}
// Grands nombres (capitalisation, volumes) : « 12,4 Md » se lit, « 12 400 000 000 » non.
function Fn_FmtGros(v, devise) {
  const n = Fn_Num(v);
  if (n == null) return '—';
  const a = Math.abs(n), suf = devise ? ' ' + devise : '';
  if (a >= 1e9) return Fn_FmtNb(n / 1e9, 2) + ' Md' + suf;
  if (a >= 1e6) return Fn_FmtNb(n / 1e6, 2) + ' M' + suf;
  if (a >= 1e3) return Fn_FmtNb(n / 1e3, 1) + ' k' + suf;
  return Fn_FmtNb(n, 0) + suf;
}
// LECTURE TOLÉRANTE D'UN CHAMP — pierre angulaire de la rétrocompatibilité.
// Le schéma d'échange avec le modèle utilise des clés COURTES (le poids des clés
// est multiplié par le nombre de lignes : c'est là que partent les jetons), mais
// une consolidation ancienne, une réponse tronquée réparée, ou un modèle qui
// retombe sur l'ancien schéma emploient les clés longues. Les deux sont acceptées,
// toujours, sans quoi une seule MAJ au mauvais format viderait l'écran.
function Fn_Ch(o, alias) {
  if (!o) return null;
  for (let i = 0; i < alias.length; i++) {
    const v = o[alias[i]];
    if (v !== undefined && v !== null && v !== '') return v;
  }
  return null;
}
// Sérialisation compacte pour ce qui PART vers le modèle : une clé à null coûte
// des jetons et n'apprend rien (l'absence dit déjà « inconnu »).
function Fn_JsonCompact(o) {
  return JSON.stringify(o, (cle, v) => (v === null || v === '' ? undefined : v));
}
// URL fournie par le modèle : validée ICI et nulle part ailleurs. Une chaîne
// « javascript: » placée dans un href s'exécuterait au clic — seuls http et https
// passent, et l'attribut est ensuite échappé comme toute donnée variable.
function Fn_UrlSure(u) {
  if (!u) return null;
  const s = String(u).trim();
  return /^https?:\/\/[^\s"'<>]{3,}$/i.test(s) ? s : null;
}
function Fn_UrlDomaine(u) {
  const m = /^https?:\/\/([^/?#]+)/i.exec(String(u || ''));
  return m ? m[1].replace(/^www\./i, '') : 'source';
}
// Lien vers la page réellement consultée (fiche instrument, fiche émetteur, page
// IR). Nouvel onglet + rel=noopener : la PWA ne doit jamais être remplacée par la
// page ouverte, ni lui donner la main sur son contexte.
function Fn_Lien(u, libelle) {
  const s = Fn_UrlSure(u);
  if (!s) return '';
  return '<a class="lien" target="_blank" rel="noopener noreferrer" href="' + Fn_Esc(s) + '">'
    + Fn_Esc(libelle || Fn_UrlDomaine(s)) + '</a>';
}
// Âge d'une donnée consolidée. Un cours vieux de trois jours affiché sans mention
// se lit comme le cours du jour : l'âge accompagne donc toujours la donnée.
function Fn_Age(ts) {
  const t = Fn_Num(ts);
  if (t == null) return null;
  const j = Math.floor((Date.now() - t) / 86400000);
  if (j <= 0) return { j: 0, txt: 'du jour', cls: 'neutre' };
  if (j === 1) return { j: 1, txt: 'hier', cls: 'neutre' };
  return { j, txt: 'il y a ' + j + ' j', cls: j > 7 ? 'crit' : (j > 2 ? 'warn' : 'neutre') };
}
function Fn_BadgeAge(ts) {
  const a = Fn_Age(ts);
  return a ? '<span class="badge badge-' + a.cls + '">' + Fn_Esc(a.txt) + '</span>' : '';
}
// DATE PORTÉE PAR LA COTATION ELLE-MÊME. `asOf` est du texte libre écrit par la
// consolidation (« 30/07/26 09:40 », « 28/07/26 (dernier cours publié) ») : on en
// extrait la date. C'est ELLE qui dit si le cours est à jour — surtout pas
// `dateMaj`, qui est l'heure de l'APPEL et vaut donc toujours « aujourd'hui ».
// Bug vécu : un cours vieux de 23 jours s'affichait avec un badge « du jour »,
// ce qui rendait la péremption invisible à l'écran.
function Fn_DateCotation(q) {
  const m = /(\d{2})\/(\d{2})\/(\d{2})/.exec(String((q && q.asOf) || ''));
  return m ? ('20' + m[3] + '-' + m[2] + '-' + m[1]) : null;
}
// Tolérance en JOURS CALENDAIRES : un lundi, la dernière clôture a trois jours
// et c'est normal. L'ambre commence donc à 2 jours et le rouge à 5, plutôt que
// de prétendre connaître le calendrier de chaque place.
function Fn_BadgeFraicheurCours(q) {
  if (!q) return '';
  const iso = Fn_DateCotation(q);
  if (!iso) return '<span class="badge badge-warn">date du cours non lue</span>';
  const j = -Fn_JoursDepuis(iso);
  if (j == null) return '';
  if (j <= 0) {
    // Même jour ne veut pas dire à jour : un instantané de 09 h 40 relevé à
    // 22 h 26 a douze heures de retard et la clôture existe. Heuristique
    // assumée, calée pour ne pas se déclencher à tort : aucune clôture de place
    // européenne ou américaine n'est antérieure de plus de 7 h à une MAJ du
    // soir (Xetra 17 h 35 vs 22 h 26 = 4 h 51), alors qu'un instantané de
    // milieu de séance l'est largement. Ambre, pas rouge : c'est un doute.
    const hq = /(\d{2}):(\d{2})/.exec(String(q.asOf || ''));
    const ecart = (hq && Fn_Num(q.dateMaj) != null)
      ? (new Date(Fn_Num(q.dateMaj)).getHours() * 60 + new Date(Fn_Num(q.dateMaj)).getMinutes())
        - (Number(hq[1]) * 60 + Number(hq[2]))
      : null;
    if (ecart != null && ecart > 420) {
      return '<span class="badge badge-warn">instantané de ' + Fn_Esc(hq[0]) + ' — séance close depuis, clôture non récupérée</span>';
    }
    return '<span class="badge badge-neutre">cours du jour</span>';
  }
  if (j === 1) return '<span class="badge badge-neutre">cours de la veille</span>';
  return '<span class="badge badge-' + (j >= 5 ? 'crit' : 'warn') + '">cours du '
    + Fn_Esc(Fn_FmtDateCourt(iso)) + ' — ' + j + ' j de retard</span>';
}
// Mise en puces d'un texte à alternatives (« si X → A ; si Y → B »). PRÉSENTATION
// SEULE : le texte stocké n'est jamais modifié, et un texte qui ne s'y prête pas
// (une seule proposition, ou des fragments trop courts pour être des alternatives)
// reste un paragraphe.
function Fn_TexteOuListe(txt) {
  const brut = String(txt == null ? '' : txt);
  const bouts = brut.split(/\s;\s+/).map(s => s.trim()).filter(Boolean);
  if (bouts.length < 2 || bouts.length > 4 || bouts.some(m => m.length < 20)) {
    return '<div class="svap-txt">' + Fn_Gloss(Fn_Esc(brut)) + '</div>';
  }
  return '<ul class="svap-liste">' + bouts.map(m => '<li>' + Fn_Gloss(Fn_Esc(m)) + '</li>').join('') + '</ul>';
}
// Carte de recommandation. `role` porte la couleur et la vignette ; le libellé
// reste écrit en toutes lettres — la couleur ne doit jamais être le seul porteur
// de sens (écran en plein soleil, daltonisme).
const Cst_RolesSvap = {
  surv: { cls: 'svap-surv', ico: '◎', lib: 'Surveiller' },
  arb: { cls: 'svap-arb', ico: '⇄', lib: 'Arbitrage' },
  prat: { cls: 'svap-prat', ico: '⚑', lib: 'Pratique' },
  decl: { cls: 'svap-surv', ico: '◎', lib: 'Déclencheur' },
  cout: { cls: 'svap-arb', ico: '⇄', lib: 'Coût / bénéfice' },
  inval: { cls: 'svap-crit', ico: '✕', lib: 'Invalidation' },
  propo: { cls: 'svap-prat', ico: '→', lib: 'Proposition' }
};
function Fn_HtmlSvap(role, texte, libelleForce) {
  if (!texte) return '';
  const r = Cst_RolesSvap[role] || Cst_RolesSvap.prat;
  return '<div class="svap-carte ' + r.cls + '">'
    + '<div class="svap-tete"><span class="svap-ico">' + r.ico + '</span>'
    + '<span class="svap-lib">' + Fn_Esc(libelleForce || r.lib) + '</span></div>'
    + Fn_TexteOuListe(texte) + '</div>';
}

/* ================================================================
   GLOSSAIRE — dictionnaire dynamique tactile (section 4 ter)
   ================================================================ */
const Cst_Glossary = {
  'découverte d’opportunités': { long: 'Découverte d’opportunités', def: 'Balayage en ligne effectué pendant la MAJ et arrêté au jour de la synchronisation : la masse d’actualités est filtrée (concentration puis picking), puis chaque piste est jugée contre l’exposition réelle du portefeuille — concentration, facteurs, devise, liquidité, coussin de marge, levier. Ce sont des candidats à étudier, jamais des recommandations.' },
  'financement par arbitrage': { long: 'Financement par arbitrage', def: 'Financer une nouvelle position en allégeant une ligne existante plutôt qu’en augmentant le brut : la règle s’impose dès que le coussin de marge passe sous son seuil, où toute prise de risque supplémentaire se paierait en levier.' },
  'MAJ': { long: 'Mise à jour des données', def: 'Consolidation des données du portefeuille (cours, consensus, valorisation, événements) déclenchée manuellement par le bouton « ⟳ MAJ des données ». Rien n’est envoyé sans votre action.' },
  'VN': { long: 'Valeur nette (valeur liquidative)', def: 'Valeur du portefeuille : titres + liquidités − dette de marge. Sert de dénominateur à toutes les expositions exprimées en % VN.' },
  'valeur liquidative': { long: 'Valeur liquidative', def: 'Valeur totale du portefeuille si tout était vendu et les dettes remboursées ; affichée par le courtier dans l’aperçu de marge (écran « Espace libre » chez DEGIRO).' },
  'VL': { long: 'Valeur liquidative', def: 'Abréviation de la valeur liquidative du portefeuille (titres + liquidités − dette) : le dénominateur du coussin de marge et du levier exact.' },
  'PER': { long: 'Price Earnings Ratio (cours/bénéfice)', def: 'Cours divisé par le bénéfice par action. Un PER isolé n’est pas interprétable : il se compare à la médiane historique du titre ou à celle des pairs.' },
  'TTM': { long: 'Trailing Twelve Months (12 mois glissants)', def: 'Calculé sur les 12 derniers mois publiés — ex. PER TTM = cours rapporté au bénéfice des 4 derniers trimestres.' },
  'BNA': { long: 'Bénéfice net par action', def: 'Résultat net divisé par le nombre d’actions. La direction des révisions de BNA par les analystes (hausse/baisse) est un signal de tendance clé.' },
  'BPA': { long: 'Bénéfice par action', def: 'Synonyme de BNA : résultat net rapporté au nombre d’actions, comparé au consensus lors des publications.' },
  'PEG': { long: 'Price/Earnings to Growth', def: 'PER divisé par la croissance attendue des bénéfices. En dessous de 1, la valorisation paraît raisonnable au regard de la croissance ; au-delà de 2, elle suppose beaucoup.' },
  'VE/EBITDA': { long: 'Valeur d’entreprise / EBITDA', def: 'Multiple de valorisation indépendant de la structure de dette, utile pour comparer des sociétés d’un même secteur ou une société à son propre historique.' },
  'VE/CA': { long: 'Valeur d’entreprise / chiffre d’affaires', def: 'Multiple utilisé notamment quand le résultat est négatif (PER non significatif) ou très volatil.' },
  'VE': { long: 'Valeur d’entreprise', def: 'Capitalisation boursière + dette nette : ce que « coûte » réellement l’entreprise. Base des multiples VE/CA et VE/EBITDA.' },
  'EBITDA': { long: 'Excédent brut d’exploitation', def: 'Résultat avant intérêts, impôts, dépréciations et amortissements — approximation de la génération de trésorerie opérationnelle.' },
  'CA': { long: 'Chiffre d’affaires', def: 'Total des ventes de la période. « CA S1 » = chiffre d’affaires du premier semestre.' },
  'P/B': { long: 'Price to Book (cours/actif net)', def: 'Cours rapporté à l’actif net comptable par action. Multiple privilégié pour les banques et assurances, dont le bilan EST l’activité.' },
  'P/ANR': { long: 'Cours / actif net réévalué', def: 'Décote ou prime d’une foncière par rapport à la valeur de marché réévaluée de son patrimoine. Multiple de référence du secteur immobilier coté.' },
  'ANR': { long: 'Actif net réévalué', def: 'Valeur de marché des actifs moins les dettes — référence de valorisation des foncières.' },
  'BFR': { long: 'Besoin en fonds de roulement', def: 'Trésorerie immobilisée par le cycle d’exploitation (stocks + créances − dettes fournisseurs). Sa variation éclaire la qualité du résultat : un bénéfice sans cash-flow se voit ici.' },
  'ADV': { long: 'Average Daily Volume (volume moyen quotidien)', def: 'Volume moyen échangé par séance. Dimensionne la capacité à sortir d’une ligne en 1 à 2 séances sans peser sur le cours.' },
  'FOMC': { long: 'Federal Open Market Committee', def: 'Comité de politique monétaire de la Réserve fédérale américaine. Ses décisions de taux et ses projections sont des catalyseurs macro majeurs.' },
  'Fed': { long: 'Réserve fédérale américaine', def: 'Banque centrale des États-Unis, dont la politique de taux pilote le dollar et les valorisations des actifs risqués.' },
  'BCE': { long: 'Banque centrale européenne', def: 'Banque centrale de la zone euro ; ses décisions de taux influencent l’euro et le financement des positions sur marge en EUR.' },
  'SEP': { long: 'Summary of Economic Projections', def: 'Projections trimestrielles des membres de la Fed (croissance, inflation, taux), publiées avec le « dot plot » quatre fois par an.' },
  'dot plot': { long: 'Dot plot (nuage de points de la Fed)', def: 'Graphique des anticipations de taux directeurs de chaque membre du FOMC. Publié avec le SEP, il peut faire bouger les marchés davantage que la décision elle-même.' },
  'delta-neutre': { long: 'Delta-neutre', def: 'Position dont l’exposition nette au sous-jacent est proche de zéro : les jambes longues et courtes se compensent. Un ordre en attente peut faire basculer une poche en delta-neutre.' },
  'delta': { long: 'Delta', def: 'Sensibilité d’un produit dérivé à la variation de son sous-jacent (delta 0,5 ≈ 50 % du mouvement). Le ratio de couverture se mesure en delta couvert, pas en nombre de titres.' },
  'turbo BEST': { long: 'Turbo BEST', def: 'Turbo sans échéance dont la barrière est égale au niveau de financement : en cas de knock-out, la valeur résiduelle est nulle.' },
  'turbo': { long: 'Turbo', def: 'Produit à levier à barrière désactivante : si le sous-jacent touche la barrière, le produit est remboursé, souvent pour presque rien. La distance à la barrière est le premier indicateur à surveiller.' },
  'mini-future': { long: 'Mini-future', def: 'Produit à levier sans échéance dont la barrière de sécurité est distincte du financement, laissant généralement une valeur résiduelle en cas de knock-out.' },
  'barrière': { long: 'Barrière (knock-out)', def: 'Niveau du sous-jacent qui, s’il est touché — même en séance, même brièvement —, désactive définitivement le produit à levier.' },
  'knock-out': { long: 'Knock-out (désactivation)', def: 'Franchissement de la barrière d’un produit à levier : le produit est désactivé et remboursé à sa valeur résiduelle (souvent quasi nulle).' },
  'KO': { long: 'Knock-out', def: 'Abréviation de la désactivation d’un produit à barrière ; « distance au KO » = marge de sécurité avant désactivation.' },
  'strike': { long: 'Strike (prix d’exercice / financement)', def: 'Niveau de référence d’un produit dérivé servant au calcul de sa valeur intrinsèque ; ajusté lors des détachements de dividende.' },
  'parité': { long: 'Ratio / parité', def: 'Nombre de produits à levier nécessaires pour représenter une unité de sous-jacent (ex. 10:1). Indispensable pour convertir un prix de produit en exposition réelle.' },
  'portage': { long: 'Coût de portage', def: 'Coût de détention d’une position dans le temps (financement, ajustement quotidien de barrière). Une couverture à portage sans catalyseur daté « fond » sans justification.' },
  'coussin de marge': { long: 'Coussin de marge', def: 'Marge disponible rapportée à la valeur liquidative (%). Plus il est mince, plus une baisse des titres rapproche de l’appel de marge.' },
  'levier brut': { long: 'Levier brut', def: 'Valeur des titres détenus divisée par la valeur liquidative : 1,5× signifie 150 € d’exposition pour 100 € de fonds propres — les gains ET les pertes sont amplifiés d’autant.' },
  'gap': { long: 'Gap (saut de cours)', def: 'Écart entre le cours de clôture et le premier cours suivant, fréquent après résultats. Un ordre limite peut être « traversé » par un gap et exécuté bien au-delà du niveau visé.' },
  'binaire': { long: 'Événement binaire', def: 'Événement à issue discontinue (résultats, décision réglementaire, banque centrale) pouvant provoquer un gap dans un sens ou l’autre. La taille et la couverture s’ajustent AVANT, pas après.' },
  'consensus': { long: 'Consensus des analystes', def: 'Agrégat des recommandations et prévisions des analystes (répartition achat/neutre/vente, objectif de cours moyen). Point de référence, pas vérité.' },
  'révision': { long: 'Révision (des estimations)', def: 'Changement récent des prévisions de BNA/CA par les analystes. La DIRECTION des révisions est souvent plus informative que leur niveau.' },

// Index de recherche construit une fois (motifs triés du plus long au plus court).
function Fn_GlossIndex() {
  const rt = Var_State._runtime;
  if (rt.glossIndex) return rt.glossIndex;
  const cles = Object.keys(Cst_Glossary).sort((a, b) => b.length - a.length);
  rt.glossIndex = cles.map(cle => {
    let motif = cle.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&');
    const prem = cle.charAt(0);
    if (prem >= 'a' && prem <= 'z') motif = '[' + prem.toUpperCase() + prem + ']' + motif.slice(1);
    return { cle, re: new RegExp('(^|[^0-9A-Za-zÀ-ÖØ-öø-ÿ_])(' + motif + ')(?![0-9A-Za-zÀ-ÖØ-öø-ÿ_])', 'g') };
  });
  return rt.glossIndex;
}
// Enveloppe chaque terme du glossaire d'un <span class="gloss"> — appelé APRÈS Fn_Esc,
// respecte les frontières de mots et ne ré-enveloppe jamais l'intérieur d'une balise.
function Fn_Gloss(html) {
  if (html == null || html === '') return html == null ? '' : html;
  const idx = Fn_GlossIndex();
  const seg = String(html).split(/(<[^>]+>)/);
  for (let i = 0; i < seg.length; i++) {
    if (!seg[i] || seg[i].charAt(0) === '<') continue;
    // Decoupage progressif en fragments bruts / enveloppes : un terme deja
    // enveloppe (fragment non brut) n'est jamais retraite par les termes suivants.
    let fragments = [{ brut: true, s: seg[i] }];
    for (let k = 0; k < idx.length; k++) {
      const e = idx[k];
      const suivants = [];
      for (let p = 0; p < fragments.length; p++) {
        if (!fragments[p].brut) { suivants.push(fragments[p]); continue; }
        const s = fragments[p].s;
        e.re.lastIndex = 0;
        let curseur = 0, m;
        while ((m = e.re.exec(s)) !== null) {
          const debut = m.index + m[1].length;
          if (debut > curseur) suivants.push({ brut: true, s: s.slice(curseur, debut) });
          suivants.push({ brut: false, s: '<span class="gloss" data-terme="' + Fn_Esc(e.cle) + '">' + m[2] + '</span>' });
          curseur = debut + m[2].length;
        }
        if (curseur === 0) { suivants.push(fragments[p]); }
        else if (curseur < s.length) { suivants.push({ brut: true, s: s.slice(curseur) }); }
      }
      fragments = suivants;
    }
    seg[i] = fragments.map(f => f.s).join('');
  }
  return seg.join('');
}

// Aide applicable à un élément : les commandes contextuelles (onglet, panneau,
// case de thèse) se résolvent sur leur data-id / data-champ.
function Fn_TexteAide(el) {
  if (!el || !el.getAttribute) return null;
  const action = el.getAttribute('data-action');
  if (!action) return null;
  const id = el.getAttribute('data-id');
  if (action === 'onglet') return Cst_AideOnglets[id] || null;
  if (action === 'toggle') {
    const quoi = Cst_AidePanneaux[id];
    return quoi ? { t: 'Ouvrir ou replier', d: 'Affiche ou masque ' + quoi + ' L’état d’ouverture est mémorisé et suit sur vos autres appareils.' } : null;
  }
  if (action === 'these-check') return Cst_AideThese[el.getAttribute('data-champ')] || null;
  return Cst_AideActions[action] || null;
}

// Positionnement partagé par le glossaire et l'aide des commandes : un seul
// popover à l'écran, jamais hors cadre, basculé au-dessus de l'ancre s'il déborde.
function Fn_OuvrirPopover(titre, texte, ancre, cle) {
  const pop = document.getElementById('gloss-popover');
  if (!ancre) return;
  pop.innerHTML = '<div class="gloss-long">' + Fn_Esc(titre) + '</div><div class="gloss-def">' + Fn_Esc(texte) + '</div>';
  pop.hidden = false;
  pop.style.visibility = 'hidden';
  pop.style.left = '0px'; pop.style.top = '0px';
  const r = ancre.getBoundingClientRect();
  const pr = pop.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const left = Math.min(Math.max(8, r.left), Math.max(8, vw - pr.width - 8));
  let top = r.bottom + 8;
  if (top + pr.height > vh - 8) top = Math.max(8, r.top - pr.height - 8);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  pop.style.visibility = 'visible';
  Var_State._runtime.glossOuvert = cle;
}
