/* ================================================================
   DONNÉES / CLASSIFICATION
   ----------------------------------------------------------------
   PRINCIPE DIRECTEUR DE TOUTE CETTE SECTION :
   l'IA ne fait que ce qu'elle seule sait faire — juger. Tout ce qui est
   déterministe est calculé ICI, en JavaScript, gratuitement, et se rejoue
   seul sans relancer le moindre appel.
   Corollaires appliqués sans exception :
     1. aucun chiffre présent dans une capture ou un fichier n'est
        « retrouvé » par recherche ;
     2. aucun chiffre calculable n'est demandé au modèle ;
     3. le desk REÇOIT les nombres et n'en émet aucun.
   ================================================================
   ÉTAGE 1 — ACQUISITION : lecture de l'export du courtier
   ----------------------------------------------------------------
   Vrai fichier XLSX (archive ZIP). Deux entrées suffisent :
   xl/sharedStrings.xml et xl/worksheets/sheet1.xml. Lecture sans aucune
   bibliothèque : parcours du répertoire central du ZIP, décompression par
   DecompressionStream('deflate-raw') — natif — puis XML par expressions
   régulières.
   TROIS CARACTÉRISTIQUES MESURÉES SUR UN EXPORT RÉEL, traitées explicitement :
     1. AUCUNE DATE dans le fichier : l'application horodate à l'import et
        affiche la séance retenue.
     2. Les noms de produits sont TRONQUÉS À 32 CARACTÈRES : les paramètres
        d'un produit à levier (barrière, strike, ratio, levier) y sont perdus.
        La capture texte fait donc foi sur le nom.
     3. La colonne « clôture » porte systématiquement la clôture de la VEILLE,
        quelle que soit l'heure d'export. Le fichier ne sert JAMAIS de source
        de cours : il est un registre d'identité et de quantités.
   ---------------------------------------------------------------- */
const Cst_XlsxEntrees = ['xl/sharedStrings.xml', 'xl/worksheets/sheet1.xml'];
function Fn_Lire16(oct, p) { return oct[p] | (oct[p + 1] << 8); }
function Fn_Lire32(oct, p) { return (oct[p] | (oct[p + 1] << 8) | (oct[p + 2] << 16)) + oct[p + 3] * 16777216; }
// Décompression « deflate brut » (méthode 8 du ZIP). Le flux est lu morceau par
// morceau : passer par Response() supposerait un environnement complet, alors
// qu'un lecteur de flux existe partout où DecompressionStream existe.
async function Fn_Inflate(octets) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('Ce navigateur ne sait pas décompresser le fichier (DecompressionStream absent). Collez les positions à la main : la lecture de l’écran suffit pour les cours et les noms, seuls les contrôles croisés de quantité seront indisponibles.');
  }
  const flux = new Blob([octets]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  const lecteur = flux.getReader();
  const morceaux = [];
  let total = 0;
  for (;;) {
    const r = await lecteur.read();
    if (r.done) break;
    morceaux.push(r.value);
    total += r.value.length;
  }
  const sortie = new Uint8Array(total);
  let p = 0;
  morceaux.forEach(m => { sortie.set(m, p); p += m.length; });
  return sortie;
}
// Extrait les entrées demandées d'une archive ZIP en mémoire.
async function Fn_ZipExtraire(octets, noms) {
  // Fin du répertoire central : signature 0x06054b50, cherchée depuis la fin
  // (le commentaire d'archive, s'il existe, la précède).
  let eocd = -1;
  for (let i = octets.length - 22; i >= 0 && i > octets.length - 66000; i--) {
    if (octets[i] === 0x50 && octets[i + 1] === 0x4b && octets[i + 2] === 0x05 && octets[i + 3] === 0x06) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Fichier non reconnu comme un classeur : ni archive .xlsx, ni classeur ancien .xls. Vérifiez que c’est bien l’export du courtier et non un PDF ou un CSV renommé.');
  const nb = Fn_Lire16(octets, eocd + 10);
  let p = Fn_Lire32(octets, eocd + 16);
  const dec = new TextDecoder('utf-8');
  const trouve = {};
  for (let i = 0; i < nb; i++) {
    if (octets[p] !== 0x50 || octets[p + 1] !== 0x4b || octets[p + 2] !== 0x01 || octets[p + 3] !== 0x02) break;
    const methode = Fn_Lire16(octets, p + 10);
    const tailleComp = Fn_Lire32(octets, p + 20);
    const lgNom = Fn_Lire16(octets, p + 28);
    const lgExtra = Fn_Lire16(octets, p + 30);
    const lgComm = Fn_Lire16(octets, p + 32);
    const offsetLocal = Fn_Lire32(octets, p + 42);
    const nom = dec.decode(octets.subarray(p + 46, p + 46 + lgNom));
    if (noms.indexOf(nom) >= 0) {
      const lgNomL = Fn_Lire16(octets, offsetLocal + 26);
      const lgExtraL = Fn_Lire16(octets, offsetLocal + 28);
      const debut = offsetLocal + 30 + lgNomL + lgExtraL;
      const brut = octets.subarray(debut, debut + tailleComp);
      trouve[nom] = methode === 0 ? dec.decode(brut) : dec.decode(await Fn_Inflate(brut));
    }
    p += 46 + lgNom + lgExtra + lgComm;
  }
  return trouve;
}
function Fn_XmlTexte(s) {
  return String(s || '')
    .replace(/<[^>]+>/g, '')
    .replace(/&#(\d+);/g, (m, n) => String.fromCharCode(Number(n)))
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, '\'').replace(/&amp;/g, '&');
}
/* ---------- LE FORMAT ANCIEN DU COURTIER (.xls) ----------
   Le courtier propose l'export en deux formats et rien ne signale lequel on a
   pris : le .xlsx est une archive ZIP, le .xls ancien est un conteneur OLE2
   (« Compound File »), qui n'est PAS une archive. Le refuser obligeait à
   ré-exporter sans dire pourquoi ; il est donc lu, lui aussi, sans dépendance.
   Bonne surprise : son contenu est en CLAIR — ce format ne réclame aucun
   décompresseur, là où le .xlsx dépend de DecompressionStream. */

// Numéro de colonne → lettre(s), comme dans une feuille de calcul.
function Fn_ColLettre(i) {
  let s = '';
  for (let n = i; n >= 0; n = Math.floor(n / 26) - 1) s = String.fromCharCode(65 + (n % 26)) + s;
  return s;
}
/* Un conteneur OLE2 est un petit système de fichiers : un en-tête, une table
   d'allocation (FAT) qui chaîne les secteurs, un répertoire d'entrées nommées.
   On n'en veut qu'une seule, le flux « Workbook ». Les flux de moins de
   4 096 octets vivent à part, dans un « mini-flux » à secteurs de 64 octets —
   un export de portefeuille tombe régulièrement sous ce seuil. */
function Fn_OleFlux(octets, nomsVoulus) {
  if (octets.length < 512) throw new Error('Fichier trop court pour être un classeur.');
  const dv = new DataView(octets.buffer, octets.byteOffset, octets.byteLength);
  const u16 = o => dv.getUint16(o, true), u32 = o => dv.getUint32(o, true);
  const tSec = 1 << u16(30), tMini = 1 << u16(32);
  if (tSec < 128 || tSec > 65536 || tMini < 16 || tMini > tSec) throw new Error('Classeur ancien illisible : en-tête inattendu.');
  const pos = i => 512 + i * tSec;
  const LIBRE = 0xfffffffe;

  // DIFAT : 109 entrées dans l'en-tête, la suite chaînée secteur par secteur.
  const difat = [];
  for (let i = 0; i < 109; i++) { const v = u32(76 + i * 4); if (v < LIBRE) difat.push(v); }
  let s = u32(68), garde = 0;
  while (s < LIBRE && garde++ < 100000 && pos(s) + tSec <= octets.length) {
    const b = pos(s), n = tSec / 4 - 1;
    for (let i = 0; i < n; i++) { const v = u32(b + i * 4); if (v < LIBRE) difat.push(v); }
    s = u32(b + n * 4);
  }
  const fat = [];
  difat.forEach(d => { if (pos(d) + tSec > octets.length) return; const b = pos(d); for (let i = 0; i < tSec / 4; i++) fat.push(u32(b + i * 4)); });

  const chaine = (debut, table) => {
    const l = []; let c = debut, g = 0;
    while (c < LIBRE && c < table.length && g++ < 1000000) { l.push(c); c = table[c]; }
    return l;
  };
  const assembler = (liste, taille, base) => {
    const out = new Uint8Array(liste.length * taille);
    liste.forEach((c, i) => { const d = base(c); if (d + taille <= octets.length) out.set(octets.subarray(d, d + taille), i * taille); });
    return out;
  };

  const dir = assembler(chaine(u32(48), fat), tSec, pos);
  const entrees = [];
  const lireU32 = (t, o) => t[o] | (t[o + 1] << 8) | (t[o + 2] << 16) | (t[o + 3] << 24);
  for (let o = 0; o + 128 <= dir.length; o += 128) {
    const lg = dir[o + 64] | (dir[o + 65] << 8);
    if (!lg || lg > 64) continue;
    let nom = '';
    for (let i = 0; i + 1 < lg - 1; i += 2) nom += String.fromCharCode(dir[o + i] | (dir[o + i + 1] << 8));
    entrees.push({ nom, type: dir[o + 66], debut: lireU32(dir, o + 116), taille: lireU32(dir, o + 120) >>> 0 });
  }
  const cible = entrees.filter(e => e.type === 2)
    .find(e => nomsVoulus.some(n => n.toUpperCase() === e.nom.toUpperCase()));
  if (!cible) throw new Error('Fichier reconnu comme un classeur ancien, mais sans feuille de calcul à l’intérieur : l’export ne correspond pas au format attendu.');

  if (cible.taille < 4096) {
    const racine = entrees.find(e => e.type === 5);
    if (!racine) throw new Error('Classeur ancien incomplet : son répertoire n’a pas de racine.');
    const mf = assembler(chaine(u32(60), fat), tSec, pos);
    const miniFat = [];
    for (let i = 0; i + 4 <= mf.length; i += 4) miniFat.push(lireU32(mf, i) >>> 0);
    const store = assembler(chaine(racine.debut, fat), tSec, pos);
    const liste = chaine(cible.debut, miniFat);
    const out = new Uint8Array(liste.length * tMini);
    liste.forEach((c, i) => out.set(store.subarray(c * tMini, (c + 1) * tMini), i * tMini));
    return out.subarray(0, cible.taille);
  }
  return assembler(chaine(cible.debut, fat), tSec, pos).subarray(0, cible.taille);
}
/* BIFF8 : une suite d'enregistrements « identifiant · longueur · données ».
   Seuls comptent ceux qui portent une valeur de cellule. Comme pour le .xlsx,
   DEUX lectures sont conservées : le texte affiché et la valeur NUMÉRIQUE —
   ici elle est native, le format stocke de vrais nombres binaires, donc aucune
   ambiguïté de séparateur décimal ne peut s'y glisser. */
function Fn_LireBiff(flux) {
  const dv = new DataView(flux.buffer, flux.byteOffset, flux.byteLength);
  const u8 = o => flux[o], u16 = o => dv.getUint16(o, true), u32 = o => dv.getUint32(o, true);
  const f64 = o => dv.getFloat64(o, true);

  // Un enregistrement trop long pour tenir sur 64 Ko se poursuit dans des
  // CONTINUE, qu'on rattache au précédent au lieu de les traiter à part.
  const recs = [];
  let o = 0;
  while (o + 4 <= flux.length) {
    const id = u16(o), lg = u16(o + 2), deb = o + 4;
    if (deb + lg > flux.length) break;
    if (id === 0x003c && recs.length) recs[recs.length - 1].suites.push([deb, lg]);
    else recs.push({ id: id, deb: deb, lg: lg, suites: [] });
    o = deb + lg;
  }

  /* LA TABLE DES CHAÎNES (SST) est le seul endroit vraiment retors du format :
     un libellé peut être coupé par un CONTINUE, et la moitié qui suit redéclare
     À ELLE SEULE si elle est écrite sur un ou deux octets par caractère. Lire le
     SST sans en tenir compte donne des noms tronqués — silencieusement, et donc
     des lignes qui ne s'apparient plus avec le collage. */
  const sst = [];
  let recSst = null;
  for (let i = 0; i < recs.length; i++) if (recs[i].id === 0x00fc) { recSst = recs[i]; break; }
  if (recSst) {
    const blocs = [[recSst.deb, recSst.lg]].concat(recSst.suites);
    let bi = 0, bo = 8;                        // 8 octets d'en-tête (total, uniques)
    const fin = () => blocs[bi][0] + blocs[bi][1];
    const cur = () => blocs[bi][0] + bo;
    const place = () => { while (bi < blocs.length && cur() >= fin()) { bi++; bo = 0; } return bi < blocs.length; };
    const sauter = n => { let r = n; while (r > 0 && place()) { const d = Math.min(r, fin() - cur()); bo += d; r -= d; } };
    const uniques = u32(recSst.deb + 4);
    for (let k = 0; k < uniques && k < 200000 && place(); k++) {
      const cch = u16(cur()); bo += 2;
      const fl = u8(cur()); bo += 1;
      let cRun = 0, cbExt = 0;
      if (fl & 8) { cRun = u16(cur()); bo += 2; }
      if (fl & 4) { cbExt = u32(cur()); bo += 4; }
      let large = fl & 1, reste = cch, txt = '';
      while (reste > 0 && place()) {
        const dispo = Math.floor((fin() - cur()) / (large ? 2 : 1));
        const n = Math.min(reste, dispo);
        for (let i = 0; i < n; i++) {
          txt += large ? String.fromCharCode(u16(cur())) : String.fromCharCode(u8(cur()));
          bo += large ? 2 : 1;
        }
        reste -= n;
        if (reste > 0) { bi++; bo = 0; if (bi >= blocs.length) break; large = u8(cur()) & 1; bo += 1; }
      }
      sauter(4 * cRun); sauter(cbExt);
      sst.push(txt);
    }
  }

  // Chaîne courte écrite en place (LABEL) : longueur sur deux octets, drapeaux
  // sur un, puis les caractères — même codage que dans la table des chaînes.
  const chaineEnPlace = p => {
    const cch = u16(p), fl = u8(p + 2);
    let t = '', q = p + 3;
    if (fl & 8) q += 2;
    if (fl & 4) q += 4;
    for (let i = 0; i < cch && q < flux.length; i++) {
      t += (fl & 1) ? String.fromCharCode(u16(q)) : String.fromCharCode(u8(q));
      q += (fl & 1) ? 2 : 1;
    }
    return t;
  };
  /* Nombre « RK » : une compression maison du format. Deux drapeaux dans les bits
     de poids faible — entier plutôt que flottant, et valeur à diviser par cent.
     Un flottant y est un double amputé de ses 34 bits de poids faible. */
  const tampon = new DataView(new ArrayBuffer(8));
  const rk = v => {
    let n;
    if (v & 2) n = (v | 0) >> 2;
    else { tampon.setUint32(0, 0, true); tampon.setUint32(4, v & 0xfffffffc, true); n = tampon.getFloat64(0, true); }
    return (v & 1) ? n / 100 : n;
  };

  /* La PREMIÈRE feuille seulement : son décalage dans le flux est donné par
     BOUNDSHEET. Si le repère manque, on lit tout plutôt que de ne rien rendre —
     un classeur à une seule feuille reste alors parfaitement lu. */
  let debutFeuille = -1;
  for (let i = 0; i < recs.length; i++) if (recs[i].id === 0x0085) { debutFeuille = u32(recs[i].deb); break; }
  let vuFeuille = false;
  if (debutFeuille >= 0) for (let i = 0; i < recs.length; i++) if (recs[i].deb - 4 === debutFeuille) { vuFeuille = true; break; }
  let dedans = !vuFeuille;

  const parRang = {}, numParRang = {};
  const poser = (r, c, texte, valeur) => {
    const ref = Fn_ColLettre(c);
    if (!parRang[r]) { parRang[r] = {}; numParRang[r] = {}; }
    if (texte !== null && String(texte).trim() !== '') parRang[r][ref] = String(texte).trim();
    if (valeur !== null && valeur !== undefined && !isNaN(valeur)) numParRang[r][ref] = valeur;
  };
  recs.forEach(r => {
    if (vuFeuille && r.deb - 4 === debutFeuille) dedans = true;
    if (!dedans) return;
    const p = r.deb;
    if (r.id === 0x00fd) { const i = u32(p + 6); poser(u16(p), u16(p + 2), sst[i] === undefined ? '' : sst[i], null); }
    else if (r.id === 0x0204 || r.id === 0x00d6) poser(u16(p), u16(p + 2), chaineEnPlace(p + 6), null);
    else if (r.id === 0x0203) { const n = f64(p + 6); poser(u16(p), u16(p + 2), String(n), n); }
    else if (r.id === 0x027e) { const n = rk(u32(p + 6)); poser(u16(p), u16(p + 2), String(n), n); }
    else if (r.id === 0x00bd) {
      const lig = u16(p), c0 = u16(p + 2), nb = Math.floor((r.lg - 6) / 6);
      for (let i = 0; i < nb; i++) { const n = rk(u32(p + 4 + i * 6 + 2)); poser(lig, c0 + i, String(n), n); }
    } else if (r.id === 0x0006 && u16(p + 12) !== 0xffff) { const n = f64(p + 6); poser(u16(p), u16(p + 2), String(n), n); }
  });

  const rangs = Object.keys(parRang).map(Number).sort((a, b) => a - b);
  const lignes = [], nombres = [];
  rangs.forEach(r => { if (Object.keys(parRang[r]).length) { lignes.push(parRang[r]); nombres.push(numParRang[r]); } });
  return { lignes: lignes, nombres: nombres };
}
// Lecture du classeur : renvoie les lignes brutes (par lettre de colonne), sans
// interprétation métier — celle-ci est faite par Fn_RegistreDepuisXlsx.
async function Fn_LireXlsx(fichier) {
  const buf = await (fichier.arrayBuffer ? fichier.arrayBuffer() : new Promise((res, rej) => {
    const l = new FileReader();
    l.onload = () => res(l.result);
    l.onerror = () => rej(new Error('lecture du fichier impossible'));
    l.readAsArrayBuffer(fichier);

  const octets = new Uint8Array(buf);
  const socle = { ts: Date.now(), nom: fichier.name || 'export', taille: fichier.size || 0 };
  /* LE FORMAT EST RECONNU À SA SIGNATURE, JAMAIS À SON EXTENSION. Le courtier
     nomme « .xls » un fichier qui est parfois un vrai .xlsx, et l'inverse se voit
     aussi ; se fier au nom aurait fait refuser des fichiers parfaitement lisibles.
     D0 CF 11 E0 : conteneur OLE2, donc classeur ancien. */
  if (octets[0] === 0xd0 && octets[1] === 0xcf && octets[2] === 0x11 && octets[3] === 0xe0) {
    const lu = Fn_LireBiff(Fn_OleFlux(octets, ['Workbook', 'Book']));
    const lignesLues = lu.lignes;
  /* Un classeur VIDE se lit sans erreur et ne donne rien : accepté tel quel, il
     s'afficherait comme chargé, et les contrôles croisés qu'il alimente seraient
     morts sans que rien ne le dise. Un export sans une seule ligne est donc
     refusé, avec la marche à suivre. */
  if (!lignesLues.length) throw new Error('Classeur lu, mais entièrement vide : aucune ligne à en tirer. Refaites l’export depuis l’espace du courtier, portefeuille affiché.');
    return { lignes: lu.lignes, nombres: lu.nombres, ts: socle.ts, nom: socle.nom, taille: socle.taille };
  }
  const entrees = await Fn_ZipExtraire(octets, Cst_XlsxEntrees);
  const feuille = entrees['xl/worksheets/sheet1.xml'];
  if (!feuille) throw new Error('Classeur lu, mais sa première feuille est introuvable : l’export ne correspond pas au format attendu.');
  const partagees = [];
  const brutSs = entrees['xl/sharedStrings.xml'] || '';
  const reSi = /<si\b[\s\S]*?<\/si>/g;
  let m;
  while ((m = reSi.exec(brutSs)) !== null) partagees.push(Fn_XmlTexte(m[0]));
  /* DEUX LECTURES DE LA MÊME CELLULE, et c'est la correction la plus importante
     de ce lecteur. « lignes » garde le texte tel qu'il est écrit ; « nombres »
     garde la valeur NUMÉRIQUE des seules cellules qui en portent une.
     Un classeur écrit des nombres MACHINE : le point y est TOUJOURS une
     décimale, jamais un séparateur de milliers. Fn_NombreFr, lui, arbitre pour
     un écran français, où « 75.717 » vaut soixante-quinze mille — et transformait
     donc tout montant du fichier à exactement trois décimales en sa valeur mille
     fois trop grande : un cours de 0,085 devenait 85, un montant de 578,745 €
     devenait 578 745 €. Les deux règles sont justes chacune dans son monde ; il
     fallait cesser d'appliquer celle de l'écran au fichier. */
  const lignes = [], nombres = [];
  const reLigne = /<row\b([^>]*)>([\s\S]*?)<\/row>/g;
  const reCell = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
  let mr;
  while ((mr = reLigne.exec(feuille)) !== null) {
    const cellules = {}, nums = {};
    let mc;
    reCell.lastIndex = 0;
    while ((mc = reCell.exec(mr[2])) !== null) {
      const attrs = mc[1] || '', corps = mc[2] || '';
      const ref = /r="([A-Z]+)\d+"/.exec(attrs);
      if (!ref) continue;
      const type = /t="([a-zA-Z]+)"/.exec(attrs);
      let valeur = null, brut = null;
      const mv = /<v>([\s\S]*?)<\/v>/.exec(corps);
      if (type && type[1] === 's' && mv) valeur = partagees[Number(mv[1])] || '';
      else if (type && type[1] === 'inlineStr') valeur = Fn_XmlTexte(corps);
      else if (mv) { valeur = Fn_XmlTexte(mv[1]); brut = mv[1]; }
      if (valeur === null || String(valeur).trim() === '') continue;
      cellules[ref[1]] = String(valeur).trim();
      // Le motif exige la forme d'un nombre machine : une cellule de formule
      // rendant du texte (t="str") ou un booléen n'y entre pas.
      if (brut !== null && /^-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?$/.test(String(brut).trim())) {
        const n = Number(String(brut).trim());
        if (!isNaN(n)) nums[ref[1]] = n;
      }
    }
    if (Object.keys(cellules).length) { lignes.push(cellules); nombres.push(nums); }
  }
  const lignesLues = lignes;
  /* Un classeur VIDE se lit sans erreur et ne donne rien : accepté tel quel, il
     s'afficherait comme chargé, et les contrôles croisés qu'il alimente seraient
     morts sans que rien ne le dise. Un export sans une seule ligne est donc
     refusé, avec la marche à suivre. */
  if (!lignesLues.length) throw new Error('Classeur lu, mais entièrement vide : aucune ligne à en tirer. Refaites l’export depuis l’espace du courtier, portefeuille affiché.');
  return { lignes, nombres, ts: socle.ts, nom: socle.nom, taille: socle.taille };
}
/* Nombre écrit par une MACHINE : le point y est la décimale, jamais un
   séparateur de milliers. Réservé aux cellules du classeur qui portent du texte
   au lieu d'un nombre — ailleurs, la valeur numérique native fait foi. */
function Fn_NombreMachine(s) {
  const t = String(s == null ? '' : s).replace(/[\s\u00a0\u202f]/g, '');
  if (!/^-?\d+(?:,\d{3})*(?:\.\d+)?$/.test(t)) return null;
  const v = Number(t.replace(/,/g, ''));
  return isNaN(v) ? null : v;
}
/* LES COLONNES SONT RECONNUES PAR LEUR EN-TÊTE, PAS PAR LEUR LETTRE.
   Le principe qui interdit de reconnaître une LIGNE par son numéro vaut sur
   l'autre axe, et pour la même raison : la disposition a déjà changé sous ce
   lecteur. L'export ancien tient en six colonnes et fusionne la devise avec le
   montant dans une seule cellule (« USD 5546.73 ») ; l'export actuel en compte
   sept et les sépare. Lu à la lettre, l'ancien rendait des montants en euros
   tous vides et une somme nulle — sans rien signaler.
   Sans en-tête reconnaissable, on retombe sur la convention A…G : un classeur
   sans ligne de titres reste lisible. */
function Fn_ColonnesExport(lignes) {
  const defaut = { nom: 'A', code: 'B', qte: 'C', cloture: 'D', dev: 'E', montDev: 'F', montEur: 'G', enTete: -1 };
  const norme = s => String(s || '').toLowerCase().normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
  for (let i = 0; i < Math.min(5, lignes.length); i++) {
    const c = lignes[i], cles = Object.keys(c);
    const vus = cles.map(k => ({ k: k, t: norme(c[k]) }));
    if (!vus.some(v => /produit|libelle/.test(v.t)) || !vus.some(v => /quantit/.test(v.t))) continue;
    const m = { nom: null, code: null, qte: null, cloture: null, dev: null, montDev: null, montEur: null, enTete: i };
    vus.forEach(v => {
      if (!m.nom && /produit|libelle/.test(v.t)) m.nom = v.k;
      else if (!m.code && /isin|ticker/.test(v.t)) m.code = v.k;
      else if (!m.qte && /quantit/.test(v.t)) m.qte = v.k;
      else if (!m.cloture && /cloture|cours/.test(v.t)) m.cloture = v.k;
      else if (!m.dev && /devise/.test(v.t)) m.dev = v.k;
      else if (!m.montEur && /montant/.test(v.t) && /eur/.test(v.t)) m.montEur = v.k;
      else if (!m.montDev && /montant|valeur/.test(v.t)) m.montDev = v.k;
    });
    // Une seule colonne de montant : c'est celle en EUROS.
    if (!m.montEur && m.montDev) { m.montEur = m.montDev; m.montDev = null; }
    /* Un en-tête à moitié compris est PIRE que pas d'en-tête : il laisse des
       colonnes vides sans que rien ne le dise. Sans les rôles indispensables,
       on retombe donc entièrement sur la convention de place. */
    if (!m.nom || !m.qte || !m.montEur) return defaut;
    /* LA COLONNE DU MONTANT EN DEVISE N'A PAS DE TITRE dans l'export du courtier :
       sa case d'en-tête est vide. La chercher par son libellé la perdait, et avec
       elle le taux de change, qui s'en déduit — le fichier se lisait alors
       entièrement sauf ce qui convertit les devises. On la retrouve par sa place :
       la colonne sans rôle située entre la devise et le montant en euros. */
    const rang = L => { let v = 0; for (let j = 0; j < L.length; j++) v = v * 26 + (L.charCodeAt(j) - 64); return v; };
    const entre = (apres, avant) => {
      if (!apres || !avant) return null;
      const pris = {};
      Object.keys(m).forEach(k => { if (k !== 'enTete' && m[k]) pris[m[k]] = 1; });
      const vues = {};
      for (let j = i + 1; j < Math.min(i + 6, lignes.length); j++) Object.keys(lignes[j]).forEach(k => { vues[k] = 1; });
      const libres = Object.keys(vues)
        .filter(k => !pris[k] && rang(k) > rang(apres) && rang(k) < rang(avant))
        .sort((x, y) => rang(x) - rang(y));
      return libres.length ? libres[0] : null;
    };
    if (!m.montDev) m.montDev = entre(m.dev, m.montEur);
    if (!m.cloture) m.cloture = entre(m.qte, m.dev);
    return m;
  }
  return defaut;
}
/* Interprétation métier du classeur : produit · ticker/ISIN · quantité ·
   clôture (VEILLE, inutilisable) · devise · montant en devise · montant en EUR.
   Aucune ligne n'est reconnue par son NUMÉRO ni aucune colonne par sa LETTRE :
   la ligne des liquidités est celle qui porte un montant sans quantité ni
   identifiant, une ligne de position celle qui porte un produit ET une quantité,
   et les colonnes viennent de l'en-tête. Un export dont l'ordre changerait —
   c'est déjà arrivé — resterait donc lisible. */
function Fn_RegistreDepuisXlsx(xlsx) {
  const lignes = [], inconnues = [];
  let liquidites = null;
  const taux = {};
  const nombres = xlsx.nombres || [];
  const col = Fn_ColonnesExport(xlsx.lignes || []);
  (xlsx.lignes || []).forEach((c, i) => {
    if (i === col.enTete) return;
    // La valeur NUMÉRIQUE de la cellule fait foi ; le texte n'est relu que si la
    // cellule n'en portait pas (état antérieur, cellule de texte). Voir le
    // commentaire de Fn_LireXlsx : la règle de lecture d'un écran français n'a
    // rien à faire dans un fichier.
    const n = nombres[i] || {};
    const val = cle => (!cle ? null : (n[cle] !== undefined ? n[cle] : Fn_NombreFr(c[cle])));
    const nom = (col.nom && c[col.nom]) || '', code = (col.code && c[col.code]) || '';
    const estIsin = /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(code.toUpperCase());
    const qte = val(col.qte);
    /* CELLULE FUSIONNÉE « devise + montant » de l'export ancien : la devise seule
       est gardée, le montant qui la suit sert de montant en devise — c'est de lui
       que se déduit le taux de change, qui serait sinon introuvable. */
    const devBrut = ((col.dev && c[col.dev]) || '').toUpperCase().trim();
    const fusion = /^([A-Z]{3})\s+(-?[\d.,\s\u00a0]+)$/.exec(devBrut);
    const dev = fusion ? fusion[1] : devBrut;
    const montDev = fusion ? Fn_NombreMachine(fusion[2]) : val(col.montDev);
    const montEur = val(col.montEur);
    // Ligne d'en-tête non repérée : la colonne de quantité ne porte pas un nombre.
    if (i === 0 && col.enTete < 0 && qte == null && nom) return;
    if (dev && dev !== 'EUR' && montDev && montEur != null && montDev !== 0) {
      taux[dev] = Math.round(Math.abs(montEur / montDev) * 1e6) / 1e6;
    }
    /* LIGNE DE LIQUIDITÉS. Reconnue par sa FORME : un montant, aucune quantité,
       aucun identifiant. Le courtier la nomme (« CASH & CASH FUND & FTX CASH
       (EUR) ») — exiger un libellé VIDE la faisait tomber en « ligne non
       reconnue » à chaque analyse, et le contrôle croisé des liquidités, qui
       n'avait plus de terme à comparer, ne s'exécutait tout simplement jamais.
       Une position porte toujours À LA FOIS un identifiant et une quantité :
       la confusion est donc impossible dans l'autre sens. */
    if (qte == null && montEur != null && !estIsin) {
      liquidites = { nom: nom || 'liquidités', dev: dev || 'EUR', montantDev: montDev, montantEur: montEur };
      return;
    }
    if (nom && qte != null) {
      lignes.push({
        nom, nomNorm: Fn_NormNom(nom), code, qte, dev: dev || 'EUR',
        clotureVeille: val(col.cloture), montantDev: montDev, montantEur: montEur,
        isin: estIsin ? code.toUpperCase() : null
      });
      return;
    }
    if (nom || code || montEur != null) inconnues.push(Object.keys(c).map(k => k + '=' + c[k]).join(' · '));
  });
  return { lignes, liquidites, taux, inconnues, ts: xlsx.ts, nom: xlsx.nom };
}

/* ----------------------------------------------------------------
   ÉTAGE 2 — NORMALISATION : parseur des captures texte
   PRINCIPES (non négociables, ils viennent du cahier) :
   - ORIENTÉ LIGNE, TOLÉRANT, JAMAIS BLOQUANT : une ligne non comprise
     n'annule pas les autres, elle est mise de côté et signalée.
   - ANCRAGES ROBUSTES plutôt que positions de colonnes : un motif d'ISIN,
     un nombre suivi d'un code devise, un mot-clé. Ne JAMAIS dépendre d'un
     nombre d'espaces — un écran mobile n'aligne rien.
   - DÉCIMALES FRANÇAISES ET ANGLAISES acceptées, espaces insécables compris.
   - IDEMPOTENT : recoller deux fois la même capture donne le même état.
   - Le texte brut est conservé même après un parsing réussi : c'est la seule
     pièce qui permette de diagnostiquer un parseur qui se trompe.
   Le format exact produit par l'automate de capture n'étant pas figé, tout
   passe par UNE interface stable, Fn_ParserCapture(type, texte), et par la
   table d'ancrages ci-dessous — c'est elle, et elle seule, qu'il faut
   compléter quand un écran change.
   ---------------------------------------------------------------- */
const Cst_AncresMarge = [
  { cle: 'titres', motifs: [/valeur\s+des\s+titres/i, /portefeuille\s+titres/i, /securities?\s+value/i] },
  { cle: 'cash', motifs: [/liquidit[ée]s?/i, /esp[èe]ces/i, /solde\s+esp[èe]ces/i, /^cash$/i] },
  { cle: 'vl', motifs: [/valeur\s+(liquidative|de\s+liquidation)/i, /total\s+du\s+compte/i, /account\s+value/i] },
  { cle: 'risque', motifs: [/risque\s+(du\s+)?portefeuille/i, /^risque$/i, /portfolio\s+risk/i] },
  { cle: 'libre', motifs: [/espace\s+libre/i, /marge\s+disponible/i, /free\s+(space|margin)/i] }

/* Lignes d'habillage d'écran : titres de colonnes, horodatages, totaux. Elles
   portent parfois des chiffres et seraient prises pour des positions. C'est LA
   table à compléter quand un écran du courtier change de libellé — et le seul
   endroit à toucher. */
const Cst_LignesIgnorees = [
  /derni[èe]re\s+mise\s+[àa]\s+jour/i, /^portefeuille$/i, /^positions?$/i, /^ordres?/i,
  /^transactions?/i, /^total/i, /^produit\b/i, /^quantit[ée]/i, /^valeur\b/i, /^sous-?total/i,
  /^actualis[ée]/i, /^solde/i, /^r[ée]sum[ée]/i, /^mon\s+portefeuille/i,
  // Bornes et en-tête d'un document sectionné collé tel quel dans une seule
  // zone : elles ne portent aucune donnée de portefeuille et n'ont rien à faire
  // en « ligne non reconnue ». Le découpage les retire déjà — ceci n'est que le
  // filet pour un collage à l'ancienne.
  /^===VIGIE:/, /^(version|capture|statut|maj_degiro|noeuds_|ordres_|historique|valeur_gage|facilite_credit|duree_s)\w*=/i

// lecture des nombres, en préservant les positions dans la ligne (remplacement
// par des espaces de même longueur) pour que le découpage nom / chiffres reste juste.
function Fn_SansHorodatage(l) {
  const blanc = m => new Array(m.length + 1).join(' ');
  return String(l)
    .replace(/\b\d{1,2}\s*[:h]\s*\d{2}(?:\s*[:.]\s*\d{2})?\b/g, blanc)
    .replace(/\b\d{1,2}[/-]\d{1,2}[/-]\d{2,4}\b/g, blanc);
}
/* DOCUMENT SECTIONNÉ — la capture unique de l'automate.
   UN SEUL COLLAGE alimente les trois écrans : le document porte des bornes
   « ===VIGIE:NOM=== » et se découpe AVANT tout parseur. C'est indispensable :
   les parseurs « ordres » et « exécutés » acceptent exactement les mêmes lignes,
   et verser le même texte dans les deux y compterait deux fois les mêmes ordres.
   Sans borne reconnue, le texte repart tel quel vers l'entrée visée — un collage
   écran par écran reste valide, et rien de l'ancien chemin ne change. */
const Cst_ReSectionVigie = /^===VIGIE:([A-Z]+)===$/;

  const lignes = String(texte || '').split(/\r?\n/);

  let cle = null;
  lignes.forEach(l => {
    const m = Cst_ReSectionVigie.exec(l.trim());
    if (m) { cle = m[1]; if (cle !== 'FIN') sections[cle] = sections[cle] || []; return; }
    if (cle && cle !== 'FIN' && sections[cle]) sections[cle].push(l);
  });

  const j = k => (sections[k] || []).join('\n').trim();

    executes: j('EXECUTES'), meta: j('META') };
}
/* EN-TÊTE DE CAPTURE. Des lignes « clé=valeur » qui décrivent la LECTURE, pas le
   portefeuille : heure de capture, heure de rafraîchissement du courtier, nombre
   de nœuds lus par écran, nombre d'ordres ouverts, mention d'historique vide.
   Aucune de ces valeurs n'est un chiffre de portefeuille : elles servent à DATER
   et à CONTRÔLER ce qui a été lu, jamais à le remplacer. */
function Fn_ParserMeta(texte) {
  const meta = {};
  Fn_LignesUtiles(texte).forEach(l => {
    const i = l.indexOf('=');
    if (i <= 0) return;
    meta[l.slice(0, i).trim().toLowerCase()] = l.slice(i + 1).trim();

}
/* SENS D'UN ORDRE. « long » et « short » ont été RETIRÉS de ce vocabulaire : ils
   décrivent un produit, pas un ordre. Une VENTE de « Turbo Mini-Future Short »
   se lisait « achat » parce que le nom du produit portait le mot, et un turbo
   Long vendu se lisait achat de la même façon. Le sens se lit sur le mot d'ordre
   (Achat / Vente), et sur celui qui vient EN PREMIER dans la ligne. */
const Cst_MotsAchat = /\b(achat|acheter|buy)\b/i;
const Cst_MotsVente = /\b(vente|vendre|sell)\b/i;
const Cst_ReIsin = /\b([A-Z]{2}[A-Z0-9]{9}[0-9])\b/;
const Cst_ReDevise = /\b(EUR|USD|GBP|CHF|JPY|SEK|NOK|DKK|CAD|AUD|HKD)\b/;

// répète le code devise qu'une colonne plus loin, parfois pas du tout.
const Cst_SymbolesDevise = { '€': 'EUR', '$': 'USD', '£': 'GBP', '¥': 'JPY' };
const Cst_ReSymboleDevise = /[€$£¥]/;
/* UN NOMBRE. Deux alternatives, dans cet ordre :
   1. un nombre à SÉPARATEUR DE MILLIERS — espace (insécable comprise) ou POINT,
      chaque groupe faisant exactement trois chiffres, et la série n'étant PAS
      suivie d'un chiffre de plus ;
   2. à défaut, un nombre simple, à décimale française ou anglaise.
   Le point comme séparateur de milliers vient de l'écran du courtier, qui écrit
   « 75.717,76 ». Sans lui, la ligne était lue « 75.717 » PUIS « 76 » : comme le
   bloc de marge retient le DERNIER nombre de sa ligne, la valeur des titres
   valait 76 euros, et la valeur nette, le coussin et le levier en découlaient tous.
   Le garde-fou « pas de chiffre après la série » est ce qui distingue
   « 27.988,25 » (vingt-sept mille) de « 653.3671 » (une barrière à quatre
   décimales) : sans lui, la seconde devenait 653 367, mille fois trop. */
const Cst_ReNombre = /-?\d{1,3}(?:[   .]\d{3})+(?!\d)(?:[.,]\d+)?|-?\d+(?:[.,]\d+)?/g;
function Fn_NombresDe(ligne) {
  const res = [];
  Cst_ReNombre.lastIndex = 0;
  let m;
  while ((m = Cst_ReNombre.exec(ligne)) !== null) {
    const v = Fn_NombreFr(m[0]);
    if (v != null) res.push({ v, i: m.index, brut: m[0] });

  return res;
}
/* NOMBRE D'UN PARAMÈTRE DE PRODUIT À LEVIER. Lecture SÉPARÉE, et c'est voulu :
   dans « BAR 186.315 » le point est une DÉCIMALE (186,315), alors que le même
   point est ailleurs sur l'écran un séparateur de milliers. Lus par la règle
   générale, ces paramètres valaient mille fois leur valeur. */
function Fn_NombreParam(txt) {
  const s = String(txt == null ? '' : txt).replace(/[\s  ]/g, '').replace(/,/g, '.');
  const m = /^\d+(?:\.\d+)?/.exec(s);
  return m ? Number(m[0]) : null;
}
function Fn_LignesUtiles(texte) {
  return String(texte || '')
    .replace(/\r/g, '\n').replace(/[  ]/g, ' ').replace(/\t/g, ' ')
    .split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
}
/* MASQUAGE DES CODES. Un identifiant et un paramètre de turbo portent des
   chiffres sans être des montants. Ils sont remplacés par des blancs de MÊME
   LONGUEUR avant toute lecture de nombres : les positions dans la ligne restent
   justes, donc le découpage « nom / chiffres » aussi.
   - l'ISIN, sinon un identifiant se lit comme un nombre de dix chiffres, et
     l'écran le place AVANT le cours sur certaines dispositions : le cours lu
     valait alors un fragment de l'identifiant, et cela sur TOUTES les lignes ;
   - les paramètres de levier, parce que le premier nombre d'une ligne de turbo
     était la barrière et non le cours : le cours du turbo ressortait faux d'un
     facteur trente, et c'est précisément la donnée dont le collage a le monopole.
   Les lettres isolées R et P (parité) ne sont masquées que si la ligne est bien
   une ligne de produit à levier : ailleurs, elles appartiennent au texte. */
const Cst_ReMarqueLevier = /\b(?:SL|BAR|STR)\s*:?\s*\d/i;
const Cst_ReParamFort = /\b(?:SL|BAR|STR|LV)\s*:?\s*\d[\d.,]*/gi;
const Cst_ReParamFaible = /\b(?:R|P)\s*:?\s*\d[\d.,]*/gi;
function Fn_MasquerCodes(l) {
  const blanc = m => new Array(m.length + 1).join(' ');
  const s = String(l).replace(/\b[A-Z]{2}[A-Z0-9]{9}[0-9]\b/g, blanc);
  if (!Cst_ReMarqueLevier.test(s)) return s;
  return s.replace(Cst_ReParamFort, blanc).replace(Cst_ReParamFaible, blanc);
}
/* NOM DOUBLÉ. L'arbre d'accessibilité expose à la fois le texte d'un nœud et sa
   description : chaque libellé de produit arrive écrit DEUX FOIS de suite.
   « Untel SA Untel SA » redevient « Untel SA ». Sans cela le nom affiché est
   illisible, et surtout un nom court ne s'apparie plus avec celui de l'export. */
function Fn_DedoublerNom(nom) {
  const t = String(nom || '').split(' ').filter(Boolean);
  for (let k = Math.floor(t.length / 2); k >= 1; k--) {
    if (t.slice(0, k).join(' ').toUpperCase() === t.slice(k, 2 * k).join(' ').toUpperCase()) {
      return t.slice(0, k).concat(t.slice(2 * k)).join(' ');

  }
  return t.join(' ');
}
/* NOM ET TICKER d'une ligne de position. L'écran écrit « <nom> <nom> <TICKER> | »
   puis les colonnes. La barre verticale est l'ancre : le mot en majuscules qui la
   précède est le ticker — la seule source qui en donne un, l'export n'en portant
   pas. Le reste est dédoublé, débarrassé du symbole de devise qui traîne avant le
   premier chiffre, et devient le nom complet du produit. */
function Fn_NomEtTicker(segment) {
  let s = String(segment || '').replace(/\s+/g, ' ').trim();
  let ticker = null;
  const iPipe = s.lastIndexOf('|');
  if (iPipe >= 0) {
    const avant = s.slice(0, iPipe).trim();
    const m = /(?:^|\s)([A-Z][A-Z0-9.\-]{0,6})$/.exec(avant);
    if (m) { ticker = m[1]; s = avant.slice(0, avant.length - m[1].length).trim(); }
    else s = avant;
  }
  s = s.replace(/[|·;,€$£¥\s]+$/, '').trim();
  return { nom: Fn_DedoublerNom(s), ticker: ticker || null };
}
/* PARAMÈTRES D'UN PRODUIT À LEVIER. Le nom complet affiché à l'écran les porte
   tous ; l'export, tronqué à 32 caractères, les perd.
   DEUX CONVENTIONS COEXISTENT, relevées le même jour sur le même écran :
     « <émetteur> <sous-jacent> Turbo Mini-Future Short SL 652.8124 STR 680.0129 R 10 LV 2.09 »
     « <émetteur> <sous-jacent> Turbo illimités BEST Call BAR 186.02 STR 186.02 P 10 LV 1.51 »
   barrière = SL OU BAR · parité = R OU P · strike = STR · levier = LV.
   Ne connaître que la première convention laissait barrière et parité NULLES sur
   tout produit de l'autre émetteur ; et le sens, lu seulement sur « long » et
   « short », faisait passer un Call pour long par accident et un Put pour long à tort.
   L'ordre réel des champs est <émetteur> <sous-jacent> <type> <sens> <paramètres> :
   le sous-jacent est ce qui sépare l'émetteur du premier mot de type. Une forme
   plus ancienne intercale le type avant le sous-jacent — elle reste lue par le
   second découpage.
   Un motif non reconnu ne bloque JAMAIS : la position existe, ses paramètres sont
   marqués manquants et la ligne passe en carte « à valider » pour saisie. */
const Cst_ReTypeLevier = /\b(turbo|mini[- ]?futures?|certificats?|warrants?|factor|leverage|knock)/i;
function Fn_ExtraireParamsLevier(nom) {
  const s = String(nom || '');
  if (!Cst_ReTypeLevier.test(s) && !Cst_ReMarqueLevier.test(s)) return null;
  const nb = re => { const m = re.exec(s); return m ? Fn_NombreParam(m[1]) : null; };
  const barriere = nb(/\b(?:SL|BAR)\s*:?\s*([\d.,]+)/i);
  const strike = nb(/\bSTR\s*:?\s*([\d.,]+)/i);
  // La parité s'écrit R ou P, et la lettre doit être ISOLÉE : le R de « STR » et
  // le P de « P/L » ne sont pas des parités.
  const parite = nb(/(?:^|[^A-Za-z])[RP]\s*:?\s*([\d.,]+)/i);
  const levier = nb(/\bLV\s*:?\s*([\d.,]+)/i);
  // Un Call est un pari à la hausse, un Put un pari à la baisse : ils se
  // traduisent exactement dans le vocabulaire long / short.
  const sens = /\b(short|put)\b/i.test(s) ? 'short' : (/\b(long|call)\b/i.test(s) ? 'long' : null);
  const mots = s.replace(/\s+/g, ' ').trim().split(' ');
  const emetteur = mots.length ? (mots[0].replace(/[^A-Za-zÀ-ÿ&.\-]/g, '') || null) : null;
  let sousJacent = null;
  const mType = Cst_ReTypeLevier.exec(s);
  if (mType && mType.index > mots[0].length) {
    const entre = s.slice(mots[0].length, mType.index).trim().replace(/[|·,;-]+$/, '').trim();
    if (entre) sousJacent = entre;
  }
  if (!sousJacent) {
    const mApres = /\b(?:short|long|put|call)\b\s+([A-Za-z0-9À-ÿ][\wÀ-ÿ&.’' -]*?)\s*(?=\bSL\b|\bBAR\b|\bSTR\b|\bLV\b|$)/i.exec(s);
    if (mApres && mApres[1].trim()) sousJacent = mApres[1].trim();
  }
  return {
    type: 'derive', emetteur: emetteur || null, sousJacent: sousJacent || null,
    sens: sens || 'long', barriere, strike, parite, levier,
    manquants: ['barriere', 'strike', 'parite', 'levier'].filter(k => ({ barriere, strike, parite, levier })[k] == null)
  };
}
/* PARSEUR DE CAPTURE — interface stable, unique point d'entrée.
   Renvoie toujours { type, ts, lignes, inconnues, marge, meta, brut } : jamais
   d'exception, jamais de rejet global. */
function Fn_ParserCapture(type, texte) {
  const res = { type, ts: Date.now(), lignes: [], inconnues: [], marge: null, meta: null, brut: String(texte || '') };
  if (type === 'meta') { res.meta = Fn_ParserMeta(texte); return res; }
  const lignes = Fn_LignesUtiles(texte);
  if (!lignes.length) return res;
  if (type === 'positions') return Fn_ParserPositions(lignes, res);
  if (type === 'ordres') return Fn_ParserOrdres(lignes, res);
  if (type === 'executes') return Fn_ParserExecutes(lignes, res);
  res.inconnues = lignes;
  return res;
}
/* POSITIONS. Ce qui est cherché, dans cet ordre : le bloc de marge (par
   mots-clés, la valeur pouvant être sur la même ligne ou la suivante), puis
   chaque ligne de position. Une ligne de position porte un NOM (au moins trois
   lettres consécutives) et au moins un nombre APRÈS ce nom une fois les codes
   masqués. Ce premier nombre est le cours du jour — c'est la seule donnée dont
   cette capture ait le monopole, l'export donnant tout le reste et mieux.
   Le bloc de marge peut MANQUER : il n'est à l'écran que si le bandeau « Aperçu
   de la marge disponible » a été ouvert. marge reste alors nulle, et
   l'application le dit au lieu de deviner. */
function Fn_ParserPositions(lignes, res) {
  const prisMarge = {};
  lignes.forEach((l, i) => {
    Cst_AncresMarge.forEach(a => {
      if (prisMarge[a.cle] != null) return;        // != null : une marge à zéro est une valeur
      if (!a.motifs.some(re => re.test(l))) return;
      let nbs = Fn_NombresDe(Fn_SansHorodatage(l)); // une heure n'est pas un montant
      if (!nbs.length && lignes[i + 1]) nbs = Fn_NombresDe(Fn_SansHorodatage(lignes[i + 1]));
      if (nbs.length) prisMarge[a.cle] = nbs[nbs.length - 1].v;
    });
  });
  if (Object.keys(prisMarge).length) {
    res.marge = prisMarge;
    // Heure LUE sur la capture, jamais l'heure de l'appel : c'est elle qui date
    // les grandeurs de marge. L'en-tête du document la donne aussi, et plus
    // sûrement (maj_degiro) — Fn_AnalyserEntrees la préfère quand elle existe.
    const mh = /(\d{1,2})\s*[:h]\s*(\d{2})(?:\s*[:.]\s*(\d{2}))?/.exec(lignes.join(' '));
    res.marge.as = mh ? (mh[1].length < 2 ? '0' : '') + mh[1] + ':' + mh[2] + (mh[3] ? ':' + mh[3] : '') : null;
  }
  lignes.forEach(l => {
    if (Cst_AncresMarge.some(a => a.motifs.some(re => re.test(l)))) return; // déjà consommée
    if (Cst_LignesIgnorees.some(re => re.test(l))) return;                  // habillage d'écran
    const propre = Fn_MasquerCodes(Fn_SansHorodatage(l));
    const nbs = Fn_NombresDe(propre);
    const mNom = /[A-Za-zÀ-ÿ]{3,}/.exec(l);
    if (!mNom || !nbs.length) { if (l.length > 2) res.inconnues.push(l); return; }
    const apres = nbs.filter(n => n.i > mNom.index);
    if (!apres.length) { if (l.length > 2) res.inconnues.push(l); return; }
    const finNom = apres[0].i;
    const nt = Fn_NomEtTicker(l.slice(0, finNom));
    if (!nt.nom || nt.nom.length < 3) { res.inconnues.push(l); return; }
    // Les paramètres du produit à levier se lisent sur la LIGNE ENTIÈRE : l'écran
    // les rejette en fin de ligne, loin du nom. Le nom, lui, reste le nom.
    const levier = Fn_ExtraireParamsLevier(l);
    const mIsin = Cst_ReIsin.exec(l);
    const mDev = Cst_ReDevise.exec(l.slice(finNom));
    const mSym = mDev ? null : Cst_ReSymboleDevise.exec(l.slice(mNom.index));
    res.lignes.push({
      nom: nt.nom, nomNorm: Fn_NormNom(nt.nom), ticker: nt.ticker,
      isin: mIsin ? mIsin[1] : null,
      dev: mDev ? mDev[1] : (mSym ? Cst_SymbolesDevise[mSym[0]] : null),
      // Convention assumée et AFFICHÉE : dans une ligne de position, le premier
      // nombre après le nom — codes et paramètres masqués — est le cours du jour.
      // Les suivants sont conservés bruts : l'export fait foi sur la quantité et
      // le montant, on ne devine pas.
      cloture: apres[0].v, levier: levier,
      nombres: apres.map(n => n.v), brut: l
    });
  });
  return res;
}
/* ORDRES. Champs lus par ANCRAGE, jamais par position de colonne : l'ordre réel
   à l'écran est limite, montant, quantité — exactement l'inverse de ce qu'une
   lecture positionnelle supposait, et sur une ligne de turbo les paramètres du
   produit décalaient tout un peu plus.
   - la quantité porte son libellé en clair : « Qté 25 » ;
   - la limite est le seul nombre PRÉCÉDÉ d'un symbole de devise (« € 72,00 ») ;
   - le montant est le nombre suivant, borné par le libellé de validité pour ne
     pas ramasser la variation du jour qui traîne en fin de ligne ;
   - le nom est ce qui PRÉCÈDE le mot d'ordre, jamais la ligne vidée de ses
     chiffres — le vidage laissait les parasites de colonne dans le libellé. */
const Cst_ReQte = /\bQt[ée]s?\s*:?\s*(-?[\d   .,]+)/i;
const Cst_ReAncreDevise = /([€$£¥]|\b(?:EUR|USD|GBP|CHF|JPY|SEK|NOK|DKK|CAD|AUD|HKD)\b)\s*(-?[\d   .,]+)/;
const Cst_ReValidite = /\b(continu|jour|gtc)\b/i;
function Fn_LireOrdre(l) {
  const s = Fn_MasquerCodes(Fn_SansHorodatage(l));
  const mA = Cst_MotsAchat.exec(l), mV = Cst_MotsVente.exec(l);
  if (!mA && !mV) return null;
  const achat = !!mA && (!mV || mA.index < mV.index);
  const m = achat ? mA : mV;
  const iSens = m.index;
  const nbs = Fn_NombresDe(s);
  if (!nbs.length) return null;
  // Le nom est ce qui PRÉCÈDE le mot d'ordre. Certaines sources l'écrivent en
  // tête de ligne (« Achat Untel SA 25 … ») : le nom est alors ce qui SUIT le
  // mot d'ordre, jusqu'au premier chiffre. Les deux dispositions sont lues.
  let nt = Fn_NomEtTicker(l.slice(0, iSens));
  if (!nt.nom || nt.nom.length < 3) {
    const finSens = iSens + m[0].length;
    const apres = nbs.filter(n => n.i > finSens);
    nt = Fn_NomEtTicker(l.slice(finSens, apres.length ? apres[0].i : l.length));
  }
  if (!nt.nom || nt.nom.length < 3) return null;
  const mQ = Cst_ReQte.exec(s);
  const mVal = Cst_ReValidite.exec(s);
  const mL = Cst_ReAncreDevise.exec(s);
  const borne = Math.min(mQ ? mQ.index : Infinity, mVal ? mVal.index : Infinity, s.length);
  let limite = null, montantEur = null;
  if (mL) {
    limite = Fn_NombreFr(mL[2]);
    const suite = nbs.filter(n => n.i >= mL.index + mL[0].length && n.i < borne);
    montantEur = suite.length ? suite[0].v : null;
  } else {
    // Aucune ancre de devise : repli sur l'ORDRE RÉEL de l'écran (limite puis
    // montant), borné de la même façon. Jamais l'inverse.
    const avant = nbs.filter(n => n.i > iSens && n.i < borne);
    limite = avant.length ? avant[0].v : null;
    montantEur = avant.length > 1 ? avant[1].v : null;
  }
  const mDate = /(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})/.exec(l);
  const p2 = n => (String(n).length < 2 ? '0' : '') + n;
  const mIsin = Cst_ReIsin.exec(l);
  return {
    sens: achat ? 'achat' : 'vente', nom: nt.nom, ticker: nt.ticker,
    isin: mIsin ? mIsin[1] : null,
    qte: mQ ? Fn_NombreFr(mQ[1]) : null,
    limite: limite, montantEur: montantEur,
    validite: mVal ? mVal[1] : null,
    date: mDate ? ((mDate[3].length === 2 ? '20' + mDate[3] : mDate[3]) + '-' + p2(mDate[2]) + '-' + p2(mDate[1])) : null,
    brut: l
  };
}
function Fn_ParserOrdres(lignes, res) {
  lignes.forEach(l => {
    if (Cst_LignesIgnorees.some(re => re.test(l))) return;
    const o = Fn_LireOrdre(l);
    if (!o) { if (l.length > 2) res.inconnues.push(l); return; }
    res.lignes.push({ sens: o.sens, nom: o.nom, ticker: o.ticker, isin: o.isin,
      qte: o.qte, limite: o.limite, montantEur: o.montantEur,
      validite: o.validite ? o.validite + (o.date ? ' jusqu’au ' + o.date : '') : null,
      brut: o.brut });
  });
  return res;
}
/* ORDRES EXÉCUTÉS. Même écran que les ordres en attente, donc mêmes ancrages :
   c'est le comportement attendu. Ce parseur n'a PAS pu être calibré sur des
   lignes réelles — le jour du relevé, le courtier n'avait aucune transaction sur
   la période et l'en-tête du document le déclarait explicitement. Le prix
   unitaire y prend la place de la limite : c'est le nombre précédé du symbole de
   devise. À reconfirmer sur un relevé qui porte des transactions. */
function Fn_ParserExecutes(lignes, res) {
  lignes.forEach(l => {
    if (Cst_LignesIgnorees.some(re => re.test(l))) return;
    const o = Fn_LireOrdre(l);
    if (!o) { if (l.length > 2) res.inconnues.push(l); return; }
    res.lignes.push({ sens: o.sens, nom: o.nom, ticker: o.ticker, isin: o.isin,
      date: o.date, qte: o.qte, cours: o.limite, montantEur: o.montantEur, brut: o.brut });
  });
  return res;
}

/* ----------------------------------------------------------------
   APPARIEMENT DES DEUX SOURCES ET CONTRÔLES CROISÉS (§ 4.4 du cahier)
   Rôle respectif, tranché une fois pour toutes :
     quantités, identifiant, devise → l'EXPORT fait foi (lu par machine) ;
     cours du jour, nom complet du produit, ordres, marge → la CAPTURE
     est la seule source, l'export étant daté de la veille et tronqué.
   L'appariement se fait sur le PRÉFIXE du nom normalisé, l'export tronquant
   à 32 caractères. Tout écart produit une carte « à valider » : ces contrôles
   sont arithmétiques, gratuits, et ne peuvent pas être oubliés faute de budget.
   ---------------------------------------------------------------- */
function Fn_Apparier(nomExport, lignesCapture) {
  const cible = Fn_NormNom(nomExport);
  if (!cible) return null;
  let meilleur = null, meilleureLg = 0;
  lignesCapture.forEach(l => {
    const n = l.nomNorm || Fn_NormNom(l.nom);
    if (!n) return;
    const commun = (n.indexOf(cible) === 0) ? cible.length : ((cible.indexOf(n) === 0) ? n.length : 0);
    // Le seuil de HUIT caractères communs n'existe que parce que l'export tronque
    // à 32 caractères : un préfixe trop court apparierait n'importe quoi. Mais un
    // nom court ne l'atteint JAMAIS — « SAP SE » fait six caractères et remontait
    // en carte « ligne de l'export absente de la capture » à chaque analyse, à
    // valider à la main indéfiniment. Sous huit caractères, on exige donc que le
    // nom de l'export soit un MOT COMPLET en tête du nom lu à l'écran : c'est
    // aussi strict qu'une égalité, et cela survit au ticker que l'écran accole.
    const assez = cible.length >= 8
      ? commun >= 8
      : (n === cible || n.indexOf(cible + ' ') === 0);
    const poids = cible.length >= 8 ? commun : cible.length;
    if (assez && poids > meilleureLg) { meilleur = l; meilleureLg = poids; }
  });
  return meilleur;
}
function Fn_AnalyserEntrees() {
  const rt = Var_State._runtime;
  const capPos = rt.collages.positions ? Fn_ParserCapture('positions', rt.collages.positions.texte) : null;
  const capOrd = rt.collages.ordres ? Fn_ParserCapture('ordres', rt.collages.ordres.texte) : null;
  const capExe = (rt.collages.executes && !rt.aucuneTransac) ? Fn_ParserCapture('executes', rt.collages.executes.texte) : null;
  const reg = rt.xlsx ? Fn_RegistreDepuisXlsx(rt.xlsx) : null;
  const controles = [], propositions = [];
  const capLignes = capPos ? capPos.lignes : [];
  const vus = [];
  // EN-TÊTE DE LA CAPTURE UNIQUE. Il ne porte aucun chiffre de portefeuille : il
  // DATE la lecture et permet de la CONTRÔLER. Trois usages, et rien de plus.
  const meta = (rt.capture && rt.capture.meta) ? rt.capture.meta : null;
  if (meta) {
    // 1. L'heure de rafraîchissement du courtier est déclarée par l'automate :
    //    plus sûre que la première heure croisée dans le texte de l'écran.
    if (capPos && capPos.marge && meta.maj_degiro) capPos.marge.as = meta.maj_degiro;
    // 2. Une capture dégradée se signale au lieu de passer pour complète.
    if (meta.statut && !/^ok$/i.test(meta.statut)) {
      controles.push({ kind: 'capture_degradee',
        resume: 'La capture s’est déclarée en état « ' + meta.statut +' » : elle peut être incomplète.',
        preuve: 'En-tête de la capture du ' + (meta.capture || '—') + ', ' + (meta.duree_s || '—') + ' s de lecture.',
        propo: 'Refaire la capture avant d’intégrer, ou intégrer en sachant qu’une ligne peut manquer.' });
    }
    // 3. Le nombre d'ordres ouverts est compté par l'automate à l'écran : s'il
    //    diffère de ce que le parseur a su lire, c'est le parseur qui a tort.
    const ouverts = Fn_Num(meta.ordres_ouverts);
    if (capOrd && ouverts != null && ouverts !== capOrd.lignes.length) {
      controles.push({ kind: 'ecart_ordres',
        resume: 'L’écran annonce ' + Fn_FmtNb(ouverts, 0) + ' ordre(s) en attente, ' + capOrd.lignes.length + ' ont été lus.',
        preuve: 'Compté par la capture (ordres_ouverts) contre lignes reconnues par la lecture de la section des ordres.',
        propo: 'Voir le texte brut de l’entrée « Ordres en cours » : une ligne n’a pas été comprise, ou l’écran n’était pas complètement déroulé.' });
    }
  }
  if (reg) {
    reg.lignes.forEach(x => {
      const c = Fn_Apparier(x.nom, capLignes);
      if (c) vus.push(c);
      const id = Fn_IdPosition(x.isin || c && c.isin, null, c ? c.nom : x.nom);
      const nomComplet = c ? c.nom : x.nom; // la capture fait foi sur le nom
      // Les paramètres du produit à levier viennent de la LIGNE lue, pas du nom :
      // l'écran les rejette en fin de ligne, et le nom en est désormais nettoyé.
      // Les relire sur le nom seul les rendrait tous nuls.
      const levier = c ? c.levier : Fn_ExtraireParamsLevier(x.nom);
      const existante = Var_State.positions.find(p => p.id === id);
      if (!c) {
        controles.push({ kind: 'ligne_absente_capture',
          resume: 'Ligne présente dans l’export mais introuvable dans la capture : ' + x.nom + '.',
          preuve: 'Export : ' + Fn_FmtNb(x.qte, 0) + ' titres, ' + Fn_FmtEur(x.montantEur) + '. Capture : aucune ligne dont le nom commence par ce libellé.',
          propo: 'Capture partielle probable (défilement incomplet) : refaire la capture, ou intégrer la ligne sans cours du jour.' });
      }
      if (c && existante && Fn_Num(existante.detention.qte) != null && Fn_Num(existante.detention.qte) !== x.qte) {
        controles.push({ kind: 'ecart_quantite', id,
          resume: 'Quantité modifiée sur ' + nomComplet + ' : ' + Fn_FmtNb(existante.detention.qte, 0) + ' → ' + Fn_FmtNb(x.qte, 0) + ' titres.',
          preuve: 'Écart entre l’état de l’application et l’export du jour, qui fait foi sur les quantités.',
          propo: 'Mettre la ligne à jour (ordre exécuté ou mouvement intermédiaire).' });
      }
      propositions.push({ id, isin: x.isin || (c && c.isin) || null, nom: nomComplet, qte: x.qte,
        ticker: (c && c.ticker) || null, // l'écran est la SEULE source d'un ticker : l'export n'en porte pas
        dev: x.dev, cloture: c ? c.cloture : null, clotureVeille: x.clotureVeille,
        montantDev: x.montantDev, montantEur: x.montantEur, levier, source: 'export+capture' });
    });
    capLignes.forEach(c => {
      if (vus.indexOf(c) >= 0) return;
      // La carte porte son PAYLOAD : sans lui, accepter la proposition n'aurait
      // rien créé et la ligne serait restée hors de l'état pour toujours. Le cas
      // est fréquent et légitime — l'export tronque à 32 caractères, et un
      // produit à levier acheté après l'export n'y figure pas encore.
      const id = Fn_IdPosition(c.isin, null, c.nom);
      const payload = { id, isin: c.isin, nom: c.nom, ticker: c.ticker || null, qte: null,
        dev: c.dev || 'EUR', cloture: c.cloture, clotureVeille: null, montantDev: null,
        montantEur: null, levier: c.levier, source: 'capture seule' };
      controles.push({ kind: 'ligne_non_appariee', id, payload,
        resume: 'Ligne lue à l’écran sans correspondance dans l’export : ' + String(c.nom).slice(0, 70) + '.',
        preuve: 'Collage du ' + Fn_FmtHeure(capPos.ts) + '. L’export ne porte aucun produit dont le nom commence de la même façon.',
        propo: 'Intégrer la ligne avec son cours du jour — sa quantité restera à confirmer au prochain export. Ou refaire l’export s’il précède l’opération.' });
    });
  } else {
    // Sans export : on travaille sur la seule capture, et on le dit. Les
    // quantités restent celles de l'état — jamais devinées depuis l'écran.
    capLignes.forEach(c => {
      const id = Fn_IdPosition(c.isin, null, c.nom);
      const existante = Var_State.positions.find(p => p.id === id
        || Fn_NormNom(p.detention.nom).indexOf(Fn_NormNom(c.nom).slice(0, 12)) === 0);
      propositions.push({ id: existante ? existante.id : id, isin: c.isin, nom: c.nom,
        ticker: c.ticker || null,
        qte: existante ? Fn_Num(existante.detention.qte) : null, dev: c.dev || 'EUR',
        cloture: c.cloture, clotureVeille: null, montantDev: null, montantEur: null,

  const margeCap = capPos && capPos.marge;
  if (reg && reg.liquidites && margeCap && Fn_Num(margeCap.cash) != null) {
    const ecart = Fn_Num(margeCap.cash) - Fn_Num(reg.liquidites.montantEur);
    if (Math.abs(ecart) > 1) {
      controles.push({ kind: 'ecart_liquidites',
        resume: 'Liquidités divergentes entre l’écran et l’export : écart de ' + Fn_FmtEur(ecart) + '.',
        preuve: 'Écran : ' + Fn_FmtEur(margeCap.cash) + ' · export : ' + Fn_FmtEur(reg.liquidites.montantEur) + '.',
        propo: 'Mouvement de trésorerie entre les deux horodatages (ordre exécuté, frais, dépôt) — à expliquer avant intégration.' });
    }
  }
  /* VALEUR DES TITRES — comparer ce qui est comparable.
     Ce contrôle sommait les montants de l'EXPORT, qui datent de la clôture de la
     veille, et les opposait à la valeur des titres LUE SUR L'ÉCRAN, qui est celle
     du jour. Les deux diffèrent légitimement de tout le mouvement de la séance :
     sur une tolérance de 0,5 %, la carte se levait donc presque chaque jour sans
     rien signaler de réel — un contrôle qui crie toujours ne se lit plus.
     La somme est désormais recalculée AU COURS DU JOUR, sur la même base que
     l'écran ; ce qui subsiste alors est un vrai écart : une ligne détenue que
     l'export ignore, ou l'inverse. Une ligne dont le cours ou le taux manque est
     comptée à son montant d'export et le contrôle le dit, plutôt que de la
     compter zéro et d'inventer un écart. */
  if (margeCap && Fn_Num(margeCap.titres) != null && propositions.length) {
    const tauxDe = d => {
      if (!d || d === 'EUR') return 1;
      const t = reg && reg.taux ? Fn_Num(reg.taux[d]) : null;
      return t != null ? t : Fn_Taux(d);
    };
    let somme = 0, approchees = 0;
    propositions.forEach(p => {
      const q = Fn_Num(p.qte), c = Fn_Num(p.cloture), t = tauxDe(p.dev);
      if (q != null && c != null && t != null) { somme += q * c * t; return; }
      const repli = Fn_Num(p.montantEur);
      if (repli != null) { somme += repli; approchees++; }
    });
    const ecart = Fn_Num(margeCap.titres) - somme;
    if (somme > 0 && Math.abs(ecart) > Math.max(5, somme * 0.005)) {
      controles.push({ kind: 'ecart_valeur_titres',
        resume: 'Valeur des titres de l’écran (' + Fn_FmtEur(margeCap.titres) + ') différente de la somme des lignes valorisées (' + Fn_FmtEur(somme) + ') : écart de ' + Fn_FmtEur(ecart) + '.',
        preuve: 'Somme calculée sur ' + propositions.length + ' ligne(s), au cours du jour et au taux de change déduit de l’export — même base que l’écran.'
          + (approchees ? ' ' + approchees + ' ligne(s) sans cours ou sans taux comptée(s) à leur montant d’export, daté de la veille.' : ''),
        propo: 'Ligne détenue absente de l’export, ligne de l’export qui n’est plus détenue, ou quantité périmée — vérifier avant d’intégrer.' });
    }
  }
  return { capPos, capOrd, capExe, reg, meta, propositions, controles,
    lignesKo: (capPos ? capPos.inconnues.length : 0) + (capOrd ? capOrd.inconnues.length : 0) + (capExe ? capExe.inconnues.length : 0) };
}
/* Intégration des entrées dans l'état. AUCUNE INTÉGRATION SILENCIEUSE : les
   valeurs de marché (cours du jour, marge, taux) sont écrites directement — ce
   sont des faits lus, pas des jugements — mais tout ce qui change la STRUCTURE
   du portefeuille passe en carte « à valider ». */
function Fn_IntegrerEntrees(an) {
  let nouvelles = 0, majees = 0;
  const ts = Date.now();
  an.propositions.forEach(p => {
    let pos = Var_State.positions.find(x => x.id === p.id);
    if (!pos) {
      // Une ligne inconnue ne rentre jamais toute seule : elle passe par le sas.
      Fn_AjouterControle({ kind: 'nouvelle_ligne', payload: p,
        resume: 'Nouvelle ligne détectée : ' + p.nom + (p.qte != null ? ' — ' + Fn_FmtNb(p.qte, 0) + ' titres' : '') + (p.montantEur != null ? ', ' + Fn_FmtEur(p.montantEur) : '') + '.',
        preuve: 'Présente dans les entrées du jour (' + p.source + '), absente de l’état de l’application.',
        propo: 'Intégrer la ligne ; sa poche et son profil seront proposés au prochain jugement de desk.' });
      nouvelles++;
      return;
    }
    // Ligne connue : seules les valeurs de marché sont rafraîchies.
    const d = pos.detention;
    /* CLÔTURE DE LA VEILLE. L'export la porte explicitement et fait foi : sa
       colonne de clôture est celle de la séance précédente, quelle que soit
       l'heure d'export. Sans lui, on se rabat sur le cours précédemment retenu —
       mais SEULEMENT s'il datait d'un autre jour. Deux analyses le même jour
       faisaient sinon glisser la référence sur le cours du matin, et la
       « variation du jour » devenait une variation depuis le petit-déjeuner. */
    if (p.clotureVeille != null) d.clotureVeille = p.clotureVeille;
    else if (p.cloture != null && d.cloture != null && d.cloture !== p.cloture
      && (d.ts == null || !Fn_MemeJour(d.ts, ts))) d.clotureVeille = d.cloture;
    if (p.cloture != null) d.cloture = p.cloture;
    if (p.dev) d.dev = p.dev;
    if (p.nom && p.nom.length > String(d.nom || '').length) d.nom = p.nom; // la capture porte le nom complet
    if (p.ticker && !pos.ticker) pos.ticker = p.ticker; // relevé sur l'écran, jamais deviné
    if (p.montantDev != null) d.valDev = p.montantDev;
    // Le montant de l'export est rangé À PART : il date de la veille. La valeur
    // du jour est recalculée par Fn_Recalculer depuis le cours du jour.
    if (p.montantEur != null) d.valEurExport = p.montantEur;
    d.ts = ts;
    if (p.levier) Fn_MajProduitLevier(pos, p.levier, ts);
    majees++;
  });
  // Marge : lue à l'écran, horodatée par l'HEURE LUE SUR LA CAPTURE.
  if (an.capPos && an.capPos.marge) {
    const m = an.capPos.marge;
    Var_State.marge = { titres: Fn_Num(m.titres), cash: Fn_Num(m.cash), vl: Fn_Num(m.vl),
      risque: Fn_Num(m.risque), libre: Fn_Num(m.libre), as: m.as || null, ts: an.capPos.ts };
  }
  // Taux de change : DÉDUIT du fichier (montant en euros ÷ montant en devise),
  // jamais d'une API de change. Il est daté de la même séance que le fichier.
  if (an.reg && Object.keys(an.reg.taux).length) {
    Var_State.fx = { taux: an.reg.taux, ts: an.reg.ts, origine: 'export du courtier (colonne EUR ÷ colonne devise)' };
  }
  if (an.capOrd) {
    Var_State.ordres = an.capOrd.lignes.map(o => ({
      id: Fn_Uid('ord'), ticker: o.ticker || null, nom: o.nom, isin: o.isin, sens: o.sens,
      type: o.limite != null ? 'limite' : null,
      qte: o.qte, limite: o.limite, montantEur: o.montantEur, validite: o.validite || null, ts: an.capOrd.ts
    }));
  }
  if (an.capExe) {
    an.capExe.lignes.forEach(t => {
      const cle = x => [x.nom, x.date, x.qte, x.cours].map(v => v == null ? '' : String(v)).join('|');
      const n = { ticker: t.ticker || null, nom: t.nom, isin: t.isin, sens: t.sens, qte: t.qte, cours: t.cours,
        montantEur: t.montantEur, date: t.date, ts: an.capExe.ts };
      if (!Var_State.executes.some(x => cle(x) === cle(n))) Var_State.executes.push(n);
    });
  }
  an.controles.forEach(c => Fn_AjouterControle(c));
  // Journal des collages : ce qui est entré, quand, et ce qui n'a pas été compris.
  Var_State.captures = [];
  if (an.meta) {
    // L'en-tête de la capture entre au journal : il DATE la lecture et dit ce que
    // l'écran annonçait. Aucun chiffre de portefeuille n'y figure.
    Var_State.captures.push({ type: 'capture', ts: Var_State._runtime.capture.ts,
      lignesOk: 0, lignesKo: 0, inconnues: [],
      lu: { a: an.meta.capture || null, courtier: an.meta.maj_degiro || null,
        statut: an.meta.statut || null, ordresOuverts: Fn_Num(an.meta.ordres_ouverts) } });
  }
  Cst_Entrees.forEach(e => {
    const c = Var_State._runtime.collages[e.cle];
    const parse = e.cle === 'positions' ? an.capPos : (e.cle === 'ordres' ? an.capOrd : an.capExe);
    if (!c) return;
    Var_State.captures.push({ type: e.cle, ts: c.ts, lignesOk: parse ? parse.lignes.length : 0,
      lignesKo: parse ? parse.inconnues.length : 0,
      inconnues: parse ? parse.inconnues.slice(0, 12) : [] });
  });
  if (an.reg) {
    Var_State.captures.push({ type: 'xlsx', ts: an.reg.ts, lignesOk: an.reg.lignes.length,
      lignesKo: an.reg.inconnues.length, inconnues: an.reg.inconnues.slice(0, 12) });
  }
  Fn_Recalculer();
  return { nouvelles, majees, controles: an.controles.length };
}
// Historisation de la barrière et du strike : DEUX observations datées suffisent
// à déduire le portage journalier, puis mensuel. Déterministe, gratuit, et plus
// fiable que la brochure de l'émetteur — que le modèle n'a jamais su localiser.
function Fn_MajProduitLevier(pos, levier, ts) {
  const pr = pos.produit;
  pr.type = 'derive';
  if (levier.emetteur) pr.emetteur = levier.emetteur;
  if (levier.sousJacent) pr.sousJacent = levier.sousJacent;
  if (levier.sens) pr.sens = levier.sens;
  if (levier.parite != null) pr.parite = levier.parite;
  if (levier.levier != null) pr.levier = levier.levier;
  const jour = Fn_DateISO(new Date(ts));
  if (levier.barriere != null || levier.strike != null) {
    pr.histBarriere = (pr.histBarriere || []).filter(h => h.d !== jour);
    pr.histBarriere.push({ d: jour, bar: levier.barriere, str: levier.strike });
    pr.histBarriere.sort((a, b) => a.d < b.d ? -1 : 1);
    if (pr.histBarriere.length > 40) pr.histBarriere = pr.histBarriere.slice(-40);
    if (levier.barriere != null) pr.barriere = levier.barriere;
    if (levier.strike != null) pr.strike = levier.strike;
  }
  if (levier.manquants && levier.manquants.length) {
    Fn_AjouterControle({ kind: 'parametres_levier', id: pos.id,
      resume: 'Paramètres illisibles sur ' + pos.detention.nom + ' : ' + levier.manquants.join(', ') + '.',
      preuve: 'Le nom lu à l’écran ne porte pas ces paramètres sous une forme reconnue. Ils sont perdus dans l’export, tronqué à 32 caractères.',
      propo: 'Les saisir à la main, ou recoller la ligne complète depuis l’écran du courtier.' });
  }
}
/* Contrôles dont il ne peut exister QU'UNE carte en attente : ils portent sur le
   portefeuille entier, pas sur une ligne. Leurs chiffres bougent d'une analyse à
   l'autre, donc leur résumé aussi — les distinguer par leur texte en empilerait
   un par lancement. */
const Cst_ControlesUniques = ['capture_degradee', 'ecart_ordres', 'ecart_liquidites', 'ecart_valeur_titres'];
/* IDENTITÉ D'UN CONTRÔLE — ce qu'il dit, jamais où il est rangé.
   L'identifiant de stockage est engendré À L'ÉCRITURE : un contrôle entrant ne
   peut pas le porter. L'ancienne clé le comparait pourtant à lui, si bien que la
   comparaison échouait toujours pour tout contrôle sans identifiant métier —
   nouvelle ligne, écart de liquidités, écart de valeur des titres. « Analyser
   les entrées » empilait alors un jeu COMPLET de doublons à chaque lancement,
   invisible à l'écran (qui n'en montre qu'un) mais bien présent dans l'état
   synchronisé, et laissé derrière par un « tout accepter ». */
function Fn_CleControle(c) {
  if (Cst_ControlesUniques.indexOf(c.kind) >= 0) return c.kind;
  const metier = (c.payload && c.payload.id)
    || (c.id && String(c.id).indexOf('ctl-') !== 0 ? c.id : '');
  return (c.kind || '') + '|' + (metier || String(c.resume || '').slice(0, 80));
}
function Fn_AjouterControle(c) {
  const cle = Fn_CleControle(c);
  const dejaLa = Var_State.controles.find(x => x.statut === 'a_valider' && Fn_CleControle(x) === cle);
  /* Une nouvelle analyse RAFRAÎCHIT la carte en attente plutôt que d'en ajouter
     une seconde : mêmes faits, chiffres à jour. Sauter l'écriture laisserait au
     contraire la carte afficher des chiffres périmés. L'identifiant de stockage
     ne bouge pas — un double appui commencé sur cette carte reste valide. */
  if (dejaLa) {
    Object.keys(c).forEach(k => { if (k !== 'id' && k !== 'statut') dejaLa[k] = c[k]; });
    dejaLa.cle = cle;
    return false;
  }
  Var_State.controles.push(Object.assign({ id: Fn_Uid('ctl'), statut: 'a_valider' }, c, { cle: cle }));
  return true;
}

/* ----------------------------------------------------------------
   ÉTAGE 3 (partie déterministe) — LES GRANDEURS CALCULÉES
   LISTE FERMÉE : aucune de ces valeurs n'est demandée au modèle.
   variation du jour · valeur en euros · % de la valeur nette · exposition
   par facteur, par poche, par devise · levier brut · delta en euros d'un
   produit à levier · distance à la barrière · portage · taux de change ·
   écarts de contrôle · impact d'un gap sur la valeur nette.
   ---------------------------------------------------------------- */
function Fn_Taux(dev) {
  if (!dev || dev === 'EUR') return 1;
  const t = Var_State.fx && Var_State.fx.taux ? Fn_Num(Var_State.fx.taux[dev]) : null;
  return t == null ? null : t;
}
function Fn_ValeurNette() {
  const rt = Var_State._runtime;
  if (rt.memoVN !== undefined) return rt.memoVN;
  const m = Var_State.marge;
  let r = null;
  if (m && Fn_Num(m.vl) != null) r = { vn: Fn_Num(m.vl), src: 'valeur liquidative lue sur l’écran de marge [relevé]', approx: false };
  else {
    const pos = Var_State.positions;
    if (pos.length && pos.every(p => Fn_Num(p.detention.valEur) != null)) {
      r = { vn: pos.reduce((a, p) => a + Fn_Num(p.detention.valEur), 0),
        src: 'somme des lignes [calcul] — approximation : liquidités et dette non incluses, coller le bloc de marge', approx: true };
    }
  }
  rt.memoVN = r;
  return r;
}
// Recalcul complet. Appelé après CHAQUE mutation de données : c'est le seul
// endroit où ces grandeurs sont produites, et il est idempotent.
function Fn_Recalculer() {
  // Les agrégats mémorisés tombent AVANT tout recalcul : ils dérivent des champs
  // qui vont changer juste en dessous.
  Fn_OublierAgregats();
  const s = Var_State.seuils;
  // DEUX PASSES, et c'est nécessaire. Sans bloc de marge, la valeur nette est la
  // SOMME des valeurs de ligne : la calculer avant de les avoir recalculées
  // rapportait chaque poids à la valeur nette de la veille.
  Var_State.positions.forEach(p => {
    const d = p.detention, pr = p.produit || (p.produit = {});
    const taux = Fn_Taux(d.dev);
    /* VALEUR EN EUROS — recalculée à CHAQUE fois, jamais reprise de l'export.
       L'export vaut la VEILLE : le prendre pour la valeur du jour gelait toute
       l'exposition à la séance précédente, alors que le cours affiché juste à
       côté, lui, était celui du jour. Le poids d'une ligne, sa part de valeur
       nette et toute l'exposition par facteur en découlaient d'un jour de retard.
       Le montant de l'export reste conservé à part (valEurExport) : il sert au
       contrôle croisé avec l'écran, et de repli quand le cours manque. */
    const q = Fn_Num(d.qte), c = Fn_Num(d.cloture);
    d.valEur = (q != null && c != null && taux != null) ? q * c * taux : Fn_Num(d.valEurExport);
    d.var = (c != null && Fn_Num(d.clotureVeille) != null && Fn_Num(d.clotureVeille) !== 0)
      ? (c - Fn_Num(d.clotureVeille)) / Fn_Num(d.clotureVeille) * 100 : null;
    // Produit à levier : delta, distance à la barrière et portage.
    if (pr.type === 'derive') {
      const sj = Fn_CoursSousJacent(p);
      const coursSj = sj ? sj.cours : null;
      // Le cours du sous-jacent est dans SA devise, pas dans celle du produit :
      // un turbo coté en euros sur un sous-jacent américain se convertissait au
      // taux de l'euro, donc pas du tout, et son exposition était fausse du taux
      // de change entier.
      const tauxSj = sj ? Fn_Taux(sj.dev) : null;
      if (q != null && Fn_Num(pr.parite) != null && Fn_Num(pr.parite) !== 0 && coursSj != null && tauxSj != null) {
        const expo = q / Fn_Num(pr.parite) * coursSj * tauxSj;
        pr.deltaEur = pr.sens === 'short' ? -expo : expo;
      } else {
        pr.deltaEur = null;
      }
      if (coursSj != null && Fn_Num(pr.barriere) != null && coursSj !== 0) {
        pr.distBarriere = (pr.sens === 'short' ? (Fn_Num(pr.barriere) - coursSj) : (coursSj - Fn_Num(pr.barriere))) / coursSj * 100;
      } else {
        pr.distBarriere = null;
      }
      pr.portageMensuel = Fn_PortageMensuel(p);
    } else {
      pr.deltaEur = Fn_Num(d.valEur);
    }
    // Niveau de traitement : l'effort suit l'exposition. Il est AFFICHÉ sur la
    // carte — c'est une information, pas une lacune.
    p.desk = p.desk || {};
  });
  // Grandeurs de marge dérivées. Elles précèdent la valeur nette, qui les lit.
  const m = Var_State.marge;
  if (m) {
    m.levier = (Fn_Num(m.vl) && Fn_Num(m.titres) != null) ? Fn_Num(m.titres) / Fn_Num(m.vl) : null;
    m.coussinPct = (Fn_Num(m.vl) && Fn_Num(m.libre) != null) ? Fn_Num(m.libre) / Fn_Num(m.vl) * 100 : null;
  }
  // SECONDE PASSE : tout ce qui se rapporte à la valeur nette, une fois toutes
  // les valeurs de ligne à jour. Le niveau de traitement en dépend aussi — il se
  // décide sur le poids de la ligne.
  Fn_OublierAgregats();
  const vnObj = Fn_ValeurNette();
  const vn = vnObj ? vnObj.vn : null;
  Var_State.positions.forEach(p => {
    const d = p.detention;
    d.pctVN = (vn && Fn_Num(d.valEur) != null && vn !== 0) ? Fn_Num(d.valEur) / vn * 100 : null;
    p.desk.niveau = Fn_NiveauTraitement(p, s);
  });

}
/* AGRÉGATS MÉMORISÉS. La valeur nette et le profil d'exposition étaient
   recalculés à l'identique par le héros, la discipline, les règles, le cadre des
   découvertes et le contrat du desk — cinq parcours complets du portefeuille pour
   un seul et même résultat, à chaque re-rendu. Ils sont calculés UNE fois et
   oubliés au seul endroit qui puisse les changer : le recalcul et l'enregistrement.
   Le cache vit dans _runtime : il n'est ni persisté, ni synchronisé. */
function Fn_OublierAgregats() {
  const rt = Var_State._runtime;
  rt.memoProfil = null;
  rt.memoVN = undefined;
  rt.memoInds = null;
}
// Cours du sous-jacent : celui de la ligne détenue qui porte ce sous-jacent, ou
// à défaut celui d'une position dont le nom correspond. Un produit à levier n'a
// pas de cours de sous-jacent propre — il est TOUJOURS emprunté, et on dit à
// l'écran d'où il vient et quand il a été lu.
function Fn_CoursSousJacent(p) {
  const sj = p.produit && p.produit.sousJacent;
  if (!sj) return null;
  const cible = Fn_NormNom(sj);
  const autre = Var_State.positions.find(x => x !== p && x.produit.type !== 'derive'
    && (Fn_NormNom(x.detention.nom).indexOf(cible) === 0 || String(x.ticker || '').toUpperCase() === sj.toUpperCase()));
  // La DEVISE voyage avec le cours : un turbo coté en euros peut porter sur un
  // sous-jacent coté en dollars, et convertir son exposition au taux du produit
  // revenait à ne pas la convertir du tout.
  if (autre && Fn_Num(autre.detention.cloture) != null) {
    return { cours: Fn_Num(autre.detention.cloture), dev: autre.detention.dev || 'EUR',
      src: 'ligne détenue « ' + String(autre.detention.nom || '').slice(0, 30) + ' »' };
  }
  // Repli : le strike du jour et le prix du produit donnent le cours implicite.
  // Strike et prix sont alors supposés dans la MÊME devise — c'est le cas chez
  // l'émetteur, qui exprime ses paramètres dans la devise de cotation du produit.
  const pr = p.produit, d = p.detention;
  if (Fn_Num(pr.strike) != null && Fn_Num(pr.parite) != null && Fn_Num(d.cloture) != null) {
    const c = pr.sens === 'short'
      ? Fn_Num(pr.strike) - Fn_Num(pr.parite) * Fn_Num(d.cloture)

/* PORTAGE D'UN PRODUIT À LEVIER — calculé, jamais cherché.
   La barrière et le strike dérivent chaque jour du financement. Deux
   observations datées suffisent :
     653,9527 (30/07) → 653,4635 (02/08) = −0,4892 en 3 jours.
   On rapporte la dérive quotidienne au cours du sous-jacent, puis à la valeur
   de la position, pour obtenir un coût mensuel en euros. */
function Fn_PortageMensuel(p) {
  const h = (p.produit && p.produit.histBarriere) || [];
  if (h.length < 2) return null;
  const b = h[h.length - 1];
  // Fenêtre de mesure : la plus RÉCENTE qui couvre au moins une semaine. Prendre
  // la toute première observation contre la dernière étalait la mesure sur des
  // mois et mélangeait des régimes de financement ; prendre les deux dernières
  // rendait le portage sensible au bruit d'une seule journée.
  let a = h[0];
  for (let i = h.length - 2; i >= 0; i--) {
    a = h[i];
    if ((Fn_ParseDate(b.d) - Fn_ParseDate(h[i].d)) / 86400000 >= 7) break;
  }
  const va = Fn_Num(a.str) != null ? Fn_Num(a.str) : Fn_Num(a.bar);
  const vb = Fn_Num(b.str) != null ? Fn_Num(b.str) : Fn_Num(b.bar);
  if (va == null || vb == null) return null;
  const jours = Math.round((Fn_ParseDate(b.d) - Fn_ParseDate(a.d)) / 86400000);
  if (!jours) return null;
  const sj = Fn_CoursSousJacent(p);
  const coursSj = sj ? sj.cours : null;
  if (coursSj == null || coursSj === 0) return null;
  // Un short paie quand le financement DESCEND vers lui ; un long paie quand il
  // monte. Le signe est ramené à un coût positif.
  const deriveJour = Math.abs((vb - va) / jours);
  const expo = Math.abs(Fn_Num(p.produit.deltaEur) || 0);
  if (!expo) return null;
  return deriveJour / coursSj * expo * 30;
}
