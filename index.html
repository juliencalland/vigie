<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Vigie Portefeuille</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1220">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0B1220;
  --panel:#131E31;
  --panel2:#0F1830;
  --line:#233450;
  --txt:#E7EEFB;
  --muted:#8CA0C4;
  --accent:#4EA1F3;
  --warn:#F0B24E;
  --crit:#E0526B;
  --ok:#46C48A;
  --accent-dim:rgba(78,161,243,.14);
  --warn-dim:rgba(240,178,78,.14);
  --crit-dim:rgba(224,82,107,.14);
  --ok-dim:rgba(70,196,138,.14);
  --ombre:rgba(0,0,0,.45);
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:48px}
/* Largeur FLUIDE, sans palier : la page suit le redimensionnement en continu.
   La largeur gagnée sert à ajouter des COLONNES (voir .grille-cartes), jamais à
   étirer les lignes de texte — au-delà de ~90 caractères, l'œil perd la ligne
   suivante en revenant à la marge. */
#app{width:min(100% - 20px,1800px);margin:0 auto}
#onglet-vigie,#onglet-parametres{max-width:78rem;margin:0 auto}
header#entete{padding:14px 4px 8px}
header#entete h1{margin:0;font-size:19px;letter-spacing:.3px}
/* Deux lignes réservées : l'état de synchronisation s'y réécrit pendant l'appel
   et un simple renvoi à la ligne de plus faisait descendre TOUTE la page. */
header#entete .sous-titre{color:var(--muted);font-size:12px;margin-top:2px;min-height:35px}
header#entete .sous-titre b{color:var(--txt);font-weight:600}
#sync-etat{display:inline-block;min-width:19ch}
nav#nav-onglets{display:flex;gap:4px;position:sticky;top:0;z-index:40;background:var(--bg);padding:6px 0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav#nav-onglets::-webkit-scrollbar{display:none}
.onglet-btn{flex:1 0 112px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:9px 6px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:40px}
.onglet-btn.actif{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
/* Pastille de comptage : place réservée même à vide, pour qu'une apparition
   après un appel ne redimensionne pas le libellé de l'onglet. */
.nav-n{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--warn);margin-left:3px;display:inline-block;min-width:1.1em}
main{padding-top:10px}
.onglet{display:none}
.onglet.actif{display:block}
.carte{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.carte-titre{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
/* Étape d'un panneau. Trois blocs empilés sans séparation se lisaient comme un
   seul mur de texte où le bouton d'action se perdait : chacun porte désormais un
   liseré et son titre, et l'œil retrouve où il en est. */
.etape{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:9px 0}
.etape-t{font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.etape-cle{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.etape-cle .etape-t{color:var(--accent)}
/* Le bouton d'une étape vit DANS sa boîte, collé à son paragraphe : c'est la
   seule disposition où l'œil n'a pas à chercher à quoi l'action se rapporte. */
.etape .rang-btn{margin-top:8px;margin-bottom:0}
.etape > :last-child{margin-bottom:0}
.panneau-tete{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:none;color:var(--txt);font:inherit;font-weight:700;font-size:13.5px;padding:2px 0;cursor:pointer;min-height:36px;text-align:left}
.panneau-tete .chevron{color:var(--muted);font-size:12px;transition:transform .15s}
.panneau-tete.ouvert .chevron{transform:rotate(90deg)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.petit{font-size:12px}
.tres-petit{font-size:11px}
hr.sep{border:none;border-top:1px solid var(--line);margin:10px 0}
.btn{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:38px}
.btn:disabled{opacity:.5;cursor:default}
.btn-accent{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.btn-ok{background:var(--ok-dim);border-color:var(--ok);color:var(--ok)}
/* Double-tap : le libellé bascule vers « Confirmer ? ». Largeur réservée pour
   que la rangée de boutons ne se réagence pas entre les deux états. */
.btn-danger{background:none;border-color:var(--line);color:var(--muted);min-width:12ch}
.btn-danger.arme{background:var(--crit-dim);border-color:var(--crit);color:var(--crit)}
.btn-large{width:100%;padding:11px;font-size:14px}
.rang-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:20px;vertical-align:1px}
.badge-crit{background:var(--crit-dim);color:var(--crit)}
.badge-warn{background:var(--warn-dim);color:var(--warn)}
.badge-info{background:var(--accent-dim);color:var(--accent)}
.badge-ok{background:var(--ok-dim);color:var(--ok)}
.badge-neutre{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.pastille{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.p-ok{background:var(--ok)}.p-warn{background:var(--warn)}.p-crit{background:var(--crit)}.p-info{background:var(--accent)}.p-neutre{background:var(--muted)}
/* ---- héro ---- */
.hero{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero .hero-lib{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
.hero .hero-titre{font-size:16.5px;font-weight:700;margin:4px 0 2px}
.hero .hero-date{font-family:var(--mono);font-size:13px;color:var(--muted)}
/* Rangée de grandeurs du héro : valeur nette, coussin, levier — la lecture du
   jour, toujours à la même place, jamais à chercher. */
.hero-grandeurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:6px;margin-top:10px}
.hero-g{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
.hero-g .hg-lib{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.hero-g .hg-val{font-family:var(--mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
/* Largeur réservée pour le plus long libellé (« AUJOURD'HUI ») : le tic d'une
   fois par minute réécrit ces compteurs sans jamais réagencer leur ligne. */
.compteur{font-family:var(--mono);font-weight:700;display:inline-block;min-width:11ch;font-variant-numeric:tabular-nums}
.compteur.auj{color:var(--warn)}
.compteur.retard{color:var(--crit)}
.compteur.futur{color:var(--accent)}
.compteur.fait{color:var(--muted);font-weight:400}
/* ---- calendrier ---- */
.cal-entete{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.cal-entete div{text-align:center;font-size:10px;color:var(--muted);text-transform:uppercase}
.cal-grille{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-jour{position:relative;min-width:0;overflow:hidden;background:var(--panel2);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:3px 4px 13px;cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.cal-jour .cal-mois{display:block;font-size:9px;color:var(--muted);line-height:1}
.cal-date{display:block;font-size:9px;line-height:1.25;font-weight:700;color:var(--txt)}
.cal-evt{display:block;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:8.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-evt-crit{color:var(--crit)}.cal-evt-warn{color:var(--warn)}.cal-evt-info{color:var(--accent)}.cal-evt-fait{color:var(--muted)}
.cal-jour.cal-passe{opacity:.45}
.cal-jour.cal-auj{border-color:var(--warn);color:var(--txt)}
.cal-jour.cal-crit{border-color:var(--crit);background:var(--crit-dim);opacity:1;color:var(--txt)}
.cal-jour.cal-sel{background:var(--accent);border-color:var(--accent);color:var(--bg);opacity:1}
.cal-sel .cal-date,.cal-sel .cal-evt,.cal-sel .cal-mois,.cal-sel .cal-n{color:var(--bg)}
.cal-sel .cal-dot{background:var(--bg)}
.cal-dot{position:absolute;left:4px;bottom:4px;width:8px;height:8px;border-radius:50%}
.cal-n{position:absolute;right:4px;bottom:2px;font-size:10px;font-weight:700;color:var(--txt)}
/* ---- chips ---- */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;min-height:32px}
.chip.actif{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.chip .pastille{width:7px;height:7px;margin-right:2px}
.chip-n{font-family:var(--mono);font-size:10.5px;margin-left:4px;color:var(--txt);opacity:.85}
.bandeau-filtre{display:flex;align-items:center;justify-content:space-between;background:var(--accent-dim);border:1px solid var(--accent);border-radius:9px;padding:6px 10px;margin-bottom:8px;font-size:12.5px}
/* ---- timeline ---- */
.sem-tete{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sem-tete b{color:var(--txt)}
.sem-tete .s-crit{color:var(--crit)}
.ev{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:11px;padding:11px 12px;margin-bottom:8px}
.ev.sev-Crit{border-left-color:var(--crit)}
.ev.sev-Warn{border-left-color:var(--warn)}
.ev.sev-Info{border-left-color:var(--accent)}
.ev.traite{opacity:.55}
.ev-haut{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ev-date{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ev-titre{font-size:14.5px;font-weight:700;margin:3px 0 4px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.3px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:1px 6px}
.mets{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
/* inline-block obligatoire : en inline pur, un .met qui revient à la ligne voit
   sa bordure se scinder, et ni son padding ni sa bordure ne poussent la hauteur
   de ligne — l'encadré chevauche alors les lignes voisines. */
.met{display:inline-block;vertical-align:middle;font-family:var(--mono);font-size:11px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--muted)}
.met b{color:var(--txt);font-weight:600}
/* Zones de seuil : la valeur DOIT se colorer avec l'étiquette, sinon la règle
   .met b la laisse blanche et l'alerte passe inaperçue. */
.met.z-ok,.met.z-ok b{border-color:var(--ok);color:var(--ok)}
.met.z-warn,.met.z-warn b{border-color:var(--warn);color:var(--warn)}
.met.z-crit,.met.z-crit b{border-color:var(--crit);color:var(--crit)}
/* Surveiller / Arbitrage / Pratique — trois registres de nature différente : un
   indicateur à LIRE, une décision à TRANCHER, une règle de métier à APPLIQUER.
   Chacun devient une carte à liseré coloré, avec sa vignette et son étiquette en
   toutes lettres (la couleur n'est jamais le seul porteur de sens). */
.svap{display:flex;flex-direction:column;gap:6px;margin:9px 0 4px}
.svap-carte{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:9px;padding:8px 11px}
.svap-tete{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.svap-ico{font-family:var(--mono);font-size:12px;line-height:1.2;width:14px;text-align:center;flex:none}
.svap-lib{font-weight:700;letter-spacing:.45px;font-size:10.5px;text-transform:uppercase;color:var(--muted)}
.svap-txt{font-size:12.5px;line-height:1.65;max-width:92ch}
.svap-liste{margin:2px 0 0;padding-left:16px;font-size:12.5px;line-height:1.6;max-width:92ch}
.svap-liste li{margin:3px 0;padding-left:2px}
.svap-liste li::marker{color:var(--muted)}
.svap-surv{border-left-color:var(--accent)}
.svap-surv .svap-ico,.svap-surv .svap-lib{color:var(--accent)}
.svap-arb{border-left-color:var(--warn)}
.svap-arb .svap-ico,.svap-arb .svap-lib{color:var(--warn)}
.svap-prat{border-left-color:var(--ok)}
.svap-prat .svap-ico,.svap-prat .svap-lib{color:var(--ok)}
.svap-crit{border-left-color:var(--crit)}
.svap-crit .svap-ico,.svap-crit .svap-lib{color:var(--crit)}
/* Cotation : les moments de séance se lisent ENSEMBLE, chacun avec sa valeur.
   Blocs de largeur libre qui se replient plutôt qu'une ligne unique tronquée. */
.cote-rang{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.cote-bloc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;min-width:0}
.cote-lib{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);line-height:1.4}
.cote-val{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.cote-h{font-family:var(--mono);font-size:10px;color:var(--muted)}
.cote-bloc.cote-vide .cote-val{color:var(--muted);font-weight:400}
.v-pos{color:var(--ok)}
.v-neg{color:var(--crit)}
/* Valorisation : une grille de couples étiquette/valeur, colonnes suivant la
   largeur. En rangée inline, les multiples formaient un pavé illisible. */
.valo-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5rem,1fr));gap:5px;margin:5px 0}
.valo-grille .met{display:flex;justify-content:space-between;gap:6px;min-width:0}
.valo-grille .met b{font-variant-numeric:tabular-nums;white-space:nowrap}
.lien{color:var(--accent);text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.lien::after{content:" ↗";font-size:.85em;text-decoration:none}
.ev-actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ev-actions .btn{padding:6px 11px;min-height:34px;font-size:12px}
/* ---- notes ---- */
.note{border-radius:9px;padding:8px 10px;font-size:12.5px;margin:8px 0}
.note-warn{background:var(--warn-dim);border:1px solid var(--warn);color:var(--warn)}
.note-crit{background:var(--crit-dim);border:1px solid var(--crit);color:var(--crit)}
.note-ok{background:var(--ok-dim);border:1px solid var(--ok);color:var(--ok)}
.note-info{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent)}
/* ---- formulaires ---- */
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font:inherit;font-size:13.5px;padding:8px 9px;min-height:38px}
textarea{min-height:56px;resize:vertical}
label.champ{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin:8px 0 3px}
.form-grille{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-grille .col2{grid-column:1/3}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);vertical-align:-4px}
/* Champs de code (clé API, jeton) : chasse fixe pour distinguer O de 0 et l de 1,
   interlettrage aéré. Une erreur de casse ne se voit pas autrement, et le message
   d'erreur ne vient qu'au premier appel. */
.champ-code{font-family:var(--mono);letter-spacing:.03em}
/* ---- acquisition (étage 1) ---- */
/* Une entrée d'écran en forme COMPACTE : une ligne d'état, pas une zone de
   collage. C'est ce qui distingue « il n'y a rien à faire ici » de « à coller ». */
.entree-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0;border-bottom:1px solid var(--line)}
.entree-n{font-weight:600;font-size:12.5px;min-width:0;flex:1 1 9rem}
.entree-e{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.btn-mini{padding:3px 8px;font-size:11px;min-height:0}
/* Cellules de budget : libellé au-dessus, valeur en dessous. La grille « met »
   plaçait les deux côte à côte avec une valeur non sécable dans une case de
   8,5 rem — la valeur débordait et cassait l’alignement de la rangée. */
.budget-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:6px;margin:6px 0}
.budget-c{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:0}
.budget-c .bc-l{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);overflow-wrap:anywhere}
.budget-c .bc-v{display:block;font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.budget-c .bc-s{display:block;font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
/* Astérisque des champs indispensables : couleur ET symbole, jamais la couleur
   seule — un liseré coloré ne se voit pas sur tous les écrans. */
.champ-req{color:var(--crit);font-weight:800}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.zone-collage{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:var(--panel2)}
.zone-tete{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.zone-tete .zt-nom{font-weight:700;font-size:13px}
.zone-etat{font-family:var(--mono);font-size:11px}
.zone-collage textarea{margin-top:6px;min-height:74px;font-family:var(--mono);font-size:11.5px}
/* Diagramme des cinq étages : ce qui est prêt, ce qui manque, et ce que ça coûte.
   Hauteur constante — les états changent, la mise en page non. */
.etages{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:6px;margin:8px 0}
.etage{border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:var(--panel2)}
.etage .et-n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.etage .et-nom{font-weight:700;font-size:12px;margin:1px 0 2px}
.etage .et-etat{font-size:11px}
.etage.et-ok{border-color:var(--ok)}
.etage.et-attente{border-color:var(--line)}
.etage.et-manque{border-color:var(--warn)}
/* ---- jauges & discipline ---- */
.jauge{position:relative;display:flex;height:8px;border-radius:5px;overflow:visible;margin:7px 0 3px}
.jz{height:100%}
.jz:first-child{border-radius:5px 0 0 5px}.jz:last-child{border-radius:0 5px 5px 0}
.jz-ok{background:var(--ok)}.jz-warn{background:var(--warn)}.jz-crit{background:var(--crit)}
.jauge-marq{position:absolute;top:-4px;width:3px;height:16px;background:var(--txt);border-radius:2px;box-shadow:0 0 4px var(--ombre)}
.ind-valeur{font-family:var(--mono);font-size:19px;font-weight:700}
.ind-seuils{font-size:11px;color:var(--muted);font-family:var(--mono)}
.score-rang{display:flex;align-items:center;gap:14px}
.score-val{font-family:var(--mono);font-size:34px;font-weight:800}
.bloc-titre{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--accent);margin:16px 0 8px;text-transform:uppercase}
/* ---- tableaux compacts ---- */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--muted);text-align:left;font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px}
/* ---- appel au modèle ----
   STABILITÉ DE MISE EN PAGE : pendant un appel, phases, compteurs et requêtes
   changent de texte plusieurs fois par seconde. Toute variation de HAUTEUR
   déplace ce que l'utilisateur est en train de lire. Chaque zone vivante occupe
   une hauteur RÉSERVÉE, fixée par le conteneur et jamais par le contenu. */
.flux-barre{position:relative;height:8px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;margin:8px 0 6px}
.flux-jauge{height:100%;width:0;background:var(--accent);transition:width .35s ease}
.flux-jauge.f-ok{background:var(--ok)}
.flux-jauge.f-echec{background:var(--crit)}
.flux{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.flux-etape{display:flex;align-items:center;gap:4px;font-size:10.5px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);white-space:nowrap}
.flux-etape .f-ico{font-family:var(--mono);font-weight:700}
.flux-etape.f-ok{border-color:var(--ok);color:var(--ok)}
.flux-etape.f-encours{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);animation:vp-pulse 1.4s ease-in-out infinite}
.flux-etape.f-echec{border-color:var(--crit);color:var(--crit);background:var(--crit-dim)}
@keyframes vp-pulse{0%,100%{opacity:1}50%{opacity:.55}}
.bilan-trait{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:5px;margin:6px 0}
.bilan-trait .bt{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--panel2)}
.bilan-trait .bt-n{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--txt)}
.bilan-trait .bt-lib{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.maj-phases{list-style:none;margin:8px 0;padding:0}
.maj-phases li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:3px 0}
.maj-phases .ph-ico{font-family:var(--mono);width:16px;flex:none;line-height:1.4}
/* DEUX lignes réservées par phase, toujours. Une seule tronquait les messages
   utiles au tiers ; une hauteur libre faisait sauter la page à chaque message
   plus long. Le message intégral reste en infobulle. */
.maj-phases .ph-txt{flex:1;min-width:0;line-height:1.4;height:2.8em;overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.ph-ok .ph-ico{color:var(--ok)}
.ph-encours .ph-ico{color:var(--warn)}
.ph-echec .ph-ico{color:var(--crit)}
.ph-attente{color:var(--muted)}
.ph-attente .ph-ico{color:var(--muted)}
.maj-compteurs{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:8px;margin:8px 0}
.maj-compteurs .met{display:flex;justify-content:space-between;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.maj-compteurs .met b{font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.maj-compteurs .met-large{grid-column:1/-1}
.maj-sante{min-height:34px;margin:2px 0 6px}
.maj-sante .badge{white-space:normal;line-height:1.5}
/* Journal des requêtes : hauteur figée, défilement interne calé sur la dernière
   ligne — la liste s'allonge sans pousser la page. Une requête par ligne. */
.maj-requetes{height:132px;overflow-y:auto;overscroll-behavior:contain}
.maj-req-l{line-height:1.5;padding:1px 0;overflow-wrap:anywhere}
.maj-req-l b{color:var(--txt)}
.maj-resume{min-height:32px}
/* L'appui long ouvre l'aide de la commande : sans ceci, le navigateur mobile
   ouvrirait par-dessus son menu « copier ». Les champs de saisie sont exclus. */
button[data-action],label[data-action],[data-action="onglet"],[data-action="chip"],[data-action="cal-jour"]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:vp-rot .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes vp-rot{to{transform:rotate(360deg)}}
.doc-slot{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.doc-slot:last-child{border-bottom:none}
.doc-slot input[type=file]{display:none}
.doc-slot>div{min-width:0}
.doc-etat{font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- glossaire ---- */
.gloss{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
#gloss-popover{position:fixed;z-index:100;max-width:min(320px,calc(100vw - 16px));background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;box-shadow:0 6px 22px var(--ombre);font-size:12.5px}
#gloss-popover .gloss-long{font-weight:700;color:var(--accent);margin-bottom:4px}
#gloss-popover .gloss-def{color:var(--txt)}
.gloss-liste dt{font-weight:700;color:var(--accent);margin-top:9px;font-size:13px}
.gloss-liste dd{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
/* ---- découvertes ---- */
.opp-resume{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.opp-carte{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px;margin-bottom:10px}
.opp-carte.opp-gardee{border-left-color:var(--ok)}
.opp-carte.opp-ecartee{opacity:.55;border-left-color:var(--muted)}
.opp-carte.opp-conditions{border-left-color:var(--warn)}
.opp-carte.opp-incoherente{border-left-color:var(--crit)}
.opp-tete{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.opp-titre{font-size:15px;font-weight:750;line-height:1.25}
.opp-meta{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.opp-section{font-size:12.5px;margin:7px 0}
.opp-section b{font-size:10.5px;text-transform:uppercase;letter-spacing:.35px;color:var(--muted)}
.opp-source{font-size:10.5px;color:var(--muted);overflow-wrap:anywhere}
.opp-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
/* ---- divers ---- */
.avalider{border-left:4px solid var(--warn)}
.prio{font-family:var(--mono);font-weight:800;border-radius:6px;padding:1px 7px;font-size:11.5px}
.prio-1{background:var(--crit-dim);color:var(--crit)}
.prio-2{background:var(--warn-dim);color:var(--warn)}
.prio-3{background:var(--accent-dim);color:var(--accent)}
.instr-ligne{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.instr-ligne:last-child{border-bottom:none}
.vide{color:var(--muted);font-size:13px;padding:8px 2px}
/* Bloc de fiche. L'étiquette passe SUR SA PROPRE LIGNE : en flux inline, elle se
   soudait aux valeurs et la fiche se lisait comme une seule phrase. */
.cours-ligne{font-size:12.5px;line-height:1.55;margin:0;padding:9px 0;border-top:1px solid var(--line);max-width:92ch}
.cours-ligne:first-of-type{border-top:none;padding-top:2px}
.cours-ligne .lib{display:block;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:3px}
.expo-ligne{display:flex;flex-wrap:wrap;align-items:center;gap:5px;max-width:none}
.expo-ligne .lib{margin-bottom:0}
/* Provenance : la partie la plus longue et la moins consultée d'une fiche.
   Reléguée derrière un filet — présente pour qui vérifie, transparente sinon. */
.src{display:block;margin-top:5px;padding-left:9px;border-left:2px solid var(--line);color:var(--muted);font-size:10.5px;line-height:1.5;max-width:88ch}
.faits{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:0}
.faits dt{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;font-weight:700;padding-top:2px}
.faits dd{margin:0;min-width:0}
.carte>.petit,.carte>.tres-petit{max-width:92ch}
/* Ligne de position au traitement allégé : une seule ligne, pas une carte.
   Le niveau de traitement est AFFICHÉ — c'est une information, pas une lacune. */
.pos-ligne{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-bottom:6px}
.pos-ligne .pl-nom{font-weight:700;font-size:13px;min-width:0}
.pos-ligne .pl-chiffres{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
@media (min-width:520px){
  .form-grille{grid-template-columns:1fr 1fr 1fr}
  .form-grille .col2{grid-column:auto}
  .form-grille .col3{grid-column:1/4}
}
@media (min-width:768px){
  .cal-date{font-size:10px}
  .cal-evt{font-size:10px}
}
/* Listes de fiches : le nombre de colonnes suit la largeur EN CONTINU. */
.grille-cartes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,32rem),1fr));gap:10px;align-items:start}
.grille-cartes>.carte{margin-bottom:0}
.grille-cartes>.hero,.grille-cartes>.bloc-titre,.grille-cartes>.tres-petit,.grille-cartes>.vide,.grille-cartes>.note,.grille-cartes>.pos-ligne{grid-column:1/-1}
</style>
</head>
<body>
<div id="app">
  <header id="entete">
    <h1>Vigie Portefeuille</h1>
    <div class="sous-titre" id="entete-info"></div>
  </header>
  <nav id="nav-onglets">
    <button type="button" class="onglet-btn actif" data-action="onglet" data-id="vigie">Vigie<span id="nav-valider-n" class="nav-n"></span></button>
    <button type="button" class="onglet-btn" data-action="onglet" data-id="cours">Cours &amp; tendances</button>
    <button type="button" class="onglet-btn" data-action="onglet" data-id="discipline">Discipline</button>
    <button type="button" class="onglet-btn" data-action="onglet" data-id="decouvertes">Découvertes<span id="nav-dec-n" class="nav-n"></span></button>
    <button type="button" class="onglet-btn" data-action="onglet" data-id="parametres">Paramètres</button>
  </nav>
  <main id="principal">
    <section id="onglet-vigie" class="onglet actif">
      <div id="v-hero"></div><div id="v-acquisition"></div><div id="v-maj"></div>
      <div id="v-debrief"></div><div id="v-actions"></div><div id="v-avalider"></div>
      <div id="v-cal"></div><div id="v-chips"></div><div id="v-timeline"></div><div id="v-form"></div><div id="v-regles"></div>
    </section>
    <section id="onglet-cours" class="onglet"><div id="c-contenu" class="grille-cartes"></div></section>
    <section id="onglet-discipline" class="onglet"><div id="d-contenu" class="grille-cartes"></div></section>
    <section id="onglet-decouvertes" class="onglet"><div id="o-contenu" class="grille-cartes"></div></section>
    <section id="onglet-parametres" class="onglet"><div id="p-contenu"></div></section>
  </main>
</div>
<div id="gloss-popover" hidden=""></div>
<script>
'use strict';
/* ================================================================
   CONSTANTES
   ================================================================ */
// Estampille posée par publier.js, IDENTIQUE à celle du cache de sw.js. Sert à
// détecter qu'un onglet resté ouvert exécute encore l'ancien code : il ne navigue
// pas, donc ne repasse jamais par le réseau, et rien ne l'en avertissait.
const Cst_Version = 'vigie-202608261812';
const Cst_CleStockage = 'vigie-portefeuille';
const Cst_CleApiKey   = 'vigie-portefeuille-apikey'; // localStorage UNIQUEMENT (jamais window.storage, jamais le fichier)
const Cst_IsArtifact  = !!(window.storage && typeof window.storage.get === 'function');
const Cst_ModeleMAJ   = 'claude-opus-5'; // défaut ; le modèle réellement appelé est Fn_ModeleMAJ()
const Cst_EffortMAJ   = 'high';          // défaut ; l'effort réellement demandé est Fn_EffortMAJ()
// CATALOGUE DES MODÈLES. Les tarifs voyagent AVEC le modèle : sans cela, changer
// de modèle rendait l'estimation de coût fausse sans prévenir. Haiku est
// volontairement absent : son plafond de sortie (64 000 jetons) est inférieur au
// JSON produit ici.
const Cst_Modeles = [
  { id: 'claude-opus-5', nom: 'Claude Opus 5', entreeParM: 5, sortieParM: 25,
    note: 'Le plus capable de sa gamme. Référence de qualité pour le jugement de desk, qui est désormais l’essentiel de ce que le modèle produit.' },
  { id: 'claude-sonnet-5', nom: 'Claude Sonnet 5', entreeParM: 3, sortieParM: 15,
    note: 'Environ 40 % moins cher qu’Opus 5. L’écart de qualité se voit surtout sur les raisonnements longs — donc sur les textes d’arbitrage et les débriefs.' },
  { id: 'claude-opus-4-8', nom: 'Claude Opus 4.8', entreeParM: 5, sortieParM: 25,
    note: 'Génération précédente d’Opus, même tarif. Utile seulement comme repli si Opus 5 pose problème.' }
];
// EFFORT : profondeur de réflexion ET nombre d'appels d'outils. Levier de coût le
// plus rentable après le cache, parce qu'il agit sur la SORTIE (5× plus chère que
// l'entrée) et sur le nombre d'aller-retours.
const Cst_Efforts = [
  { id: 'high', nom: 'high — équilibré', note: 'Défaut de l’API et réglage recommandé ici : le desk ne collecte plus, il juge — la profondeur sert le texte, pas la fouille.' },
  { id: 'xhigh', nom: 'xhigh — maximal utile', note: 'Pour les journées à arbitrage lourd (plusieurs événements échus à débriefer). Le plus coûteux en jetons de sortie.' },
  { id: 'medium', nom: 'medium — économe', note: 'Réduit nettement la dépense ; le modèle cadre son travail au strict demandé.' },
  { id: 'low', nom: 'low — minimal', note: 'Pour une passe d’enrichissement seule, où le travail est de la collecte et non du jugement.' },
  { id: 'max', nom: 'max — sans retenue', note: 'Plafond de capacité, rendements décroissants et surcoût marqué. À réserver aux cas difficiles.' }
];
// CACHE DE CONTEXTE. À chaque relance (pause_turn), TOUT le contexte accumulé
// repart. Avec un point de cache, ce préfixe se relit à 0,1× au lieu du plein
// tarif. TTL d'une heure et non cinq minutes : un tour de boucle d'outils dure
// ici plusieurs minutes, trop près du cache court dont l'expiration ferait
// repayer le préfixe entier au prix fort.
const Cst_CacheTtl = '1h';
const Cst_CoefCacheEcriture = 2;   // écriture au TTL 1 h : 2× le tarif d'entrée
const Cst_CoefCacheLecture = 0.1;  // relecture depuis le cache : 0,1×
// Relances autorisées après un pause_turn. L'API rend la main tous les ~10 appels
// d'outils. Un plafond bas coupait l'appel APRÈS l'avoir payé — le pire des cas.
const Cst_MaxContinuations = 24;
// Plafond MAXIMAL documenté pour Claude Opus 5 (128K jetons de sortie).
// NE JAMAIS abaisser : un plafond bas produit des troncatures JSON (bug vécu).
const Cst_MaxTokens   = 128000;
// SEUL abaissement autorisé, et automatique : voir Fn_LancerAppel.
const Cst_MaxTokensRepli = 64000;
const Cst_ApiUrl      = 'https://api.anthropic.com/v1/messages';
// OUTILS SERVEUR. Les versions 20260209 filtrent les résultats avant qu'ils
// n'entrent dans le contexte : plus précises ET moins coûteuses.
// Ne JAMAIS déclarer code_execution à côté : ces versions s'en servent déjà en
// interne, et un second environnement d'exécution perturbe le modèle.
const Cst_OutilRecherche = 'web_search_20260209';
const Cst_OutilRechercheRepli = 'web_search_20250305';
const Cst_OutilLecture = 'web_fetch_20260209';
const Cst_MaxJetonsParPage = 12000;
const Cst_VersionEtat = 3;

/* BUDGETS DE RECHERCHE — TOUJOURS CALCULÉS, JAMAIS EN DUR.
   Une constante de plafond est arbitraire par construction : 60 recherches
   saturaient déjà à 14 instruments et seraient absurdes à 60 titres.
   Deux budgets DISTINCTS et ÉTANCHES, c'est le cœur de la reconstruction :
   la collecte ne peut plus dévorer le budget des découvertes, qui était le
   livrable systématiquement sacrifié. */
const Cst_RecherchesParDecouverte = 4;   // une piste = un fait daté à sourcer, puis à recouper
const Cst_LecturesParDecouverte = 2;
const Cst_DecouvertesVisees = 5;         // objectif haut de la fourchette 3–5 du cahier
/* UN DÉBRIEF SE PAIE EN DEUX TEMPS. Établir ce qui s'est passé — chiffres
   publiés contre consensus attendu — puis regarder CE QUI A CHANGÉ DEPUIS sur
   cette ligne. Le second temps n'existait pas : le débrief était borné à
   l'événement, et une nouvelle survenue entre-temps ne pouvait pas être vue,
   faute d'enveloppe pour la chercher. C'est pourtant au moment où l'on rouvre un
   dossier que l'actualité qui l'entoure coûte le moins cher à collecter. */
const Cst_RecherchesParDebrief = 3;      // établir les faits de l'événement
const Cst_RecherchesActualiteParDebrief = 2; // ce qui a changé depuis, sur cette ligne
const Cst_LecturesParDebrief = 3;
const Cst_RecherchesParLigneLourde = 3;  // passe d'enrichissement : cotation, valorisation, agenda
const Cst_LecturesParLigneLourde = 2;
const Cst_RecherchesPlancher = 8;        // couvre le coût fixe (macro) d'un portefeuille minuscule
const Cst_LecturesPlancher = 6;
// Budget de la passe DESK : découvertes + débriefs, et rien d'autre. Aucune
// collecte de cours ni de multiples n'y est autorisée (§ 6 du cahier).
function Fn_BudgetDesk(nbDebriefs) {
  const d = Math.max(0, Math.round(Fn_Num(nbDebriefs) || 0));
  const parDebrief = Cst_RecherchesParDebrief + Cst_RecherchesActualiteParDebrief;
  return {
    recherches: Math.max(Cst_RecherchesPlancher, Cst_DecouvertesVisees * Cst_RecherchesParDecouverte + d * parDebrief),
    lectures: Math.max(Cst_LecturesPlancher, Cst_DecouvertesVisees * Cst_LecturesParDecouverte + d * Cst_LecturesParDebrief),
    decouvertes: Cst_DecouvertesVisees * Cst_RecherchesParDecouverte,
    debriefs: d * parDebrief,
    // Part du budget de débrief explicitement ouverte à l'actualité de la ligne,
    // et non aux seuls chiffres de l'événement.
    debriefsActualite: d * Cst_RecherchesActualiteParDebrief
  };
}
// Budget de la passe ENRICHISSEMENT : proportionnel au nombre de lignes
// RÉELLEMENT à rafraîchir (matérialité × fraîcheur), jamais au nombre de lignes.
function Fn_BudgetEnrichissement(nbLignes) {
  const n = Math.max(0, Math.round(Fn_Num(nbLignes) || 0));
  if (!n) return { recherches: 0, lectures: 0 };
  return {
    recherches: Math.max(Cst_RecherchesPlancher, n * Cst_RecherchesParLigneLourde),
    lectures: Math.max(Cst_LecturesPlancher, n * Cst_LecturesParLigneLourde)
  };
}

// Tarifs par défaut (USD) — modifiables dans Paramètres, à vérifier sur docs.claude.com
const Cst_TarifsDefaut = { entreeParM: 5, sortieParM: 25, recherchePour1000: 10 };
/* SEUILS. Les indicateurs de couverture de la v2 ont disparu : ils mesuraient une
   structure de couverture inexistante dans ce portefeuille et ne se sont jamais
   allumés. Ce qui les remplace — exposition directionnelle nette par facteur —
   vit tous les jours. */
const Cst_SeuilsDefaut = {
  expoFacteurVert: 25, expoFacteurRouge: 40,
  jambeNueVert: 10, jambeNueRouge: 25,
  portageVert: 1, portageRouge: 3,
  tensionValoVert: 25, tensionValoRouge: 50,
  fraicheurTheseVert: 45, fraicheurTheseRouge: 90,
  densiteCatVert: 20, densiteCatRouge: 50,
  concLigneVert: 15, concLigneRouge: 30,
  levierVert: 1.2, levierRouge: 1.5,
  coussinVert: 25, coussinRouge: 10,
  deviseVert: 30, deviseRouge: 50,
  liquiditeVert: 10, liquiditeRouge: 25,
  barriereVert: 25, barriereRouge: 10,
  couvertureDonneesVert: 80, couvertureDonneesRouge: 50,
  materialiteComplet: 10, materialiteCompact: 3,
  fraicheurDonneesJours: 7, peremptionDecouverteJours: 30,
  horizonImminentJours: 5
};
const Cst_SeuilsMeta = [
  { cle: 'expoFacteurVert', label: 'Exposition nette par facteur — vert jusqu’à', unite: '% VN' },
  { cle: 'expoFacteurRouge', label: 'Exposition nette par facteur — rouge au-delà de', unite: '% VN' },
  { cle: 'jambeNueVert', label: 'Jambe directionnelle sans contrepartie — vert jusqu’à', unite: '% VN' },
  { cle: 'jambeNueRouge', label: 'Jambe directionnelle sans contrepartie — rouge au-delà de', unite: '% VN' },
  { cle: 'portageVert', label: 'Portage des produits à levier — vert jusqu’à', unite: '% VN/an' },
  { cle: 'portageRouge', label: 'Portage des produits à levier — rouge au-delà de', unite: '% VN/an' },
  { cle: 'tensionValoVert', label: 'Tension de valorisation — vert jusqu’à', unite: '% VN' },
  { cle: 'tensionValoRouge', label: 'Tension de valorisation — rouge au-delà de', unite: '% VN' },
  { cle: 'fraicheurTheseVert', label: 'Fraîcheur des thèses — vert jusqu’à', unite: 'jours' },
  { cle: 'fraicheurTheseRouge', label: 'Fraîcheur des thèses — rouge au-delà de', unite: 'jours' },
  { cle: 'densiteCatVert', label: 'Densité de catalyseurs (7 j) — vert jusqu’à', unite: '% VN' },

/* ================================================================
   PERSISTANCE — window.storage (artefact) avec repli localStorage
   ================================================================ */
async function Fn_StorageGet() {
  if (Cst_IsArtifact) {
    try {
      const v = await window.storage.get(Cst_CleStockage);
      if (v == null) return null;
      if (typeof v === 'string') return v;
      if (typeof v === 'object' && typeof v.value === 'string') return v.value;
      return JSON.stringify(v);
    } catch (e) { /* repli */ }
  }
  try { return localStorage.getItem(Cst_CleStockage); } catch (e) { return null; }
}
async function Fn_StorageSet(chaine) {
  if (Cst_IsArtifact) {
    try { await window.storage.set(Cst_CleStockage, chaine); return true; } catch (e) { /* repli */ }
  }
  try { localStorage.setItem(Cst_CleStockage, chaine); return true; } catch (e) { return false; }
}
function Fn_SerialiserEtat() {
  return JSON.stringify(Var_State, (k, v) => (k && k.charAt && k.charAt(0) === '_') ? undefined : v);
}
// Unique point de sauvegarde : état ENTIER sérialisé (clés « _ » exclues).
// etatTs n'est tamponné QUE lors d'une modification réelle — jamais au simple
// chargement, sinon un appareil vierge se croirait « plus récent » que l'état du
// dépôt distant et l'écraserait.
function Fn_Save() {
  try {
    // Un seuil modifié change les zones du profil sans passer par le recalcul :
    // le cache tombe ici aussi, sur le seul point d'écriture de l'application.
    if (typeof Fn_OublierAgregats === 'function') Fn_OublierAgregats();
    Var_State.etatTs = Date.now();
    Fn_StorageSet(Fn_SerialiserEtat());
    Fn_SyncPlanifier();
  } catch (e) { /* stockage indisponible : l'app reste utilisable en session */ }
}
function Fn_PersisterSansHorodatage() {
  try { Fn_StorageSet(Fn_SerialiserEtat()); } catch (e) { /* session seulement */ }
}

/* ----------------------------------------------------------------
   MIGRATION v2 → v3
   L'état v2 doit rester lisible : il porte 132 événements, douze
   positions et l'historique des thèses. La migration est faite au
   CHARGEMENT et à chaque adoption d'état — un appareil resté en v2
   peut encore pousser un état ancien au dépôt.
   Elle ne perd rien : les blocs parallèles quotes / fundamentals /
   valuation / expertise sont repliés SUR la position qu'ils décrivent,
   et les événements reçoivent un statut déduit de leur date.
   ---------------------------------------------------------------- */
function Fn_IdPosition(isin, ticker, libelle) {
  const i = String(isin || '').trim().toUpperCase();
  if (/^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(i)) return i;
  const t = String(ticker || '').trim().toUpperCase();
  if (t) return 'T:' + t;
  return 'L:' + Fn_Slug(libelle || 'position');
}
function Fn_MigrerEtat(s) {
  if (!s || typeof s !== 'object') return s;
  if (Fn_Num(s.v) === 3) return s;               // déjà au schéma courant
  if (!s.events && !s.positions && !s.margin) return s; // rien de reconnaissable : laissé tel quel
  const auj = Fn_AujISO();
  // Fenêtre de débrief à la reprise d'un état antérieur. Attention au faux ami :
  // dans le schéma précédent, « non traité » ne voulait PAS dire « en attente de
  // débrief » — le cycle de vie n'existait pas, et chaque consolidation datait
  // ses propositions du jour même. Les remonter toutes ferait un mur de dizaines
  // de cartes à la première ouverture, et le bandeau perdrait tout son sens.
  // Seuls les trois derniers jours passent en « à débriefer » ; le reste est
  // CLASSÉ, jamais effacé, avec le motif écrit sur la carte.
  const fenetreDebrief = Fn_DateISO(new Date(Date.now() - 3 * 86400000));
  const q = s.quotes || {}, f = s.fundamentals || {}, val = s.valuation || {}, x = s.expertise || {};
  const ts = Fn_Num(s.derniereConsolidation) || Fn_Num(s.etatTs) || Date.now();
  const parTicker = {};
  const positions = (s.positions || []).map(p => {
    const id = Fn_IdPosition(p.isin, p.ticker, p.libelle);
    parTicker[p.ticker] = id;
    const qq = q[p.ticker] || {}, vv = val[p.ticker] || {}, ff = f[p.ticker] || {}, xx = x[p.ticker] || {};
    const estDerive = !!(p.barriere || p.strike || p.sousJacent);
    return {
      id, ticker: p.ticker || null, isin: p.isin || null,
      detention: {
        nom: p.libelle || p.ticker || '', qte: Fn_Num(p.quantite), dev: p.devise || 'EUR',
        cloture: Fn_Num(p.cours), clotureVeille: Fn_Num(qq.clotPrec), var: Fn_Num(qq.chgPct),
        valDev: null, valEurExport: Fn_Num(p.valeurEur), valEur: null, pctVN: Fn_Num(p.pctVN),
        poche: p.categorie || null, facteurs: Array.isArray(p.facteurs) ? p.facteurs : [],
        liqFaible: !!p.liquiditeFaible, ts, src: p.src || 'état v2'
      },
      produit: {
        type: estDerive ? 'derive' : 'action', emetteur: null, sousJacent: p.sousJacent || null,
        sens: p.sens || 'long', barriere: Fn_Num(p.barriere), strike: Fn_Num(p.strike),
        parite: Fn_Num(p.ratioParite), levier: Fn_Num(p.levier), deltaEur: Fn_Num(p.deltaEur),
        distBarriere: null, portageMensuel: Fn_Num(p.portageMensuelEur), histBarriere: []
      },
      marche: { ouv: Fn_Num(qq.ouv), haut: Fn_Num(qq.haut), bas: Fn_Num(qq.bas), vol: Fn_Num(qq.vol),
        adv: Fn_Num(qq.adv), h52: Fn_Num(qq.h52), b52: Fn_Num(qq.b52),
        freshTs: Fn_Num(qq.dateMaj), s: qq.src || null, u: qq.url || null },
      valo: { per: Fn_Num(vv.perTtm), perN: Fn_Num(vv.perFwd1), bpa: Fn_Num(vv.bpa), capi: Fn_Num(vv.capi),
        detteNette: Fn_Num(vv.detteNette), roe: Fn_Num(vv.roe), margeOp: Fn_Num(vv.margeOp),
        rdt: Fn_Num(vv.divYield), exDiv: vv.exDiv || null, veCa: Fn_Num(vv.evSales), veEbitda: Fn_Num(vv.evEbitda),
        refHist: vv.refHist || null, refPairs: vv.refPeers || null,
        freshTs: Fn_Num(vv.dateMaj), s: vv.src || null, u: vv.url || null },
      consensus: { conso: ff.consensus || null, nbA: Fn_Num(ff.nbAnalystes), obj: Fn_Num(ff.targetMean),
        objEcart: Fn_Num(ff.targetGapPct), pub: ff.nextReport || null, pubDate: ff.nextReportDate || null,
        freshTs: Fn_Num(ff.dateMaj), s: ff.src || null, u: ff.url || null },
      desk: { niveau: null, profil: estDerive ? 'derive' : null, tend: xx.tendance || null,
        these: xx.lectureDesk || null, valoRef: xx.valorisationVsRef || null, risques: xx.risques || null,
        revue: xx.revueResultats || null, ts: Fn_Num(xx.dateMaj) || null }
    };
  });
  // Événements : statut attribué automatiquement selon la date. Ceux qui sont
  // passés depuis plus que l'horizon d'affichage sont CLASSÉS — les remonter tous
  // en « à débriefer » rendrait le bandeau inutilisable dès la première ouverture,
  // et un événement vieux de trois mois ne se débriefe plus utilement.
  const calendrier = (s.events || []).map(e => {
    let statut, motif = null;
    if (e.traite) statut = 'classe';
    else if (!e.date) statut = 'classe';
    else if (e.date < fenetreDebrief) {
      statut = 'classe';
      motif = 'classé à la reprise de l’état : passé depuis plus de trois jours et jamais tranché — le cycle de vie n’existait pas dans le schéma précédent';
    } else if (e.date < auj) statut = 'echu';
    else statut = 'prevu';
    const tags = Array.isArray(e.tags) ? e.tags : [];
    const isin = tags.map(t => parTicker[t]).filter(Boolean)[0] || null;
    const metriques = (e.metrics || []).map(m => ({ l: m.label, v: m.value }));
    // Empreinte calculée DÈS LA REPRISE : sans elle, tous les événements déjà
    // rédigés seraient considérés « à réécrire » et repayés une seconde fois —
    // exactement ce que le cycle de vie cherche à supprimer.
    const dejaEcrit = !!(e.surveiller && e.pratique);
    return {
      id: e.id, isin, date: e.date || null, statut, motif,
      source: e.ajoutManuel ? 'manuel' : 'état précédent', libelle: e.titre || '', court: e.court || null,
      sev: e.sev || 'Info', conf: e.unc === false, tags, metriques,
      textes: { surv: e.surveiller || '', arb: e.arbitrage || '', prat: e.pratique || '',
        texteEcritLe: e.traiteLe || (dejaEcrit ? Fn_DateISO(new Date(ts)) : null),
        empreinte: dejaEcrit ? metriques.map(m => String(m.l) + '=' + String(m.v)).join('|').slice(0, 400) : null },
      debrief: null, src: e.src || null
    };
  });

    const cle = Fn_CleControle(c);
    if (parCle[cle] === undefined) { parCle[cle] = gardees.length; gardees.push(c); return; }

/* ÉLAGAGE — une carte décidée n'est plus affichée nulle part et ne sert plus au

   actions décidées pesaient 170 Ko sur 427, poussés au dépôt à CHAQUE
   sauvegarde). Le calendrier, lui, est borné par son cycle de vie : c'est ce qui
   empêche les 132 événements de se reformer. */

function Fn_ElaguerEtat() {

    return attente.concat(decidees);

  Var_State.actions = borner(Var_State.actions || [], Cst_MaxDecidees);
  if (Var_State.executes.length > Cst_MaxExecutes) Var_State.executes = Var_State.executes.slice(-Cst_MaxExecutes);

  const archives = Var_State.calendrier.filter(e => e.statut === 'debriefe' || e.statut === 'classe')

/* BILAN FINANCIER D'UN APPEL — cinq postes, et non trois : l'entrée plein tarif,
   l'ÉCRITURE du cache (majorée), sa RELECTURE (à 0,1×), la sortie, les recherches.
   Ignorer les deux postes de cache rendait le coût affiché faux dès que le cache
   agissait — précisément ce qui devait se voir. */
function Fn_CoutJournal(journal) {
  const t = Var_State.tarifs;
  const pe = Fn_Num(t.entreeParM) || 0, ps = Fn_Num(t.sortieParM) || 0, pr = Fn_Num(t.recherchePour1000) || 0;
  const entree = Fn_Num(journal.jetonsEntree) || 0;
  const cw = Fn_Num(journal.jetonsCacheEcriture) || 0;
  const cr = Fn_Num(journal.jetonsCacheLecture) || 0;
  const sortie = Fn_Num(journal.jetonsSortie) || 0;
  const rech = Fn_Num(journal.recherches) || 0;
  return {
    entree: entree / 1e6 * pe,
    cacheEcriture: cw / 1e6 * pe * Cst_CoefCacheEcriture,
    cacheLecture: cr / 1e6 * pe * Cst_CoefCacheLecture,
    sortie: sortie / 1e6 * ps,
    // Les LECTURES de page ne sont pas facturées à l'appel : leur coût est déjà
    // compté dans les jetons d'entrée. Seules les recherches le sont.
    recherches: rech / 1000 * pr,
    // Les deux sous-totaux portent les intitulés de console.anthropic.com —
    // « coût en tokens » et « coût de la recherche web ». Les nommer autrement
    // rendait le rapprochement avec la facture impossible à faire de tête.
    get jetons() { return this.entree + this.cacheEcriture + this.cacheLecture + this.sortie; },
    get total() { return this.jetons + this.recherches; }

function Fn_CloturerBilan(journal) {

  journal.bilanFait = true;
  journal.finTs = journal.finTs || Date.now();

  const c = Var_State.cumulApi;
  c.appels++;
  c.jetonsEntree += Fn_Num(journal.jetonsEntree) || 0;
  c.jetonsSortie += Fn_Num(journal.jetonsSortie) || 0;
  c.jetonsCacheEcriture = (Fn_Num(c.jetonsCacheEcriture) || 0) + (Fn_Num(journal.jetonsCacheEcriture) || 0);
  c.jetonsCacheLecture = (Fn_Num(c.jetonsCacheLecture) || 0) + (Fn_Num(journal.jetonsCacheLecture) || 0);
  c.recherches += Fn_Num(journal.recherches) || 0;

/* ----------------------------------------------------------------

   NAVIGATION. Un onglet laissé ouvert ne navigue jamais : il continue d'exécuter
   le code chargé au premier affichage, indéfiniment, sans le moindre signe.
   Cas vécu : trois publications ignorées pendant deux heures, des appels à plus
   de 2 $ lancés sur du code périmé, et des résultats attribués à tort aux
   correctifs qui n'avaient jamais été chargés.

function Fn_VerifierVersion() {
  const rt = Var_State._runtime;

  return fetch('sw.js?v=' + Date.now(), { cache: 'no-store' })
    .then(r => (r.ok ? r.text() : ''))
    .then(txt => {
      const m = /const CACHE\s*=\s*'([^']+)'/.exec(txt || '');
      rt.versionPubliee = m ? m[1] : null;
      if (rt.versionPubliee && rt.versionPubliee !== Cst_Version) { Fn_RenderMajPanel(); Fn_RenderEntete(); }
      return rt.versionPubliee;
    })
    .catch(() => null); // hors ligne / file:// / artefact : rien à dire

    + Fn_Esc(Var_State._runtime.versionPubliee) + '</span>. Un onglet resté ouvert ne recharge jamais le code tout seul. '

   Le texte collé est la SEULE pièce permettant de diagnostiquer un parseur qui se

   de question de le synchroniser — il ne quitte la machine que vers

const Cst_DocsBase = 'vigie-docs';

function Fn_DocsOuvrir() {
  return new Promise((resoudre, rejeter) => {
    if (typeof indexedDB === 'undefined') { rejeter(new Error('indexedDB indisponible')); return; }
    const req = indexedDB.open(Cst_DocsBase, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(Cst_DocsMagasin)) req.result.createObjectStore(Cst_DocsMagasin);
    };
    req.onsuccess = () => resoudre(req.result);
    req.onerror = () => rejeter(req.error || new Error('ouverture impossible'));
  });

function Fn_DocsTransaction(mode, action) {
  return Fn_DocsOuvrir().then(base => new Promise((resoudre, rejeter) => {
    const tr = base.transaction(Cst_DocsMagasin, mode);
    const req = action(tr.objectStore(Cst_DocsMagasin));
    tr.oncomplete = () => { base.close(); resoudre(req ? req.result : null); };
    tr.onerror = () => { base.close(); rejeter(tr.error || new Error('transaction échouée')); };
  }));

const Cst_ClesCollage = ['positions', 'ordres', 'executes', 'xlsx', 'aucuneTransac', 'capture'];

  try {
    for (const cle of Cst_ClesCollage) {

      if (cle === 'aucuneTransac') Var_State._runtime.aucuneTransac = !!v.valeur;
      else if (cle === 'xlsx') Var_State._runtime.xlsx = v;
      else if (cle === 'capture') Var_State._runtime.capture = v;
      else Var_State._runtime.collages[cle] = v;

}

  Var_State._runtime.collages = {};

  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));

function Fn_Auj() { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function Fn_DateISO(d) {
  const p = n => (n < 10 ? '0' : '') + n;
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function Fn_AujISO() { return Fn_DateISO(Fn_Auj()); }
// Deux horodatages tombent-ils le même jour ? Sert à ne pas faire glisser la
// clôture de référence quand la même séance est analysée deux fois.
function Fn_MemeJour(a, b) {
  const x = Fn_Num(a), y = Fn_Num(b);
  if (x == null || y == null) return false;
  return Fn_DateISO(new Date(x)) === Fn_DateISO(new Date(y));
}
function Fn_JoursDepuis(iso) {
  const d = Fn_ParseDate(iso);
  if (!d) return null;
  return Math.round((d.getTime() - Fn_Auj().getTime()) / 86400000);
}
// NORMALISATION : toutes les dates affichées sont en JJ/MM/AA (jamais MM/JJ),
// construites depuis les composantes locales — aucune ambiguïté jour/mois.
function Fn_FmtDateCourt(iso) {
  const d = Fn_ParseDate(iso);
  if (!d) return '—';
  const p = n => (n < 10 ? '0' : '') + n;
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2);
}
function Fn_FmtDate(iso) {
  const d = Fn_ParseDate(iso);
  if (!d) return '—';
  let js = '';
  try { js = new Intl.DateTimeFormat('fr-FR', { weekday: 'short' }).format(d) + ' '; } catch (e) { js = ''; }
  return js + Fn_FmtDateCourt(iso);
}
function Fn_FmtHeure(ts) {
  if (!ts) return '—';
  try {
    const d = new Date(ts);
    const p = n => (n < 10 ? '0' : '') + n;
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + String(d.getFullYear()).slice(2) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  } catch (e) { return String(ts); }
}
function Fn_HeureSeule(ts) {
  if (!ts) return '—';
  const d = new Date(ts), p = n => (n < 10 ? '0' : '') + n;
  return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
// Compteur temporel : futurs « J+x », jour même « AUJOURD'HUI », passés « RETARD xj ».
function Fn_Compteur(iso, clos) {
  const j = Fn_JoursDepuis(iso);
  if (j == null) return { label: '—', cls: 'fait' };
  if (clos) return { label: 'traité', cls: 'fait' };
  if (j === 0) return { label: 'AUJOURD’HUI', cls: 'auj' };
  if (j > 0) return { label: 'J+' + j, cls: 'futur' };

// Libellé compact pour les cases du calendrier, quand l'événement n'en porte pas.
function Fn_AbregerTitre(titre) {
  let t = String(titre || '').split(' — ')[0];
  t = t.replace(/\([^)]*\)/g, ' ');
  const dico = [
    [/r[ée]sultats?/gi, 'Rés.'], [/trimestriels?/gi, 'trim.'], [/semestriels?/gi, 'sem.'],
    [/fiscal/gi, 'fisc.'], [/publications?/gi, 'publ.'], [/d[ée]cisions?/gi, 'Déc.'],
    [/d[ée]tachements?/gi, 'Détach.'], [/couvertures?/gi, 'couv.'], [/dividendes?/gi, 'div.'],
    [/ajustements?/gi, 'ajust.'], [/attendue?s?/gi, 'att.'], [/ex[ée]cut[ée]e?s?/gi, 'exéc.'],
    [/toujours/gi, ''], [/ concernant /gi, ' '], [/ depuis le /gi, ' dep. ']
  ];
  dico.forEach(d => { t = t.replace(d[0], d[1]); });
  t = t.replace(/\s+/g, ' ').trim();
  return t.length > 42 ? t.slice(0, 41) + '…' : t;
}
function Fn_Slug(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'x';
}
// Normalisation d'un libellé pour l'APPARIEMENT capture ↔ export : majuscules,
// accents retirés, espaces réduits. Le nom du fichier est tronqué à 32
// caractères : l'appariement se fait sur ce préfixe, jamais sur l'égalité.
function Fn_NormNom(s) {
  return String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^A-Z0-9]+/g, ' ').trim();
}
function Fn_Uid(prefixe) {
  return (prefixe || 'id') + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
}
function Fn_SemaineLundi(iso) {
  const d = Fn_ParseDate(iso);
  if (!d) return null;
  const jour = (d.getDay() + 6) % 7; // lundi = 0
  d.setDate(d.getDate() - jour);
  return Fn_DateISO(d);
}
function Fn_DureeFmt(ms) {
  if (ms == null) return '—';
  const s = Math.round(ms / 1000);
  return s < 60 ? s + ' s' : Math.floor(s / 60) + ' min ' + (s % 60) + ' s';
}
/* LECTURE TOLÉRANTE D'UN CHAMP — pierre angulaire de la rétrocompatibilité.
   Le schéma d'échange avec le modèle utilise des clés COURTES (leur poids est
   multiplié par le nombre de lignes), mais une réponse ancienne, tronquée puis
   réparée, ou un modèle qui retombe sur les clés longues, doit s'intégrer à
   l'identique. Les deux sont acceptées, toujours. */
function Fn_Ch(o, alias) {
  if (!o) return null;
  for (let i = 0; i < alias.length; i++) {
    const v = o[alias[i]];
    if (v !== undefined && v !== null && v !== '') return v;
  }
  return null;
}
// Sérialisation compacte pour ce qui PART vers le modèle : une clé à null coûte
// des jetons et n'apprend rien — l'absence dit déjà « inconnu ».
function Fn_JsonCompact(o) {
  return JSON.stringify(o, (cle, v) => (v === null || v === '' ? undefined : v));
}
// URL fournie par le modèle : validée ICI et nulle part ailleurs. Une chaîne
// « javascript: » placée dans un href s'exécuterait au clic.
function Fn_UrlSure(u) {
  if (!u) return null;
  const s = String(u).trim();
  return /^https?:\/\/[^\s"'<>]{3,}$/i.test(s) ? s : null;
}
function Fn_UrlDomaine(u) {
  const m = /^https?:\/\/([^/?#]+)/i.exec(String(u || ''));
  return m ? m[1].replace(/^www\./i, '') : 'source';
}
function Fn_Lien(u, libelle) {
  const s = Fn_UrlSure(u);
  if (!s) return '';
  return '<a class="lien" target="_blank" rel="noopener noreferrer" href="' + Fn_Esc(s) + '">'
    + Fn_Esc(libelle || Fn_UrlDomaine(s)) + '</a>';
}
/* ÂGE D'UNE DONNÉE. Mesuré sur la date de la DONNÉE, jamais sur l'heure de
   l'appel : un cours de trois jours affiché « du jour » rendait la péremption
   invisible à l'écran. Tolérance en jours CALENDAIRES — un lundi, la dernière
   clôture a trois jours et c'est normal. */
function Fn_Age(ts) {
  const t = Fn_Num(ts);
  if (t == null) return null;
  const j = Math.round((Fn_Auj().getTime() - new Date(t).setHours(0, 0, 0, 0)) / 86400000);
  if (j <= 0) return { j: 0, txt: 'du jour', cls: 'neutre' };
  if (j === 1) return { j: 1, txt: 'de la veille', cls: 'neutre' };
  return { j, txt: 'il y a ' + j + ' j', cls: j >= 5 ? 'crit' : (j >= 2 ? 'warn' : 'neutre') };
}
function Fn_BadgeAge(ts, prefixe) {
  const a = Fn_Age(ts);
  return a ? '<span class="badge badge-' + a.cls + '">' + Fn_Esc((prefixe ? prefixe + ' ' : '') + a.txt) + '</span>' : '';
}
// Fraîcheur d'un bloc enrichi : au-delà du seuil de Paramètres, il repart dans la
// passe hebdomadaire. En deçà, il n'est JAMAIS recollecté — c'est ce qui divise
// la facture.
/* UNE LIGNE EST-ELLE VALORISABLE ? Il y faut un multiple ET un référentiel
   auquel le comparer : un multiple isolé ne s'interprète pas. La MÊME condition
   sert à trois endroits — l'indicateur de tension, la couverture des données, et
   le choix des lignes à enrichir. Les laisser diverger faisait dire à l'écran
   deux choses contraires au même moment : « 100 % de la VN documentée et
   fraîche » trois lignes sous « multiples ET référentiel manquants » sur la
   totalité du portefeuille. */
function Fn_ValoExploitable(p) {
  const v = (p && p.valo) || {};
  const ref = Fn_Num(v.refHist) != null ? Fn_Num(v.refHist) : Fn_Num(v.refPairs);
  const mult = Fn_Num(v.per) != null ? Fn_Num(v.per) : Fn_Num(v.perN);
  return (ref != null && mult != null) ? { mult: mult, ref: ref } : null;
}
function Fn_DonneePerimee(freshTs) {
  const t = Fn_Num(freshTs);
  if (t == null) return true;
  const j = (Fn_Num(Var_State.seuils.fraicheurDonneesJours) || 7);
  return (Date.now() - t) > j * 86400000;
}
function Fn_BadgeFraicheurDonnee(freshTs, quoi) {
  if (Fn_Num(freshTs) == null) return '<span class="badge badge-warn">' + Fn_Esc(quoi || 'donnée') + ' jamais collectée</span>';
  const a = Fn_Age(freshTs);
  return '<span class="badge badge-' + (Fn_DonneePerimee(freshTs) ? 'warn' : a.cls) + '">'
    + Fn_Esc((quoi ? quoi + ' ' : '') + a.txt) + '</span>';
}
/* Mise en puces d'un texte à alternatives (« si X → A ; si Y → B »).
   PRÉSENTATION SEULE : le texte stocké n'est jamais modifié. */
function Fn_TexteOuListe(txt) {
  const brut = String(txt == null ? '' : txt);
  const bouts = brut.split(/\s;\s+/).map(s => s.trim()).filter(Boolean);
  if (bouts.length < 2 || bouts.length > 4 || bouts.some(m => m.length < 20)) {
    return '<div class="svap-txt">' + Fn_Gloss(Fn_Esc(brut)) + '</div>';
  }
  return '<ul class="svap-liste">' + bouts.map(m => '<li>' + Fn_Gloss(Fn_Esc(m)) + '</li>').join('') + '</ul>';
}
// Carte de recommandation. `role` porte la couleur et la vignette ; le libellé

function Fn_HtmlSvap(role, texte, libelleForce) {

/* ================================================================
   GLOSSAIRE — dictionnaire dynamique tactile
   ================================================================ */
const Cst_Glossary = {
  'découverte': { long: 'Découverte', def: 'Piste d’investissement produite par le desk, ancrée dans le portefeuille (elle nomme l’intention : renforcer, réduire, couvrir, diversifier, substituer), adossée à un fait daté et sourcé, réfutable (niveau d’entrée, invalidation, horizon) et compatible avec la discipline. Un candidat à étudier, jamais un ordre.' },
  'débrief': { long: 'Débrief d’événement', def: 'Compte rendu d’un événement échu : ce qui s’est réellement passé (chiffres publiés vs consensus attendu), l’écart à ce que la carte annonçait, ce que cela change à la thèse — explicitement « rien » si rien ne change — et l’action, ou l’absence d’action justifiée.' },
  'matérialité': { long: 'Matérialité', def: 'Poids d’une ligne dans la valeur nette. Elle pilote l’effort consacré à la ligne : traitement complet au-delà du seuil haut, compact entre les deux, une seule ligne d’agenda en dessous. Traiter toutes les lignes à l’identique était la principale cause de gaspillage.' },
  'exposition directionnelle nette': { long: 'Exposition directionnelle nette', def: 'Somme algébrique des deltas d’un même facteur : une jambe longue et une jambe short du même facteur se compensent. C’est ce qui reste, après compensation, qui porte le risque — et non le brut.' },
  'portage': { long: 'Coût de portage', def: 'Coût de détention d’une position dans le temps. Sur un produit à levier sans échéance, il se lit dans la DÉRIVE de la barrière et du strike d’un jour à l’autre : deux observations datées suffisent à le calculer, sans aucune source externe.' },
  'MAJ': { long: 'Mise à jour', def: 'Passe de jugement : l’application transmet au modèle un tableau déjà complet et lui demande uniquement ce qu’elle ne sait pas produire — les textes, les débriefs, les découvertes. Aucun chiffre présent dans une capture ne lui est demandé.' },
  'enrichissement': { long: 'Enrichissement', def: 'Passe hebdomadaire de collecte : multiples, consensus et agendas des lignes lourdes uniquement. Ces données ne bougent pas d’un jour à l’autre — les recollecter chaque jour était payer plusieurs fois la même information.' },
  'VN': { long: 'Valeur nette (valeur liquidative)', def: 'Valeur du portefeuille : titres + liquidités − dette de marge. Dénominateur de toutes les expositions exprimées en % VN.' },
  'valeur liquidative': { long: 'Valeur liquidative', def: 'Valeur totale du portefeuille si tout était vendu et les dettes remboursées ; affichée par le courtier dans l’aperçu de marge.' },
  'VL': { long: 'Valeur liquidative', def: 'Abréviation de la valeur liquidative : le dénominateur du coussin de marge et du levier exact.' },
  'PER': { long: 'Price Earnings Ratio (cours/bénéfice)', def: 'Cours divisé par le bénéfice par action. Un PER isolé n’est pas interprétable : il se compare à la médiane historique du titre ou à celle des pairs.' },
  'TTM': { long: 'Trailing Twelve Months (12 mois glissants)', def: 'Calculé sur les 12 derniers mois publiés — ex. PER TTM = cours rapporté au bénéfice des 4 derniers trimestres.' },
  'BPA': { long: 'Bénéfice par action', def: 'Résultat net rapporté au nombre d’actions, comparé au consensus lors des publications. C’est lui qui rend le PER interprétable.' },
  'BNA': { long: 'Bénéfice net par action', def: 'Synonyme de BPA. La direction des révisions de BNA par les analystes est un signal de tendance clé.' },
  'PEG': { long: 'Price/Earnings to Growth', def: 'PER divisé par la croissance attendue des bénéfices. En dessous de 1, la valorisation paraît raisonnable au regard de la croissance ; au-delà de 2, elle suppose beaucoup.' },
  'VE/EBITDA': { long: 'Valeur d’entreprise / EBITDA', def: 'Multiple indépendant de la structure de dette, utile pour comparer des sociétés d’un même secteur ou une société à son propre historique.' },
  'VE/CA': { long: 'Valeur d’entreprise / chiffre d’affaires', def: 'Multiple utilisé notamment quand le résultat est négatif (PER non significatif) ou très volatil.' },
  'VE': { long: 'Valeur d’entreprise', def: 'Capitalisation boursière + dette nette : ce que « coûte » réellement l’entreprise.' },
  'EBITDA': { long: 'Excédent brut d’exploitation', def: 'Résultat avant intérêts, impôts, dépréciations et amortissements — approximation de la génération de trésorerie opérationnelle.' },
  'CA': { long: 'Chiffre d’affaires', def: 'Total des ventes de la période. « CA S1 » = chiffre d’affaires du premier semestre.' },

  'BFR': { long: 'Besoin en fonds de roulement', def: 'Trésorerie immobilisée par le cycle d’exploitation. Sa variation éclaire la qualité du résultat : un bénéfice sans cash-flow se voit ici.' },
  'ADV': { long: 'Average Daily Volume (volume moyen quotidien)', def: 'Volume moyen échangé par séance. Dimensionne la capacité à sortir d’une ligne en 1 à 2 séances sans peser sur le cours.' },
  'ROE': { long: 'Return on Equity (rentabilité des capitaux propres)', def: 'Résultat net rapporté aux capitaux propres. Se lit avec le levier financier : un ROE élevé porté par la dette n’est pas de la rentabilité.' },
  'FOMC': { long: 'Federal Open Market Committee', def: 'Comité de politique monétaire de la Réserve fédérale américaine. Ses décisions de taux et ses projections sont des catalyseurs macro majeurs.' },

  'barrière': { long: 'Barrière (knock-out)', def: 'Niveau du sous-jacent qui, s’il est touché — même en séance, même brièvement —, désactive définitivement le produit à levier. Elle dérive chaque jour du financement : cette dérive EST le coût de portage.' },
  'knock-out': { long: 'Knock-out (désactivation)', def: 'Franchissement de la barrière d’un produit à levier : le produit est désactivé et remboursé à sa valeur résiduelle (souvent quasi nulle).' },
  'strike': { long: 'Strike (prix d’exercice / financement)', def: 'Niveau de référence servant au calcul de la valeur intrinsèque du produit ; ajusté lors des détachements de dividende, et dérivant chaque jour du financement.' },
  'parité': { long: 'Ratio / parité', def: 'Nombre de produits à levier nécessaires pour représenter une unité de sous-jacent (ex. 10:1). Indispensable pour convertir un prix de produit en exposition réelle.' },
  'coussin de marge': { long: 'Coussin de marge', def: 'Marge disponible rapportée à la valeur liquidative. Plus il est mince, plus une baisse des titres rapproche de l’appel de marge.' },
  'levier brut': { long: 'Levier brut', def: 'Valeur des titres détenus divisée par la valeur liquidative : 1,5× signifie 150 € d’exposition pour 100 € de fonds propres — gains ET pertes amplifiés d’autant.' },
  'gap': { long: 'Gap (saut de cours)', def: 'Écart entre la clôture et le premier cours suivant, fréquent après résultats. Un ordre limite peut être « traversé » par un gap et exécuté bien au-delà du niveau visé.' },

  'consensus': { long: 'Consensus des analystes', def: 'Agrégat des recommandations et prévisions des analystes. Point de référence, pas vérité : l’écart à l’objectif moyen n’est pas un potentiel, c’est une opinion moyenne.' },
  'ex-dividende': { long: 'Ex-dividende (détachement)', def: 'Premier jour où l’action se traite sans droit au dividende : le cours s’ajuste mécaniquement à la baisse, ainsi que barrières et strikes des produits dérivés.' },
  'guidance': { long: 'Guidance (prévisions de la société)', def: 'Prévisions communiquées par la société elle-même. Son relèvement ou son abaissement pèse souvent plus sur le cours que le résultat publié.' },
  'IR': { long: 'Investor Relations (relations investisseurs)', def: 'Site officiel de la société : les dates de publication y font foi, avant tout agrégateur.' },
  'BYOK': { long: 'Bring Your Own Key (votre propre clé API)', def: 'Utilisation de votre clé API personnelle, stockée uniquement dans ce navigateur. Jamais un identifiant de courtier — l’application n’en demande aucun.' },

// Index de recherche construit une fois (motifs triés du plus long au plus court).
function Fn_GlossIndex() {
  const rt = Var_State._runtime;
  if (rt.glossIndex) return rt.glossIndex;
  const cles = Object.keys(Cst_Glossary).sort((a, b) => b.length - a.length);
  rt.glossIndex = cles.map(cle => {
    let motif = cle.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&');
    const prem = cle.charAt(0);
    if (prem >= 'a' && prem <= 'z') motif = '[' + prem.toUpperCase() + prem + ']' + motif.slice(1);
    return { cle, re: new RegExp('(^|[^0-9A-Za-zÀ-ÖØ-öø-ÿ_])(' + motif + ')(?![0-9A-Za-zÀ-ÖØ-öø-ÿ_])', 'g') };
  });
  return rt.glossIndex;
}
// Enveloppe chaque terme d'un span — appelé APRÈS Fn_Esc, respecte les frontières
// de mots et ne ré-enveloppe jamais l'intérieur d'une balise.
function Fn_Gloss(html) {
  if (html == null || html === '') return html == null ? '' : html;
  const idx = Fn_GlossIndex();
  const seg = String(html).split(/(<[^>]+>)/);
  for (let i = 0; i < seg.length; i++) {
    if (!seg[i] || seg[i].charAt(0) === '<') continue;
    let fragments = [{ brut: true, s: seg[i] }];
    for (let k = 0; k < idx.length; k++) {
      const e = idx[k];
      const suivants = [];
      for (let p = 0; p < fragments.length; p++) {
        if (!fragments[p].brut) { suivants.push(fragments[p]); continue; }
        const s = fragments[p].s;
        e.re.lastIndex = 0;
        let curseur = 0, m;
        while ((m = e.re.exec(s)) !== null) {
          const debut = m.index + m[1].length;
          if (debut > curseur) suivants.push({ brut: true, s: s.slice(curseur, debut) });
          suivants.push({ brut: false, s: '<span class="gloss" data-terme="' + Fn_Esc(e.cle) + '">' + m[2] + '</span>' });
          curseur = debut + m[2].length;
        }
        if (curseur === 0) { suivants.push(fragments[p]); }
        else if (curseur < s.length) { suivants.push({ brut: true, s: s.slice(curseur) }); }
      }
      fragments = suivants;
    }
    seg[i] = fragments.map(f => f.s).join('');
  }
  return seg.join('');
}
