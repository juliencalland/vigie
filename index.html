/* PROFIL D'EXPOSITION — base CHIFFRÉE de tout jugement de cohérence.
   Agrège en DELTA (produits à levier compris, donc en exposition réelle et
   signée) par ligne, facteur, devise et poche. C'est l'exposition NETTE qui
   compte : une jambe longue et une jambe short du même facteur se compensent. */
function Fn_ProfilExposition() {
  const rt = Var_State._runtime;
  if (rt.memoProfil) return rt.memoProfil;
  const vnObj = Fn_ValeurNette();
  const base = vnObj ? vnObj.vn : null;
  const m = Var_State.marge;
  const s = Var_State.seuils;
  const parFacteur = {}, parDevise = {}, parPoche = {}, brutFacteur = {};
  Var_State.positions.forEach(p => {
    /* DELTA INCONNU : on perd la MESURE, jamais le SENS. Quand les paramètres
       d'un produit à levier n'ont pas pu être lus — c'est ce que signale la carte
       « paramètres de levier illisibles » — le delta est nul et l'agrégation se
       rabattait sur la valeur de marché, TOUJOURS POSITIVE. Une jambe short était
       alors comptée comme longue : elle gonflait l'exposition du facteur au lieu
       de la réduire, faisait passer une couverture pour un doublon, et masquait
       sa propre nudité. La valeur de marché d'un produit à levier sous-estime de
       toute façon largement son exposition ; c'est la carte à valider qui dit
       comment obtenir la vraie, pas cette approximation. */
    const d = Fn_Num(p.produit.deltaEur);
    const brut = Fn_Num(p.detention.valEur) || 0;
    const val = d != null ? d : (p.produit.sens === 'short' ? -brut : brut);
    const facteurs = (p.detention.facteurs && p.detention.facteurs.length) ? p.detention.facteurs : ['non classé'];
    facteurs.forEach(f => {
      parFacteur[f] = (parFacteur[f] || 0) + val;
      brutFacteur[f] = (brutFacteur[f] || 0) + Math.abs(val);
    });
    parDevise[p.detention.dev || 'EUR'] = (parDevise[p.detention.dev || 'EUR'] || 0) + val;
    parPoche[p.detention.poche || 'non classé'] = (parPoche[p.detention.poche || 'non classé'] || 0) + val;
  });
  const pct = v => (base ? Math.round(v / base * 1000) / 10 : null);
  const trier = o => Object.keys(o).sort((a, b) => Math.abs(o[b]) - Math.abs(o[a]))
    .map(k => ({ cle: k, deltaEur: Math.round(o[k]), pctVN: pct(o[k]) }));
  return (rt.memoProfil = {
    valeurNetteEur: base != null ? Math.round(base) : null,
    valeurNetteSrc: vnObj ? vnObj.src : 'valeur nette inconnue (écran de marge non collé) — toute taille en % VN est alors incalculable',
    coussinMargePct: m && m.coussinPct != null ? Math.round(m.coussinPct * 10) / 10 : null,
    margeDisponibleEur: m && Fn_Num(m.libre) != null ? Math.round(Fn_Num(m.libre)) : null,
    levierBrut: m && m.levier != null ? Math.round(m.levier * 100) / 100 : null,
    tresorerieEur: m && Fn_Num(m.cash) != null ? Math.round(Fn_Num(m.cash)) : null,
    gardeFous: {
      coussinRougeSousPct: s.coussinRouge, coussinVertAPartirDePct: s.coussinVert,
      levierRougeAuDelaDe: s.levierRouge, concentrationLigneRougeAuDelaDePctVN: s.concLigneRouge,
      expositionFacteurRougeAuDelaDePctVN: s.expoFacteurRouge, deviseRougeAuDelaDePctVN: s.deviseRouge,
      liquiditeFaibleRougeAuDelaDePctVN: s.liquiditeRouge
    },
    lignes: Var_State.positions.map(p => ({ id: p.id, nom: p.detention.nom, poche: p.detention.poche,
      pctVN: p.detention.pctVN, sens: p.produit.sens, facteurs: p.detention.facteurs || [], liqFaible: p.detention.liqFaible })),
    expositionNetteParFacteur: trier(parFacteur),
    expositionBruteParFacteur: trier(brutFacteur),
    expositionParDevise: trier(parDevise),
    expositionParPoche: trier(parPoche)
  });
}
// Impact d'un gap sur la valeur nette : amplitude × exposition × levier.

function Fn_ImpactGap(p, amplitudePct) {

/* ================================================================
   ÉTAGE 4 — LE CALENDRIER, PRODUIT CENTRAL
   ----------------------------------------------------------------
   ~80 % de ce calendrier est ALGORITHMIQUE : les dates de résultats et de
   détachement sont des faits collectés une fois par semaine ; les
   événements dérivés d'une règle (ajustement de barrière à l'ex-dividende,
   échéance d'ordre, franchissement de seuil de marge, revue périodique)
   sont déterministes ; la sévérité pour LA position — amplitude ×
   exposition × levier → impact en euros et en % de la valeur nette — est
   un calcul. L'application génère donc le SQUELETTE des huit semaines ;
   le desk n'écrit que les trois textes.
   ÉCONOMIE DÉCISIVE : chaque événement porte texteEcritLe et l'empreinte
   des chiffres qui l'ont motivé. Le desk ne traite QUE les événements sans
   texte, ou dont les chiffres ont matériellement bougé. En v2, tout le
   calendrier était repayé à chaque appel.
   ================================================================ */
function Fn_SevDepuisImpact(pctVN) {
  const v = Math.abs(Fn_Num(pctVN) || 0);
  if (v >= 5) return 'Crit';
  if (v >= 2) return 'Warn';
  return 'Info';
}
// Empreinte des chiffres qui motivent un événement. Si elle change, les textes
// sont marqués à refaire ; sinon ils ne repartent jamais au modèle.
function Fn_EmpreinteEvenement(ev) {
  return (ev.metriques || []).map(m => String(m.l) + '=' + String(m.v)).join('|').slice(0, 400);
}
function Fn_TextesAEcrire(ev) {
  if (!ev.textes || !ev.textes.surv || !ev.textes.prat) return true;
  if (!ev.textes.empreinte) return true;
  return ev.textes.empreinte !== Fn_EmpreinteEvenement(ev);

/* CYCLE DE VIE.
   prévu ──(J−n)──> imminent ──(date passée)──> ÉCHU ──> débriefé
                                                  └──> classé sans suite
   Seuls prévu, imminent et échu entrent dans le contexte envoyé au modèle.
   « ÉCHU » est un état ACTIF : l'événement remonte en tête du calendrier dans
   un bandeau « à débriefer » et y reste tant que l'utilisateur n'a pas tranché,
   réapparaissant le lendemain. C'est ce cycle qui empêche les 132 événements de
   se reformer. */
function Fn_MajStatutsCalendrier() {
  const seuil = Fn_Num(Var_State.seuils.horizonImminentJours) || 5;
  let change = 0;
  Var_State.calendrier.forEach(e => {
    if (e.statut === 'debriefe' || e.statut === 'classe') return;
    const j = Fn_JoursDepuis(e.date);
    let n;
    if (j == null) n = e.statut || 'prevu';
    else if (j < 0) n = 'echu';
    else if (j <= seuil) n = 'imminent';
    else n = 'prevu';
    if (n !== e.statut) { e.statut = n; change++; }
  });
  return change;
}
function Fn_CalendrierVif() {
  return Var_State.calendrier.filter(e => e.statut === 'prevu' || e.statut === 'imminent' || e.statut === 'echu');

/* GÉNÉRATION DU SQUELETTE. Idempotente : un événement déjà présent est
   RAFRAÎCHI (métriques, sévérité) et non recréé — ses textes de desk sont
   conservés, et seule une variation matérielle des chiffres les marque à
   refaire. Un événement supprimé à la main réapparaîtra si sa règle est
   toujours vraie : c'est voulu, la règle est la source. */
function Fn_PoserEvenement(ev) {
  const existant = Var_State.calendrier.find(e => e.id === ev.id);
  if (!existant) {
    ev.textes = ev.textes || { surv: '', arb: '', prat: '', texteEcritLe: null, empreinte: null };
    ev.debrief = null;
    Var_State.calendrier.push(ev);
    return 'nouveau';
  }
  if (existant.statut === 'debriefe' || existant.statut === 'classe') return 'archive';
  existant.date = ev.date;
  /* MÉTRIQUES : la règle fait foi sur SES libellés, mais le desk a pu en AJOUTER
     (clé « m » de son livrable). Les écraser en bloc ne les perdait pas seulement :
     l'empreinte changeait, l'événement repassait pour « à réécrire » et repartait
     au desk — donc se repayait — à CHAQUE régénération du squelette, c'est-à-dire
     à chaque analyse des entrées. C'était le contraire exact de l'économie que
     l'empreinte est censée produire. */
  const ajoutees = (existant.metriques || []).filter(m => !(ev.metriques || []).some(x => x.l === m.l));
  existant.metriques = (ev.metriques || []).concat(ajoutees);
  existant.sev = ev.sev;
  existant.libelle = ev.libelle;
  existant.court = ev.court;
  existant.tags = ev.tags;
  existant.isin = ev.isin || existant.isin;

        tags: [nom.slice(0, 12), 'LEVIER', 'REVUE'],
        metriques: [
          met('portage mensuel', Fn_FmtEur(pr.portageMensuel, 0) + ' [calcul : dérive quotidienne du financement × exposition × 30]'),
          met('coût annualisé', pctAn != null ? Fn_FmtPct(pctAn, 2) + ' de la valeur nette [calcul]' : manquant('valeur nette')),
          met('observations de barrière disponibles', String((pr.histBarriere || []).length) + ' [chaque analyse des entrées en ajoute une]')
        ] });
    }
    // RÈGLE 5 — thèse périmée par une publication postérieure à la dernière revue.
    const th = Var_State.theses[p.id];
    if (th && th.derniereRevue && p.desk && p.desk.revue && p.desk.ts && Fn_DateISO(new Date(p.desk.ts)) > th.derniereRevue) {
      poser({ id: 'these-' + Fn_Slug(p.id) + '-' + Fn_DateISO(new Date(p.desk.ts)), isin: p.id, date: auj, statut: 'imminent',
        source: 'regle:these', libelle: 'Thèse périmée par une publication — ' + nom,
        court: 'Thèse à revoir', sev: 'Warn', conf: true,
        tags: [nom.slice(0, 12), 'THÈSE'],
        metriques: [
          met('dernière revue déclarée', Fn_FmtDateCourt(th.derniereRevue)),
          met('revue d’analyste disponible', 'oui, du ' + Fn_FmtDateCourt(Fn_DateISO(new Date(p.desk.ts))) + ' — onglet Cours & tendances'),
          met('exposition concernée', expoTxt)
        ] });
    }
  });
  // RÈGLE 6 — ordre en attente : vigilance d'exécution, et échéance de validité.
  Var_State.ordres.forEach(o => {
    const jours = o.ts ? Math.floor((Date.now() - o.ts) / 86400000) : 0;
    /* L'IDENTIFIANT NE PORTE PLUS LA DATE DU JOUR. Un ordre encore vivant est le
       MÊME événement d'un jour sur l'autre : le dater du jour en créait un nouveau
       à chaque analyse et faisait basculer le précédent en « échu », donc à
       débriefer, donc à REPAYER — pour un ordre qui n'avait pas bougé d'un
       centime. Le calendrier se remplissait de doublons périmés, et l'utilisateur
       retrouvait chaque matin un calendrier « vide » où tout était échu.
       L'événement est reposé à chaque analyse, ce qui rafraîchit sa date tant que
       l'ordre vit ; le jour où l'ordre disparaît de la capture il cesse d'être
       reposé, passe échu, et demande alors à bon droit ce qu'il est devenu. */
    const id = 'ordre-' + Fn_Slug((o.nom || '') + '-' + (o.sens || '') + '-' + (o.limite || ''));
    poser({ id, isin: null, date: auj, statut: 'imminent', source: 'regle:ordre',
      libelle: 'Ordre en attente — ' + (o.sens || '') + ' ' + (o.nom || 'instrument non identifié'),
      court: 'Ordre en attente', sev: jours > 5 ? 'Warn' : 'Info', conf: true,
      tags: ['ORDRES'],
      metriques: [
        met('montant de l’ordre', o.montantEur != null ? Fn_FmtEur(o.montantEur, 0) : (o.qte != null && o.limite != null ? Fn_FmtEur(o.qte * o.limite, 0) + ' [calcul : quantité × limite]' : manquant('montant ou limite'))),
        met('ancienneté', jours + ' jour(s) depuis le collage qui l’a fait apparaître'),
        met('effet sur la marge si exécuté', Var_State.marge && Fn_Num(Var_State.marge.libre) != null && o.montantEur != null
          ? 'marge disponible ' + Fn_FmtEur(Var_State.marge.libre, 0) + ' → ' + Fn_FmtEur(Fn_Num(Var_State.marge.libre) - Fn_Num(o.montantEur), 0) + ' [calcul]'
          : manquant('marge disponible ou montant de l’ordre'))
      ] });
  });
  /* RÈGLE 6 bis — ANNONCE ATTENDUE AVANT L'EXÉCUTION D'UN ORDRE.
     C'est le point aveugle que rien ne couvrait : la règle des publications ne
     parcourt que les POSITIONS, si bien qu'un ordre d'achat sur un titre qu'on ne
     détient pas encore ne déclenchait rien. Acheter la veille d'une publication
     est pourtant la façon la plus banale de subir un écart de cours qu'on n'a pas
     choisi — et l'ordre, lui, est déjà chez le courtier.
     La date vient de la position quand le titre est déjà détenu, sinon de
     l'agenda collecté pour l'instrument visé. */
  Var_State.ordres.forEach(o => {
    if (!o.nom) return;
    const cle = Fn_NomAgenda(o.nom);
    const pos = Var_State.positions.find(x => Fn_NomAgenda(x.detention.nom) === cle);
    const src = pos ? { pubDate: pos.consensus && pos.consensus.pubDate, exDiv: pos.valo && pos.valo.exDiv }
      : (Var_State.agenda[cle] || {});
    [['pubDate', 'Publication de résultats', 'RÉSULTATS'], ['exDiv', 'Détachement de dividende', 'DIVIDENDE']].forEach(q => {
      const d = src[q[0]];
      if (!d || d < auj || d > fin) return;
      const jours = Fn_JoursDepuis(d);
      poser({ id: 'ordre-annonce-' + Fn_Slug((o.nom || '') + '-' + (o.sens || '')) + '-' + q[0] + '-' + d,
        isin: pos ? pos.id : null, date: d, statut: 'prevu', source: 'regle:ordre-annonce',
        libelle: q[1] + ' AVANT exécution d’un ordre — ' + o.nom,
        court: ('Annonce/ordre ' + String(o.nom).slice(0, 14)).slice(0, 28),
        sev: q[0] === 'pubDate' ? 'Warn' : 'Info', conf: true,
        tags: [String(o.nom).slice(0, 12), 'ORDRES', q[2]],
        metriques: [
          met('ordre concerné', (o.sens || '') + ' ' + (o.qte != null ? Fn_FmtNb(o.qte, 0) + ' × ' : '')
            + (o.limite != null ? Fn_FmtNb(o.limite, 2) : '—')
            + (o.montantEur != null ? ' soit ' + Fn_FmtEur(o.montantEur, 0) : '')),
          met('délai avant l’annonce', jours != null ? jours + ' jour(s)' : manquant('date lisible')),
          met('validité de l’ordre', o.validite || manquant('validité lue sur l’écran des ordres')),
          met('ce que cela change', q[0] === 'pubDate'
            ? 'un ordre à cours limite peut être exécuté sur l’écart d’ouverture qui suit la publication : décider AVANT si l’on veut être servi sur cette annonce, ou décaler l’ordre'
            : 'le cours s’ajuste à la baisse du montant détaché [règle de place] : une limite placée juste sous le cours peut être touchée mécaniquement'),
          met('titre déjà détenu', pos ? 'oui — ' + Fn_FmtPct(Fn_Num(pos.detention.pctVN), 1) + ' de la valeur nette' : 'non, l’ordre ouvrirait une ligne nouvelle')
        ] });
    });
  });
  // RÈGLE 7 — franchissement du seuil de marge : événement immédiat, sévérité maximale.
  const m = Var_State.marge;
  if (m && m.coussinPct != null && m.coussinPct < Fn_Num(s.coussinRouge)) {
    const parPoche = Fn_PositionsParPoche();
    const plan = Cst_OrdreReduction.filter(c => (parPoche[c] || []).length);
    poser({ id: 'marge-' + auj, isin: null, date: auj, statut: 'imminent', source: 'regle:marge',
      libelle: 'Coussin de marge sous le seuil professionnel', court: 'Coussin de marge bas', sev: 'Crit', conf: true,
      tags: ['MARGE'],
      metriques: [
        met('coussin de marge', Fn_FmtPct(m.coussinPct, 1) + ' [calcul : marge disponible ÷ valeur liquidative] — seuil rouge ' + Fn_FmtPct(s.coussinRouge, 0)),
        met('levier brut', m.levier != null ? Fn_FmtX(m.levier) + ' [calcul : valeur des titres ÷ valeur liquidative]' : manquant('valeur des titres')),
        met('plan de réduction ordonné', plan.length
          ? plan.map((c, i) => (i + 1) + '. ' + c + ' (' + parPoche[c].map(p => Fn_FmtEur(p.detention.valEur, 0)).join(' + ') + ')').join(' → ')
          : manquant('poches attribuées aux lignes'))
      ] });
  }
  Fn_MajStatutsCalendrier();
  return bilan;
}
/* RÈGLES PERMANENTES — recalculées depuis les données réelles. Ce sont des
   lectures continues, distinctes du calendrier qui, lui, est daté. */
/* RÈGLES PERMANENTES — ce que l'application décide À PARTIR de vos chiffres, et
   que personne d'autre n'affiche.
   Ce panneau montrait aussi le coussin, le levier, l'exposition par facteur et
   par devise, la distance à la barrière de chaque produit et le cycle de vie du
   calendrier. Tous ont un foyer ailleurs, mieux outillé : la Discipline pour les
   indicateurs à seuil, la fiche de ligne de l'onglet Cours pour la barrière et le
   portage d'un produit, l'étage ④ des Paramètres pour le cycle de vie. Les
   répéter ici obligeait à tenir plusieurs versions du même chiffre d'accord, et
   c'est exactement ce qu'une revue de code doit supprimer.
   Ne restent que les DEUX choses qui n'existent nulle part ailleurs : l'ORDRE
   dans lequel réduire, et la PROVENANCE datée du bloc de marge. */
function Fn_ReglesPermanentes() {
  const regles = [];
  const m = Var_State.marge;
  const parPoche = Fn_PositionsParPoche();
  const plan = Cst_OrdreReduction.filter(c => (parPoche[c] || []).length);
  let h = plan.length
    ? '<div>' + plan.map((c, i) => (i + 1) + '. <b>' + Fn_Esc(c) + '</b> ('
      + parPoche[c].map(p => Fn_Esc(String(p.detention.nom || '').slice(0, 18)) + ' ' + Fn_Esc(Fn_FmtEur(p.detention.valEur, 0))).join(', ') + ')').join(' → ') + '.</div>'
      + '<div class="tres-petit muted">Décidé à froid, pour n’avoir pas à le décider sous contrainte : si le coussin de marge passe au rouge, c’est dans cet ordre que les lignes s’allègent, en commençant par ce qui coûte le moins cher à la thèse.</div>'
    : '<div class="muted">Plan de réduction : établi dès que les lignes porteront une poche, attribuée au prochain jugement de desk. Sans poches, aucun ordre de réduction ne peut être décidé à froid.</div>';
  regles.push({ titre: 'Plan de réduction — l’ordre décidé à froid', html: h });
  let hp = m
    ? '<div>Bloc de marge lu à <b class="mono">' + Fn_Esc(m.as || 'heure absente de la capture')
      + '</b>, intégré le ' + Fn_Esc(Fn_FmtHeure(m.ts)) + '.</div>'
      + '<div class="tres-petit muted">C’est cette heure, et non celle de l’analyse, qui date la valeur liquidative, le coussin et le levier affichés dans l’onglet Discipline. Un écart de plusieurs heures avec les cours des lignes explique la plupart des incohérences apparentes.</div>'
    : '<div>Bloc de marge : <b>absent</b>. La valeur nette est alors la somme des lignes — liquidités et dette non incluses — et tout pourcentage de valeur nette est approché.</div>'
      + '<div class="tres-petit muted">Il n’est à l’écran du courtier que si le bandeau « Aperçu de la marge disponible » a été ouvert avant la capture.</div>';
  // Les taux de change eux-mêmes vivent à l'étage ① des Paramètres, qui les
  // déduit : ici, seul leur EXISTENCE compte pour dater les valeurs en euros.
  hp += Var_State.fx
    ? '<div class="tres-petit muted">Valeurs en euros converties aux taux déduits de l’export du '
      + Fn_Esc(Fn_FmtDateCourt(Fn_DateISO(new Date(Var_State.fx.ts)))) + ' (Paramètres → ① Acquisition).</div>'
    : '<div class="tres-petit muted">Aucun taux de change déduit : toute ligne en devise étrangère reste sans valeur en euros tant que l’export n’est pas joint.</div>';
  regles.push({ titre: 'Provenance et datation des chiffres', html: hp });
  return regles;
}

/* ================================================================
   DISCIPLINE — indicateurs reconstruits
   ----------------------------------------------------------------
   Trois indicateurs de la version précédente étaient muets en permanence.
   Diagnostic : ce n'était pas un manque de données, c'était un défaut de
   conception — ils mesuraient une structure de couverture qui n'existe pas
   dans ce portefeuille (un produit short sans jambe longue correspondante,
   l'autre ligne du même secteur portant un émetteur différent). Le ratio
   était mathématiquement indéfini ; il ne se serait jamais allumé.
   Ils sont remplacés par l'EXPOSITION DIRECTIONNELLE NETTE, qui vit tous
   les jours, et la couverture des indicateurs se mesure désormais en % de
   valeur nette et non en % de lignes : quatre petites lignes sans multiples
   suffisaient à éteindre un indicateur alors que trois lignes portent
   l'essentiel de la valeur.
   RÈGLE CONSERVÉE : un indicateur « — » est EXCLU du score, jamais compté
   zéro, et affiche la donnée manquante et le moyen de l'obtenir.
   ================================================================ */
function Fn_Couverture(mesure, base) {
  const m = Fn_Num(mesure), b = Fn_Num(base);
  if (m == null || b == null || b <= 0) return null;
  return Math.max(0, Math.min(100, m / b * 100));
}
// Applique le plancher de couverture. La VALEUR reste affichée : c'est le
// VERDICT qui tombe, pas la donnée.
function Fn_AppliquerCouverture(couv, zone, manquant, quoiManque) {
  if (couv == null || couv >= Cst_CouvertureMin) return { zone, manquant, couverture: couv };
  return {
    zone: null, couverture: couv,
    manquant: (manquant ? manquant + ' · ' : '') + quoiManque + ' — mesuré sur ' + Fn_FmtPct(couv, 0)
      + ' de la base seulement, sous le plancher de ' + Cst_CouvertureMin + ' % : aucun verdict n’est rendu sur une fraction aussi mince'
  };
}
function Fn_IndicateursDiscipline() {
  // Mémorisé comme le profil : le héros, la discipline et le score les demandent
  // tous les trois, et le calcul parcourt le portefeuille entier.
  const rt = Var_State._runtime;
  if (rt.memoInds) return rt.memoInds;
  const s = Var_State.seuils;
  const m = Var_State.marge;
  const vnObj = Fn_ValeurNette();
  const prof = Fn_ProfilExposition();
  const pos = Var_State.positions;
  const inds = [];
  const rien = !pos.length;
  const manquePortefeuille = 'les entrées du jour (coller l’écran des positions, puis « Analyser les entrées » — cela ne coûte rien)';
  const pousser = o => inds.push(o);

  /* ---- BLOC EXPOSITION ---- */
  // 1. Exposition nette par facteur — remplace le ratio de couverture par poche.
  (function () {
    let valeur = null, aff = '—', zone = null, manquant = null, extra = '', couverture = null;
    if (rien) manquant = manquePortefeuille;
    else {
      const classees = pos.filter(p => (p.detention.facteurs || []).length);
      const nets = prof.expositionNetteParFacteur.filter(f => f.cle !== 'non classé' && f.pctVN != null);
      if (!nets.length) manquant = 'facteurs de risque par ligne — attribués au prochain jugement de desk, ou à la main sur la fiche de la ligne';
      else {
        const pire = nets.slice().sort((a, b) => Math.abs(b.pctVN) - Math.abs(a.pctVN))[0];
        valeur = Math.abs(pire.pctVN);
        aff = Fn_FmtPct(pire.pctVN, 1) + ' (' + pire.cle + ')';
        zone = Fn_ZoneSeuil(valeur, s.expoFacteurVert, s.expoFacteurRouge, 'haut');
        const c = Fn_AppliquerCouverture(
          Fn_Couverture(classees.reduce((a, p) => a + Math.abs(Fn_Num(p.detention.pctVN) || 0), 0),
            pos.reduce((a, p) => a + Math.abs(Fn_Num(p.detention.pctVN) || 0), 0)),
          zone, null, classees.length + ' ligne(s) portant un facteur sur ' + pos.length);
        zone = c.zone; couverture = c.couverture;
        if (c.manquant) manquant = c.manquant;
        extra = nets.slice(0, 6).map(f => Fn_Esc(f.cle) + ' <b class="mono">' + Fn_Esc(Fn_FmtPct(f.pctVN, 1)) + '</b>').join(' · ')
          + '<br><span class="muted">Exposition NETTE : une jambe short du même facteur compense une jambe longue. C’est ce qui reste après compensation qui porte le risque.</span>';
      }
    }
    pousser({ bloc: 'EXPOSITION', nom: 'Exposition nette par facteur', valeurAff: aff, zone, manquant, extra, couverture,
      jauge: Fn_JaugeHtml(valeur == null ? null : valeur, [{ cls: 'ok', w: s.expoFacteurVert }, { cls: 'warn', w: s.expoFacteurRouge - s.expoFacteurVert }, { cls: 'crit', w: 100 - s.expoFacteurRouge }]),
      seuils: 'vert ≤ ' + s.expoFacteurVert + ' % · ambre ' + s.expoFacteurVert + '–' + s.expoFacteurRouge + ' % · rouge > ' + s.expoFacteurRouge + ' % VN',
      pratique: 'Des lignes corrélées constituent UNE exposition, pas plusieurs : le facteur dominant se pilote comme une position unique, et se réduit avant d’être couvert.' });
  })();
  // 2. Jambe directionnelle sans contrepartie — remplace le risque d'exécution
  //    de la couverture. Un short sur un facteur où aucune jambe longue n'existe
  //    n'est pas une couverture : c'est un pari autonome, et il doit le dire.
  (function () {
    let valeur = null, aff = '—', zone = null, manquant = null, extra = '';
    if (rien) manquant = manquePortefeuille;
    else {
      /* CE QUI EST MESURÉ : la part de la valeur nette portée par des positions
         SHORT qui ne compensent rien. C'est le sujet — un short sans jambe
         longue en face n'est pas une couverture, c'est un second pari.
         Deux erreurs corrigées ici, et elles se cumulaient :
         1. On sommait des POURCENTAGES PAR FACTEUR. Une ligne porte trois à cinq
            facteurs et pèse dans chacun : sa taille était donc comptée autant de
            fois qu'elle a de facteurs. Le total dépassait structurellement 100 %
            (573 % relevés sur un portefeuille à 1,66 de levier) et se comparait
            à un seuil rouge de 25 % — rouge à jamais, donc muet.
         2. On sommait les jambes LONGUES avec les autres. Un portefeuille sans
            aucun short sortait « sans contrepartie » à hauteur de son exposition
            brute, ce qui ne dit rien, pendant que le seul vrai short du
            portefeuille — sans facteur attribué — n'était pas compté du tout.
         Une ligne compte donc UNE fois, et seules les lignes short comptent. */
      const compense = {};
      prof.expositionNetteParFacteur.forEach(f => {
        if (f.cle === 'non classé' || f.pctVN == null) return;
        const brut = (prof.expositionBruteParFacteur.find(x => x.cle === f.cle) || {}).pctVN;
        if (brut == null || brut === 0) return;
        // Compensation nulle = facteur nu : |net| égal au brut.
        compense[f.cle] = (1 - Math.abs(f.pctVN) / Math.abs(brut)) >= 0.05;
      });
      const shorts = prof.lignes.filter(l => l.sens === 'short' && l.pctVN != null);
      const sansFacteur = shorts.filter(l => !(l.facteurs && l.facteurs.length));
      const jugeables = shorts.filter(l => l.facteurs && l.facteurs.length);
      const nues = jugeables.filter(l => !l.facteurs.some(f => compense[f]));
      const nom20 = l => Fn_Esc(String(l.nom || '').slice(0, 20));
      if (!shorts.length) {
        valeur = 0;
        aff = '0 % — aucune position short';
        zone = Fn_ZoneSeuil(0, s.jambeNueVert, s.jambeNueRouge, 'haut');
        extra = 'Aucune jambe short dans le portefeuille : la question de la couverture ne se pose pas encore.';
      } else if (sansFacteur.length && !jugeables.length) {
        /* Jamais compté zéro : sans facteurs, on ne peut pas dire si le short
           couvre quelque chose. La lacune s'affiche, avec le moyen de la combler. */
        manquant = 'facteurs de risque sur ' + sansFacteur.map(nom20).join(', ')
          + ' — attribués au prochain jugement de desk, sans quoi il est impossible de dire si ce short couvre une jambe longue ou parie seul';
      } else {
        valeur = nues.reduce((a, l) => a + Math.abs(l.pctVN), 0);
        aff = Fn_FmtPct(valeur, 1) + ' de la VN en short non couvrant';
        zone = Fn_ZoneSeuil(valeur, s.jambeNueVert, s.jambeNueRouge, 'haut');
        extra = (nues.length
          ? 'Shorts sans jambe longue en face : ' + nues.map(l => nom20(l) + ' ' + Fn_Esc(Fn_FmtPct(Math.abs(l.pctVN), 1))).join(' · ')
          : 'Chaque short trouve au moins une jambe longue sur l’un de ses facteurs.')
          + (sansFacteur.length ? '<br>Hors calcul faute de facteurs : ' + sansFacteur.map(nom20).join(', ')
            + ' — attribués au prochain jugement de desk.' : '')
          + '<br><span class="muted">Un produit short sans jambe longue correspondante n’est pas une couverture : c’est un pari directionnel autonome, qui doit porter sa propre thèse, son invalidation et son horizon.</span>';
      }
    }
    pousser({ bloc: 'EXPOSITION', nom: 'Jambe directionnelle sans contrepartie', valeurAff: aff, zone, manquant, extra,
      jauge: Fn_JaugeHtml(valeur == null ? null : valeur, [{ cls: 'ok', w: s.jambeNueVert }, { cls: 'warn', w: s.jambeNueRouge - s.jambeNueVert }, { cls: 'crit', w: 100 - s.jambeNueRouge }]),
      seuils: 'vert ≤ ' + s.jambeNueVert + ' % · rouge > ' + s.jambeNueRouge + ' % VN',
      pratique: 'Nommer une position « couverture » ne la rend pas couvrante : sans jambe opposée sur le MÊME sous-jacent, elle double le nombre de paris au lieu de réduire le risque.' });
  })();
  // 3. Exposition devise non couverte.
  (function () {
    let valeur = null, aff = '—', zone = null, manquant = null, extra = '';
    if (rien) manquant = manquePortefeuille;
    else {
      const hors = prof.expositionParDevise.filter(d => d.cle !== 'EUR' && d.pctVN != null);
      if (!hors.length && !prof.valeurNetteEur) manquant = 'valeur nette (coller le bloc « espace libre » avec les positions)';
      else {
        valeur = hors.reduce((a, d) => a + Math.abs(d.pctVN), 0);
        aff = Fn_FmtPct(valeur, 1) + ' de la VN hors euro';
        zone = Fn_ZoneSeuil(valeur, s.deviseVert, s.deviseRouge, 'haut');
        extra = hors.length
          ? hors.map(d => Fn_Esc(d.cle) + ' <b class="mono">' + Fn_Esc(Fn_FmtPct(d.pctVN, 1)) + '</b>').join(' · ')
            + (Var_State.fx ? '<br><span class="muted">Taux déduit de l’export du ' + Fn_Esc(Fn_FmtDateCourt(Fn_DateISO(new Date(Var_State.fx.ts)))) + ' (montant en euros ÷ montant en devise) — aucune interrogation de service de change.</span>' : '')
          : 'Aucune ligne hors euro.';
      }
    }
    pousser({ bloc: 'EXPOSITION', nom: 'Exposition devise non couverte', valeurAff: aff, zone, manquant, extra,

    if (!liste.length) return;
    const w = Cst_PoidsBlocs[b] / liste.length;
    liste.forEach(i => { somme += w * (i.zone === 'ok' ? 100 : i.zone === 'warn' ? 50 : 0); poids += w; });
  });
  if (!poids) return null;
  return Math.round(somme / poids);
}

// État de santé d'un appel — répond à la seule question qui compte quand l'écran
// ne bouge plus : « est-ce que ça avance, ou est-ce planté ? ». Le statut persisté
// ne suffit pas : un appel dont l'onglet a été rechargé reste « en cours » dans
// l'état alors que plus rien ne tourne.
function Fn_MajSante(journal) {
  const rt = Var_State._runtime;
  if (!journal || journal.statut !== 'en cours') return null;
  if (!rt.enCours) return { cls: 'badge-crit', txt: '✗ plus aucun appel ne tourne dans cet onglet — relancer' };
  const sig = rt.dernierSignal;
  if (!sig) return { cls: 'badge-info', txt: '⟳ appel en cours — pont sans flux : pas de suivi seconde par seconde' };
  const s = Math.round((Date.now() - sig) / 1000);
  if (document.hidden) return { cls: 'badge-info', txt: '⟳ en cours — onglet en arrière-plan, surveillance suspendue' };
  if (s < 45) return { cls: 'badge-ok', txt: '✓ tout se passe normalement — flux actif (' + s + ' s)' };
  if (s < 120) return { cls: 'badge-info', txt: '⏳ silence de ' + s + ' s — normal pendant une recherche web ou une phase de réflexion' };
  if (s < 300) return { cls: 'badge-warn', txt: '⚠ silence de ' + Math.floor(s / 60) + ' min ' + (s % 60) + ' s — le flux est peut-être rompu' };
  return { cls: 'badge-crit', txt: '✗ silence de plus de 5 min — coupure automatique imminente' };
}
// L'avancement se lit sur les ÉTAPES FRANCHIES, jamais sur le temps écoulé : une
// barre qui progresse toute seule pendant qu'un appel est mort donnerait
// exactement la fausse assurance qu'on cherche à supprimer.
function Fn_HtmlFluxMAJ(journal) {
  const phases = journal.phases || [];
  if (!phases.length) return '';
  const faites = phases.filter(p => p.statut === 'ok').length;
  const enCours = phases.filter(p => p.statut === 'en cours').length;
  const echec = phases.some(p => p.statut === 'echec');
  const pct = Math.round(Math.min(100, (faites + enCours * 0.5) / phases.length * 100));
  const clsJauge = echec ? ' f-echec' : (faites === phases.length ? ' f-ok' : '');
  let h = '<div class="flux-barre"><div class="flux-jauge' + clsJauge + '" style="width:' + pct + '%"></div></div>'
    + '<div class="tres-petit muted" style="margin:-2px 0 6px">Avancement : <b class="mono">' + faites + '/' + phases.length + '</b> étape(s) franchie(s)'
    + (echec ? ' · <b style="color:var(--crit)">arrêt sur échec</b>' : (enCours ? ' · <b style="color:var(--accent)">1 en cours</b>' : '')) + '</div><div class="flux">';
  phases.forEach(p => {
    const ico = p.statut === 'ok' ? '✓' : (p.statut === 'echec' ? '✗' : (p.statut === 'en cours' ? '◌' : '·'));
    const cls = p.statut === 'ok' ? ' f-ok' : (p.statut === 'echec' ? ' f-echec' : (p.statut === 'en cours' ? ' f-encours' : ''));
    h += '<span class="flux-etape' + cls + '" title="' + Fn_Esc(p.message || '') + '"><span class="f-ico">' + ico + '</span>' + Fn_Esc(p.cle) + '</span>';
  });
  return h + '</div>';
}
function Fn_HtmlBilanTraitement(journal) {

  const cases = [
    ['textes d’événements', d.textes], ['débriefs', d.debriefs], ['découvertes nouvelles', d.decNouvelles],
    ['découvertes déjà vues', d.decConnues], ['profils attribués', d.profils], ['actions proposées', d.actions],
    ['blocs de valorisation', d.valo], ['blocs de consensus', d.consensus]
  ].filter(c => Fn_Num(c[1]) != null);
  if (!cases.length) return '';
  return '<div class="bilan-trait">' + cases.map(c =>
    '<div class="bt"><div class="bt-n">' + c[1] + '</div><div class="bt-lib">' + Fn_Esc(c[0]) + '</div></div>').join('') + '</div>';
}
/* PROJECTION AVANT LANCEMENT. Calée sur les appels réellement facturés, jamais
   sur un barème théorique. Sans historique : AUCUN montant n'est affiché — une
   estimation fabriquée serait pire que pas d'estimation du tout. */
function Fn_ProjectionAppel(passe, unites) {
  const n = Math.max(0, Math.round(Fn_Num(unites) || 0));
  const refs = (Var_State.majJournaux || []).filter(j => j && j.coutUsd != null && j.statut !== 'echec'
    && j.passe === passe && Fn_Num(j.unites) > 0).slice(0, 3);
  let parUnite = null;
  if (refs.length) parUnite = refs.reduce((a, j) => a + (Fn_Num(j.coutUsd) || 0) / Fn_Num(j.unites), 0) / refs.length;
  return { unites: n, parUnite, nbRefs: refs.length, cout: parUnite == null ? null : parUnite * n };
}
function Fn_HtmlProjection(passe, unites, budget, libUnite) {
  const p = Fn_ProjectionAppel(passe, unites);
  let t = 'Budget de recherche calculé pour cet appel : <b class="mono">' + budget.recherches
    + '</b> recherches et <b class="mono">' + budget.lectures + '</b> pages, déduit de ' + p.unites + ' ' + libUnite + ' — aucun plafond fixe.';
  if (p.cout != null) {
    t += ' Sur la base des ' + p.nbRefs + ' dernier(s) appel(s) de même nature, soit <b class="mono">'
      + Fn_FmtUsd(Math.round(p.parUnite * 100) / 100) + '</b> par ' + libUnite.replace(/s$/, '')
      + ', celui-ci devrait coûter de l’ordre de <b class="mono">' + Fn_FmtUsd(Math.round(p.cout * 100) / 100) + '</b>.';
  } else {
    t += ' Aucun appel de référence : le coût ne peut pas être projeté honnêtement. Il s’affichera en direct pendant l’appel.';
  }
  t += ' Le nombre de recherches FACTURÉES peut dépasser ce budget : le plafond transmis borne les appels d’outil, pas la facturation.';
  return '<div class="note note-info tres-petit" style="margin-top:8px">' + t + '</div>';
}
// Ce que le desk aura à faire : c'est ce décompte, et lui seul, qui détermine le
// budget. Zéro événement sans texte et zéro échu = un appel très court.
function Fn_ChargeDesk() {
  const sansTexte = Fn_CalendrierVif().filter(e => e.statut !== 'echu' && Fn_TextesAEcrire(e));
  const aDebriefer = Fn_ADebriefer().filter(e => e.debriefDemande && !e.debrief);
  const sansProfil = Var_State.positions.filter(p => !p.desk.profil);
  return { sansTexte, aDebriefer, sansProfil,
    unites: sansTexte.length + aDebriefer.length * 2 + Cst_DecouvertesVisees };
}
/* CE QUE LE DESK SAIT DÉJÀ DE VOS REVUES. Une mise à jour est une RÉÉVALUATION,
   pas un premier avis : le desk reçoit son propre jugement précédent ligne par
   ligne, les arbitrages que vous avez acceptés ou rejetés, vos déclarations de
   thèse et la liste des découvertes déjà vues. Sans cette mémoire il redécouvrait
   à chaque appel, et reproposait un arbitrage déjà rejeté — qu'il fallait rejeter
   de nouveau, et repayer. Ces champs coûtent quelques milliers de jetons d'entrée,
   mis en cache : c'est l'économie la plus rentable du cycle. */
function Fn_MemoireDesk() {
  const th = Var_State.theses || {};
  return {
    jugees: Var_State.positions.filter(p => p.desk && (p.desk.these || p.desk.tend || p.desk.valoRef)).length,
    arbitrages: Var_State.actions.filter(a => a.statut !== 'a_valider').length,
    theses: Object.keys(th).filter(k => th[k] && (th[k].ecrite || th[k].invalidation || th[k].objectif)).length,
    decouvertes: Math.min(Var_State.decouvertes.length, 20)
  };
}
/* Une passe d'enrichissement peut rentrer BREDOUILLE sur une ligne : le modèle
   n'a pas trouvé le référentiel, ou la date de publication. L'horodatage était
   posé quand même, et la ligne sortait alors de la sélection pour une semaine
   entière — la lacune se figeait sans que rien ne la montre. Une ligne dont la
   valorisation reste inexploitable est donc reproposée, exactement comme une
   ligne périmée. Le nombre de lignes et le budget sont affichés avant l'appel :
   c'est vous qui décidez de le relancer, jamais l'application. */
/* TOUTE LIGNE DÉTENUE EST SUIVIE. Le traitement allégé se disait « agenda
   seulement » — et n'en collectait aucun : les lignes sous le seuil de
   matérialité étaient purement exclues de la passe. Une ligne de 1 % qui publie
   dans trois jours reste une ligne dont on veut connaître la date, et son
   consensus ne coûte pas plus cher que celui d'une autre. Le niveau continue de
   régler la profondeur du JUGEMENT ; il ne prive plus personne de données.
   Les produits à levier restent hors sélection : leurs multiples propres n'ont
   aucun sens. C'est leur SOUS-JACENT qui est suivi, par l'agenda. */
function Fn_LignesAEnrichir() {
  return Var_State.positions.filter(p => {
    if (p.desk.niveau === 'derive') return false;
    return Fn_DonneePerimee(p.valo && p.valo.freshTs)
      || Fn_DonneePerimee(p.consensus && p.consensus.freshTs)
      || !Fn_ValoExploitable(p);
  });
}
/* LES INSTRUMENTS QUE L'ON NE DÉTIENT PAS ET DONT LA DATE COMPTE QUAND MÊME :
   le titre visé par un ordre en attente, et le sous-jacent d'un produit à levier.
   Dans les deux cas on ne veut qu'un agenda — pas de multiples, pas de consensus :
   il n'y a pas de position à valoriser. */
function Fn_NomAgenda(nom) { return Fn_Slug(Fn_NormNom(nom || '')).slice(0, 60); }
function Fn_AgendasAEnrichir() {
  const vus = {}, sortie = [];
  const detenu = {};
  Var_State.positions.forEach(p => { detenu[Fn_NomAgenda(p.detention.nom)] = true; });
  const ajouter = (nom, motif) => {
    const cle = Fn_NomAgenda(nom);
    if (!cle || vus[cle] || detenu[cle]) return;      // déjà suivi comme position
    const a = Var_State.agenda[cle];
    if (a && !Fn_DonneePerimee(a.ts)) return;         // agenda frais : jamais recollecté
    vus[cle] = true;
    sortie.push({ cle: cle, nom: String(nom).slice(0, 60), motif: motif });
  };
  Var_State.ordres.forEach(o => ajouter(o.nom, 'ordre en attente'));
  Var_State.positions.forEach(p => {
    if (p.produit && p.produit.type === 'derive' && p.produit.sousJacent) {
      ajouter(p.produit.sousJacent, 'sous-jacent de ' + String(p.detention.nom || p.id).slice(0, 24));
    }
  });
  return sortie;
}
/* ALERTE DU DERNIER APPEL. Placée EN TÊTE du panneau, et affichée MÊME PANNEAU
   FERMÉ. Le message d'échec ne vivait qu'au fond du journal, sous le budget,
   l'enrichissement et le bilan : il fallait ouvrir le panneau et faire défiler
   pour apprendre qu'un appel avait échoué, et pourquoi. Un échec doit se lire là
   où l'on clique pour relancer. Le message porte déjà son code et la conduite à
   tenir : il n'est pas reformulé ici, il est remonté. */
function Fn_HtmlAlerteAppel(journal) {
  if (!journal || journal.statut === 'en cours') return '';
  const echoue = journal.statut === 'echec' || journal.statut === 'interrompue';
  if (!echoue && !journal.tronque) return '';
  const titre = journal.statut === 'interrompue' ? 'Le dernier appel a été interrompu'
    : (echoue ? 'Le dernier appel a échoué' : 'La réponse du dernier appel a été tronquée');
  return '<div class="note ' + (echoue ? 'note-crit' : 'note-warn') + '" style="margin:6px 0 0">'
    + '<b>' + titre + '</b> · ' + Fn_Esc(Fn_FmtHeure(journal.debutTs))
    + ' · ' + Fn_Esc(journal.passe === 'enrichissement' ? 'enrichissement' : 'desk')
    + (Fn_Num(journal.coutUsd) ? ' · <b>' + Fn_Esc(Fn_FmtUsd(journal.coutUsd)) + ' facturés quand même</b>' : '')
    + '<div class="tres-petit" style="margin-top:4px">' + Fn_Gloss(Fn_Esc(journal.message || 'Aucun détail enregistré.')) + '</div>'
    + '</div>';

/* ---- Bandeau « à débriefer » : l'état ÉCHU est ACTIF ----

  if (!tous.length) { el.innerHTML = ''; return; }
  // Plafond d'AFFICHAGE seulement : rien n'est retiré de la file, les plus

    + (tous.length > echus.length ? '<div class="note note-warn tres-petit">' + (tous.length - echus.length)
      + ' autre(s) événement(s) échu(s) attendent derrière ceux-ci, du plus récent au plus ancien. Tranchez ceux-là pour voir les suivants.</div>' : '');
  echus.forEach(e => {
    const c = Fn_Compteur(e.date, false);

    h += '<div class="ev sev-' + Fn_Esc(e.sev) + '">'
      + '<div class="ev-haut"><span class="ev-date">' + Fn_Esc(Fn_FmtDate(e.date)) + ' · <span class="compteur ' + c.cls + '" data-compteur data-date="' + Fn_Esc(e.date) + '">' + Fn_Esc(c.label) + '</span></span>'
      + (e.debriefDemande ? '<span class="badge badge-info">débrief demandé — sera traité au prochain appel</span>' : '') + '</div>'
      + '<div class="ev-titre">' + Fn_Gloss(Fn_Esc(e.libelle)) + '</div>'

      + '<button class="btn btn-ok" data-action="ev-classer" data-id="' + Fn_Esc(e.id) + '">' + (e.debrief ? 'Archiver' : 'Classer sans suite') + '</button>'
      + '<button class="btn btn-danger' + (arme ? ' arme' : '') + '" data-action="ev-suppr" data-id="' + Fn_Esc(e.id) + '">' + (arme ? 'Confirmer ?' : 'Supprimer') + '</button>'

/* ---- Vue calendrier : les huit prochaines semaines ---- */
function Fn_RenderCalendrier() {
  const el = document.getElementById('v-cal');
  if (!el) return;
  const parJour = {};
  Fn_CalendrierVif().forEach(e => {
    if (!e.date) return;
    (parJour[e.date] = parJour[e.date] || []).push(e);
  });
  const debut = Fn_ParseDate(Fn_SemaineLundi(Fn_AujISO()));
  if (!debut) { el.innerHTML = ''; return; }
  const auj = Fn_AujISO();
  let h = '<div class="carte"><div class="carte-titre">Calendrier — ' + Cst_HorizonSemaines + ' semaines</div>'
    + '<div class="cal-entete">' + Cst_JoursSem.map(j => '<div>' + j + '</div>').join('') + '</div><div class="cal-grille">';
  for (let i = 0; i < Cst_HorizonSemaines * 7; i++) {
    const d = new Date(debut.getTime());
    d.setDate(d.getDate() + i);
    const iso = Fn_DateISO(d);
    const evs = parJour[iso] || [];
    const crit = evs.some(e => e.sev === 'Crit');
    const cls = ['cal-jour'];
    if (iso < auj) cls.push('cal-passe');
    if (iso === auj) cls.push('cal-auj');
    if (crit) cls.push('cal-crit');
    if (Var_State.filtreJour === iso) cls.push('cal-sel');
    const prem = evs[0];
    h += '<div class="' + cls.join(' ') + '" data-action="cal-jour" data-id="' + iso + '">'
      + (d.getDate() === 1 || i === 0 ? '<span class="cal-mois">' + Fn_Esc(new Intl.DateTimeFormat('fr-FR', { month: 'short' }).format(d)) + '</span>' : '')
      + '<span class="cal-date">' + d.getDate() + '</span>'
      + (prem ? '<span class="cal-evt cal-evt-' + (prem.sev === 'Crit' ? 'crit' : prem.sev === 'Warn' ? 'warn' : 'info') + '">'
        + Fn_Esc(String(prem.court || Fn_AbregerTitre(prem.libelle)).slice(0, 22)) + '</span>' : '')
      + (evs.length > 1 ? '<span class="cal-n">' + evs.length + '</span>' : '')
      + (evs.length ? '<span class="cal-dot" style="background:var(--' + (crit ? 'crit' : 'accent') + ')"></span>' : '')
      + '</div>';
  }
  el.innerHTML = h + '</div></div>';
}

function Fn_RenderTimeline() {
  const el = document.getElementById('v-timeline');

     devant. Mais la GRILLE, elle, les affiche — si bien qu'en cliquant sur un jour
     passé on voyait une pastille dans la case et RIEN en dessous. Quand un jour
     est explicitement sélectionné, on montre donc ce qu'il porte, échus compris :
     l'utilisateur a désigné ce jour-là, pas les huit semaines à venir. */
  const jourChoisi = !!Var_State.filtreJour;
  const evs = Fn_EvenementsFiltres().filter(e => jourChoisi || e.statut !== 'echu');
  if (!evs.length) {
    el.innerHTML = '<div class="carte"><div class="vide">' + (jourChoisi ? 'Aucun événement ce jour-là. ' : '') + 'Aucun événement à venir. Le squelette des '
      + Cst_HorizonSemaines + ' semaines se génère tout seul à chaque analyse des entrées : publications, détachements, ajustements de barrière, échéances d’ordre, seuils de marge et revues périodiques.</div></div>';
    return;
  }
  const parSemaine = {};
  evs.forEach(e => { const s = Fn_SemaineLundi(e.date) || 'sans date'; (parSemaine[s] = parSemaine[s] || []).push(e); });
  let h = '';
  Object.keys(parSemaine).sort().forEach(sem => {
    const liste = parSemaine[sem];
    const nCrit = liste.filter(e => e.sev === 'Crit').length;
    h += '<div class="sem-tete">Semaine du <b>' + Fn_Esc(Fn_FmtDateCourt(sem)) + '</b> — ' + liste.length + ' événement(s)'

}

/* ================================================================
   RENDU — ONGLET DÉCOUVERTES
   ----------------------------------------------------------------
   Livrable à plus forte valeur, systématiquement sacrifié jusqu'ici parce
   qu'il était servi en dernier, après une collecte qui épuisait le budget.
   Il reçoit désormais un budget de recherche PROPRE et ÉTANCHE.
   Une découverte valide réunit QUATRE conditions, affichées sur la carte :
     1. ancrée dans le portefeuille — elle nomme son intention ;
     2. adossée à un fait daté récent, avec source nommée et lien direct ;
     3. réfutable — niveau d'entrée, invalidation, horizon ;
     4. compatible avec la discipline — un dimensionnement qui aggraverait
        un plafond déjà dépassé est signalé comme tel.
   ================================================================ */
/* Les quatre premières intentions sont RELATIVES au portefeuille ; la cinquième
   substitue une ligne par une autre. Aucune ne permettait de proposer une idée
   NEUVE, et le cahier des charges l'interdisait explicitement — d'où un onglet
   Découvertes qui ne parlait que des titres déjà détenus. « ouvrir une ligne
   nouvelle » comble ce trou : l'idée reste soumise aux mêmes quatre conditions,
   et notamment à la discipline, mais elle n'a plus à s'accrocher à l'existant. */
const Cst_Intentions = [
  'renforcer une conviction', 'réduire un risque identifié', 'couvrir le facteur concentré',
  'diversifier hors du facteur dominant', 'substituer une ligne', 'ouvrir une ligne nouvelle'
];
const Cst_VerdictsDec = {
  'cohérente': { badge: 'badge-ok', cls: '' },
  'sous conditions': { badge: 'badge-warn', cls: ' opp-conditions' },
  'incohérente': { badge: 'badge-crit', cls: ' opp-incoherente' }
};
/* CADRE D'EXPOSITION — les CONTRAINTES contre lesquelles chaque découverte est
   jugée, et rien d'autre.
   Ce panneau reproduisait la valeur nette, le coussin, le levier, la marge
   disponible et l'exposition par facteur, par devise et par poche : les mêmes
   chiffres que le bandeau de l'onglet Vigie et que l'onglet Discipline, avec
   leurs propres arrondis et leurs propres couleurs. Trois versions à tenir
   d'accord pour une seule vérité.
   Ce qui compte ici n'est pas la VALEUR d'un indicateur — la Discipline la donne
   avec son seuil, sa jauge et sa conduite à tenir — mais ce qu'elle INTERDIT à
   une idée nouvelle. Le panneau ne garde donc que les interdits actifs, et le
   renvoi vers l'endroit où les chiffres se lisent. */
function Fn_HtmlCadreExposition() {
  const p = Fn_ProfilExposition();
  const s = Var_State.seuils;
  const ouvert = !!Var_State.panneaux.cadreExpo;
  const inds = Fn_IndicateursDiscipline();
  const degrades = inds.filter(i => i.zone === 'crit' || i.zone === 'warn');
  let h = '<div class="carte"><button type="button" class="panneau-tete' + (ouvert ? ' ouvert' : '') + '" data-action="toggle" data-id="cadreExpo">'
    + '<span>Cadre d’exposition — ce que vos contraintes interdisent</span><span class="chevron">▶</span></button>';
  if (!ouvert) {
    return h + '<div class="tres-petit muted maj-resume">'
      + (degrades.length ? degrades.length + ' contrainte(s) dégradée(s) à respecter.' : 'Aucune contrainte dégradée.')
      + '</div></div>';
  }
  const interdits = [];
  const chaudes = p.lignes.filter(l => l.pctVN != null && Math.abs(l.pctVN) > s.concLigneRouge);
  if (chaudes.length) {
    interdits.push('Ne rien ajouter à ' + chaudes.map(l => '<b>' + Fn_Esc(String(l.nom || l.id).slice(0, 22)) + '</b>').join(', ')
      + ' ni à leur facteur : ces lignes sont déjà au-dessus du plafond de concentration.');
  }
  const facteursChauds = p.expositionNetteParFacteur.filter(f => f.pctVN != null && Math.abs(f.pctVN) > s.expoFacteurRouge);
  if (facteursChauds.length) {
    interdits.push('Ne pas renforcer ' + facteursChauds.map(f => '<b>' + Fn_Esc(f.cle) + '</b>').join(', ')
      + ' : l’exposition nette y dépasse le plafond. Une idée qui la RÉDUIT reste recevable.');
  }
  const devChaudes = p.expositionParDevise.filter(d => d.cle !== 'EUR' && d.pctVN != null && Math.abs(d.pctVN) > s.deviseRouge);
  if (devChaudes.length) {
    interdits.push('Toute idée en ' + devChaudes.map(d => '<b>' + Fn_Esc(d.cle) + '</b>').join(', ')
      + ' ajoute à une exposition de change déjà au plafond : elle doit le dire et se justifier.');
  }
  if (p.coussinMargePct != null && p.coussinMargePct < s.coussinRouge) {
    interdits.push('Coussin de marge sous le seuil rouge : toute découverte retenue doit être <b>auto-financée</b> — vendre avant d’acheter — et nommer la ligne à alléger. Aucune augmentation du brut n’est recevable.');
  }
  if (p.margeDisponibleEur != null && p.margeDisponibleEur <= 0) {
    interdits.push('Marge disponible épuisée : aucune position nouvelle ne peut être ouverte sans en solder une autre.');
  }
  if (p.valeurNetteEur == null) {
    interdits.push('Valeur nette inconnue — le bloc de marge n’a pas été capturé. Aucun dimensionnement en pourcentage de valeur nette n’est calculable : toute taille proposée reste à vérifier à la main.');
  }
  h += interdits.length
    ? '<div class="note note-crit">' + interdits.map(x => '<div style="margin:3px 0">· ' + Fn_Gloss(x) + '</div>').join('') + '</div>'
    : '<div class="note note-ok tres-petit">Aucune contrainte au plafond : une idée cohérente peut être dimensionnée normalement, dans la limite du plafond de concentration par ligne ('
      + Fn_Esc(Fn_FmtPct(s.concLigneRouge, 0)) + ' de la valeur nette).</div>';
  h += '<div class="tres-petit muted">Ces interdits sont déduits de vos seuils (Paramètres → Seuils) et comparés en valeur absolue : une exposition vendeuse concentre autant qu’une acheteuse. Les poches restent neutres — leur répartition relève de votre gestion, pas d’une limite de risque.</div>'
    + '<div class="rang-btn"><button class="btn btn-mini" data-action="onglet" data-id="discipline">Lire les valeurs et leurs seuils</button></div>';
  return h + '</div>';
}

function Fn_RenderDiscipline() {
  Fn_RenderEntete();
  const el = document.getElementById('d-contenu');
  if (!el) return;
  const inds = Fn_IndicateursDiscipline();
  const score = Fn_ScoreDiscipline(inds);
  const calculables = inds.filter(i => !i.horsScore && i.zone);
  const chantiers = inds.filter(i => i.zone === 'crit').concat(inds.filter(i => i.zone === 'warn')).slice(0, 2);
  let h = '<div class="carte"><div class="carte-titre">Score de discipline</div><div class="score-rang">'
    + '<div class="score-val" style="color:var(' + (score == null ? '--muted' : score >= 70 ? '--ok' : score >= 40 ? '--warn' : '--crit') + ')">'
    + (score == null ? '—' : score) + '<span class="petit muted">/100</span></div>'
    // Pondérations RÉELLEMENT appliquées : un bloc sans aucun indicateur calculable
    // sort du calcul et son poids se redistribue. Afficher un poids théorique pour
    // un bloc entièrement à « — » laisserait croire à un score qui en tient compte.
    + '<div class="petit"><div>Pondérations appliquées : ' + Object.keys(Cst_PoidsBlocs).map(b => {
      const n = calculables.filter(i => i.bloc === b).length;
      const total = Object.keys(Cst_PoidsBlocs).reduce((a, x) => a + (calculables.some(i => i.bloc === x) ? Cst_PoidsBlocs[x] : 0), 0);
      const eff = n && total ? Math.round(Cst_PoidsBlocs[b] / total * 100) : 0;
      return b.charAt(0) + b.slice(1).toLowerCase() + ' <b>' + eff + ' %</b>' + (n ? '' : ' <span class="muted">(aucun indicateur calculable — poids redistribué)</span>');
    }).join(' · ') + '.</div>'
    + '<div class="tres-petit muted">' + calculables.length + ' indicateur(s) calculable(s) sur ' + inds.filter(i => !i.horsScore).length
    + ' — les indicateurs « — » et ceux mesurés sur moins de ' + Cst_CouvertureMin + ' % de leur base sont EXCLUS du score, jamais comptés zéro.</div></div></div>';
  if (chantiers.length) {
    h += '<hr class="sep"><div class="petit"><b>Chantiers prioritaires :</b> '
      + chantiers.map(c => '<span class="pastille p-' + c.zone + '"></span>' + Fn_Esc(c.nom)).join(' · ') + '</div>';
  } else if (score != null) {
    h += '<hr class="sep"><div class="petit muted">Aucun indicateur dégradé parmi les calculables.</div>';
  } else {
    h += '<hr class="sep"><div class="petit muted">Score non calculable : aucune donnée. Collez les entrées du jour puis lancez « Analyser les entrées » — c’est gratuit et cela allume la plupart de ces indicateurs.</div>';
  }
  h += '</div>';
  Cst_BlocsDiscipline.forEach(b => {
    h += '<div class="bloc-titre">' + Fn_Esc(b[1]) + '</div>';
    inds.filter(i => i.bloc === b[0]).forEach(i => {
      h += '<div class="carte"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
        + '<div class="carte-titre" style="margin:0">' + Fn_Gloss(Fn_Esc(i.nom)) + (i.horsScore ? ' <span class="badge badge-neutre">hors score</span>' : '') + '</div>'
        + (i.zone ? '<span class="pastille p-' + i.zone + '"></span>' : '<span class="tres-petit muted">—</span>') + '</div>'
        + '<div class="ind-valeur"' + (i.zone ? ' style="color:var(--' + i.zone + ')"' : '') + '>' + Fn_Gloss(Fn_Esc(i.valeurAff)) + '</div>'
        + (i.jauge || '')
        + '<div class="ind-seuils">' + Fn_Esc(i.seuils) + '</div>'
        + (i.couverture != null && i.couverture < 100
          ? '<div class="petit" style="margin-top:4px"><span class="badge badge-' + (i.couverture < Cst_CouvertureMin ? 'crit' : 'warn') + '">mesuré sur '
            + Fn_Esc(Fn_FmtPct(i.couverture, 0)) + ' de la base</span></div>' : '')
        + (i.manquant ? '<div class="petit muted" style="margin-top:4px">Donnée manquante : ' + Fn_Gloss(Fn_Esc(i.manquant)) + ' — indicateur exclu du score.</div>' : '')
        + (i.extra ? '<div class="petit" style="margin-top:4px">' + Fn_Gloss(i.extra) + '</div>' : '')
        + '<div class="svap">' + Fn_HtmlSvap('prat', i.pratique) + '</div></div>';
    });
  });
  el.innerHTML = h;
}

    + '<div class="hero-titre">Les cinq étages du pipeline</div>'

        return n ? n + ' entrée(s) lue(s)' : 'aucune entrée'; })(), cout: '0 $' },

/* ================================================================
   MAJ DES DONNÉES — L'APPEL AU MODÈLE
   ----------------------------------------------------------------
   Deux passes DISTINCTES, chacune avec son contrat, son budget et ses
   champs d'écriture. Elles ne se marchent jamais dessus :
     · DESK (chaque MAJ) — écrit UNIQUEMENT positions[].desk,
       calendrier[].textes, calendrier[].debrief, decouvertes[], actions[].
     · ENRICHISSEMENT (hebdomadaire) — écrit UNIQUEMENT positions[].marche,
       positions[].valo, positions[].consensus.
   Aucune des deux n'écrit une quantité, un cours, une exposition, un
   pourcentage de valeur nette, un taux de change ou une distance à une
   barrière : ces champs sont calculés par l'application et FOURNIS au
   modèle. S'il calcule à partir d'eux, il marque son résultat [calcul].
   ================================================================ */
const Cst_PhasesMAJ = [
  ['contexte', 'Constitution du contexte'],
  ['envoi', 'Envoi de la requête'],
  ['analyse', 'Analyse par le modèle'],
  ['recherches', 'Recherches web'],
  ['redaction', 'Rédaction du JSON'],
  ['reception', 'Réception de la réponse'],
  ['parsing', 'Interprétation (parsing tolérant)'],
  ['integration', 'Intégration'],
  ['validations', 'Cartes « à valider »']
];
function Fn_NouveauJournal(mode, passe, unites) {
  const j = {
    id: Fn_Uid('maj'), debutTs: Date.now(), finTs: null, mode, passe, unites: unites || 0,
    modele: null, statut: 'en cours', phases: [], recherches: 0, lectures: 0, outilsVus: {},
    nbLignes: 0, nbDebriefs: 0, budget: null,
    jetonsEntree: 0, jetonsSortie: 0, jetonsCacheEcriture: 0, jetonsCacheLecture: 0,
    coutUsd: null, stopReason: null, tronque: false, message: null
  };
  Var_State.majJournaux.unshift(j);
  Var_State.majJournaux = Var_State.majJournaux.slice(0, 10);
  return j;
}
function Fn_Phase(journal, cle, statut, message) {
  const libelle = (Cst_PhasesMAJ.find(p => p[0] === cle) || [cle, cle])[1];
  let ph = journal.phases.find(p => p.cle === cle);
  if (!ph) { ph = { cle, statut: 'attente', message: libelle, ts: Date.now() }; journal.phases.push(ph); }
  ph.statut = statut;
  ph.message = message || libelle;
  ph.ts = Date.now();
  Fn_Save();
  Fn_RenderMajPanel();
}
function Fn_MajCompteursDirect(journal) {
  const m = document.getElementById('maj-modele'); if (m) m.textContent = journal.modele || '…';
  const r = document.getElementById('maj-rech'); if (r) r.textContent = String(journal.recherches || 0);
  const jt = document.getElementById('maj-jetons'); if (jt) jt.textContent = '≈ ' + Fn_FmtNb(journal.jetonsSortie || 0, 0);
  const ct = document.getElementById('maj-cout'); if (ct) ct.textContent = Fn_CoutVivant(journal);
}
// Dépense déjà engagée, arrondie au centime : à quatre décimales le compteur
// clignoterait à chaque bloc reçu sans rien apprendre de plus. Il ne redescend
// jamais — ce qui est consommé est dû, y compris si l'appel échoue ensuite.
function Fn_CoutVivant(journal) {
  return '≈ ' + Fn_FmtUsd(Math.round(Fn_CoutJournal(journal).total * 100) / 100);
}
/* ---- Erreurs différenciées : catalogue UNIQUE, servant à la fois au message
   affiché pendant l'appel et au tableau de référence de Paramètres. Une erreur
   nouvelle s'ajoute ICI et nulle part ailleurs : deux listes finiraient par
   diverger, et c'est celle que l'utilisateur lit qui se périmerait. ---- */
async function Fn_ErreurHttp(rep) {
  let type = 'http_' + rep.status, message = rep.statusText || ('HTTP ' + rep.status);
  try {
    const corps = await rep.json();
    if (corps && corps.error) { type = corps.error.type || type; message = corps.error.message || message; }
  } catch (e) { /* corps non JSON */ }
  return { api: true, status: rep.status, type, message };
}

function Fn_ErreurCatalogue(code) { return Cst_ErreursAPI.find(e => e.code === code) || null; }
function Fn_MessageErreur(err) {
  if (!err) return 'Erreur inconnue.';
  if (err.name === 'AbortError') return 'Appel annulé par l’utilisateur.';
  const msg = String(err.message || err);
  let code = err.type || '';
  if (err.fluxIncomplet) code = 'flux_incomplet';
  else if (err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(msg)) code = 'reseau';
  else if (/credit|billing|balance|insufficient/i.test(msg)) code = 'billing_error';
  const e = Fn_ErreurCatalogue(code);
  if (!e) return (err.type ? err.type + ' — ' : '') + msg + (err.status ? ' (HTTP ' + err.status + ')' : '');
  let t = e.quoi.toUpperCase() + ' — ' + e.pourquoi;
  if (code === 'flux_incomplet' && err.jetonsRecus) {
    t += ' Reçu avant la coupure : ≈ ' + Fn_FmtNb(err.jetonsRecus, 0) + ' jetons, ' + (err.recherchesFaites || 0) + ' recherche(s).';
  }
  t += ' → ' + e.faire;
  t += ' [' + [e.code, (err.status || e.http) ? 'HTTP ' + (err.status || e.http) : ''].filter(Boolean).join(' · ') + ' — détail dans Paramètres → Codes d’erreur]';
  if (msg && msg.length < 300 && (code === 'invalid_request_error' || code === 'api_error')) t += ' Message de l’API : « ' + msg + ' »';
  return t;
}
/* ---- Appel en flux (clé personnelle) : accumulateur générique de blocs ---- */
async function Fn_AppelStream(corps, entetes, journal, signal) {
  const rep = await fetch(Cst_ApiUrl, { method: 'POST', headers: entetes, body: JSON.stringify(corps), signal });
  if (!rep.ok) throw await Fn_ErreurHttp(rep);
  const lecteur = rep.body.getReader();
  const dec = new TextDecoder();
  let tampon = '', texte = '', modele = null, entree = 0, sortie = 0, stop = null;
  const blocs = [];
  const baseRech = journal.recherches || 0, baseSortie = journal.jetonsSortie || 0, baseLect = journal.lectures || 0;
  // Cumuls des reprises déjà faites : sans eux, le compteur de dépense en direct
  // retomberait à zéro à chaque reprise — précisément là où la facture grimpe.
  const baseEntree = journal.jetonsEntree || 0, baseCw = journal.jetonsCacheEcriture || 0, baseCr = journal.jetonsCacheLecture || 0;
  let rech = 0, lect = 0, charsSortie = 0;
  let rechApi = null;   // décompte facturable renvoyé par l'API : fait foi sur le comptage par blocs
  const outilsVus = {};
  let cacheEcriture = 0, cacheLecture = 0;
  // Un flux complet se termine TOUJOURS par message_stop, précédé d'un
  // message_delta portant stop_reason. Sans ces marqueurs, la connexion a été
  // coupée en route : sans ce drapeau, la coupure passait pour une fin normale et
  // le parseur tolérant « réparait » un JSON amputé en le déclarant réussi.
  let finPropre = false;
  for (;;) {
    const lu = await lecteur.read();
    Var_State._runtime.dernierSignal = Date.now();
    if (lu.done) break;
    tampon += dec.decode(lu.value, { stream: true });
    let idx;
    while ((idx = tampon.indexOf('\n')) >= 0) {
      const ligne = tampon.slice(0, idx).trim();
      tampon = tampon.slice(idx + 1);
      if (ligne.indexOf('data:') !== 0) continue;
      const brut = ligne.slice(5).trim();
      if (!brut) continue;
      let ev;
      try { ev = JSON.parse(brut); } catch (e) { continue; }
      if (ev.type === 'message_start') {
        modele = (ev.message && ev.message.model) || null;
        // ATTENTION : l'usage de message_start n'est qu'un INSTANTANÉ D'OUVERTURE.
        // Il ne contient PAS ce que les outils serveur verseront ensuite dans le
        // contexte. S'en contenter affichait deux jetons d'entrée pour un appel de
        // trente minutes. Le total réel arrive dans le message_delta final.
        const u0 = (ev.message && ev.message.usage) || {};
        entree = u0.input_tokens || 0;
        cacheEcriture = u0.cache_creation_input_tokens || 0;
        cacheLecture = u0.cache_read_input_tokens || 0;
        journal.jetonsEntree = baseEntree + entree;
        journal.jetonsCacheEcriture = baseCw + cacheEcriture;
        journal.jetonsCacheLecture = baseCr + cacheLecture;
        journal.modele = modele;
        Fn_Phase(journal, 'analyse', 'en cours', 'Analyse en cours (modèle : ' + (modele || '?') + ')');
      } else if (ev.type === 'content_block_start') {
        const b = ev.content_block ? JSON.parse(JSON.stringify(ev.content_block)) : { type: 'inconnu' };
        blocs[ev.index] = b;
        if (b.type === 'server_tool_use') {
          // Recherche et lecture de page sont deux outils DISTINCTS et n'ont pas le
          // même prix : les confondre affichait « 100 recherches » là où il y avait
          // 60 recherches et 40 lectures.
          outilsVus[b.name || 'sans nom'] = (outilsVus[b.name || 'sans nom'] || 0) + 1;
          if (b.name === 'web_fetch') { lect++; journal.lectures = baseLect + lect; }
          else { rech++; if (rechApi == null) journal.recherches = baseRech + rech; }
          b._json = '';
          Fn_Phase(journal, 'recherches', 'en cours',
            (b.name === 'web_fetch' ? 'Lecture de page n° ' + journal.lectures : 'Recherche web n° ' + journal.recherches) + ' en cours');
        } else if (b.type === 'text') { b.text = b.text || ''; Fn_Phase(journal, 'redaction', 'en cours', 'Rédaction du JSON'); }
        else if (b.type === 'thinking') { b.thinking = b.thinking || ''; b.signature = b.signature || ''; }
      } else if (ev.type === 'content_block_delta') {
        const b = blocs[ev.index];
        const d = ev.delta || {};
        if (b) {
          if (d.type === 'text_delta') { b.text = (b.text || '') + (d.text || ''); texte += d.text || ''; charsSortie += (d.text || '').length; }
          else if (d.type === 'input_json_delta') { b._json = (b._json || '') + (d.partial_json || ''); charsSortie += (d.partial_json || '').length; }
          else if (d.type === 'thinking_delta') { b.thinking = (b.thinking || '') + (d.thinking || ''); charsSortie += (d.thinking || '').length; }
          else if (d.type === 'signature_delta') { b.signature = (b.signature || '') + (d.signature || ''); }
          journal.jetonsSortie = baseSortie + Math.round(charsSortie / 3.6); // estimation, remplacée par l'usage exact en fin de flux
        }
      } else if (ev.type === 'content_block_stop') {
        const b = blocs[ev.index];
        if (b && b._json !== undefined) {
          try { b.input = b._json ? JSON.parse(b._json) : (b.input || {}); } catch (e) { b.input = b.input || {}; }
          delete b._json;
        }
        if (b && b.type === 'server_tool_use' && b.name === 'web_search' && b.input && b.input.query) {
          journal.listeRecherches = journal.listeRecherches || [];
          journal.listeRecherches.push(String(b.input.query).slice(0, 120));
          Fn_Phase(journal, 'recherches', 'en cours', 'Recherche web n° ' + journal.listeRecherches.length + ' : « ' + String(b.input.query).slice(0, 90) + ' »');
        }
      } else if (ev.type === 'message_delta') {
        // Usage CUMULÉ de toute la requête, tours d'outils compris : seule mesure
        // facturable. Elle écrase l'instantané d'ouverture.
        const u = ev.usage || {};
        if (u.output_tokens != null) { sortie = u.output_tokens; journal.jetonsSortie = baseSortie + sortie; }
        if (u.input_tokens != null) { entree = u.input_tokens; journal.jetonsEntree = baseEntree + entree; }
        if (u.cache_creation_input_tokens != null) { cacheEcriture = u.cache_creation_input_tokens; journal.jetonsCacheEcriture = baseCw + cacheEcriture; }
        if (u.cache_read_input_tokens != null) { cacheLecture = u.cache_read_input_tokens; journal.jetonsCacheLecture = baseCr + cacheLecture; }
        const su = u.server_tool_use || {};
        if (su.web_search_requests != null) { rechApi = su.web_search_requests; journal.recherches = baseRech + rechApi; }
        if (ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason;
      } else if (ev.type === 'message_stop') { finPropre = true; }
      else if (ev.type === 'error') {
        throw { api: true, type: (ev.error && ev.error.type) || 'api_error', message: (ev.error && ev.error.message) || 'erreur de flux' };
      }
      Fn_MajCompteursDirect(journal);
    }
  }
  if (!finPropre && !stop) {
    throw { api: true, type: 'flux_incomplet', fluxIncomplet: true,
      jetonsRecus: baseSortie + sortie, recherchesFaites: baseRech + rech,
      message: 'Le flux s’est interrompu avant la fin de la réponse : la connexion a été fermée sans marqueur de fin.' };
  }
  const reflexion = blocs.filter(b => b && b.type === 'thinking' && b.thinking).map(b => b.thinking).join('\n\n---\n\n');
  return { contenu: blocs.filter(Boolean), texte, reflexion, modele, entree, sortie,
    recherches: rechApi == null ? rech : rechApi, lectures: lect, outilsVus,
    cacheEcriture, cacheLecture, stopReason: stop };
}
/* ---- Appel direct sans flux (le pont d'artefact ne streame pas) ---- */
async function Fn_AppelDirect(corps, entetes, journal, signal) {
  Fn_Phase(journal, 'analyse', 'en cours', 'Analyse et recherches en cours (pont sans flux — bilan complet en fin d’appel)');
  const rep = await fetch(Cst_ApiUrl, { method: 'POST', headers: entetes, body: JSON.stringify(corps), signal });
  if (!rep.ok) throw await Fn_ErreurHttp(rep);
  const data = await rep.json();
  const contenu = data.content || [];
  const texte = contenu.filter(b => b && b.type === 'text').map(b => b.text || '').join('');
  const u = (data && data.usage) || {};
  const outils = contenu.filter(b => b && b.type === 'server_tool_use');
  const rech = (u.server_tool_use && u.server_tool_use.web_search_requests != null)
    ? u.server_tool_use.web_search_requests : outils.filter(b => b.name !== 'web_fetch').length;
  const lect = outils.filter(b => b.name === 'web_fetch').length;
  const outilsVus = {};
  outils.forEach(b => { const n = b.name || 'sans nom'; outilsVus[n] = (outilsVus[n] || 0) + 1; });
  journal.modele = data.model || journal.modele;
  journal.recherches = (journal.recherches || 0) + rech;
  journal.lectures = (journal.lectures || 0) + lect;
  journal.jetonsSortie = (journal.jetonsSortie || 0) + (u.output_tokens || 0);
  return { contenu, texte, modele: data.model || null,
    reflexion: contenu.filter(b => b && b.type === 'thinking' && b.thinking).map(b => b.thinking).join('\n\n---\n\n'),
    entree: u.input_tokens || 0, sortie: u.output_tokens || 0,
    cacheEcriture: u.cache_creation_input_tokens || 0, cacheLecture: u.cache_read_input_tokens || 0,
    recherches: rech, lectures: lect, outilsVus, stopReason: data.stop_reason || null };
}
/* ---- Parseur JSON tolérant aux troncatures : RÉPARATION, jamais rejet total.
   Une réponse tronquée est intégrée et signalée en ambre, jamais perdue. ---- */
function Fn_ParseJsonTolerant(texte) {
  if (!texte) return { data: null, repare: false, erreur: 'réponse vide' };
  let t = String(texte).trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const deb = t.indexOf('{');
  if (deb < 0) return { data: null, repare: false, erreur: 'aucun objet JSON dans la réponse' };
  const fin = t.lastIndexOf('}');
  if (fin > deb) {
    try {
      const d = JSON.parse(t.slice(deb, fin + 1));
      if (d && typeof d === 'object') return { data: d, repare: false, erreur: null };
    } catch (e) { /* → réparation */ }
  }
  const s = t.slice(deb);
  const points = [];
  let pile = '', enChaine = false, echappe = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s.charAt(i);
    if (enChaine) {
      if (echappe) echappe = false;
      else if (ch === '\\') echappe = true;
      else if (ch === '"') { enChaine = false; points.push({ idx: i + 1, pile }); }
      continue;
    }
    if (ch === '"') enChaine = true;
    else if (ch === '{' || ch === '[') pile += ch;
    else if (ch === '}' || ch === ']') { pile = pile.slice(0, -1); points.push({ idx: i + 1, pile }); }
    else if (ch === ',') points.push({ idx: i, pile });
  }
  for (let k = points.length - 1, essais = 0; k >= 0 && essais < 400; k--, essais++) {
    const p = points[k];
    const cand = s.slice(0, p.idx).replace(/[\s,]+$/, '');
    if (!cand || cand.charAt(cand.length - 1) === ':') continue;
    let fermetures = '';
    for (let j = p.pile.length - 1; j >= 0; j--) fermetures += (p.pile.charAt(j) === '{' ? '}' : ']');
    try {
      const d = JSON.parse(cand + fermetures);
      if (d && typeof d === 'object') return { data: d, repare: true, erreur: null };
    } catch (e) { /* point de coupe précédent */ }
  }
  return { data: null, repare: false, erreur: 'JSON irrécupérable malgré la réparation (recul sur ' + Math.min(points.length, 400) + ' points de coupe)' };
}

/* ----------------------------------------------------------------

function Fn_ContratDesk() {

  const m = Var_State.marge;
  const r2 = v => (Fn_Num(v) == null ? null : Math.round(Fn_Num(v) * 100) / 100);

      if (!c.conso) manque.push('consensus');

    // déclaré. C'est ce qui fait d'une mise à jour une réévaluation : sans lui,
    // le desk réécrivait chaque fois une thèse neuve, sans savoir ce qu'il avait
    // dit ni ce que vous en aviez fait.

    if (dk.these) prec.these = String(dk.these).slice(0, 220);
    if (dk.valoRef) prec.valoRef = String(dk.valoRef).slice(0, 120);

    if (dk.ts) prec.le = Fn_DateISO(new Date(Fn_Num(dk.ts) || Date.now()));

    const declare = [th.ecrite ? 'these' : null, th.invalidation ? 'invalidation' : null,
      th.objectif ? 'objectif' : null].filter(Boolean);

  });
  return {
    ts: new Date().toISOString(),
    marge: m ? { titres: Math.round(Fn_Num(m.titres) || 0), cash: Math.round(Fn_Num(m.cash) || 0),
      vl: Math.round(Fn_Num(m.vl) || 0), risque: Math.round(Fn_Num(m.risque) || 0),
      libre: Math.round(Fn_Num(m.libre) || 0), levier: r2(m.levier), coussinPct: r2(m.coussinPct), as: m.as } : null,
    fx: Var_State.fx ? Var_State.fx.taux : null,
    expoNetteFacteur: prof.expositionNetteParFacteur.map(f => ({ f: f.cle, pctVN: f.pctVN })),
    expoDevise: prof.expositionParDevise.map(f => ({ d: f.cle, pctVN: f.pctVN })),
    gardeFous: prof.gardeFous,
    pos,
    ordres: Var_State.ordres.map(o => ({ nom: String(o.nom || '').slice(0, 40), sens: o.sens, qte: o.qte, lim: o.limite, montEur: o.montantEur })),
    executes: Var_State.executes.slice(-8).map(t => ({ nom: String(t.nom || '').slice(0, 40), sens: t.sens, qte: t.qte, cours: t.cours, d: t.date })),
    ecarts: Var_State.controles.filter(c => c.statut === 'a_valider').map(c => ({ kind: c.kind, resume: String(c.resume || '').slice(0, 160) })),
    // Événements à traiter UNIQUEMENT : sans texte, ou dont les chiffres ont bougé.
    evSansTexte: charge.sansTexte.map(e => ({ id: e.id, d: e.date, isin: e.isin, sev: e.sev,

    evADebriefer: charge.aDebriefer.map(e => ({ id: e.id, d: e.date, isin: e.isin,
      lib: String(e.libelle || '').slice(0, 110), annonce: (e.metriques || []).map(x => x.l + ' : ' + String(x.v).slice(0, 90)) })),
    // Les dernières découvertes, UNE LIGNE chacune — jamais leur prose : c'est
    // l'anti-répétition, et elle ne coûte presque rien.
    decVues: Var_State.decouvertes.slice(-20).map(d => ({ c: d.cible, t: String(d.titre || '').slice(0, 60),

  };
}
function Fn_ContratEnrichissement(lignes, agendas) {

/* ----------------------------------------------------------------

function Fn_IntegrerDesk(data, journal) {
  const ts = Date.now();
  const det = { textes: 0, debriefs: 0, decNouvelles: 0, decConnues: 0, profils: 0, actions: 0 };
  if (journal) journal.detail = det;
  (data.evTextes || []).forEach(t => {
    const id = Fn_Ch(t, ['id']);
    const e = Var_State.calendrier.find(x => x.id === id);
    if (!e) return;
    const m = Fn_Ch(t, ['m']);
    if (Array.isArray(m)) {
      m.map(x => ({ l: Fn_Ch(x, ['l']), v: Fn_Ch(x, ['v']) })).filter(x => x.l && x.v)
        .forEach(x => { if (!(e.metriques || []).some(y => y.l === x.l)) (e.metriques = e.metriques || []).push(x); });
    }
    e.textes = { surv: Fn_Ch(t, ['surv']) || '', arb: Fn_Ch(t, ['arb']) || '', prat: Fn_Ch(t, ['prat']) || '',
      texteEcritLe: Fn_AujISO(), empreinte: Fn_EmpreinteEvenement(e) };
    det.textes++;
  });
  (data.debriefs || []).forEach(d => {
    const id = Fn_Ch(d, ['id']);
    const e = Var_State.calendrier.find(x => x.id === id);
    if (!e) return;
    e.debrief = { faits: Fn_Ch(d, ['faits']) || '', ecart: Fn_Ch(d, ['ecart']) || '',
      these: Fn_Ch(d, ['these']) || '', action: Fn_Ch(d, ['action']) || '',
      suite: Fn_Ch(d, ['suite']) || '',
      s: Fn_Ch(d, ['s']) || null, u: Fn_UrlSure(Fn_Ch(d, ['u'])), ts };
    e.statut = 'debriefe';
    e.debriefDemande = false;
    det.debriefs++;
  });
  (data.decouvertes || []).forEach(o => {
    const titre = Fn_Ch(o, ['titre']);
    if (!titre) return;
    const cle = Fn_Slug(String(Fn_Ch(o, ['cible']) || '') + '-' + titre);
    if (Var_State.decouvertes.some(x => Fn_Slug(String(x.cible || '') + '-' + String(x.titre || '')) === cle)) { det.decConnues++; return; }
    const verdict = Fn_Ch(o, ['verdict']);
    Var_State.decouvertes.push({
      id: Fn_Uid('dec'), ts, statut: 'proposee',
      intention: Cst_Intentions.indexOf(Fn_Ch(o, ['intention'])) >= 0 ? Fn_Ch(o, ['intention']) : null,
      cible: Fn_Ch(o, ['cible']), titre, fait: Fn_Ch(o, ['fait']) || '',
      dateFait: Fn_Ch(o, ['dateFait']), entree: Fn_Ch(o, ['entree']) || '',
      inval: Fn_Ch(o, ['inval']) || '', hor: Fn_Ch(o, ['hor']) || '',
      taille: Fn_Num(Fn_Ch(o, ['taille'])),
      verdict: (verdict === 'cohérente' || verdict === 'sous conditions' || verdict === 'incohérente') ? verdict : 'sous conditions',
      discipline: Fn_Ch(o, ['discipline']) || '', s: Fn_Ch(o, ['s']) || null, u: Fn_UrlSure(Fn_Ch(o, ['u'])), note: ''
    });
    det.decNouvelles++;
  });
  (data.positions || []).forEach(x => {
    const p = Fn_PositionParId(Fn_Ch(x, ['id']));
    if (!p) return;
    const poche = Fn_Ch(x, ['poche']);
    // Poche, facteurs et faible profondeur décrivent la DÉTENTION : ils y sont
    // écrits. Le reste est le jugement, il va dans desk. Aucun autre champ n'est
    // touché — c'est la règle de séparation des étages.
    if (poche && Cst_Poches.indexOf(poche) >= 0) p.detention.poche = poche;
    const f = Fn_Ch(x, ['fact']);
    if (Array.isArray(f)) p.detention.facteurs = f.filter(Boolean).slice(0, 5);
    const lq = Fn_Ch(x, ['liqFaible']);
    if (lq === true || lq === false) p.detention.liqFaible = lq;
    const profil = Fn_Ch(x, ['profil']);
    p.desk = p.desk || {};
    if (profil && Cst_Profils.some(y => y.id === profil)) { p.desk.profil = profil; det.profils++; }
    ['tend', 'these', 'valoRef', 'risques', 'revue'].forEach(k => {
      const v = Fn_Ch(x, [k]);
      if (v) p.desk[k] = v;
    });
    p.desk.ts = ts;
  });
  (data.actions || []).forEach(a => {
    const propo = Fn_Ch(a, ['propo']);
    if (!propo) return;
    const id = Fn_Ch(a, ['id']);
    if (Var_State.actions.some(x => x.statut === 'a_valider' && x.isin === id && x.propo === propo)) return;
    const prio = Fn_Num(Fn_Ch(a, ['prio']));
    Var_State.actions.push({ id: Fn_Uid('act'), isin: id || null, ticker: null,
      prio: (prio === 1 || prio === 2 || prio === 3) ? prio : 3, propo,
      decl: Fn_Ch(a, ['decl']) || '', cb: Fn_Ch(a, ['cb']) || '', hor: Fn_Ch(a, ['hor']) || '',
      inval: Fn_Ch(a, ['inval']) || '', statut: 'a_valider', ts });
    det.actions++;
  });
  Var_State.derniereMaj = ts;
  Fn_Recalculer();
  Fn_ElaguerEtat();
  return det;
}
function Fn_IntegrerEnrichissement(data, journal) {
  const ts = Date.now();

  if (journal) journal.detail = det;
  /* ÉTAGE ÉTANCHE : l'agenda d'un instrument non détenu s'écrit dans
     Var_State.agenda, jamais dans une position. */
