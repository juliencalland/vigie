/* ================================================================
   DONNÉES / CLASSIFICATION
   ----------------------------------------------------------------
   Version PWA : aucune classification embarquée (dépôt public). La
   taxonomie (CŒUR / CONVICTION / SATELLITE / COUVERTURE /
   SPÉCULATIF-LEVIER / ORDRES / FACTEURS) est portée par le prompt de
   MAJ (Fn_BuildPromptMAJ) ; les données arrivent par synchronisation
   ou import, chaque intégration passant par des cartes « à valider ».
   Les filtres (chips) sont générés dynamiquement depuis les tags des
   événements et les catégories réellement présentes.
   ================================================================ */
function Fn_ValeurNette() {
  const m = Var_State.margin;
  if (m && Fn_Num(m.liquidationValue) != null) {
    return { vn: Fn_Num(m.liquidationValue), src: 'valeur liquidative de l’aperçu de marge [relevé]', approx: false };
  }
  const pos = Var_State.positions;
  if (pos.length && pos.every(p => Fn_Num(p.valeurEur) != null)) {
    const somme = pos.reduce((a, p) => a + Fn_Num(p.valeurEur), 0);
    return { vn: somme, src: 'somme des positions du relevé [calcul] — approximation (liquidités et dette non incluses : fournir l’aperçu de marge)', approx: true };
  }
  return null;
}
// Grandeurs dérivées de l'aperçu de marge (section 6.1) — chacune traçable.
function Fn_GrandeursMarge() {
  const m = Var_State.margin;
  if (!m) return null;
  const vl = Fn_Num(m.liquidationValue), sv = Fn_Num(m.securitiesValue),
        rk = Fn_Num(m.portfolioRisk), fm = Fn_Num(m.freeMargin);
  const g = { asOf: m.asOf || null, cash: Fn_Num(m.cash), liquidationValue: vl, securitiesValue: sv, portfolioRisk: rk, freeMargin: fm,
              coussinPct: null, levier: null, baisseAbsorbableEur: null, baisseAbsorbablePct: null };
  if (vl != null && vl !== 0 && fm != null) g.coussinPct = fm / vl * 100;
  if (vl != null && vl !== 0 && sv != null) g.levier = sv / vl;
  // Baisse absorbable ≈ baisse de la valeur des titres qui annule la marge disponible.
  // HYPOTHÈSE AFFICHÉE : le « risque » courtier est traité comme proportionnel à la valeur
  // des positions qui le génèrent ; la réalité dépend du modèle de risque du courtier.
  if (fm != null && sv != null && rk != null && sv > rk && fm > 0) {
    const f = fm / (sv - rk);
    if (f > 0 && f < 1) {
      g.baisseAbsorbablePct = f * 100;
      g.baisseAbsorbableEur = f * sv;
    }
  }
  return g;
}
// Profil d'exposition consolidé — SEULE base de jugement de cohérence d'une opportunité.
// Agrège en delta (produits à levier compris) par ligne, facteur, devise et catégorie, et
// rappelle les garde-fous chiffrés en vigueur : une idée qui franchit un plafond n'est pas
// une opportunité, c'est une aggravation de concentration.
function Fn_ProfilExposition() {
  const vnObj = Fn_ValeurNette();
  const g = Fn_GrandeursMarge();
  const s = Var_State.seuils;
  const base = vnObj ? vnObj.vn : null;
  const parFacteur = {}, parDevise = {}, parCategorie = {};
  Var_State.positions.forEach(p => {
    const d = Fn_Num(p.deltaEur);
    const val = d != null ? d : (Fn_Num(p.valeurEur) || 0);
    const facteurs = (p.facteurs && p.facteurs.length) ? p.facteurs : ['non classé'];
    facteurs.forEach(f => { parFacteur[f] = (parFacteur[f] || 0) + val; });
    parDevise[p.devise || 'EUR'] = (parDevise[p.devise || 'EUR'] || 0) + val;
    parCategorie[p.categorie || 'non classé'] = (parCategorie[p.categorie || 'non classé'] || 0) + val;
  });
  const pct = v => (base ? Math.round(v / base * 1000) / 10 : null);
  const trier = o => Object.keys(o).sort((a, b) => Math.abs(o[b]) - Math.abs(o[a]))
    .map(k => ({ cle: k, deltaEur: Math.round(o[k]), pctVN: pct(o[k]) }));
  return {
    valeurNetteEur: base != null ? Math.round(base) : null,
    valeurNetteSrc: vnObj ? vnObj.src : 'valeur nette inconnue (ni aperçu de marge ni relevé) — toute taille en % VN est alors incalculable',
    coussinMargePct: g && g.coussinPct != null ? Math.round(g.coussinPct * 10) / 10 : null,
    margeDisponibleEur: g && g.freeMargin != null ? Math.round(g.freeMargin) : null,
    levierBrut: g && g.levier != null ? Math.round(g.levier * 100) / 100 : null,
    tresorerieEur: g && g.cash != null ? Math.round(g.cash) : null,
    gardeFous: {
      coussinRougeSousPct: s.coussinRouge, coussinVertAPartirDePct: s.coussinVert,
      levierRougeAuDelaDe: s.levierRouge, levierVertJusqua: s.levierVert,
      concentrationLigneRougeAuDelaDePctVN: s.concLigneRouge, concentrationLigneVertJusquaPctVN: s.concLigneVert,
      concentrationFacteurRougeAuDelaDePctVN: s.concFacteurRouge, concentrationFacteurVertJusquaPctVN: s.concFacteurVert,
      deviseRougeAuDelaDePctVN: s.deviseRouge, liquiditeFaibleRougeAuDelaDePctVN: s.liquiditeRouge
    },
    lignes: Var_State.positions.map(p => ({ ticker: p.ticker, categorie: p.categorie, pctVN: p.pctVN, sens: p.sens, facteurs: p.facteurs || [], liquiditeFaible: p.liquiditeFaible })),
    expositionParFacteur: trier(parFacteur),
    expositionParDevise: trier(parDevise),
    expositionParCategorie: trier(parCategorie)
  };
}
function Fn_PosDe(ticker) {
  return Var_State.positions.find(p => p.ticker === ticker) || null;
}
function Fn_QuoteDe(ticker) {
  return (ticker && Var_State.quotes[ticker]) || null;
}
function Fn_PositionsParCategorie() {
  const map = {};
  Var_State.positions.forEach(p => {
    const c = p.categorie || 'NON CLASSÉ';
    (map[c] = map[c] || []).push(p);
  });
  return map;
}
// Liste d'instruments affichée / envoyée à la consolidation : instruments suivis
// (Paramètres) ∪ tickers des positions et sous-jacents connus.
function Fn_ListeInstruments() {
  const vus = {};
  const liste = [];
  Var_State.instruments.forEach(i => { if (i.ticker && !vus[i.ticker]) { vus[i.ticker] = 1; liste.push(i); } });
  Var_State.positions.forEach(p => {
    [p.ticker, p.sousJacent].forEach(t => {
      if (t && !vus[t]) { vus[t] = 1; liste.push({ id: 'auto-' + t, ticker: t, isin: p.isin || '', place: '', libelle: p.libelle || '', categorie: p.categorie || '' }); }
    });
  });
  return liste;
}
// Domaines transmis à l'outil de recherche. Filtrés sur la liste connue : un
// domaine hérité d'un état plus ancien, retiré de Cst_SitesRecherche depuis, ne
// doit pas restreindre les recherches à une source que l'écran n'affiche plus.
function Fn_SitesAutorises() {
  const connus = {};
  Cst_SitesRecherche.forEach(g => g.sites.forEach(s => { connus[s.d] = 1; }));
  const bloques = Var_State.sitesBloques || [];
  // Un domaine que l'API a déjà refusé est retiré AVANT l'envoi : le laisser
  // repartir ferait échouer toute la MAJ en 400, sans qu'aucune recherche
  // n'ait lieu — une case cochée dans Paramètres suffisait à tout bloquer.
  return (Var_State.sitesRecherche || []).filter(d => connus[d] && bloques.indexOf(d) < 0);
}
// Domaines nommés par un refus de l'API (« the following domains are not
// accessible with our user agent: … »). On ne retient que ceux qui figurent
// dans la liste des sources proposées : ce sont les seuls qu'on ait pu envoyer,
// et cela évite de prendre api.anthropic.com ou un mot du message pour un domaine.
function Fn_DomainesRefuses(message) {
  const m = String(message || '');
  if (!/domain/i.test(m)) return [];
  const connus = [];
  Cst_SitesRecherche.forEach(g => g.sites.forEach(s => connus.push(s.d)));
  const bas = m.toLowerCase();
  return connus.filter(d => bas.indexOf(d) >= 0);
}
function Fn_TagsDisponibles() {
  const set = {};
  Var_State.events.forEach(e => (e.tags || []).forEach(t => { if (t) set[t] = 1; }));
  Var_State.positions.forEach(p => { if (p.categorie) set[p.categorie] = 1; });
  return Object.keys(set).sort();
}
function Fn_EventsFiltres() {
  let evs = Var_State.events.slice();
  if (Var_State.filtreJour) evs = evs.filter(e => e.date === Var_State.filtreJour);
  if (Var_State.filtreTag) evs = evs.filter(e => (e.tags || []).indexOf(Var_State.filtreTag) >= 0);
  evs.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (Cst_SevOrdre[a.sev] || 3) - (Cst_SevOrdre[b.sev] || 3)));
  return evs;
}
// Prochaine échéance du héro : l'événement non traité le plus urgent (retards d'abord).
function Fn_ProchaineEcheance() {
  const nonTraites = Var_State.events.filter(e => !e.traite && e.date);
  if (!nonTraites.length) return null;
  nonTraites.sort((a, b) => (a.date < b.date ? -1 : 1));
  return nonTraites[0];
}
function Fn_NbAValider() {
  return Var_State.aValider.filter(c => c.statut === 'a_valider').length +
         Var_State.actions.filter(a => a.statut === 'a_valider').length;
}

/* ---- Règles permanentes — recalculées depuis les données réelles, par catégorie ---- */
function Fn_ReglesPermanentes() {
  const regles = [];
  const s = Var_State.seuils;
  const g = Fn_GrandeursMarge();
  const parCat = Fn_PositionsParCategorie();
  // 1. Marge : seuil de coussin + plan de réduction ordonné par catégories.
  let hMarge = '';
  if (g && g.coussinPct != null) {
    const zone = g.coussinPct >= s.coussinVert ? 'ok' : (g.coussinPct < s.coussinRouge ? 'crit' : 'warn');
    hMarge += '<div><span class="pastille p-' + zone + '"></span>Coussin de marge : <b class="mono">' + Fn_Esc(Fn_FmtPct(g.coussinPct)) + '</b> '
      + '[calcul : marge disponible ' + Fn_Esc(Fn_FmtEur(g.freeMargin)) + ' / valeur liquidative ' + Fn_Esc(Fn_FmtEur(g.liquidationValue)) + '] '
      + '· levier exact <b class="mono">' + Fn_Esc(Fn_FmtX(g.levier)) + '</b> [calcul : titres ' + Fn_Esc(Fn_FmtEur(g.securitiesValue)) + ' / VL] '
      + '· seuils : vert ≥ ' + s.coussinVert + ' %, rouge &lt; ' + s.coussinRouge + ' %.</div>';
    if (g.baisseAbsorbableEur != null) {
      hMarge += '<div class="petit muted">Baisse absorbable ≈ <b class="mono">' + Fn_Esc(Fn_FmtEur(g.baisseAbsorbableEur)) + '</b> ('
        + Fn_Esc(Fn_FmtPct(g.baisseAbsorbablePct)) + ' de la valeur des titres) avant annulation de la marge disponible '
        + '[calcul + hypothèse AFFICHÉE : risque courtier supposé proportionnel à la valeur des positions — dépend du modèle de risque réel].</div>';
    }
    hMarge += '<div class="tres-petit muted">Aperçu de marge du ' + Fn_Esc(g.asOf || 'horodatage non lu') + (Var_State.releveAsOf ? ' · relevé du ' + Fn_Esc(Var_State.releveAsOf) : '') + '.</div>';
  } else {
    hMarge += '<div>Coussin, levier et baisse absorbable : <b>—</b> — donnée manquante : <b>capture de l’aperçu de marge du courtier</b> (écran « Espace libre » DEGIRO ou équivalent : valeur des titres, liquidités, valeur liquidative, risque, marge disponible), à fournir dans le panneau MAJ.</div>';
  }
  const catAvecPos = Cst_OrdreReduction.filter(c => (parCat[c] || []).length);
  if (catAvecPos.length) {
    hMarge += '<div class="petit" style="margin-top:4px">Plan de réduction ordonné (quelles catégories liquider en premier) : '
      + catAvecPos.map((c, i) => (i + 1) + '. ' + Fn_Esc(c) + ' (' + parCat[c].map(p => Fn_Esc(p.ticker) + (Fn_Num(p.valeurEur) != null ? ' ' + Fn_Esc(Fn_FmtEur(p.valeurEur)) : '')).join(', ') + ')').join(' → ')
      + '.</div>';
  } else {
    hMarge += '<div class="petit muted">Plan de réduction : établi automatiquement dès que des positions classées seront intégrées (SPÉCULATIF-LEVIER et SATELLITE avant CONVICTION).</div>';
  }
  regles.push({ titre: 'Marge & plan de réduction', html: hMarge });
  // 2. Distance aux barrières de CHAQUE produit à levier détenu.
  const produitsLevier = Var_State.positions.filter(p => p.categorie === 'COUVERTURE' || p.categorie === 'SPÉCULATIF-LEVIER');
  let hBar = '';
  if (!produitsLevier.length) {
    hBar = '<div class="muted">Aucun produit à levier dans l’état actuel — cette règle liste, pour CHAQUE turbo / mini-future détenu, la distance à sa barrière dès l’intégration du relevé.</div>';
  } else {
    hBar = produitsLevier.map(p => {
      const q = Fn_QuoteDe(p.sousJacent);
      const cours = q ? Fn_Num(q.last) : null;
      const bar = Fn_Num(p.barriere);
      let d = null;
      if (cours != null && bar != null && cours !== 0) {
        d = (p.sens === 'short' ? (bar - cours) : (cours - bar)) / cours * 100;
      }
      if (d == null) {
        return '<div>' + Fn_Esc(p.ticker) + ' (' + Fn_Esc(p.sousJacent || 'sous-jacent inconnu') + ') : distance à la barrière <b>—</b> — donnée manquante : '
          + (bar == null ? 'barrière du produit (fiche émetteur, via MAJ)' : 'cours du sous-jacent (via MAJ)') + '.</div>';
      }
      const zone = d >= s.barriereVert ? 'ok' : (d < s.barriereRouge ? 'crit' : 'warn');
      return '<div><span class="pastille p-' + zone + '"></span>' + Fn_Esc(p.ticker) + ' (' + Fn_Esc(p.sens === 'short' ? 'short' : 'long') + ' ' + Fn_Esc(p.sousJacent || '?') + ') : distance à la barrière <b class="mono">'
        + Fn_Esc(Fn_FmtPct(d)) + '</b> [calcul : cours ' + Fn_Esc(Fn_FmtNb(cours, 2)) + ' vs barrière ' + Fn_Esc(Fn_FmtNb(bar, 2)) + '] · seuils : vert ≥ ' + s.barriereVert + ' %, rouge &lt; ' + s.barriereRouge + ' %.</div>';
    }).join('');
  }
  regles.push({ titre: 'Barrières des produits à levier', html: hBar });
  // 3. État des ratios de couverture.
  const couvertures = parCat['COUVERTURE'] || [];
  let hCouv = '';
  if (!couvertures.length) {
    hCouv = '<div class="muted">Aucune couverture dans l’état actuel — cette règle affiche le ratio de couverture effectif (delta couvert / delta de la poche couverte) de chaque poche dès l’intégration du relevé.</div>';
  } else {
    hCouv = couvertures.map(c => {
      const poche = Var_State.positions.filter(p => p !== c && (p.ticker === c.sousJacent || (c.sousJacent && p.sousJacent === c.sousJacent && p.categorie !== 'COUVERTURE')));
      const expoPoche = poche.length && poche.every(p => Fn_Num(p.valeurEur) != null) ? poche.reduce((a, p) => a + Fn_Num(p.valeurEur), 0) : null;
      const delta = Fn_Num(c.deltaEur);
      if (delta == null || expoPoche == null || expoPoche === 0) {
        return '<div>' + Fn_Esc(c.ticker) + ' → poche « ' + Fn_Esc(c.sousJacent || '?') + ' » : ratio <b>—</b> — donnée manquante : '
          + (delta == null ? 'delta en € de la couverture (fiche émetteur, via MAJ)' : 'exposition de la poche couverte') + '.</div>';
      }
      const r = Math.abs(delta) / expoPoche * 100;
      const zone = (r < s.ratioCouvMin) ? 'warn' : (r > s.ratioCouvMax ? 'crit' : 'ok');
      return '<div><span class="pastille p-' + zone + '"></span>' + Fn_Esc(c.ticker) + ' → poche « ' + Fn_Esc(c.sousJacent) + ' » : ratio effectif <b class="mono">' + Fn_Esc(Fn_FmtPct(r, 0))
        + '</b> [calcul : |delta| ' + Fn_Esc(Fn_FmtEur(Math.abs(delta))) + ' / exposition ' + Fn_Esc(Fn_FmtEur(expoPoche)) + '] · neutre entre ' + s.ratioCouvMin + ' et ' + s.ratioCouvMax + ' %.</div>';
    }).join('');
    const ordresCouv = Var_State.orders.filter(o => o.categorie === 'COUVERTURE');
    if (ordresCouv.length) {
      hCouv += '<div class="petit" style="margin-top:4px"><span class="pastille p-crit"></span>Couverture reposant sur un ordre NON exécuté = protection nulle (état théorique) : '
        + ordresCouv.map(o => Fn_Esc(o.ticker)).join(', ') + '.</div>';
    }
  }
  regles.push({ titre: 'Ratios de couverture', html: hCouv });
  // 4. Coût de portage agrégé des couvertures.
  let hPort = '';
  const portages = couvertures.map(c => Fn_Num(c.portageMensuelEur)).filter(v => v != null);
  if (!couvertures.length) {
    hPort = '<div class="muted">Aucune couverture — le coût de portage agrégé (mensuel, annualisé, % VN) s’affichera ici.</div>';
  } else if (!portages.length) {
    hPort = '<div>Coût de portage agrégé : <b>—</b> — donnée manquante : portage mensuel estimé de chaque produit de couverture (fiche émetteur, via MAJ).</div>';
  } else {
    const mensuel = portages.reduce((a, v) => a + v, 0);
    const vnObj = Fn_ValeurNette();
    hPort = '<div>Portage des couvertures : <b class="mono">' + Fn_Esc(Fn_FmtEur(mensuel)) + '/mois</b> soit <b class="mono">' + Fn_Esc(Fn_FmtEur(mensuel * 12)) + '/an</b> [calcul : somme des portages produits]'
      + (vnObj ? ' = <b class="mono">' + Fn_Esc(Fn_FmtPct(mensuel * 12 / vnObj.vn * 100)) + '</b> de la VN' + (vnObj.approx ? ' (VN approchée)' : '') : ' · % VN : — (VN inconnue : aperçu de marge à fournir)')
      + (portages.length < couvertures.length ? ' · ' + (couvertures.length - portages.length) + ' produit(s) sans donnée de portage (exclus).' : '.') + '</div>';
  }
  regles.push({ titre: 'Coût de portage des couvertures', html: hPort });
  // 5. Exposition par facteur et par devise.
  let hFact = '';
  const facteurs = {};
  let pctManquant = false;
  Var_State.positions.forEach(p => {
    const pct = Fn_Num(p.pctVN);
    (p.facteurs || []).forEach(f => {
      if (pct == null) { pctManquant = true; return; }
      facteurs[f] = (facteurs[f] || 0) + pct;
    });
  });
  const clesF = Object.keys(facteurs).sort((a, b) => facteurs[b] - facteurs[a]);
  if (!Var_State.positions.length) {
    hFact = '<div class="muted">Aucune position — l’exposition agrégée par facteur de risque (secteur, thème, devise, taux) et par devise s’affichera ici : des lignes corrélées constituent UNE exposition, pas plusieurs.</div>';
  } else {
    hFact = clesF.length
      ? '<div>Facteurs dominants [calcul : somme des % VN des lignes partageant le facteur] : ' + clesF.slice(0, 5).map(f => Fn_Esc(f) + ' <b class="mono">' + Fn_Esc(Fn_FmtPct(facteurs[f], 0)) + '</b>').join(' · ') + (pctManquant ? ' · certaines lignes sans % VN exclues' : '') + '.</div>'
      : '<div>Facteurs : <b>—</b> — donnée manquante : facteurs de risque par ligne (identifiés par l’expertise de consolidation).</div>';
    const dev = {};
    let devManquant = false;
    Var_State.positions.forEach(p => {
      if (!p.devise) { devManquant = true; return; }
      if (p.devise !== 'EUR') {
        const pct = Fn_Num(p.pctVN);
        if (pct == null) { devManquant = true; return; }
        dev[p.devise] = (dev[p.devise] || 0) + pct;
      }
    });
    const clesD = Object.keys(dev);
    hFact += clesD.length
      ? '<div class="petit" style="margin-top:3px">Devises hors EUR : ' + clesD.map(d => Fn_Esc(d) + ' <b class="mono">' + Fn_Esc(Fn_FmtPct(dev[d], 0)) + '</b>').join(' · ') + (devManquant ? ' (données partielles)' : '') + '.</div>'
      : '<div class="petit muted" style="margin-top:3px">Exposition devise hors EUR : ' + (devManquant ? '— (devise ou % VN manquants sur certaines lignes)' : 'aucune détectée') + '.</div>';
  }
  regles.push({ titre: 'Expositions par facteur et par devise', html: hFact });
  return regles;
}

/* ---- Comparaison déterministe snapshot ↔ extraction (filet de sécurité JS) ---- */
function Fn_ComparerSnapshot(extrPositions, extrOrders) {
  const cartes = [];
  const avantP = {};
  Var_State.positions.forEach(p => { if (p.ticker) avantP[p.ticker] = p; });
  const apresP = {};
  (extrPositions || []).forEach(p => { if (p && p.ticker) apresP[p.ticker] = p; });
  Object.keys(apresP).forEach(t => {
    const ap = apresP[t], av = avantP[t];
    if (!av) {
      cartes.push({
        kind: 'nouvelle_ligne', ticker: t, payload: ap,
        summary: 'Nouvelle ligne détectée : ' + t + (ap.libelle ? ' (' + ap.libelle + ')' : '') + ' — ' + (Fn_Num(ap.quantite) != null ? Fn_FmtNb(ap.quantite, 0) + ' titres, ' : '') + Fn_FmtEur(ap.valeurEur) + (ap.categorie ? ', catégorie proposée ' + ap.categorie : ''),
        evidence: 'Présente dans le relevé du jour [relevé], absente de l’état de l’application.',
        proposal: 'Intégrer la ligne avec sa classification et l’ajouter aux instruments suivis.'
      });
    } else if (Fn_Num(av.quantite) != null && Fn_Num(ap.quantite) != null && Fn_Num(av.quantite) !== Fn_Num(ap.quantite)) {
      cartes.push({
        kind: 'maj_ligne', ticker: t, payload: ap,
        summary: 'Quantité modifiée sur ' + t + ' : ' + Fn_FmtNb(av.quantite, 0) + ' → ' + Fn_FmtNb(ap.quantite, 0) + ' titres.',

// Fusion sans doublon : les cartes du bloc `analysis` (expertise) priment, le

function Fn_FusionnerEcarts(cartesModele, cartesLocales) {
  const resultat = [];
  const vues = {};
  (cartesModele || []).forEach(c => {
    resultat.push(c);
    (cartesLocales || []).forEach(l => {
      if (l.kind === c.kind && l.ticker && (c.summary || '').indexOf(l.ticker) >= 0) {
        vues[l.kind + '|' + l.ticker] = 1;
        if (!c.payload) c.payload = l.payload; // rend la carte applicable automatiquement
        if (!c.ticker) c.ticker = l.ticker;
      }
    });
  });
  (cartesLocales || []).forEach(l => {
    if (!vues[l.kind + '|' + (l.ticker || '')]) resultat.push(l);
  });
  return resultat;
}

// ÉLAGAGE DE L'ÉTAT — une carte décidée n'est plus affichée nulle part (les rendus
// filtrent sur « a_valider ») et le dédoublonnage ne consulte que les cartes en
// attente. Sans plafond, elles s'accumulaient sans fin : 51 cartes et 48 actions
// toutes décidées pesaient 170 Ko sur 427, poussés au dépôt à CHAQUE sauvegarde.
// On conserve les plus récentes pour l'audit, et les rejets alimentent la liste
// « refuse » du snapshot pour que le modèle ne les repropose pas.
const Cst_MaxDecidees = 20;
const Cst_MaxTrades = 60;
function Fn_ElaguerEtat() {
  const borner = (liste, plafond) => {
    const attente = liste.filter(x => x && x.statut === 'a_valider');
    const decidees = liste.filter(x => x && x.statut !== 'a_valider').slice(-plafond);
    return attente.concat(decidees);
  };
  Var_State.aValider = borner(Var_State.aValider || [], Cst_MaxDecidees);
  Var_State.actions = borner(Var_State.actions || [], Cst_MaxDecidees);
  if (Var_State.trades.length > Cst_MaxTrades) Var_State.trades = Var_State.trades.slice(-Cst_MaxTrades);
}
function Fn_AssurerInstrument(pos) {
  if (!pos || !pos.ticker) return;
  if (!Var_State.instruments.some(i => i.ticker === pos.ticker)) {
    Var_State.instruments.push({ id: Fn_Uid('inst'), ticker: pos.ticker, isin: pos.isin || '', place: pos.place || '', libelle: pos.libelle || '', categorie: pos.categorie || '' });
  }
}
function Fn_AppliquerEcart(carte, accepte) {
  carte.statut = accepte ? 'acceptee' : 'rejetee';
  carte.dateDecision = Fn_AujISO();
  if (!accepte) return;
  const p = carte.payload;
  switch (carte.kind) {
    case 'nouvelle_ligne':
      if (p && p.ticker && !Fn_PosDe(p.ticker)) { Var_State.positions.push(p); Fn_AssurerInstrument(p); }
      break;
    case 'maj_ligne':
      if (p && p.ticker) {
        const i = Var_State.positions.findIndex(x => x.ticker === p.ticker);
        if (i >= 0) Var_State.positions[i] = Object.assign({}, Var_State.positions[i], p);
        else { Var_State.positions.push(p); Fn_AssurerInstrument(p); }
      }
      break;
    case 'position_soldee':
      if (carte.ticker) Var_State.positions = Var_State.positions.filter(x => x.ticker !== carte.ticker);
      break;
    case 'nouvel_ordre':
      if (p) { if (!p.id) p.id = Fn_Uid('ord'); Var_State.orders.push(p); }
      break;
    case 'ordre_execute':
      if (p) {
        const cle = o => [o.ticker, o.sens, o.quantite, o.limite].map(v => v == null ? '' : String(v)).join('|');
        Var_State.orders = Var_State.orders.filter(o => cle(o) !== cle(p));
      }
      break;
    default:
      // divergence_liquidites / reclassification sans payload applicable :
      // la décision est enregistrée, l'état structurel n'est pas modifié en silence.
      break;
  }
}
function Fn_AccepterEvenementPropose(carte, accepte) {
  carte.statut = accepte ? 'acceptee' : 'rejetee';
  carte.dateDecision = Fn_AujISO();
  if (!accepte || !carte.event) return;
  if (!Var_State.events.some(e => e.id === carte.event.id)) Var_State.events.push(carte.event);
}
function Fn_DeciderAction(action, accepte) {
  action.statut = accepte ? 'acceptee' : 'rejetee';
  action.dateDecision = Fn_AujISO();
  if (!accepte) return;
  const sev = action.priorite === 1 ? 'Crit' : (action.priorite === 2 ? 'Warn' : 'Info');
  const base = (action.ticker ? action.ticker + ' — ' : '') + (action.proposition || 'action proposée');
  const id = Fn_Slug('action-' + base) + '-' + Fn_AujISO();
  if (Var_State.events.some(e => e.id === id)) return;
  Var_State.events.push({
    id, date: Fn_AujISO(), sev,
    titre: 'Action : ' + (base.length > 90 ? base.slice(0, 90) + '…' : base),
    tags: ['ACTION'].concat(action.ticker ? [action.ticker] : []),
    unc: false,
    metrics: [{ label: 'priorité', value: 'P' + (action.priorite || 3) }, { label: 'horizon', value: action.horizon || '—' }],
    surveiller: action.declencheur || '—',
    arbitrage: (action.proposition || '') + (action.coutBenefice ? ' · Coût/bénéfice : ' + action.coutBenefice : ''),
    pratique: 'Condition d’invalidation : ' + (action.invalidation || 'non fournie — à définir avant exécution.'),
    src: 'consolidation du ' + Fn_FmtDateCourt(Fn_AujISO()),
    traite: false, ajoutManuel: false
  });
}

      id: Fn_Uid('act'), ticker: ticker,
      priorite: (prio === 1 || prio === 2 || prio === 3) ? prio : 3,
      proposition, declencheur: Fn_Ch(a, ['decl', 'declencheur']) || '',
      coutBenefice: Fn_Ch(a, ['cb', 'coutBenefice']) || '', horizon: Fn_Ch(a, ['hor', 'horizon']) || '',
      invalidation: Fn_Ch(a, ['inval', 'invalidation']) || '', statut: 'a_valider', dateProposition: Fn_AujISO()
    });
    cartes++;
  });

  // Découverte d’opportunités : sélection courte issue de la recherche web, datée de
  // la fin de la consolidation. Les fiches modifiées manuellement sont verrouillées :
  // une nouvelle version du modèle reste disponible sans écraser le travail local.
  let nbOpportunites = 0;
  (data.opportunities || []).forEach(o => {
    const libelle = Fn_Ch(o, ['lib', 'libelle']);
    const ticker = String(Fn_Ch(o, ['t', 'ticker']) || '').trim().toUpperCase();
    if (!ticker && !libelle) return;
    // Clé de rapprochement : celle renvoyée par le modèle (fiche déjà ouverte)
    // sinon le ticker, sinon le libellé — pour mettre à jour au lieu de dupliquer.
    const cle = Fn_Ch(o, ['k', 'cleModele']) || ticker || Fn_Slug(libelle || 'opportunite');
    const verdict = Fn_Ch(o, ['verdict', 'verdictCoherence']);
    const facteurs = Fn_Ch(o, ['fact', 'facteurs']);
    const score = Fn_Num(Fn_Ch(o, ['score']));
    const incoming = {
      ticker, isin: Fn_Ch(o, ['isin']) || '', place: Fn_Ch(o, ['place']) || '',
      libelle: libelle || ticker || 'Opportunité',
      type: Fn_Ch(o, ['type']) || 'watchlist', these: Fn_Ch(o, ['these']) || '',
      coherencePortefeuille: Fn_Ch(o, ['coh', 'coherencePortefeuille']) || '',
      verdictCoherence: (verdict === 'cohérente' || verdict === 'sous conditions' || verdict === 'incohérente') ? verdict : 'sous conditions',
      financement: Fn_Ch(o, ['fin', 'financement']) || '', dateCatalyseur: Fn_Ch(o, ['cataDate', 'dateCatalyseur']),
      tailleEur: Fn_Num(Fn_Ch(o, ['tailleEur'])),
      facteurs: Array.isArray(facteurs) ? facteurs.filter(Boolean) : [], devise: Fn_Ch(o, ['dev', 'devise']),
      score: Math.max(0, Math.min(100, score == null ? 50 : score)),
      conviction: Fn_Ch(o, ['conv', 'conviction']) || 'moyenne', prixReference: Fn_Ch(o, ['prixRef', 'prixReference']),
      asOf: Fn_Ch(o, ['as', 'asOf']), valorisation: Fn_Ch(o, ['valo', 'valorisation']) || '',
      catalyseurs: Fn_Ch(o, ['cata', 'catalyseurs']) || '',
      declencheur: Fn_Ch(o, ['decl', 'declencheur']) || '', invalidation: Fn_Ch(o, ['inval', 'invalidation']) || '',
      risques: Fn_Ch(o, ['risques']) || '', horizon: Fn_Ch(o, ['hor', 'horizon']) || '',
      allocationCiblePctVN: Fn_Num(Fn_Ch(o, ['allocPct', 'allocationCiblePctVN'])),
      liquidite: Fn_Ch(o, ['liq', 'liquidite']) || '', src: Fn_Ch(o, ['s', 'src']) || '',
      url: Fn_UrlSure(Fn_Ch(o, ['u', 'url'])),
      dateMaj: ts, modele: (journal && journal.modele) || Cst_ModeleMAJ
    };
    let existante = Var_State.opportunites.find(x => (x.cleModele || x.ticker || '') === cle && x.statut !== 'supprimee');
    if (!existante) det.oppNouvelles++; else det.oppConnues++;
    if (!existante) {
      Var_State.opportunites.push(Object.assign({
        id: Fn_Uid('opp'), cleModele: cle, statut: 'a_etudier', noteUtilisateur: '',
        verrouille: false, modifieManuellement: false, modifieLe: null, versionModeleEnAttente: null
      }, incoming));
    } else if (existante.verrouille) {
      existante.versionModeleEnAttente = incoming;
      existante.dateMajModele = ts;
    } else {
      const garde = { id: existante.id, statut: existante.statut || 'a_etudier', noteUtilisateur: existante.noteUtilisateur || '', cleModele: cle };
      Object.assign(existante, incoming, garde, { versionModeleEnAttente: null });
    }
    nbOpportunites++;
  });
  if (journal) journal.opportunitesProduites = nbOpportunites;
  Var_State.derniereConsolidation = ts;
  Fn_ElaguerEtat(); // borne l'état AVANT la sauvegarde qui suit, donc avant la poussée au dépôt
  return cartes;
}

// Pastille de la barre d'onglets : fiches de la dernière synchronisation encore à étudier.
function Fn_NbOpportunitesNouvelles() {
  return (Var_State.opportunites || []).filter(o => o && o.statut === 'a_etudier' && Fn_OpportuniteRecente(o)).length;
}
function Fn_MajBadgeOppo() {
  const el = document.getElementById('nav-oppo-n');

  el.textContent = n ? String(n) : '';
}
function Fn_OpportuniteRecente(o) {
  const dc = Fn_Num(Var_State.derniereConsolidation);
  return !!(dc && Fn_Num(o.dateMaj) === dc);
}
// Statut « retenue » : SEULE bascule qui touche au reste de l'application — l'instrument entre
// dans la liste suivie (donc consolidé aux MAJ suivantes) et le catalyseur daté rejoint le
// calendrier de Vigie, marqué « à confirmer ». Aucun ordre n'est passé, jamais.
function Fn_OpportuniteRetenue(o) {
  if (!o || o.statut !== 'retenue') return;
  if (o.ticker) Fn_AssurerInstrument({ ticker: o.ticker, isin: o.isin, place: o.place, libelle: o.libelle, categorie: '' });
  if (!o.dateCatalyseur) return;
  const idEv = Fn_Slug((o.ticker ? o.ticker + '-' : '') + 'opportunite-' + (o.libelle || '')) + '-' + o.dateCatalyseur;
  if (Var_State.events.some(e => e.id === idEv)) return;
  const tags = ['OPPORTUNITÉ'];
  if (o.ticker) tags.unshift(o.ticker);
  Var_State.events.push({
    id: idEv, date: o.dateCatalyseur,
    titre: 'Opportunité retenue — ' + (o.libelle || o.ticker || ''),
    sev: (o.verdictCoherence === 'incohérente') ? 'Warn' : 'Info',
    court: ('Oppo. ' + (o.ticker || o.libelle || '')).slice(0, 28),
    tags, unc: true,
    metrics: [
      { label: 'taille envisagée', value: (Fn_Num(o.tailleEur) != null ? Fn_FmtEur(o.tailleEur, 0) : '— (non dimensionnée)') + (Fn_Num(o.allocationCiblePctVN) != null ? ' (' + Fn_FmtPct(o.allocationCiblePctVN, 1) + ' VN)' : '') },
      { label: 'cohérence portefeuille', value: (o.verdictCoherence || 'à qualifier') + (o.coherencePortefeuille ? ' — ' + o.coherencePortefeuille : '') }
    ],
    surveiller: o.declencheur || o.catalyseurs || '', arbitrage: o.financement || '', pratique: o.invalidation || '',
    src: o.src || 'fiche opportunité', traite: false, ajoutManuel: false
  });
}
function Fn_StatutOpportuniteLibelle(s) {
  return ({ a_etudier: 'À étudier', surveiller: 'À surveiller', retenue: 'Retenue', archivee: 'Archivée' })[s] || 'À étudier';
}
// Cadre d'exposition : la grille de lecture chiffrée contre laquelle chaque fiche est jugée.
function Fn_HtmlCadreExposition() {
  const p = Fn_ProfilExposition();
  const gf = p.gardeFous;
  const ouvert = !!Var_State.panneaux.oppoCadre;
  let h = '<div class="carte"><button type="button" class="panneau-tete' + (ouvert ? ' ouvert' : '') + '" data-action="toggle" data-id="oppoCadre">'
    + '<span>Cadre d’exposition — la grille de lecture de chaque fiche</span><span class="chevron">▶</span></button>';
  if (!ouvert) return h + '</div>';
  const s = Var_State.seuils;
  // Chaque grandeur porte sa zone (vert / ambre / rouge) calculée sur les seuils
  // de Paramètres. La marge disponible n'a pas de seuil propre — seul son
  // épuisement (≤ 0, appel de marge imminent) mérite le rouge ; la valeur nette
  // n'est pas un risque, elle reste neutre.
  const zoneMarge = (p.margeDisponibleEur == null) ? null : (p.margeDisponibleEur <= 0 ? 'crit' : null);
  const mets = [
    ['valeur nette', p.valeurNetteEur != null ? Fn_FmtEur(p.valeurNetteEur, 0) : '— (donnée manquante : aperçu de marge)', null],
    ['coussin de marge', Fn_FmtPct(p.coussinMargePct, 1) + ' (vert dès ' + Fn_FmtPct(s.coussinVert, 0) + ', rouge sous ' + Fn_FmtPct(gf.coussinRougeSousPct, 0) + ')',
      Fn_ZoneSeuil(p.coussinMargePct, s.coussinVert, s.coussinRouge, 'bas')],
    ['levier brut', Fn_FmtX(p.levierBrut) + ' (vert jusqu’à ' + Fn_FmtX(s.levierVert) + ', rouge au-delà de ' + Fn_FmtX(gf.levierRougeAuDelaDe) + ')',
      Fn_ZoneSeuil(p.levierBrut, s.levierVert, s.levierRouge, 'haut')],
    ['marge disponible', Fn_FmtEur(p.margeDisponibleEur, 0), zoneMarge]
  ];
  h += '<div class="mets">' + mets.map(m => '<span class="met' + (m[2] ? ' z-' + m[2] : '') + '">'
    + Fn_Gloss(Fn_Esc(m[0])) + ' → <b>' + Fn_Gloss(Fn_Esc(m[1])) + '</b></span>').join('') + '</div>';
  // Concentrations : le signe ne change rien au risque (une exposition vendeuse
  // de -50 % concentre autant qu'une acheteuse), d'où la valeur absolue. Pas de
  // vert ici : une exposition sous le seuil n'appelle aucune action, la colorer
  // en vert noierait les deux ou trois qui en appellent vraiment une.
  const bloc = (titre, liste, vert, rouge, n) => {
    if (!liste.length) return '';
    return '<div class="cours-ligne expo-ligne"><span class="lib">' + Fn_Esc(titre) + '</span> '
      + liste.slice(0, n).map(x => {
        const z = Fn_ZoneSeuil(x.pctVN == null ? null : Math.abs(x.pctVN), vert, rouge, 'haut');
        return '<span class="met' + (z === 'crit' || z === 'warn' ? ' z-' + z : '') + '">'
          + Fn_Gloss(Fn_Esc(x.cle)) + ' → <b>' + Fn_Esc(Fn_FmtPct(x.pctVN, 1)) + '</b></span>';
      }).join(' ') + '</div>';
  };
  h += '<div class="mets" style="display:block">'
    + bloc('Facteurs (delta agrégé)', p.expositionParFacteur, s.concFacteurVert, s.concFacteurRouge, 5)
    + bloc('Devises', p.expositionParDevise, s.deviseVert, s.deviseRouge, 4)
    // Les catégories n'ont pas de seuil : leur répartition est un choix de
    // gestion, pas une limite de risque. Neutres, et c'est dit sous le cadre.
    + bloc('Catégories', p.expositionParCategorie, null, null, 6)
    + '</div>';
  const chaudes = p.lignes.filter(l => l.pctVN != null && l.pctVN > gf.concentrationLigneRougeAuDelaDePctVN);
  if (chaudes.length) {
    h += '<div class="note note-crit">Concentration par ligne déjà au-dessus du plafond rouge (' + Fn_Esc(Fn_FmtPct(gf.concentrationLigneRougeAuDelaDePctVN, 0)) + ' de la VN) : '
      + chaudes.map(l => Fn_Esc(l.ticker) + ' ' + Fn_Esc(Fn_FmtPct(l.pctVN, 1))).join(' · ')
      + ' — aucune fiche ne doit renforcer ces lignes ni leur facteur.</div>';
  }
  if (p.coussinMargePct != null && p.coussinMargePct < gf.coussinRougeSousPct) {
    h += '<div class="note note-crit">' + Fn_Gloss(Fn_Esc('Coussin de marge sous le seuil rouge : toute fiche retenue doit être auto-financée (financement par arbitrage — vendre avant d’acheter), jamais ajoutée au brut.')) + '</div>';
  }
  h += '<div class="tres-petit muted" style="margin-top:6px">Base : ' + Fn_Gloss(Fn_Esc(p.valeurNetteSrc || '—')) + '.'
    + ' Couleurs calculées ici même, en comparant ces chiffres à vos seuils (Paramètres → Seuils) : ambre au-delà du seuil vert, rouge au-delà du seuil rouge, en valeur absolue — une exposition vendeuse concentre autant qu’une acheteuse.'
    + ' Les catégories restent neutres : leur répartition relève de votre choix de gestion, pas d’une limite de risque.</div>';
  return h + '</div>';
}

// État de santé d'une MAJ en cours — répond à la seule question qui compte quand
// l'écran ne bouge plus : « est-ce que ça avance, ou est-ce planté ? ».
// Le statut persisté ne suffit pas : une MAJ dont l'onglet a été rechargé reste
// « en cours » dans l'état alors que plus rien ne tourne. On croise donc trois
// signaux — exécution locale, âge du dernier octet reçu, mode d'appel.
function Fn_MajSante(journal) {
  const rt = Var_State._runtime;
  if (!journal || journal.statut !== 'en cours') return null;
  if (!rt.enCours) {
    return { cls: 'badge-crit', txt: '✗ plus aucune MAJ ne tourne dans cet onglet — relancer' };
  }
  const sig = rt.dernierSignal;
  if (!sig) return { cls: 'badge-info', txt: '⟳ appel en cours — pont d’artefact, sans flux : pas de suivi seconde par seconde' };
  const s = Math.round((Date.now() - sig) / 1000);
  if (document.hidden) return { cls: 'badge-info', txt: '⟳ en cours — onglet en arrière-plan, surveillance suspendue' };
  if (s < 45) return { cls: 'badge-ok', txt: '✓ tout se passe normalement — flux actif (' + s + ' s)' };
  if (s < 120) return { cls: 'badge-info', txt: '⏳ silence de ' + s + ' s — normal pendant une recherche web ou une phase de réflexion' };
  if (s < 300) return { cls: 'badge-warn', txt: '⚠ silence de ' + Math.floor(s / 60) + ' min ' + (s % 60) + ' s — le flux est peut-être rompu' };
  return { cls: 'badge-crit', txt: '✗ silence de plus de 5 min — coupure automatique imminente' };
}
// Diagramme de contrôle du flux + barre de progression. L'avancement se lit sur
// les ÉTAPES FRANCHIES, jamais sur le temps écoulé : une durée ne dit rien de ce
// qui reste à faire, et une barre qui progresse toute seule pendant qu'un appel
// est mort donnerait exactement la fausse assurance qu'on cherche à supprimer.
function Fn_HtmlFluxMAJ(journal) {
  const phases = journal.phases || [];
  if (!phases.length) return '';
  const faites = phases.filter(p => p.statut === 'ok').length;
  const enCours = phases.filter(p => p.statut === 'en cours').length;
  const echec = phases.some(p => p.statut === 'echec');
  // Une étape en cours compte pour une demie : elle est engagée, pas franchie.
  const pct = Math.round(Math.min(100, (faites + enCours * 0.5) / phases.length * 100));
  const clsJauge = echec ? ' f-echec' : (faites === phases.length ? ' f-ok' : '');
  let h = '<div class="flux-barre"><div class="flux-jauge' + clsJauge + '" style="width:' + pct + '%"></div></div>'
    + '<div class="tres-petit muted" style="margin:-2px 0 6px">Avancement : <b class="mono">' + faites + '/' + phases.length + '</b> étape(s) franchie(s)'
    + (echec ? ' · <b style="color:var(--crit)">arrêt sur échec</b>' : (enCours ? ' · <b style="color:var(--accent)">1 en cours</b>' : '')) + '</div>'
    + '<div class="flux">';
  phases.forEach(p => {
    const ico = p.statut === 'ok' ? '✓' : (p.statut === 'echec' ? '✗' : (p.statut === 'en cours' ? '◌' : '·'));
    const cls = p.statut === 'ok' ? ' f-ok' : (p.statut === 'echec' ? ' f-echec' : (p.statut === 'en cours' ? ' f-encours' : ''));
    h += '<span class="flux-etape' + cls + '" title="' + Fn_Esc(p.message || '') + '">'
      + '<span class="f-ico">' + ico + '</span>' + Fn_Esc(p.cle) + '</span>';
  });
  return h + '</div>';
}

    if (journal) {

      h += '<hr class="sep"><div class="carte-titre">Avancement — MAJ du ' + Fn_Esc(Fn_FmtHeure(journal.debutTs)) + '</div>';
      if (majEnCours) {
        h += '<div class="maj-compteurs">'
          + '<span class="met">modèle <b id="maj-modele">' + Fn_Esc(journal.modele || '…') + '</b></span>'
          + '<span class="met">recherches <b id="maj-rech">' + (journal.recherches || 0) + '</b></span>'
          + '<span class="met">jetons reçus <b id="maj-jetons">≈ ' + Fn_Esc(Fn_FmtNb(journal.jetonsSortie || 0, 0)) + '</b></span>'
          + '<span class="met">chrono <b id="maj-chrono">' + Fn_Esc(Fn_DureeFmt(Date.now() - journal.debutTs)) + '</b></span>'
          + (journal.mode === 'byok' ? '<span class="met met-large">dernier signal <b id="maj-signal">…</b></span>' : '')
          + '</div>'
          // Verdict en clair, rafraîchi chaque seconde par le tic du chrono.
          + '<div class="maj-sante"><span class="badge" id="maj-sante-badge"></span></div>'
          + (journal.mode === 'byok'
            ? '<div class="tres-petit muted">« jetons reçus » est ESTIMÉ pendant le flux (l’usage exact n’arrive qu’à la fin — le bilan le corrigera). Si « dernier signal » dépasse 2 min (rouge), le flux est probablement rompu : Annuler puis relancer. Coupure automatique après 5 min sans signal — ce décompte est SUSPENDU quand l’onglet passe en arrière-plan et repart de zéro à votre retour : vous pouvez changer d’onglet ou d’application sans interrompre la MAJ.</div>'
            : '');
      }
      h += Fn_HtmlFluxMAJ(journal);
      h += '<ul class="maj-phases">' + (journal.phases || []).map(p => {
        const ico = p.statut === 'ok' ? '✓' : (p.statut === 'echec' ? '✗' : (p.statut === 'en cours' ? '◌' : '·'));
        const cls = p.statut === 'ok' ? 'ph-ok' : (p.statut === 'echec' ? 'ph-echec' : (p.statut === 'en cours' ? 'ph-encours' : 'ph-attente'));
        // ph-txt : une seule ligne, tronquée si besoin (hauteur constante quelle
        // que soit la longueur du message) ; title = le message intégral.
        return '<li class="' + cls + '"><span class="ph-ico">' + ico + '</span><span class="ph-txt" title="' + Fn_Esc(p.message) + '">' + Fn_Gloss(Fn_Esc(p.message)) + ' <span class="tres-petit muted mono">' + Fn_Esc(Fn_FmtHeure(p.ts).split(' ').pop() || '') + '</span></span></li>';
      }).join('') + '</ul>';
      // Requêtes web journalisées : on sait TOUJOURS quelle était la dernière recherche.
      // Pendant la MAJ le bloc est présent DÈS LE DÉPART (même vide) et de hauteur
      // figée : la liste s'allonge à chaque recherche par défilement interne, sans
      // repousser d'un pixel ce qui suit. Une fois la MAJ finie, plus rien ne bouge :
      // le bloc reprend sa hauteur naturelle et se lit d'un seul tenant.
      const requetes = journal.listeRecherches || [];
      if (majEnCours || requetes.length) {
        // Une requête PAR LIGNE : en paragraphe continu, la dernière — la seule
        // qui renseigne sur ce qui se passe maintenant — était noyée au milieu.
        h += '<div class="tres-petit muted' + (majEnCours ? ' maj-requetes' : '') + '" style="margin:2px 0 6px">'
          + '<div class="maj-req-l"><b>Requêtes web (' + requetes.length + ')</b></div>'
          + (requetes.length
            ? requetes.map((q, i) => '<div class="maj-req-l">' + (i + 1) + '. « ' + Fn_Esc(q) + ' »</div>').join('')
            : '<div class="maj-req-l">— aucune recherche lancée pour l’instant</div>')
          + '</div>';
      }
      if (journal.message && journal.statut !== 'en cours') {
        const nCls = journal.statut === 'echec' || journal.statut === 'interrompue' ? 'note-crit' : (journal.tronque ? 'note-warn' : 'note-ok');
        h += '<div class="note ' + nCls + '">' + Fn_Gloss(Fn_Esc(journal.message)) + '</div>';
      }
      // Bilan affiché pour TOUTE issue, y compris échec et interruption : un appel
      // coupé en route a bel et bien consommé des jetons et des recherches web,
      // et cette dépense doit rester sous les yeux — c'est elle qui explique la
      // facture. Seul le bouton d'export est réservé aux MAJ qui ont intégré des
      // données (rien à exporter après un échec).
      if (!majEnCours) {
        const t = Var_State.tarifs;
        const aboutie = journal.statut === 'terminee' || journal.statut === 'partielle';
        h += '<div class="carte-titre" style="margin-top:8px">Bilan de l’appel' + (aboutie ? '' : ' (interrompu — dépense déjà engagée)') + '</div><div class="maj-compteurs">'
          + '<span class="met">modèle <b>' + Fn_Esc(journal.modele || '?') + '</b></span>'
          + '<span class="met">durée <b>' + Fn_Esc(Fn_DureeFmt((journal.finTs || Date.now()) - journal.debutTs)) + '</b></span>'
          + '<span class="met">recherches <b>' + (journal.recherches || 0) + '</b></span>'
          + '<span class="met">jetons entrée <b>' + Fn_Esc(Fn_FmtNb(journal.jetonsEntree || 0, 0)) + '</b></span>'
          + '<span class="met">jetons sortie <b>' + Fn_Esc(Fn_FmtNb(journal.jetonsSortie || 0, 0)) + '</b></span>'
          + '<span class="met">coût estimé <b>' + Fn_Esc(Fn_FmtUsd(journal.coutUsd)) + '</b></span>'
          + '</div>'
          + Fn_HtmlBilanTraitement(journal)
          + '<div class="tres-petit muted">Coût estimé aux tarifs de Paramètres → Accès API (' + t.entreeParM + ' $/M entrée · ' + t.sortieParM + ' $/M sortie · ' + t.recherchePour1000 + ' $/1000 recherches — à vérifier sur docs.claude.com).'
          + (aboutie ? '' : ' Sur un appel interrompu, les jetons de sortie sont ceux ESTIMÉS pendant le flux : le décompte exact n’arrive qu’avec la fin de la réponse, qui n’a pas eu lieu. Le montant réel se lit sur console.anthropic.com.')
          + '</div>'
          + (aboutie
            ? '<div class="tres-petit muted">État enregistré et envoyé au dépôt privé : vos autres appareils le reprendront à l’ouverture (détails : Paramètres → Synchronisation entre appareils).</div>'
            : '');
      }
      const c = Var_State.cumulApi;
      h += '<div class="tres-petit muted" style="margin-top:6px">Cumul local : ' + c.appels + ' appel(s) · ' + Fn_FmtNb(c.jetonsEntree, 0) + ' jetons entrée · ' + Fn_FmtNb(c.jetonsSortie, 0) + ' jetons sortie · ' + c.recherches + ' recherche(s) · ≈ ' + Fn_FmtUsd(c.coutUsd) + '.<br>'
        + 'Crédit restant : l’API ne l’expose pas à une clé standard — consultez console.anthropic.com ; le cumul local ci-dessus n’est qu’une estimation.</div>';
      if (Var_State.majJournaux.length > 1) {
        h += '<div class="rang-btn"><button class="btn" data-action="toggle" data-id="journal">' + (Var_State.panneaux.journal ? 'Masquer' : 'Voir') + ' l’historique des MAJ (' + (Var_State.majJournaux.length - 1) + ')</button></div>';
        if (Var_State.panneaux.journal) {
          h += Var_State.majJournaux.slice(1, 8).map(j =>
            '<div class="tres-petit" style="padding:3px 0;border-top:1px solid var(--line)"><span class="mono">' + Fn_Esc(Fn_FmtHeure(j.debutTs)) + '</span> — ' + Fn_Esc(j.mode) + ' — ' + Fn_Esc(j.statut)
            + (j.coutUsd ? ' — ≈ ' + Fn_Esc(Fn_FmtUsd(j.coutUsd)) : '') + (j.message ? '<br><span class="muted">' + Fn_Esc(j.message) + '</span>' : '') + '</div>'
          ).join('');
        }
      }
    }
  }
  h += '</div>';
  el.innerHTML = h;
  // La boîte des requêtes web reste calée sur sa dernière ligne : la recherche en
  // cours est toujours visible, et ce défilement INTERNE ne déplace pas la page.
  const boiteReq = el.querySelector('.maj-requetes');
  if (boiteReq) boiteReq.scrollTop = boiteReq.scrollHeight;
  // Le verdict est écrit DÈS LE RENDU, pas seulement par le tic : si le tic ne
  // tourne pas (MAJ orpheline), c'est précisément l'information à afficher.
  Fn_MajAfficherSante(journal);
}

/* ---- Vue calendrier : 8 prochaines semaines ---- */
function Fn_RenderCalendrier() {
  const el = document.getElementById('v-cal');
  const parJour = {};
  Var_State.events.forEach(e => {
    if (!e.date) return;
    const o = parJour[e.date] = parJour[e.date] || { n: 0, sev: 9, actifs: 0, evs: [] };
    o.n++;
    o.evs.push(e);
    if (!e.traite) {
      o.actifs++;
      const s = Cst_SevOrdre[e.sev] != null ? Cst_SevOrdre[e.sev] : 2;
      if (s < o.sev) o.sev = s;
    }
  });
  // Tickers connus (instruments, sous-jacents, ordres) pour préfixer le libellé
  // de case par le nom court de l'instrument concerné — dynamique après chaque MAJ.
  const tickersConnus = {};
  Fn_ListeInstruments().forEach(i => { if (i.ticker) tickersConnus[i.ticker] = 1; });
  Var_State.orders.forEach(o => { if (o.ticker) tickersConnus[o.ticker] = 1; });
  const lundi = Fn_ParseDate(Fn_SemaineLundi(Fn_AujISO()));
  const aujIso = Fn_AujISO();
  let h = '<div class="carte"><div class="carte-titre">Calendrier — 8 prochaines semaines</div>'
    + '<div class="cal-entete">' + Cst_JoursSem.map(j => '<div>' + j + '</div>').join('') + '</div>'
    + '<div class="cal-grille">';
  const d = new Date(lundi.getTime());
  for (let i = 0; i < 56; i++) {
    const iso = Fn_DateISO(d);
    const info = parJour[iso];
    const cls = ['cal-jour'];
    if (iso < aujIso) cls.push('cal-passe');
    if (iso === aujIso) cls.push('cal-auj');
    if (Var_State.filtreJour === iso) cls.push('cal-sel');
    if (info && info.actifs && info.sev === 0) cls.push('cal-crit');
    let contenu;
    if (info) {
      // Détail dans la case : date JJ/MM/AA + UNE ligne par événement (tronquée),
      // non traités d'abord par sévérité — dérivé de l'état, donc suit chaque MAJ.
      const tries = info.evs.slice().sort((a, b) => (a.traite === b.traite
        ? (Cst_SevOrdre[a.sev] != null ? Cst_SevOrdre[a.sev] : 3) - (Cst_SevOrdre[b.sev] != null ? Cst_SevOrdre[b.sev] : 3)
        : (a.traite ? 1 : -1)));
      const lignes = tries.slice(0, 3).map(ev => {
        const tk = (ev.tags || []).find(t => tickersConnus[t]) || null;
        // Libellé court dédié (seed ou labelCourt de la MAJ), sinon titre abrégé.
        let resume = ev.court ? String(ev.court) : Fn_AbregerTitre(ev.titre);
        if (tk && resume.indexOf(tk) !== 0) resume = tk + ' · ' + resume;
        const sc = ev.traite ? 'fait' : (ev.sev === 'Crit' ? 'crit' : ev.sev === 'Warn' ? 'warn' : 'info');
        return '<span class="cal-evt cal-evt-' + sc + '">' + Fn_Esc(resume) + '</span>';
      });
      if (tries.length > 3) lignes[2] = '<span class="cal-evt cal-evt-fait">+ ' + (tries.length - 2) + ' autres événements…</span>';
      const p = info.actifs ? (info.sev === 0 ? 'p-crit' : info.sev === 1 ? 'p-warn' : 'p-info') : 'p-neutre';
      const jjmmaa = iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(2, 4);
      contenu = '<span class="cal-date">' + jjmmaa + '</span>'
        + lignes.join('')
        + '<span class="cal-dot ' + p + '"></span><span class="cal-n">' + info.n + '</span>';
    } else {
      const moisLib = (d.getDate() === 1 || i === 0) ? '<span class="cal-mois">' + Fn_Esc(new Intl.DateTimeFormat('fr-FR', { month: 'short' }).format(d)) + '</span>' : '';
      contenu = moisLib + d.getDate();
    }
    h += '<div class="' + cls.join(' ') + '" data-action="cal-jour" data-id="' + iso + '">' + contenu + '</div>';
    d.setDate(d.getDate() + 1);
  }
  h += '</div><div class="tres-petit muted" style="margin-top:5px">Un appui sur un jour filtre la timeline · libellé = événement le plus sévère du jour (le nombre compte tous les événements) · pastille = sévérité maximale.</div></div>';
  el.innerHTML = h;
}
/* ---- Filtres dynamiques (chips) ---- */
function Fn_RenderChips() {
  const el = document.getElementById('v-chips');
  const tags = Fn_TagsDisponibles();
  let h = '';
  if (Var_State.filtreJour) {
    h += '<div class="bandeau-filtre"><span>Timeline filtrée sur le <b class="mono">' + Fn_Esc(Fn_FmtDate(Var_State.filtreJour)) + '</b></span>'
      + '<button class="btn" style="min-height:28px;padding:3px 10px" data-action="filtre-jour-clear">✕</button></div>';
  }
  if (tags.length) {
    // Chaque chip porte le code couleur des sévérités NON traitées du tag + le nombre
    // d'événements concernés — recalculés depuis l'état à chaque rendu (donc après MAJ).
    const stats = {};
    const sevsTotal = {};
    Var_State.events.forEach(e => {
      (e.tags || []).forEach(t => {
        const s = stats[t] = stats[t] || { n: 0, sevs: {} };
        s.n++;
        if (!e.traite) s.sevs[e.sev || 'Info'] = 1;
      });
      if (!e.traite) sevsTotal[e.sev || 'Info'] = 1;
    });
    const pastilles = sevs => {
      const l = ['Crit', 'Warn', 'Info'].filter(s => sevs[s])
        .map(s => '<span class="pastille p-' + (s === 'Crit' ? 'crit' : s === 'Warn' ? 'warn' : 'info') + '"></span>').join('');
      return l || '<span class="pastille p-neutre"></span>';
    };
    h += '<div class="chips"><button class="chip' + (Var_State.filtreTag ? '' : ' actif') + '" data-action="chip" data-id="">' + pastilles(sevsTotal) + 'Tous<span class="chip-n">' + Var_State.events.length + '</span></button>'
      + tags.map(t => {
        const s = stats[t] || { n: 0, sevs: {} };
        return '<button class="chip' + (Var_State.filtreTag === t ? ' actif' : '') + '" data-action="chip" data-id="' + Fn_Esc(t) + '">' + pastilles(s.sevs) + Fn_Esc(t) + '<span class="chip-n">' + s.n + '</span></button>';
      }).join('')
      + '</div>';
  }
  el.innerHTML = h;
}
/* ---- Carte d'événement (date+compteur · titre · tags · badge · métriques · S/A/P · boutons) ---- */
function Fn_HtmlEvCarte(ev, opts) {
  opts = opts || {};
  const c = Fn_Compteur(ev.date, ev.traite);
  let h = '<div class="ev sev-' + Fn_Esc(ev.sev || 'Info') + (ev.traite ? ' traite' : '') + '">';
  h += '<div class="ev-haut"><span class="ev-date">' + Fn_Esc(Fn_FmtDate(ev.date)) + '</span>'
    + '<span class="compteur ' + c.cls + '" data-compteur data-date="' + Fn_Esc(ev.date) + '" data-traite="' + (ev.traite ? '1' : '0') + '">' + Fn_Esc(c.label) + '</span></div>';
  h += '<div class="ev-titre">' + Fn_Gloss(Fn_Esc(ev.titre)) + '</div>';
  const tags = (ev.tags || []).map(t => '<span class="tag">' + Fn_Esc(t) + '</span>').join('');
  let badge = ev.unc ? '<span class="badge badge-warn">à confirmer</span>' : '';
  // L'état « traité » s'affiche en badge (état) — le bouton, lui, ne décrit que l'ACTION.
  if (ev.traite) badge += '<span class="badge badge-ok">✓ traité' + (ev.traiteLe ? ' le ' + Fn_Esc(Fn_FmtDateCourt(ev.traiteLe)) : '') + '</span>';
  if (tags || badge) h += '<div class="tags">' + tags + badge + '</div>';
  // Rangée de métriques : obligatoire sur chaque carte — « — » avec donnée manquante nommée sinon.
  if (ev.metrics && ev.metrics.length) {
    h += '<div class="mets">' + ev.metrics.map(m => '<span class="met">' + Fn_Gloss(Fn_Esc(m.label)) + ' → <b>' + Fn_Gloss(Fn_Esc(m.value)) + '</b></span>').join('') + '</div>';
  } else {
    h += '<div class="mets"><span class="met">— <span class="muted">métriques non chiffrées (donnée manquante : relevé + consolidation MAJ)</span></span></div>';
  }
  // Les trois registres de décision, en cartes distinctes : ce qu'il faut LIRE,
  // ce qu'il faut TRANCHER, la règle de métier à APPLIQUER.
  const blocs = Fn_HtmlSvap('surv', ev.surveiller) + Fn_HtmlSvap('arb', ev.arbitrage) + Fn_HtmlSvap('prat', ev.pratique);
  h += blocs
    ? '<div class="svap">' + blocs + '</div>'
    : '<div class="svap"><div class="svap-carte"><div class="svap-txt muted tres-petit">Surveiller / Arbitrage / Pratique : à compléter par une consolidation (événement ajouté manuellement).</div></div></div>';
  if (ev.src || ev.url) h += '<div class="src">Source : ' + Fn_Gloss(Fn_Esc(ev.src || '')) + (ev.url ? ' · ' + Fn_Lien(ev.url) : '') + '</div>';
  if (!opts.apercu) {
    const arme = !!Var_State._runtime.armes['ev-' + ev.id];
    h += '<div class="ev-actions">'
      + '<button class="btn" data-action="ev-traite" data-id="' + Fn_Esc(ev.id) + '">' + (ev.traite ? 'Rouvrir' : 'Marquer traité') + '</button>'
      + '<button class="btn btn-danger' + (arme ? ' arme' : '') + '" data-action="ev-suppr" data-id="' + Fn_Esc(ev.id) + '">' + (arme ? 'Confirmer ?' : 'Supprimer') + '</button>'
      + '</div>';
  }
  h += '</div>';
  return h;
}
/* ---- Timeline groupée par semaine, retards en tête ---- */
function Fn_RenderTimeline() {
  const el = document.getElementById('v-timeline');
  if (!Var_State.events.length) {
    el.innerHTML = '<div class="carte vide">Aucun événement dans la vigie. Lancez une MAJ des données (les catalyseurs de chaque position seront proposés en cartes « à valider ») ou ajoutez un événement manuellement ci-dessous.</div>';
    return;
  }
  const evs = Fn_EventsFiltres();
  if (!evs.length) {
    el.innerHTML = '<div class="carte vide">Aucun événement ne correspond au filtre actif.</div>';
    return;
  }
  const retards = evs.filter(e => !e.traite && Fn_JoursDepuis(e.date) < 0);
  const autres = evs.filter(e => retards.indexOf(e) < 0);
  let h = '';
  if (retards.length) {
    h += '<div class="sem-tete"><span class="s-crit">En retard — ' + retards.length + ' événement' + (retards.length > 1 ? 's' : '') + ' non traité' + (retards.length > 1 ? 's' : '') + '</span></div>';
    h += retards.map(e => Fn_HtmlEvCarte(e)).join('');
  }
  const semaines = {};
  autres.forEach(e => {
    const s = Fn_SemaineLundi(e.date) || 'sans-date';
    (semaines[s] = semaines[s] || []).push(e);
  });
  Object.keys(semaines).sort().forEach(s => {
    const liste = semaines[s];
    const nCrit = liste.filter(e => e.sev === 'Crit' && !e.traite).length;
    h += '<div class="sem-tete">Semaine du <b>' + Fn_Esc(Fn_FmtDateLong(s)) + '</b> — ' + liste.length + ' événement' + (liste.length > 1 ? 's' : '')
      + (nCrit ? ', dont <span class="s-crit">' + nCrit + ' critique' + (nCrit > 1 ? 's' : '') + '</span>' : '') + '</div>';
    h += liste.map(e => Fn_HtmlEvCarte(e)).join('');
  });
  el.innerHTML = h;
}

function Fn_PastilleSynth(synth) {
  if (!synth) return { cls: 'p-neutre', lib: 'synthèse non consolidée' };
  const s = String(synth).toLowerCase();
  if (s.indexOf('amélior') >= 0) return { cls: 'p-ok', lib: synth };
  if (s.indexOf('dégrad') >= 0) return { cls: 'p-crit', lib: synth };
  if (s.indexOf('stable') >= 0) return { cls: 'p-info', lib: synth };
  return { cls: 'p-neutre', lib: synth };
}
// Un moment de cotation : libellé, valeur, variation colorée, heure. Un bloc dont

function Fn_HtmlCotation(q) {

function Fn_HtmlProduitLevier(pos) {
  if (!pos) return '';

  // jamais reprise du modèle — même formule que les règles permanentes.
  const qs = Fn_QuoteDe(pos.sousJacent);
  const cours = qs ? Fn_Num(qs.last) : null;
  const bar = Fn_Num(pos.barriere);
  if (cours != null && bar != null && cours !== 0) {
    const d = (pos.sens === 'short' ? (bar - cours) : (cours - bar)) / cours * 100;

    const isoQ = Fn_DateCotation(qs);

/* COUVERTURE D'UN INDICATEUR — quelle part de sa base il a réellement mesurée.
   La règle « un indicateur “—” est exclu du score, jamais compté zéro » ne suffisait
   pas : un indicateur calculé sur une fraction de la base rend un verdict qui a
   l'air net et qui est tout aussi faux qu'un zéro. Cas vécu : « tension de
   valorisation » calculée sur UNE ligne de 2,6 % de la valeur nette (une seule
   valorisation portait un référentiel), affichée « 0 % de la VN en valorisation
   tendue » en VERT — les 97 % restants n'avaient simplement pas été mesurés.
   Sous le plancher, l'indicateur redevient « — » et dit ce qui manque ; au-dessus,
   il affiche la part qu'il couvre pour que le verdict se lise avec sa portée. */
const Cst_CouvertureMin = 60; // % de la base en dessous duquel aucun verdict n'est rendu
function Fn_Couverture(mesure, base) {
  const m = Fn_Num(mesure), b = Fn_Num(base);
  if (m == null || b == null || b <= 0) return null;
  return Math.max(0, Math.min(100, m / b * 100));
}
// Applique le plancher à un indicateur en cours de construction. Renvoie l'objet
// { zone, manquant, couverture } à répercuter, sans jamais toucher à la valeur :
// elle reste affichée, c'est le VERDICT qui est retiré.
function Fn_AppliquerCouverture(couv, zone, manquant, quoiManque) {
  if (couv == null || couv >= Cst_CouvertureMin) return { zone, manquant, couverture: couv };
  return {
    zone: null,
    couverture: couv,
    manquant: (manquant ? manquant + ' · ' : '')
      + quoiManque + ' — mesuré sur ' + Fn_FmtPct(couv, 0) + ' de la base seulement, sous le plancher de '
      + Cst_CouvertureMin + ' % : aucun verdict n’est rendu sur une fraction aussi mince'
  };
}

}
function Fn_ScoreDiscipline(inds) {
  const parBloc = { COUVERTURE: [], TENDANCE: [], STRUCTURE: [] };
  inds.forEach(i => { if (!i.horsScore && i.zone) (parBloc[i.bloc] = parBloc[i.bloc] || []).push(i); });
  let somme = 0, poids = 0;
  Object.keys(Cst_PoidsBlocs).forEach(b => {
    const liste = parBloc[b] || [];
    if (!liste.length) return;
    const w = Cst_PoidsBlocs[b] / liste.length;
    liste.forEach(i => {
      somme += w * (i.zone === 'ok' ? 100 : i.zone === 'warn' ? 50 : 0);
      poids += w;
    });
  });
  if (!poids) return null;
  return Math.round(somme / poids);
}
function Fn_RenderDiscipline() {
  Fn_RenderEntete();
  const el = document.getElementById('d-contenu');
  const inds = Fn_IndicateursDiscipline();
  const score = Fn_ScoreDiscipline(inds);
  const calculables = inds.filter(i => !i.horsScore && i.zone);
  const chantiers = inds.filter(i => i.zone === 'crit').concat(inds.filter(i => i.zone === 'warn')).slice(0, 2);
  let h = '<div class="carte"><div class="carte-titre">Score de discipline</div><div class="score-rang">'
    + '<div class="score-val" style="color:var(' + (score == null ? '--muted' : score >= 70 ? '--ok' : score >= 40 ? '--warn' : '--crit') + ')">' + (score == null ? '—' : score) + '<span class="petit muted">/100</span></div>'
    // Pondérations RÉELLEMENT appliquées : un bloc sans aucun indicateur calculable
    // sort du calcul et son poids se redistribue. Afficher 45 % pour un bloc
    // Couverture entièrement à « — » laissait croire à un score qui en tient compte.
    + '<div class="petit"><div>Pondérations appliquées : ' + Object.keys(Cst_PoidsBlocs).map(b => {
      const n = calculables.filter(i => i.bloc === b).length;
      const total = Object.keys(Cst_PoidsBlocs).reduce((a, x) => a + (calculables.some(i => i.bloc === x) ? Cst_PoidsBlocs[x] : 0), 0);
      const eff = n ? Math.round(Cst_PoidsBlocs[b] / total * 100) : 0;
      return b.charAt(0) + b.slice(1).toLowerCase() + ' <b>' + eff + ' %</b>'
        + (n ? '' : ' <span class="muted">(aucun indicateur calculable — poids redistribué)</span>');
    }).join(' · ') + '.</div>'
    + '<div class="tres-petit muted">' + calculables.length + ' indicateur(s) calculable(s) sur ' + inds.filter(i => !i.horsScore).length + ' — les indicateurs « — » (donnée manquante) et ceux mesurés sur moins de ' + Cst_CouvertureMin + ' % de leur base sont EXCLUS du score, jamais comptés zéro.</div></div></div>';
  if (chantiers.length) {
    h += '<hr class="sep"><div class="petit"><b>Chantiers prioritaires :</b> ' + chantiers.map(c => '<span class="pastille p-' + c.zone + '"></span>' + Fn_Esc(c.nom)).join(' · ') + '</div>';
  } else if (score != null) {
    h += '<hr class="sep"><div class="petit muted">Aucun indicateur dégradé parmi les calculables.</div>';
  } else {
    h += '<hr class="sep"><div class="petit muted">Score non calculable : aucune donnée consolidée. Fournir relevé + captures via ⟳ MAJ (onglet Vigie).</div>';
  }
  h += '</div>';
  const blocs = [['COUVERTURE', 'Pilotage des couvertures (pondération la plus forte)'], ['TENDANCE', 'Tendance fondamentale & valorisation'], ['STRUCTURE', 'Structure du portefeuille']];
  blocs.forEach(b => {
    h += '<div class="bloc-titre">' + Fn_Esc(b[1]) + '</div>';
    inds.filter(i => i.bloc === b[0]).forEach(i => {
      h += '<div class="carte"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
        + '<div class="carte-titre" style="margin:0">' + Fn_Gloss(Fn_Esc(i.nom)) + (i.horsScore ? ' <span class="badge badge-neutre">hors score</span>' : '') + '</div>'
        + (i.zone ? '<span class="pastille p-' + i.zone + '"></span>' : '<span class="tres-petit muted">—</span>') + '</div>'
        + '<div class="ind-valeur"' + (i.zone ? ' style="color:var(--' + (i.zone === 'ok' ? 'ok' : i.zone === 'warn' ? 'warn' : 'crit') + ')"' : '') + '>' + Fn_Gloss(Fn_Esc(i.valeurAff)) + '</div>'
        + (i.jauge || '')
        + '<div class="ind-seuils">' + Fn_Esc(i.seuils) + '</div>'
        // La PORTÉE du verdict se lit à côté du verdict : un chiffre mesuré sur une
        // fraction de la base n'est pas faux, il est partiel — et doit le dire.
        + (i.couverture != null && i.couverture < 100
          ? '<div class="petit" style="margin-top:4px"><span class="badge badge-' + (i.couverture < Cst_CouvertureMin ? 'crit' : 'warn') + '">mesuré sur ' + Fn_Esc(Fn_FmtPct(i.couverture, 0)) + ' de la base</span></div>'

        + (i.manquant ? '<div class="petit muted" style="margin-top:4px">Donnée manquante : ' + Fn_Gloss(Fn_Esc(i.manquant)) + ' — indicateur exclu du score.</div>' : '')

        + '<div class="svap">' + Fn_HtmlSvap('prat', i.pratique) + '</div>'
        + '</div>';
    });
  });
  el.innerHTML = h;

function Fn_LireFichier(fichier) {
  return new Promise((resoudre, rejeter) => {
    const lecteur = new FileReader();
    lecteur.onload = () => {
      const res = String(lecteur.result || '');
      const virgule = res.indexOf(',');
      resoudre({ nom: fichier.name, taille: fichier.size, media: fichier.type || 'application/octet-stream', b64: res.slice(virgule + 1) });
    };
    lecteur.onerror = () => rejeter(new Error('lecture du fichier impossible'));
    lecteur.readAsDataURL(fichier);
  });
}
// SNAPSHOT DE L'ÉTAT COURANT — joint à chaque appel (contrôle de cohérence et
// dédoublonnage). C'est LUI qui faisait boule de neige : il repartait entier à
// chaque MAJ et grossissait avec l'historique (mesuré : 28 Ko, dont 19 Ko
// d'événements — 65 sur 79 déjà passés — et 6 Ko de prose d'opportunités que le
// modèle avait lui-même écrite au tour précédent). Trois règles depuis :
//   1. BORNER — on n'envoie que ce qui sert encore à décider (événements à venir).
//   2. NE PAS RENVOYER LA PROSE DU MODÈLE — un identifiant suffit à dédoublonner.
//   3. CLÉS COURTES — leur poids est multiplié par le nombre de lignes ; la
//      légende figure dans le texte envoyé, pour trois lignes de coût, une fois.
// Piège corrigé au passage : l'ancien `events.slice(0, 80)` coupait dans l'ORDRE
// D'INSERTION. À 79 événements, les suivants sortaient de la liste et le modèle
// recommençait à proposer des doublons — déjà payés, à revalider un par un.
function Fn_BuildSnapshot() {
  const m = Var_State.margin;
  // Horizon de dédoublonnage : le modèle propose des catalyseurs À VENIR. J-7
  // couvre en plus les publications qui viennent de tomber (revue de résultats).
  const borne = Fn_DateISO(new Date(Date.now() - 7 * 86400000));
  const theses = {};
  Object.keys(Var_State.theses).forEach(t => {
    if (Var_State.theses[t] && Var_State.theses[t].derniereRevue) theses[t] = Var_State.theses[t].derniereRevue;
  });
  const evFuturs = Var_State.events
    .filter(e => e && e.date && e.date >= borne)
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
    .slice(0, 60)
    .map(e => ({ d: e.date, t: (e.tags || [])[0] || null, c: String(e.court || Fn_AbregerTitre(e.titre) || '').slice(0, 44) }));
  // Propositions déjà écartées : deux lignes qui évitent de les voir revenir à
  // chaque consolidation — et d'être payées une deuxième fois.
  const refuse = [];
  Var_State.actions.filter(a => a && a.statut === 'rejetee').slice(-12)
    .forEach(a => refuse.push({ t: a.ticker || null, quoi: String(a.proposition || '').slice(0, 90) }));
  (Var_State.opportunites || []).filter(o => o && o.statut === 'archivee').slice(-8)
    .forEach(o => refuse.push({ t: o.ticker || null, quoi: 'opportunité archivée : ' + String(o.libelle || '').slice(0, 70) }));
  return {
    ts: new Date().toISOString(),
    majPrec: Var_State.derniereConsolidation ? new Date(Var_State.derniereConsolidation).toISOString() : null,
    releve: Var_State.releveAsOf || null,
    marge: m ? { titres: m.securitiesValue, cash: m.cash, vl: m.liquidationValue, risque: m.portfolioRisk, libre: m.freeMargin, as: m.asOf } : null,
    pos: Var_State.positions.map(p => ({ t: p.ticker, lib: p.libelle, qte: p.quantite, cat: p.categorie, valEur: p.valeurEur, pctVN: p.pctVN, dev: p.devise, sj: p.sousJacent, sens: p.sens, bar: p.barriere })),
    ord: Var_State.orders.map(o => ({ t: o.ticker, sens: o.sens, type: o.type, qte: o.quantite, lim: o.limite, montEur: o.montantEur })),
    // Liste unique : elle tenait AUSSI dans un second bloc du texte envoyé, donc
    // deux fois dans la même requête. Une seule fois désormais.
    inst: Fn_ListeInstruments().map(i => ({ t: i.ticker, isin: i.isin, place: i.place, lib: i.libelle, cat: i.categorie })),
    evFuturs,
    opp: (Var_State.opportunites || []).filter(o => o && o.statut !== 'supprimee' && o.statut !== 'archivee').slice(0, 20)
      .map(o => ({ k: o.cleModele || o.ticker || null, t: o.ticker, lib: String(o.libelle || '').slice(0, 40), score: o.score, statut: o.statut, maj: o.dateMaj ? Fn_DateISO(new Date(o.dateMaj)) : null })),
    refuse,
    theses
  };
}
