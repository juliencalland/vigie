    const cle = Fn_Ch(a, ['id']);
    if (!cle) return;
    const pub = Fn_Ch(a, ['pubDate']), ex = Fn_Ch(a, ['exDiv']);
    const e = Var_State.agenda[cle] || (Var_State.agenda[cle] = { nom: Fn_Ch(a, ['nom']) || cle });
    if (Fn_Ch(a, ['nom'])) e.nom = Fn_Ch(a, ['nom']);
    if (pub) e.pubDate = pub;
    if (ex) e.exDiv = ex;
    if (Fn_Ch(a, ['s'])) e.s = Fn_Ch(a, ['s']);
    if (Fn_Ch(a, ['u'])) e.u = Fn_Ch(a, ['u']);
    e.ts = ts;                                     // horodaté même bredouille : pas de boucle
    det.agendas++;
  });
  (data.lignes || []).forEach(l => {
    const p = Fn_PositionParId(Fn_Ch(l, ['id']));
    if (!p) return;
    const v = l.valo, c = l.conso, m = l.marche;
    if (v && typeof v === 'object') {
      p.valo = p.valo || {};
      ['per', 'perN', 'bpa', 'capi', 'detteNette', 'roe', 'margeOp', 'rdt', 'veCa', 'veEbitda',
       'croisCa', 'croisBpa', 'refHist', 'refPairs', 'divAct'].forEach(k => {
        const x = Fn_Num(Fn_Ch(v, [k]));
        if (x != null) p.valo[k] = x;
      });
      if (Fn_Ch(v, ['exDiv'])) p.valo.exDiv = Fn_Ch(v, ['exDiv']);
      p.valo.s = Fn_Ch(v, ['s']) || p.valo.s;
      p.valo.u = Fn_UrlSure(Fn_Ch(v, ['u'])) || p.valo.u;
      p.valo.freshTs = ts;
      det.valo++;
    }
    if (c && typeof c === 'object') {
      p.consensus = p.consensus || {};
      if (Fn_Ch(c, ['conso'])) p.consensus.conso = Fn_Ch(c, ['conso']);
      ['nbA', 'obj', 'objEcart'].forEach(k => { const x = Fn_Num(Fn_Ch(c, [k])); if (x != null) p.consensus[k] = x; });
      if (Fn_Ch(c, ['pub'])) p.consensus.pub = Fn_Ch(c, ['pub']);
      if (Fn_Ch(c, ['pubDate'])) p.consensus.pubDate = Fn_Ch(c, ['pubDate']);
      p.consensus.s = Fn_Ch(c, ['s']) || p.consensus.s;
      p.consensus.u = Fn_UrlSure(Fn_Ch(c, ['u'])) || p.consensus.u;
      p.consensus.freshTs = ts;
      det.consensus++;
    }
    if (m && typeof m === 'object') {
      p.marche = p.marche || {};
      ['h52', 'b52', 'adv', 'vol'].forEach(k => { const x = Fn_Num(Fn_Ch(m, [k])); if (x != null) p.marche[k] = x; });
      p.marche.s = Fn_Ch(m, ['s']) || p.marche.s;
      p.marche.u = Fn_UrlSure(Fn_Ch(m, ['u'])) || p.marche.u;
      p.marche.freshTs = ts;
      det.marche++;
    }
  });
  Var_State.derniereEnrichissement = ts;
  Fn_Recalculer();
  // Les dates de publication fraîchement collectées créent des événements : le
  // squelette se régénère aussitôt, sans coût.
  Fn_GenererSquelette();
  return det;
}

        const msgP = String((errParam && errParam.message) || '');
        if (errParam && errParam.name === 'AbortError') throw errParam;
        if (!repliEffort && effort && /output_config|effort/i.test(msgP)) {
          repliEffort = true; effort = null;
          Fn_Phase(journal, 'envoi', 'en cours', 'Paramètre d’effort refusé par l’API — nouvelle tentative sans lui');
          continue;
        }
        if (!repliOutils && /tool|web_search|web_fetch/i.test(msgP) && /not (a )?(valid|supported)|unknown|unsupported|invalid/i.test(msgP)) {
          repliOutils = true;
          outils = [{ type: Cst_OutilRechercheRepli, name: 'web_search', max_uses: budget.recherches }];
          appliquerDomaines();
          Fn_Phase(journal, 'envoi', 'en cours', 'Outils refusés par l’API — repli sur la recherche simple SANS lecture de page : les faits sourcés des découvertes risquent d’être plus faibles');
          continue;
        }
        if (!repliPlafond && plafond > Cst_MaxTokensRepli && /max_tokens/i.test(msgP)) {
          repliPlafond = true; plafond = Cst_MaxTokensRepli;
          Fn_Phase(journal, 'envoi', 'en cours', 'Plafond de sortie refusé par l’API — nouvelle tentative à ' + Fn_FmtNb(plafond, 0) + ' jetons');
          continue;
        }
        if (!repliCache && /cache_control|cache/i.test(msgP)) {
          repliCache = true;
          Fn_Phase(journal, 'envoi', 'en cours', 'Cache de contexte refusé par l’API — nouvelle tentative SANS cache : le coût de cet appel sera nettement plus élevé');
          continue;
        }
        if (repliDomaines < 2 && domaines.length && /domain/i.test(msgP)) {
          const refuses = Fn_DomainesRefuses(msgP);
          repliDomaines++;
          if (refuses.length && refuses.length < domaines.length) {
            Var_State.sitesBloques = (Var_State.sitesBloques || []).concat(refuses.filter(d => (Var_State.sitesBloques || []).indexOf(d) < 0));
            domaines = domaines.filter(d => refuses.indexOf(d) < 0);
            appliquerDomaines();
            reecrireTexte(domaines);
            Fn_Phase(journal, 'envoi', 'en cours', 'Domaine(s) refusé(s) par l’outil de recherche : ' + refuses.join(', ') + ' — retirés et mémorisés, nouvelle tentative sur ' + domaines.length + ' site(s)');
          } else {
            if (refuses.length) Var_State.sitesBloques = (Var_State.sitesBloques || []).concat(refuses.filter(d => (Var_State.sitesBloques || []).indexOf(d) < 0));
            domaines = [];
            appliquerDomaines();
            reecrireTexte([]);
            Fn_Phase(journal, 'envoi', 'en cours', 'Tous les sites cochés sont refusés par l’outil de recherche — nouvelle tentative en RECHERCHE LIBRE sur tout le web');
          }
          continue;
        }
        throw errParam;
      }
      texte += res.texte;
      rt.diag.reponse = texte;
      if (res.reflexion) rt.diag.reflexion += (rt.diag.reflexion ? '\n\n---\n\n' : '') + res.reflexion;
      totalEntree += res.entree; totalSortie += res.sortie; totalRech += res.recherches;
      totalLect += (res.lectures || 0); totalCw += (res.cacheEcriture || 0); totalCr += (res.cacheLecture || 0);
      Object.keys(res.outilsVus || {}).forEach(n => { journal.outilsVus[n] = (journal.outilsVus[n] || 0) + res.outilsVus[n]; });
      journal.jetonsEntree = totalEntree; journal.jetonsSortie = totalSortie; journal.recherches = totalRech;
      journal.lectures = totalLect; journal.jetonsCacheEcriture = totalCw; journal.jetonsCacheLecture = totalCr;
      journal.continuations = continuations;
      if (res.modele) journal.modele = res.modele;
      stopReason = res.stopReason;
      if (stopReason === 'pause_turn' && continuations < Cst_MaxContinuations) {
        continuations++;
        messagesApi.push({ role: 'assistant', content: res.contenu });
        Fn_Phase(journal, 'recherches', 'en cours', 'Reprise automatique n° ' + continuations + '/' + Cst_MaxContinuations
          + ' (la boucle d’outils rend la main tous les ~10 appels)'
          + (totalCr ? ' — contexte relu depuis le cache : ' + Fn_FmtNb(totalCr, 0) + ' jetons à 0,1×' : ''));
        continue;
      }
      // Plafond de reprises atteint alors que le modèle n'avait pas fini : c'est
      // une COUPURE, pas une fin. Elle était silencieuse — l'appel paraissait
      // réussi sur un JSON amputé, après avoir été payé en entier.
      if (stopReason === 'pause_turn') {
        Fn_Phase(journal, 'recherches', 'echec', 'Travail interrompu au plafond de ' + Cst_MaxContinuations
          + ' reprises : le modèle n’avait pas terminé. Ce qui a été produit est intégré, mais c’est incomplet.');
      }
      break;
    }
    journal.stopReason = stopReason;
    Fn_Phase(journal, 'analyse', 'ok');
    Fn_Phase(journal, 'recherches', 'ok', totalRech + ' recherche(s) web · ' + totalLect + ' page(s) lue(s)'
      + (continuations ? ' · ' + continuations + ' reprise(s)' : '')
      + (totalCr ? ' · ' + Fn_FmtNb(totalCr, 0) + ' jetons relus depuis le cache' : ''));
    Fn_Phase(journal, 'redaction', 'ok');
    Fn_Phase(journal, 'reception', 'ok', 'Réponse reçue : ' + Fn_FmtNb(totalSortie, 0) + ' jetons de sortie (stop_reason : ' + (stopReason || '?') + ')');
    if (stopReason === 'refusal') throw { api: true, type: 'refusal', message: 'stop_reason: refusal' };
    if (stopReason === 'model_context_window_exceeded') throw { api: true, type: 'contexte_depasse', message: 'stop_reason: model_context_window_exceeded' };
    Fn_Phase(journal, 'parsing', 'en cours');
    const parse = Fn_ParseJsonTolerant(texte);
    if (!parse.data) {
      Fn_Phase(journal, 'parsing', 'echec', 'Interprétation impossible : ' + parse.erreur);
      throw { api: true, type: 'parse', message: 'Réponse illisible malgré le parseur tolérant : ' + parse.erreur };
    }
    journal.tronque = (stopReason === 'max_tokens');
    Fn_Phase(journal, 'parsing', 'ok', 'JSON ' + (parse.repare ? 'RÉPARÉ (troncature : recul au dernier élément complet, fermetures reconstruites)' : 'valide')
      + (journal.tronque ? ' — réponse tronquée au plafond de jetons' : ''));
    Fn_Phase(journal, 'integration', 'en cours');
    const det = passe === 'enrichissement' ? Fn_IntegrerEnrichissement(parse.data, journal) : Fn_IntegrerDesk(parse.data, journal);
    Fn_Phase(journal, 'integration', 'ok', passe === 'enrichissement'
      ? det.valo + ' bloc(s) de valorisation · ' + det.consensus + ' consensus — aucun autre champ n’a été touché'
      : det.textes + ' texte(s) · ' + det.debriefs + ' débrief(s) · ' + det.decNouvelles + ' découverte(s) — aucun chiffre du portefeuille n’a été touché');
    Fn_Phase(journal, 'validations', 'ok', Fn_NbAValider() + ' carte(s) en attente de votre décision');
    journal.finTs = Date.now();
    journal.statut = journal.tronque ? 'partielle' : 'terminee';
    journal.message = journal.tronque
      ? 'Réponse tronquée au plafond de jetons — données partielles réparées et intégrées. Relancer pour compléter si besoin.'
      : (passe === 'enrichissement'
        ? 'Enrichissement terminé : ' + det.valo + ' ligne(s) valorisée(s), ' + det.consensus + ' consensus. Ces données sont désormais fraîches et ne seront pas recollectées avant ' + (Fn_Num(Var_State.seuils.fraicheurDonneesJours) || 7) + ' jours.'
        : 'Jugement terminé : ' + det.textes + ' texte(s) d’événement, ' + det.debriefs + ' débrief(s), '
          + det.decNouvelles + ' découverte(s) nouvelle(s), ' + det.actions + ' action(s) proposée(s).');
  } catch (err) {
    journal.finTs = Date.now();
    if (err && err.name === 'AbortError' && rt._stallAbort) {
      journal.statut = 'echec';
      journal.message = 'Flux interrompu : aucun signal reçu depuis 5 minutes écran visible (le temps passé en arrière-plan n’est pas compté) — appel coupé automatiquement. Dernière activité : '
        + (journal.listeRecherches && journal.listeRecherches.length
          ? 'recherche web n° ' + journal.listeRecherches.length + ' (« ' + journal.listeRecherches[journal.listeRecherches.length - 1] + ' »)' : 'envoi de la requête')
        + '. Vérifier la connexion puis relancer.';
    } else if (err && err.name === 'AbortError') {
      journal.statut = 'interrompue';
      journal.message = Fn_MessageErreur(err);
    } else {
      journal.statut = 'echec';
      journal.message = Fn_MessageErreur(err);
      if (err && err.fluxIncomplet) Fn_Phase(journal, 'reception', 'echec', 'Connexion fermée avant la fin de la réponse — rien n’a été intégré');
    }
    journal.phases.forEach(p => { if (p.statut === 'en cours') p.statut = 'echec'; });
  } finally {
    if (rt.timers.chrono) { clearInterval(rt.timers.chrono); rt.timers.chrono = null; }
    if (rt.onVisibilite) { document.removeEventListener('visibilitychange', rt.onVisibilite); rt.onVisibilite = null; }
    if (rt.onQuitter) { window.removeEventListener('beforeunload', rt.onQuitter); rt.onQuitter = null; }
    rt.masqueA = null;
    rt.abort = null;
    rt.dernierSignal = null;
    rt.enCours = false;
    // Coût et cumul arrêtés ICI : succès, échec, annulation ou coupure, les jetons
    // consommés sont les mêmes et doivent être comptés une fois.
    Fn_CloturerBilan(journal);
    // Boîte noire déposée APRÈS la clôture du bilan, pour qu'elle porte les
    // compteurs définitifs, et sans être attendue : l'échec d'un compte rendu ne
    // doit pas transformer un appel réussi en échec.
    Fn_EcrireDiagnostic(journal);
    Fn_Save();
    Fn_RenderTout();
  }
}

/* ================================================================
   ÉVÉNEMENTS UI — délégation : un listener par conteneur, routage par
   data-action / data-id. Suppressions en double appui temporisé (~3 s) :
   les boîtes de dialogue natives sont bloquées en artefact, donc interdites.
   ================================================================ */
function Fn_DoubleTap(cle, surConfirme, surRender) {
  const rt = Var_State._runtime;
  if (rt.armes[cle]) {
    clearTimeout(rt.armes[cle]);
    delete rt.armes[cle];
    surConfirme();
  } else {
    rt.armes[cle] = setTimeout(() => { delete rt.armes[cle]; surRender(); }, 3000);
    surRender();
  }
}
function Fn_RenderZonesEvenements() {
  Fn_RenderHero();
  Fn_RenderDebrief();
  Fn_RenderCalendrier();
  Fn_RenderChips();
  Fn_RenderTimeline();
}
// Enregistre un texte collé : horodaté à la seconde de son arrivée, conservé
// verbatim, jamais synchronisé.
function Fn_PoserCollage(cle, texte) {
  const t = String(texte || '').trim();
  if (!t) return false;
  const doc = { texte: t, ts: Date.now(), taille: t.length };
  Var_State._runtime.collages[cle] = doc;
  Fn_DocEnregistrer(cle, doc);
  return true;
}
/* CAPTURE UNIQUE. Un document sectionné alimente les trois entrées d'un coup.
   Deux règles, et elles sont l'essentiel :
   1. une capture est un INSTANTANÉ des écrans, donc elle REMPLACE les entrées du
      jour au lieu de s'y ajouter. Une section vide (aucun ordre en attente)
      efface l'entrée correspondante : sans cela, le collage de la veille restait
      en place et l'analyse rendait des ordres qui n'existaient plus ;
   2. la mention d'historique vide de l'en-tête vaut EXACTEMENT la case « aucune
      transaction récente » — l'écran l'a dit, il n'y a rien à interpréter.
   Rien n'est effacé puis réécrit sous la même clé : la suppression et
   l'enregistrement sont deux transactions distinctes, dont l'ordre d'arrivée
   n'est pas garanti. Une clé est soit posée, soit supprimée, jamais les deux. */
function Fn_PoserCapture(texte) {
  const doc = Fn_DecouperDocument(texte);
  if (!doc) return false;
  const rt = Var_State._runtime;
  const brut = String(texte || '').trim();
  ['positions', 'ordres', 'executes'].forEach(cle => {
    if (doc[cle]) Fn_PoserCollage(cle, doc[cle]);
    else { delete rt.collages[cle]; Fn_DocSupprimer(cle); }
  });
  const meta = Fn_ParserMeta(doc.meta);
  rt.capture = { ts: Date.now(), taille: brut.length, meta: meta,
    sections: { positions: doc.positions.length, ordres: doc.ordres.length, executes: doc.executes.length } };
  Fn_DocEnregistrer('capture', rt.capture);
  const rien = /aucune\s+transaction/i.test(String(meta.historique || ''));
  if (rien || doc.executes) {
    rt.aucuneTransac = rien;
    Fn_DocEnregistrer('aucuneTransac', { valeur: rien, ts: Date.now() });
  }
  return true;
}
function Fn_AppliquerControle(carte, accepte) {
  carte.statut = accepte ? 'acceptee' : 'rejetee';
  carte.dateDecision = Fn_AujISO();
  if (!accepte) return;
  const p = carte.payload;
  if ((carte.kind === 'nouvelle_ligne' || carte.kind === 'ligne_non_appariee') && p && p.id && !Fn_PositionParId(p.id)) {
    const levier = p.levier;
    Var_State.positions.push({
      id: p.id, ticker: p.ticker || null, isin: p.isin || null,
      detention: { nom: p.nom, qte: p.qte, dev: p.dev || 'EUR', cloture: p.cloture,
        clotureVeille: p.clotureVeille, var: null, valDev: p.montantDev, valEurExport: p.montantEur, valEur: null,
        pctVN: null, poche: null, facteurs: [], liqFaible: null, ts: Date.now(), src: p.source },
      produit: levier
        ? { type: 'derive', emetteur: levier.emetteur, sousJacent: levier.sousJacent, sens: levier.sens,
            barriere: levier.barriere, strike: levier.strike, parite: levier.parite, levier: levier.levier,
            deltaEur: null, distBarriere: null, portageMensuel: null,
            histBarriere: (levier.barriere != null || levier.strike != null)
              ? [{ d: Fn_AujISO(), bar: levier.barriere, str: levier.strike }] : [] }
        : { type: 'action', emetteur: null, sousJacent: null, sens: 'long', barriere: null, strike: null,
            parite: null, levier: null, deltaEur: null, distBarriere: null, portageMensuel: null, histBarriere: [] },
      marche: {}, valo: {}, consensus: {}, desk: {}
    });
  } else if (carte.kind === 'ecart_quantite' && carte.id) {
    const pos = Fn_PositionParId(carte.id);
    const m = /→\s*([\d   ,.]+)\s*titres/.exec(String(carte.resume || ''));
    if (pos && m) pos.detention.qte = Fn_NombreFr(m[1]);
  }
  // Les autres natures d'écart (liquidités, valeur des titres, ligne absente,
  // paramètres illisibles) n'ont pas de correctif automatique : la décision est
  // enregistrée, l'état structurel n'est pas modifié en silence.
  Fn_Recalculer();
}
function Fn_OnAction(e) {
  if (e.target.closest && e.target.closest('.gloss')) return; // géré par le popover
  const el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) return;
  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');
  const rt = Var_State._runtime;
  switch (action) {
    case 'toggle': {
      Var_State.panneaux[id] = !Var_State.panneaux[id];
      Fn_Save();
      if (id === 'acquisition') Fn_RenderAcquisition();
      else if (id === 'maj' || id === 'journal') Fn_RenderMajPanel();
      else if (id === 'formAjout') Fn_RenderFormAjout();
      else if (id === 'regles') Fn_RenderRegles();
      else if (id === 'cadreExpo') Fn_RenderDecouvertes();
      else Fn_RenderParametres();
      break;
    }
    case 'capture-coller': {
      if (!navigator.clipboard || !navigator.clipboard.readText) {
        rt.collageErreur = 'Ce navigateur ne donne pas accès au presse-papier ici (il faut une page servie en HTTPS). Collez à la main dans la zone ci-dessous.';
        Fn_RenderAcquisition();
        break;
      }
      navigator.clipboard.readText().then(txt => {
        // Un texte sans borne n'est PAS une capture : il est refusé ici plutôt
        // que versé au hasard dans une des trois entrées.
        if (Fn_PoserCapture(txt)) rt.collageErreur = null;
        else rt.collageErreur = 'Ce texte ne porte pas les bornes d’une capture. Utilisez les trois zones écran par écran ci-dessous, ou relancez la capture.';
        Fn_RenderAcquisition();
      }).catch(() => {
        rt.collageErreur = 'Accès au presse-papier refusé. Collez à la main dans la zone ci-dessous — le traitement est identique.';
        Fn_RenderAcquisition();
      });
      break;
    }
    case 'etat-exporter': {
      rt.razMessage = Fn_TelechargerEtat()
        ? 'Copie téléchargée. « Restaurer un état » sait la relire.'
        : 'Téléchargement impossible dans ce navigateur : copiez plutôt le fichier etat.json du dépôt privé avant d’effacer.';
      Fn_RenderParametres();
      break;
    }
    case 'etat-raz': {
      Fn_DoubleTap('etat-raz', () => {
        Fn_RemiseAZero();
        rt.razMessage = 'Vigie remise à zéro. L’état vide a été poussé au dépôt : vos autres appareils l’adopteront à leur prochaine synchronisation.';
        Fn_RenderTout();
      }, () => Fn_RenderParametres());
      break;
    }
    case 'capture-effacer': {
      Fn_DoubleTap('capture', () => {
        rt.capture = null;
        Fn_DocSupprimer('capture');
        ['positions', 'ordres', 'executes'].forEach(c => { delete rt.collages[c]; Fn_DocSupprimer(c); });
        Fn_RenderAcquisition();
      }, () => Fn_RenderAcquisition());
      break;
    }
    case 'collage-voir': { rt['voir-' + id] = !rt['voir-' + id]; Fn_RenderAcquisition(); break; }
    case 'xlsx-effacer': {
      Fn_DoubleTap('xlsx-effacer', () => { rt.xlsx = null; Fn_DocSupprimer('xlsx'); Fn_RenderAcquisition(); }, () => Fn_RenderAcquisition());
      break;
    }
    case 'acq-integrer': {
      const an = Fn_AnalyserEntrees();
      const bilan = Fn_IntegrerEntrees(an);
      const sq = Fn_GenererSquelette();
      rt.analyse = bilan;
      Fn_Save();
      Fn_RenderVigie();
      Fn_RenderCours();
      Fn_RenderDiscipline();
      break;
    }
    case 'acq-vider': {
      Fn_DoubleTap('acq-vider', () => { Fn_CollagesVider(); rt.analyse = null; Fn_RenderAcquisition(); }, () => Fn_RenderAcquisition());
      break;
    }
    case 'maj-lancer': Fn_LancerDesk(); break;
    case 'maj-enrichir': Fn_LancerEnrichissement(); break;
    case 'maj-annuler': if (rt.abort) rt.abort.abort(); break;
    case 'aller-avalider': {
      const ancre = document.getElementById('ancre-avalider') || document.getElementById('v-actions');
      if (ancre && ancre.scrollIntoView) ancre.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'chip': { Var_State.filtreTag = id || null; Fn_Save(); Fn_RenderChips(); Fn_RenderTimeline(); break; }
    case 'filtre-jour-clear': { Var_State.filtreJour = null; Fn_Save(); Fn_RenderZonesEvenements(); break; }
    case 'cal-jour': {
      Var_State.filtreJour = (Var_State.filtreJour === id) ? null : id;
      Fn_Save(); Fn_RenderZonesEvenements();
      if (Var_State.filtreJour) {
        const zone = document.getElementById('v-timeline');
        if (zone && zone.scrollIntoView) zone.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      break;
    }
    case 'ev-debriefer': {
      const ev = Var_State.calendrier.find(x => x.id === id);
      if (ev) { ev.debriefDemande = true; Fn_Save(); Fn_RenderDebrief(); Fn_RenderMajPanel(); }
      break;
    }
    case 'ev-classer': {
      const ev = Var_State.calendrier.find(x => x.id === id);
      if (ev) {
        ev.statut = ev.debrief ? 'debriefe' : 'classe';
        ev.debriefDemande = false;
        Fn_Save(); Fn_RenderZonesEvenements(); Fn_RenderMajPanel();
      }
      break;
    }
    case 'ev-suppr': {
      Fn_DoubleTap('ev-' + id, () => {
        Var_State.calendrier = Var_State.calendrier.filter(x => x.id !== id);
        Fn_Save(); Fn_RenderZonesEvenements();
      }, () => Fn_RenderZonesEvenements());
      break;
    }
    case 'form-ajouter': {
      const val = q => ((document.getElementById(q) || {}).value || '').trim();
      const date = val('f-date'), titre = val('f-titre');
      if (!date || !titre) { Fn_MajBoutonFormAjout(); break; } // le bouton dit ce qui manque
      let idEv = Fn_Slug(titre) + '-' + date;
      if (Var_State.calendrier.some(x => x.id === idEv)) idEv += '-' + Math.random().toString(36).slice(2, 5);
      Var_State.calendrier.push({
        id: idEv, isin: null, date, statut: 'prevu', source: 'manuel',
        libelle: titre, court: Fn_AbregerTitre(titre).slice(0, 28),
        sev: val('f-sev') || 'Info', conf: true,
        tags: val('f-tags').split(',').map(s => s.trim()).filter(Boolean),
        metriques: [],
        textes: { surv: val('f-surv'), arb: val('f-arb'), prat: val('f-prat'), texteEcritLe: Fn_AujISO(), empreinte: '' },
        debrief: null
      });
      Fn_MajStatutsCalendrier();
      Fn_Save(); Fn_RenderZonesEvenements(); Fn_RenderFormAjout();
      break;
    }
    case 'av-accepter': case 'av-rejeter': {
      const carte = Var_State.controles.find(x => x.id === id);
      if (carte && carte.statut === 'a_valider') {
        Fn_AppliquerControle(carte, action === 'av-accepter');
        Fn_Save(); Fn_RenderVigie(); Fn_RenderCours();
      }
      break;
    }
    case 'av-tout-accepter': {
      Var_State.controles.filter(x => x.statut === 'a_valider').forEach(c => Fn_AppliquerControle(c, true));
      Fn_Save(); Fn_RenderVigie(); Fn_RenderCours();
      break;
    }
    case 'act-accepter': case 'act-rejeter': {
      const a = Var_State.actions.find(x => x.id === id);
      if (a && a.statut === 'a_valider') {
        a.statut = action === 'act-accepter' ? 'acceptee' : 'rejetee';
        a.dateDecision = Fn_AujISO();
        if (action === 'act-accepter') {
          const idEv = Fn_Slug('action-' + (a.propo || '')) + '-' + Fn_AujISO();
          if (!Var_State.calendrier.some(x => x.id === idEv)) {
            /* L'EMPREINTE EST POSÉE ICI, pas laissée vide. Ses textes sont écrits par
               l'application à partir de l'arbitrage accepté : il n'y a rien à
               demander au desk. Une empreinte vide vaut « textes à écrire » et
               renvoyait donc l'événement au modèle à CHAQUE cycle, pour lui faire
               réécrire ce qui était déjà là — le contraire exact de l'économie que
               l'empreinte existe pour produire. */
            const ev = {
              id: idEv, isin: a.isin || null, date: Fn_AujISO(), statut: 'imminent', source: 'action',
              libelle: 'Action retenue — ' + String(a.propo).slice(0, 90),
              court: 'Action retenue', sev: a.prio === 1 ? 'Crit' : (a.prio === 2 ? 'Warn' : 'Info'), conf: true,
              tags: ['ACTION'],
              metriques: [{ l: 'priorité', v: 'P' + (a.prio || 3) }, { l: 'horizon', v: a.hor || '— (non fourni)' }],
              textes: { surv: a.decl || '', arb: (a.propo || '') + (a.cb ? ' · Coût/bénéfice : ' + a.cb : ''),
                prat: 'Condition d’invalidation : ' + (a.inval || 'non fournie — à définir avant exécution.'),
                texteEcritLe: Fn_AujISO(), empreinte: '' },
              debrief: null
            };
            ev.textes.empreinte = Fn_EmpreinteEvenement(ev);
            Var_State.calendrier.push(ev);
          }
        }
        Fn_Save(); Fn_RenderVigie();
      }
      break;
    }
    case 'these-revue': {
      const th = Var_State.theses[id] = Var_State.theses[id] || { ecrite: false, invalidation: false, objectif: false, derniereRevue: null };
      th.derniereRevue = Fn_AujISO();
      Fn_Save(); Fn_RenderCours(); Fn_RenderDiscipline();
      break;
    }
    case 'dec-filtre': { Var_State.filtreDecouvertes = id === 'toutes' ? 'toutes' : 'vives'; Fn_Save(); Fn_RenderDecouvertes(); break; }
    case 'dec-garder': {
      const d = Var_State.decouvertes.find(x => x.id === id);
      if (d) {
        d.statut = 'gardee';
        // Seule bascule qui touche au reste de l'application : l'instrument entre
        // dans la liste suivie. Aucun ordre n'est passé, aucune position créée.
        if (d.cible && !Var_State.instruments.some(i => i.id === 'dec-' + d.id)) {
          Var_State.instruments.push({ id: 'dec-' + d.id, ticker: '', isin: '', place: '', libelle: d.titre });
        }
        Fn_Save(); Fn_RenderDecouvertes();
      }
      break;
    }
    case 'dec-ecarter': {
      const d = Var_State.decouvertes.find(x => x.id === id);
      if (d) { d.statut = 'ecartee'; d.motifEcart = 'écartée le ' + Fn_FmtDateCourt(Fn_AujISO()); Fn_Save(); Fn_RenderDecouvertes(); }
      break;
    }
    case 'dec-suppr': {
      Fn_DoubleTap('dec-' + id, () => {
        Var_State.decouvertes = Var_State.decouvertes.filter(x => x.id !== id);
        if (rt.decEdition === id) rt.decEdition = null;
        Fn_Save(); Fn_RenderDecouvertes();
      }, () => Fn_RenderDecouvertes());
      break;
    }
    case 'dec-modifier': rt.decEdition = id; Fn_RenderDecouvertes(); break;
    case 'dec-annuler': rt.decEdition = null; Fn_RenderDecouvertes(); break;
    case 'dec-enregistrer': {
      const d = Var_State.decouvertes.find(x => x.id === id);
      if (!d) break;
      const val = q => ((document.getElementById(q) || {}).value || '').trim();
      d.titre = val('dec-titre') || d.titre;
      d.intention = val('dec-intention') || d.intention;
      d.cible = val('dec-cible') || null;
      d.taille = Fn_Num(val('dec-taille'));
      d.fait = val('dec-fait');
      d.dateFait = val('dec-datefait') || null;
      d.u = Fn_UrlSure(val('dec-u'));
      d.entree = val('dec-entree');
      d.inval = val('dec-inval');
      d.note = val('dec-note');
      d.modifieLe = Fn_AujISO();
      rt.decEdition = null;
      Fn_Save(); Fn_RenderDecouvertes();
      break;
    }
    case 'dec-ajouter': {
      const d = { id: Fn_Uid('dec'), ts: Date.now(), statut: 'proposee', intention: Cst_Intentions[0],
        cible: null, titre: 'Nouvelle découverte', fait: '', dateFait: null, entree: '', inval: '',
        hor: '', taille: null, verdict: 'sous conditions', discipline: '', s: 'saisie manuelle', u: null, note: '' };
      Var_State.decouvertes.push(d);
      Var_State.filtreDecouvertes = 'toutes';
      rt.decEdition = d.id;
      Fn_Save(); Fn_RenderDecouvertes();
      break;
    }
    /* AFFICHER UN CODE ENREGISTRÉ. Le champ est VIDE dès qu'un code est en
       mémoire — son libellé invite à saisir pour remplacer. Basculer le type du
       champ ne montrait donc rien du tout, et le bouton passait pour inerte. Il
       faut y ÉCRIRE le code enregistré, et l'effacer en remasquant pour ne pas
       le laisser traîner dans le formulaire. Le code n'est jamais réécrit dans
       le stockage au passage : rien ici ne modifie quoi que ce soit. */
    case 'cle-voir': case 'ghtoken-voir': {
      const estCle = (action === 'cle-voir');
      const inp = document.getElementById(estCle ? 'p-cle' : 'p-ghtoken');
      if (!inp) break;
      const stocke = estCle ? Fn_GetApiKey() : Fn_GetSyncToken();
      if (inp.type !== 'password') {
        inp.type = 'password';
        if (inp.dataset.revele === '1') { inp.value = ''; inp.dataset.revele = ''; }
        el.textContent = 'Afficher';
        break;
      }
      if (!inp.value && !stocke) {
        // Ne rien afficher SANS LE DIRE est exactement ce qui faisait passer ce
        // bouton pour cassé. Le libellé répond, puis se remet seul.
        el.textContent = 'aucun code enregistré';
        clearTimeout(rt.timers.codeHint);
        rt.timers.codeHint = setTimeout(() => {
          const b = document.querySelector('[data-action="' + action + '"]');
          if (b) b.textContent = 'Afficher';
        }, 2500);
        break;
      }
      if (!inp.value) { inp.value = stocke; inp.dataset.revele = '1'; }
      inp.type = 'text';
      el.textContent = 'Masquer';
      break;
    }
    case 'cle-enregistrer': {
      const inp = document.getElementById('p-cle');
      const v = inp ? String(inp.value || '').trim() : '';
      if (v) { Fn_SetApiKey(v); if (inp) inp.value = ''; Fn_RenderParametres(); Fn_RenderEntete(); Fn_RenderMajPanel(); }
      break;
    }
    case 'cle-effacer': {
      Fn_DoubleTap('cle-effacer', () => { Fn_SetApiKey(''); Fn_RenderParametres(); Fn_RenderEntete(); Fn_RenderMajPanel(); }, () => Fn_RenderParametres());
      break;
    }
    case 'ghtoken-enregistrer': {
      const inp = document.getElementById('p-ghtoken');
      const v = inp ? String(inp.value || '').trim() : '';
      if (v) { Fn_SetSyncToken(v); if (inp) inp.value = ''; Fn_RenderParametres(); Fn_RenderEntete(); Fn_SyncTirer(); }
      break;
    }
    case 'ghtoken-effacer': {
      Fn_DoubleTap('ghtoken-effacer', () => { Fn_SetSyncToken(''); Fn_RenderParametres(); Fn_RenderEntete(); }, () => Fn_RenderParametres());
      break;
    }
    case 'sync-maintenant': Fn_SyncTirer(); break;
    case 'inst-ajouter': {
      const val = q => ((document.getElementById(q) || {}).value || '').trim();
      const ticker = val('i-ticker');
      if (!ticker) break;
      if (!Var_State.instruments.some(i => i.ticker === ticker)) {
        Var_State.instruments.push({ id: Fn_Uid('inst'), ticker, isin: val('i-isin'), place: '', libelle: val('i-lib') });
        Fn_Save();
      }
      Fn_RenderParametres();
      break;
    }
    case 'inst-suppr': {
      Fn_DoubleTap('inst-' + id, () => {
        Var_State.instruments = Var_State.instruments.filter(i => i.id !== id);
        Fn_Save(); Fn_RenderParametres();
      }, () => Fn_RenderParametres());
      break;
    }
    case 'seuils-reset': {
      Fn_DoubleTap('seuils-reset', () => {
        Var_State.seuils = Object.assign({}, Cst_SeuilsDefaut);
        Fn_Recalculer(); Fn_Save(); Fn_RenderParametres(); Fn_RenderDiscipline();
      }, () => Fn_RenderParametres());
      break;
    }
    case 'cumul-raz': {
      Fn_DoubleTap('cumul-raz', () => {
        Var_State.cumulApi = { appels: 0, jetonsEntree: 0, jetonsSortie: 0, jetonsCacheEcriture: 0, jetonsCacheLecture: 0, recherches: 0, lectures: 0, coutUsd: 0 };
        Fn_Save(); Fn_RenderParametres();
      }, () => Fn_RenderParametres());
      break;
    }
    case 'sites-tous': {
      const tous = [];
      Cst_SitesRecherche.forEach(g => g.sites.forEach(s => tous.push(s.d)));
      Var_State.sitesRecherche = tous;
      Fn_Save(); Fn_RenderParametres();
      break;
    }
    case 'sites-aucun': { Var_State.sitesRecherche = []; Fn_Save(); Fn_RenderParametres(); break; }
    case 'sites-debloquer': { Var_State.sitesBloques = []; Fn_Save(); Fn_RenderParametres(); break; }
  }
}
function Fn_OnChange(e) {
  const el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) return;
  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');
  const rt = Var_State._runtime;
  switch (action) {
    case 'capture-saisie': {
      if (Fn_PoserCapture(el.value)) { rt.collageErreur = null; el.value = ''; }
      else rt.collageErreur = 'Ce texte ne porte pas les bornes d’une capture. Utilisez les trois zones écran par écran ci-dessous, ou relancez la capture.';
      setTimeout(() => Fn_RenderAcquisition(), 0);
      break;
    }
    case 'xlsx': {
      const fichier = el.files && el.files[0];
      if (!fichier) break;
      rt.xlsxErreur = null;
      Fn_LireXlsx(fichier).then(x => {
        rt.xlsx = x;
        Fn_DocEnregistrer('xlsx', x);
        Fn_RenderAcquisition();
      }).catch(err => {
        rt.xlsxErreur = String((err && err.message) || err);
        Fn_RenderAcquisition();
      });
      break;
    }
    case 'maj-notrans': {
      rt.aucuneTransac = !!el.checked;
      Fn_DocEnregistrer('aucuneTransac', { valeur: !!el.checked, ts: Date.now() });
      Fn_RenderAcquisition();
      break;
    }
    case 'pos-profil': {
      const p = Fn_PositionParId(id);
      if (p) { p.desk = p.desk || {}; p.desk.profil = el.value || null; Fn_Save(); Fn_RenderCours(); }
      break;
    }
    case 'these-check': {
      const th = Var_State.theses[id] = Var_State.theses[id] || { ecrite: false, invalidation: false, objectif: false, derniereRevue: null };
      th[el.getAttribute('data-champ')] = !!el.checked;
      Fn_Save();
      break;
    }
    case 'site-recherche': {
      const liste = Var_State.sitesRecherche;
      const pos = liste.indexOf(id);
      if (el.checked) { if (pos < 0) liste.push(id); }
      else if (pos >= 0) liste.splice(pos, 1);
      Fn_Save(); Fn_RenderParametres();
      break;
    }
    case 'seuil': {
      const v = Fn_Num(el.value);
      if (v != null) { Var_State.seuils[id] = v; Fn_Recalculer(); Fn_Save(); }
      break;
    }
    case 'modele': {
      const m = Cst_Modeles.find(x => x.id === el.value);
      if (m) {
        Var_State.modeleMAJ = m.id;
        // Les tarifs suivent le modèle : les laisser en arrière rendrait toute
        // estimation fausse dès le changement, sans le dire.
        Var_State.tarifs.entreeParM = m.entreeParM;
        Var_State.tarifs.sortieParM = m.sortieParM;
        Fn_Save(); Fn_RenderParametres(); Fn_RenderMajPanel();
      }
      break;
    }
    case 'effort': {
      if (Cst_Efforts.some(x => x.id === el.value)) { Var_State.effortMAJ = el.value; Fn_Save(); Fn_RenderParametres(); Fn_RenderMajPanel(); }
      break;
    }
    case 'tarif': {
      const v = Fn_Num(el.value);
      if (v != null) { Var_State.tarifs[id] = v; Fn_Save(); }
      break;
    }
    case 'rappel': Var_State.freqRappel = el.value; Fn_Save(); break;
    case 'sync-importer': {
      const fichier = el.files && el.files[0];
      if (fichier) Fn_SyncImporterFichier(fichier);
      break;
    }
  }
}
/* ---- Popover : glossaire au tap et au survol, aide des commandes en appui long ---- */
function Fn_OnDocumentClick(e) {
  const g = e.target.closest ? e.target.closest('.gloss') : null;
  const pop = document.getElementById('gloss-popover');
  const rt = Var_State._runtime;
  if (!pop) return;
  if (g) {
    const terme = g.getAttribute('data-terme');
    if (!pop.hidden && rt.glossOuvert === terme && (Date.now() - (rt.glossTs || 0)) > 600) Fn_FermerGloss();
    else { Fn_OuvrirGloss(terme, g); rt.glossTs = Date.now(); }
    return;
  }
  if (!pop.hidden && !pop.contains(e.target)) Fn_FermerGloss();
}
function Fn_OnSurvol(e) {
  const g = e.target.closest ? e.target.closest('.gloss') : null;
  if (g) { Fn_OuvrirGloss(g.getAttribute('data-terme'), g); Var_State._runtime.glossTs = Date.now(); return; }
  // Aide des commandes à la souris : l'infobulle native est posée au survol, une
  // seule fois par élément. Rien n'est parcouru au rendu — un balayage de toutes
  // les commandes après chaque re-rendu coûterait bien plus.
  const cmd = e.target.closest ? e.target.closest('[data-action]') : null;
  if (cmd && !cmd.title) {
    const aide = Fn_TexteAide(cmd);
    if (aide) cmd.title = aide.t + ' — ' + aide.d;
  }
}
function Fn_AnnulerAideTactile() {
  const rt = Var_State._runtime;
  if (rt.timers.aide) { clearTimeout(rt.timers.aide); rt.timers.aide = null; }
}
function Fn_OnTactileDebut(e) {
  const rt = Var_State._runtime;
  Fn_AnnulerAideTactile();
  const cmd = e.target.closest ? e.target.closest('[data-action]') : null;
  // Champs de saisie exclus : l'appui long y sert à sélectionner du texte, et
  // c'est justement là qu'on colle.
  if (!cmd || /^(INPUT|TEXTAREA|SELECT)$/.test(cmd.tagName || '')) return;
  const aide = Fn_TexteAide(cmd);
  if (!aide) return;
  const t = e.touches && e.touches[0];
  rt.aideDepart = t ? { x: t.clientX, y: t.clientY } : null;
  rt.timers.aide = setTimeout(() => {
    rt.timers.aide = null;
    rt.aideDeclenchee = true; // le clic de relâchement sera neutralisé
    Fn_OuvrirPopover(aide.t, aide.d, cmd, null);
  }, 500);
}
function Fn_OnTactileBouge(e) {
  const rt = Var_State._runtime;
  if (!rt.timers.aide || !rt.aideDepart) return;
  const t = e.touches && e.touches[0];
  // Un défilement n'est pas une demande d'aide : au-delà de 10 px, on renonce.
  if (t && (Math.abs(t.clientX - rt.aideDepart.x) > 10 || Math.abs(t.clientY - rt.aideDepart.y) > 10)) Fn_AnnulerAideTactile();
}
function Fn_OnFinSurvol(e) {
  const g = e.target.closest ? e.target.closest('.gloss') : null;
  if (!g) return;
  const vers = e.relatedTarget;
  const pop = document.getElementById('gloss-popover');
  if (!pop) return;
  if (vers && (pop.contains(vers) || (vers.closest && vers.closest('.gloss') === g))) return;
  Fn_FermerGloss();
}
/* ---- Tic des compteurs (1/min) — mise à jour ciblée, jamais de re-rendu ---- */
function Fn_TickCompteurs() {
  document.querySelectorAll('[data-compteur]').forEach(el => {
    const c = Fn_Compteur(el.getAttribute('data-date'), false);
    el.textContent = c.label;
    el.className = 'compteur ' + c.cls;
  });
  // Une date franchie change un statut : le bandeau des échus doit apparaître le
  // jour même, sans attendre une action de l'utilisateur.
  if (Fn_MajStatutsCalendrier()) { Fn_PersisterSansHorodatage(); Fn_RenderZonesEvenements(); }
}

/* ================================================================
   INIT
   ================================================================ */
(async function Fn_Init() {
  await Fn_Load();
  // Collages du jour restaurés AVANT le premier rendu : un rechargement d'onglet
  // ne doit pas obliger à tout recoller.
  await Fn_CollagesRestaurer();
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js'); } catch (e) { /* hors PWA */ }
  }
  // Contrôle de version : au chargement, puis toutes les dix minutes pour un
  // onglet laissé ouvert — c'est exactement le cas qui posait problème.
  Fn_VerifierVersion();
  Var_State._runtime.timers.version = setInterval(Fn_VerifierVersion, 600000);
  await Promise.race([Fn_SyncTirer(), new Promise(r => setTimeout(r, 4000))]);
  const nav = document.getElementById('nav-onglets');
  if (nav) {
    nav.addEventListener('click', e => {
      const b = e.target.closest('[data-action="onglet"]');
      if (b) Fn_MontrerOnglet(b.getAttribute('data-id'));
    });
  }
  const principal = document.getElementById('principal');
  if (principal) {
    principal.addEventListener('click', Fn_OnAction);
    principal.addEventListener('change', Fn_OnChange);
    // Un seul écouteur de frappe, délégué comme les autres. Il ne sert qu'à
    // rendre un bouton disponible dès que sa saisie est complète : il ne mute
    // jamais l'état et ne redessine jamais la zone où l'on tape — remplacer le
    // DOM sous les doigts ferait perdre le curseur à chaque caractère.
    principal.addEventListener('input', Fn_OnSaisie);
  }
  // Capture, donc AVANT tout autre gestionnaire : un appui long qui vient
  // d'ouvrir l'aide ne doit pas déclencher la commande au relâchement.
  document.addEventListener('click', e => {
    const rt = Var_State._runtime;
    if (!rt.aideDeclenchee) return;
    rt.aideDeclenchee = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
  document.addEventListener('touchstart', Fn_OnTactileDebut, { passive: true });
  document.addEventListener('touchmove', Fn_OnTactileBouge, { passive: true });
  document.addEventListener('touchend', Fn_AnnulerAideTactile, { passive: true });
  document.addEventListener('touchcancel', Fn_AnnulerAideTactile, { passive: true });
  document.addEventListener('click', Fn_OnDocumentClick);
  document.addEventListener('mouseover', Fn_OnSurvol);
  document.addEventListener('mouseout', Fn_OnFinSurvol);
  window.addEventListener('scroll', Fn_FermerGloss, { passive: true });
  Var_State._runtime.timers.tick = setInterval(Fn_TickCompteurs, 60000);
  Fn_RenderTout();
  Fn_MontrerOnglet(Var_State.onglet || 'vigie');
})();
</script>
