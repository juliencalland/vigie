  L.push('MISSION 2 — COLLECTE ET CONSOLIDATION des données de marché pour CHAQUE instrument du bloc inst (positions, sous-jacents, instruments suivis). Source privilégiée : les pages publiques Zone Bourse (zonebourse.com). EXHAUSTIVITÉ EXIGÉE : chaque champ listé ci-dessous est à chercher explicitement — un champ omis sera lu comme « introuvable », il ne se rattrape pas au tour suivant. Une valeur non trouvée s’omet (voir ÉCONOMIE) ; elle ne s’invente jamais.');
  L.push('  PROTOCOLE DE COLLECTE (à appliquer instrument par instrument, sans exception) :');
  L.push('   0. FRAÎCHEUR — CRITÈRE DE REJET, à vérifier AVANT de retenir un cours. Le champ last doit porter le dernier cours de la séance EN COURS, ou la clôture de la DERNIÈRE séance close. Sont des échecs de collecte, pas des valeurs acceptables : un instantané pris plus tôt dans la journée alors que la séance est terminée (« 09 h 40 » relevé à 22 h : la clôture de 17 h 35 existe, va la chercher) ; un cours de la veille ou d’avant quand la séance du jour a eu lieu ; un cours dont tu ne peux pas dater la séance. Un extrait de résultat de recherche porte la date de l’INDEXATION, pas celle du marché — c’est précisément pourquoi il faut OUVRIR la page. Si une source ne donne qu’un instantané ancien, change de source : essaies-en au moins deux avant d’abandonner. Si après cela la cotation du jour reste introuvable, rends le dernier cours réellement trouvé, mets sa VRAIE date dans as, et dis-le dans s (« clôture du JJ/MM/AA non publiée sur les N sources consultées ») — ne présente JAMAIS un cours ancien comme le cours courant. Le champ as porte toujours la date et l’heure DU COURS, jamais celles de l’appel : l’application compare les deux et affiche le retard.');
  L.push('   1. LE RELEVÉ N’EST PAS UNE COTATION. Le prix imprimé sur le relevé du courtier est une valorisation d’inventaire, pas un cours de marché : il ne porte ni variation, ni ouverture, ni volume, ni horodatage de séance. Le reprendre en last est une NON-COLLECTE. Le cours de séance se lit sur une page de cotation, et l’écart éventuel avec le relevé se signale dans analysis (mission 3).');
  L.push('   2. TU DISPOSES DE DEUX OUTILS, ET LE SECOND EST CELUI QUI RAPPORTE LES CHIFFRES : la RECHERCHE rend des extraits de résultats — jamais un tableau de valorisation — tandis que la LECTURE DE PAGE ouvre une URL et te donne son contenu. Les multiples, le BPA, la capitalisation, les volumes et les bornes de séance vivent DANS les pages, pas dans les extraits. Enchaîne donc systématiquement : chercher la page → LIRE la page → relever les chiffres. Une URL doit être apparue dans la conversation (donc dans un résultat de recherche) avant de pouvoir être lue.');
  L.push('   3. Pour chaque instrument, au minimum : (a) ouvrir sa page de COTATION — cours, variation, ouverture, haut, bas, clôture précédente, volume, ADV, 52 semaines, et la cotation hors séance si la place est fermée ; (b) ouvrir sa page de VALORISATION — les multiples, le BPA et les agrégats de la liste (e). Une requête générale du type « X cours action » sans lecture de page ne rapporte ni multiples, ni BPA, ni volumes : elle ne suffit pas. L’agenda et le consensus se lisent sur ces mêmes pages ou sur une troisième.');
  L.push('   4. Un produit à levier compte pour SON SOUS-JACENT : ses multiples sont ceux du sous-jacent, sa fiche émetteur fournit barrière, parité, delta et portage. Ne consomme pas d’appel pour chercher un PER au turbo lui-même.');
  L.push('   5. Si la page de valorisation reste introuvable ou illisible APRÈS l’avoir cherchée ET tenté de la lire, dis-le dans note en nommant ce qui a été tenté. Une note de ce type sans lecture correspondante est une faute : l’omission n’est légitime qu’après avoir réellement ouvert la page.');
  L.push('   6. Ordre de priorité si le temps manque : cotations complètes de toutes les lignes détenues D’ABORD, puis valorisation des lignes les plus lourdes en % de la valeur nette, puis le reste. Ne sacrifie jamais les cotations pour produire davantage de texte.');
  L.push('  (a) COTATIONS (bloc quotes) — pré-ouverture (pre), variation de la pré-ouverture en % (preVar) et son heure (preAs) ; dernier cours de séance (last) et sa variation en % (var) ; ouverture (ouv), plus haut (haut) et plus bas (bas) de la séance, clôture de la veille (clotPrec) ; après-clôture (post), sa variation en % (postVar) et son heure (postAs) ; volume du jour (vol) et volume moyen quotidien sur 3 mois (adv, en TITRES — il dimensionne la capacité de sortie) ; plus haut et plus bas de 52 semaines (h52, b52) ; devise de cotation (dev) et place (place). La RÈGLE HORS-HORAIRES ci-dessus s’applique : si la place est fermée, la valeur pertinente du moment (pré-ouverture ou après-clôture) est OBLIGATOIRE en plus du dernier cours de séance — « dernier cours de clôture » seul est une réponse incomplète.');
  L.push('  (b) AGENDA de la société (bloc fundamentals) — prochaine publication en clair (pub) ET sa date en ISO AAAA-MM-JJ (pubDate) quand elle est connue.');
  L.push('  (c) CONSENSUS (bloc fundamentals) — recommandation agrégée avec sa répartition (conso), nombre d’analystes (nbA), objectif de cours moyen (obj), écart en % au dernier cours (objEcart), objectifs le plus haut et le plus bas (objHaut, objBas).');
  L.push('  (d) RÉVISIONS (bloc fundamentals) — direction récente des révisions de BNA/CA (revi) et synthèse de tendance (synth).');
  L.push('  (e) VALORISATION (bloc valuation, page « Valorisation ») — PER courant TTM (per) et prévisionnels exercice en cours et suivant (perN, perN1) ; BÉNÉFICE PAR ACTION publié et prévisionnels (bpa, bpaN, bpaN1) — le BPA est OBLIGATOIRE dès que la page le publie, c’est lui qui rend le PER interprétable ; VE/CA (veCa), VE/EBITDA (veEbitda), P/B (pb), PEG (peg) ; rendement du dividende en % (rdt), dividende par action (divAct) et prochaine date de détachement en ISO (exDiv) ; CAPITALISATION boursière (capi) avec sa devise (capiDev) ; dette nette (detteNette) et dette nette/EBITDA (dnEbitda) ; ROE en % (roe), marge opérationnelle en % (margeOp), croissance attendue du CA et du BPA en % (croisCa, croisBpa) ; ET les points de comparaison — médiane historique 5 ou 10 ans du titre (refHist) et médiane des pairs/du secteur (refPairs) — sans lesquels un multiple reste brut et tendue vaut null.');
  L.push('  (f) ACTUALITÉS marquantes récentes → elles alimentent l’expertise (mission 5), pas un bloc dédié.');
  L.push('  (g) PRODUITS À LEVIER — fiche émetteur : sens, ratio/parité, barrière, distance à la barrière, strike, delta, coût de portage mensuel → bloc positions.');
  L.push('  (h) LIEN DIRECT (champ u, sur quotes, fundamentals, valuation, expertise, events, positions et opportunities) : l’URL EXACTE de la page consultée pour ce bloc et cet instrument — fiche Zone Bourse de l’instrument, page « Valorisation », fiche produit de l’émetteur, page IR, communiqué. Une URL http(s) complète et directement ouvrable, jamais une page d’accueil ni une recherche. C’est ce lien qui permet de revérifier un chiffre des jours plus tard : il fait partie de la donnée, pas de l’habillage.');
  L.push('  CROISE avec les sources primaires : sites relations investisseurs (IR) des émetteurs pour les dates officielles, calendriers des banques centrales, communiqués. Chaque donnée restituée porte s (source nommée) + as (horodatage) + u (lien).');
  L.push('MISSION 3 — CONTRÔLE DE COHÉRENCE : les documents entre eux ET les documents vs le snapshot ci-dessus. Une divergence est un SIGNAL, pas une erreur : les liquidités du relevé PDF et celles de l’aperçu de marge sont comparées ; un écart trahit des mouvements entre les deux horodatages (ordre exécuté, dépôt/retrait, frais). Tente le rapprochement CHIFFRÉ de chaque écart (ex. « écart de 12 010,00 € = somme exacte des 2 ordres d’achat en attente sur le relevé → probablement exécutés depuis ») et produis une entrée analysis par écart : kind parmi position_soldee / ordre_execute / nouvelle_ligne / divergence_liquidites / reclassification ; summary décrit l’écart, evidence le rapprochement chiffré, proposal le traitement proposé, ticker si identifiable. Signale aussi tout ordre qui, exécuté, transformerait une poche (ex. bascule en delta-neutre) : à classer reclassification.');
  L.push('MISSION 4 — REVUE DES AGENDAS ET ÉVÉNEMENTS CLÉS PAR TITRE : pour chaque position et sous-jacent, vérifie les prochaines dates (résultats et guidances, journées investisseurs, détachements de dividende avec ajustement barrière/strike des dérivés, échéances/exercices des produits, catalyseurs macro pertinents pour les expositions — banques centrales avec mention des projections/dot plot, publications macro majeures, catalyseurs sectoriels des facteurs dominants, indicateurs avancés type donneurs d’ordre/clients/pairs d’un facteur concentré). Confirme sur source primaire quand c’est possible (confirmed=true seulement dans ce cas). Qualifie l’importance pour LA position détenue (taille, sens, levier). Ajoute un événement récurrent de revue du bien-fondé de CHAQUE couverture (« le catalyseur qui justifie cette couverture est-il passé ? »), un point de vigilance pour chaque ordre en attente dont un catalyseur du sous-jacent précède la probable exécution (risque de gap à travers la limite) et un point de vérification d’exécution. Si le coussin de marge ressort sous le seuil professionnel (< 10 %), événement immédiat de sévérité Crit avec plan de réduction chiffré. NE DUPLIQUE PAS les événements déjà suivis (bloc evFuturs du snapshot) : ne propose que les nouveaux ou les dates corrigées. → bloc events, textes complets (mission 7).');
  L.push('MISSION 5 — EXPERTISE PAR POSITION : pour chaque ligne, une lecture de desk — tendance (technique et fondamentale), exposition effective (€, % VN, effet levier), valorisation vs référentiel, risques spécifiques. Quand une publication de résultats est intervenue depuis la dernière consolidation (' + (Var_State.derniereConsolidation ? 'le ' + Fn_FmtHeure(Var_State.derniereConsolidation) : 'jamais réalisée : traite les dernières publications de chaque ligne') + '), ajoute une REVUE D’ANALYSTE-COMPTABLE : CA / marges / BPA vs consensus, guidance relevée / confirmée / abaissée, qualité du résultat (éléments exceptionnels, cash-flow vs résultat comptable, variation de BFR), et ce que cela change à la thèse. Sinon, omets simplement la clé revue. → bloc expertise.');
  L.push('MISSION 6 — ACTIONS PROPOSÉES SUR LES POSITIONS (le livrable central) : pour chaque position qui le justifie au regard des missions 3-5, la ou les meilleures actions envisageables, HIÉRARCHISÉES (priorite 1 = urgent à 3), chacune formulée comme sur un desk : proposition concrète, déclencheur conditionnel (« si X → A ; si Y → B »), coût/bénéfice chiffré, horizon, condition d’invalidation. Une action sans déclencheur ni ordre de grandeur chiffré est à reformuler avant livraison. Les positions sans action nécessaire le disent EXPLICITEMENT (« conserver, prochain point de décision : résultats du JJ/MM/AA ») — une entrée « conserver » vaut mieux qu’une ligne absente. → bloc actions.');
  L.push('MISSION 7 — TEXTES D’ÉVÉNEMENTS COMPLETS : chaque événement du bloc events porte ses trois textes — surv (l’indicateur concret à lire ce jour-là), arb (la décision formulée en alternatives : « si X → A ; si Y → B », avec coût/bénéfice chiffré, en RÉUTILISANT les métriques de la carte : « l’exécution porterait le levier de 1,53 à 1,78 » plutôt qu’une formule vague ; sépare les alternatives par un point-virgule, l’application les met en puces), prat (voir l’EXIGENCE D’EXPERTISE ci-dessous : règle professionnelle SPÉCIFIQUE à l’événement et à la position, avec action corrective — jamais de généralité creuse). Et sa rangée m, NON VIDE, chiffrée depuis le relevé et les données consolidées, choisie selon la catégorie :');
  L.push('  - publication d’une ligne détenue : exposition en jeu (€ et % VN), amplitude de gap de référence (mouvement type post-résultats du titre, à défaut ±10 % en le signalant comme hypothèse), impact du gap sur la VN en € dans les deux sens, effet levier inclus ;');
  L.push('  - ORDRES : montant de l’ordre (€), écart limite vs dernier cours (%), effet sur la dette/levier si exécuté (avant → après) ;');
  L.push('  - COUVERTURE : delta couvert vs delta de la poche (€ et %), état effectif/théorique, distance à la barrière (%), portage couru estimé (€) ;');
  L.push('  - MACRO : exposition du facteur concerné (€ et % VN), sensibilité approximative (ex. « ±1 % EUR/USD ≈ ±X € ») ;');
  L.push('  - MARGE : dette actuelle, levier avant/après les ordres en attente, montant libérable par le plan de réduction (€).');
  L.push('  Toute métrique non calculable faute de donnée : v = « — (donnée manquante : X) » — jamais de valeur inventée.');
  L.push('  EXIGENCE D’EXPERTISE SUR LA LIGNE prat (niveau attendu : gérant de desk + analyste expert-comptable). Chaque ligne pratique énonce une règle de gestion RECONNUE, choisie dans le registre le PLUS PERTINENT pour ce type d’événement et cette position, avec son action corrective chiffrée quand la carte le permet. Registres à mobiliser :');
  L.push('  - desk / risque : taille et couverture s’ajustent AVANT le binaire ; une couverture d’événement se déboucle APRÈS le catalyseur ; delta effectif vs théorique ; le coussin de marge et le levier priment sur toute opportunité ;');
  L.push('  - microstructure / exécution : gap d’ouverture à travers une limite ; profondeur (ADV) → sorties en plusieurs séances sur les small caps ; revoir chaque ordre en attente LA VEILLE d’une publication du titre ; fenêtres d’exécution (ouverture, clôture, fixings) ;');
  L.push('  - valorisation : un multiple tendu vs référentiel se re-price plus violemment sur déception (asymétrie du re-rating) ; PEG vs croissance guidée ; changement de multiple pertinent quand le résultat change de signe (PER → VE/CA) ; l’écart à l’objectif du consensus n’est pas un potentiel, c’est une opinion moyenne ;');
  L.push('  - analyse financière / comptable : lire la guidance et son pont (bridge) AVANT le BPA ; qualité du résultat — éléments exceptionnels, cash-flow vs résultat comptable, variation de BFR, reconnaissance du revenu ; book-to-bill et carnet pour les équipementiers ; distinguer l’effet de change sur les comptes de l’effet de change sur le titre ;');
  L.push('  - structuration produit : ajustement des barrières/strikes aux détachements ; portage couru d’un produit sans échéance ; valeur résiduelle au knock-out selon le type (turbo BEST : nulle ; mini-future : résiduelle) ; parité/ratio avant tout calcul d’exposition.');
  L.push('  INTERDIT : deux événements différents partageant la même ligne prat générique — chacune est spécifique au type d’événement, à la catégorie de la position et à sa taille.');
  L.push('  LIBELLÉ COURT (court, obligatoire sur chaque événement) : un libellé compact de 28 caractères MAXIMUM pour la case du calendrier — l’essentiel en abréviations usuelles (« Rés. T3 fisc. 2026 », « CA S1 avant Bourse », « Déc. FOMC 20 h », « Ex-div — ajust. barrière »), SANS le ticker (l’application le préfixe), compréhensible seul. Si le libellé dépasse 28 caractères, abréger davantage plutôt que tronquer.');
  L.push('MISSION 8 — DÉCOUVERTE D’OPPORTUNITÉS (bloc opportunities) : à partir de la photographie COMPLÈTE du portefeuille et d’une recherche web large, réalise d’abord la concentration de la masse d’informations puis le picking. Ne livre que 3 à 7 dossiers réellement discriminants, récents au moment de la FIN de cet appel. Écarte le bruit, les reprises de dépêches et les idées redondantes. Chaque opportunité doit expliciter sa COHÉRENCE avec l’exposition actuelle : facteurs déjà dominants, corrélation avec les lignes détenues, devise, liquidité, levier et coussin de marge. Une idée qui renforce une concentration déjà excessive est rejetée ou classée watchlist avec allocationCiblePctVN = 0 tant que le risque n’est pas réduit. Privilégie les compléments de portefeuille, les asymétries documentées, les catalyseurs datés et les valorisations comparées à un référentiel. Exclue par défaut les titres déjà détenus, sauf renforcement/paire/couverture explicitement justifié. Croise les données décisionnelles avec une source primaire et une seconde source fiable ; chaque dossier porte un horodatage asOf et des sources. Le score 0-100 agrège qualité de la thèse, adéquation portefeuille, valorisation, catalyseurs, liquidité et risque. Ce sont des CANDIDATS À ÉTUDIER, jamais des ordres ni des recommandations personnalisées.');
  L.push('  Pour chaque opportunité : these concise mais complète ; coh chiffrée et spécifique ; fact ; prixRef et dev avec as ; valo vs historique/pairs ; cata datés ; decl observable ; inval ; risques principaux ; hor ; allocPct compatible avec la marge et les seuils de concentration ; liq ; s ; u (lien direct vers la fiche de l’instrument ou le communiqué qui fonde la thèse — indispensable pour rouvrir le dossier des jours plus tard). Une fiche qui reprend une idée déjà ouverte porte sa clé k. Si aucune idée ne passe le filtre, renvoie opportunities: [] plutôt que de remplir artificiellement.');
  L.push('  FILTRE DE COHÉRENCE — appliqué dans cet ordre sur le PROFIL D’EXPOSITION fourni ci-dessus, jamais « en général » :');
  L.push('   1. PLAFONDS : une idée qui porterait une ligne au-delà du plafond rouge de concentration par ligne, un facteur au-delà du plafond par facteur, ou une devise au-delà du plafond de devise → verdict = "incohérente", allocPct = 0, et elle n’est conservée QUE si elle RÉDUIT une concentration existante (diversification, jambe opposée, couverture). Le calcul figure en clair dans coh (ex. « porterait le facteur X de 82,2 % à 85,4 % de la VN, plafond rouge 40 % »).');
  L.push('   2. MARGE ET LEVIER : si le coussin de marge est sous son seuil rouge ou le levier brut au-dessus du sien, AUCUNE augmentation du brut n’est recevable — l’idée doit être AUTO-FINANCÉE et le champ fin nomme la ligne à alléger et le montant (« vendre ~1 800 € de la ligne Y, satellite la plus liquide, avant d’engager »). verdict = "sous conditions" au mieux. Le coussin et le levier priment sur toute opportunité.');
  L.push('   3. DIMENSIONNEMENT : allocPct et tailleEur compatibles avec la marge disponible ET les plafonds, cohérents avec la catégorie visée (une idée satellite ne se dimensionne pas comme une conviction). Sans valeur nette connue : clés omises, et le dire dans coh.');
  L.push('   4. RÉCENCE : ne retenir que des éléments PUBLIÉS dans la fenêtre ci-dessus ; as = date et heure d’arrêté (jour de cet appel, heure de Paris) ; cataDate, quand elle existe, est une date FUTURE ou du jour au format ISO AAAA-MM-JJ — jamais un catalyseur déjà passé.');
  L.push('   5. ACCESSIBILITÉ : instrument coté et négociable depuis un compte-titres européen (place et ISIN quand ils sont trouvés) ; signaler toute faible profondeur (sortie impossible en 1-2 séances) et, pour un produit à barrière, la distance au knock-out. Accessibilité non vérifiable → le dire dans risques, jamais la supposer.');
  if (ctx.coursSeuls) L.push('  MODE « COURS SEULS » : le balayage reste dû, mais sans relevé du jour l’exposition n’est pas actualisée — dimensionner sur le profil fourni EN LE SIGNALANT et abaisser d’un cran chaque verdict (aucune idée "cohérente" sans exposition à jour).');
  L.push('');
  L.push('=== TAXONOMIE DE CLASSIFICATION (expertise, jamais de liste codée en dur) ===');
  L.push('- CŒUR : supports diversifiés de détention longue (ETF larges, fonds).');
  L.push('- CONVICTION : lignes actions à poids significatif (> 10 % de la valeur nette) portant une thèse identifiable.');
  L.push('- SATELLITE : lignes actions de poids faible, opportunistes ou résiduelles.');
  L.push('- COUVERTURE : produits dérivés/à levier dont le sens est OPPOSÉ à une exposition détenue (à détecter par croisement sous-jacent/sens/taille) — calcule le ratio de couverture effectif (delta couvert / delta de la poche couverte).');
  L.push('- SPÉCULATIF-LEVIER : produits à levier SANS jambe opposée en portefeuille (paris directionnels autonomes).');
  L.push('- ORDRES : chaque ordre en attente avec son effet potentiel sur la marge et la classification.');
  L.push('- FACTEURS : regroupements par facteur de risque commun (secteur, thème, devise, sensibilité taux) — des lignes corrélées constituent UNE exposition ; renseigne positions[].facteurs.');
  L.push('');
  L.push('=== VALORISATION — CAS PARTICULIERS (dictés par l’analyse) ===');
  L.push('Ligne en pertes : PER « n. s. (résultat négatif) » dans note et bascule sur VE/CA. Banque/assurance : privilégier P/B. Foncière : P/ANR. ETF : frais courants et PER moyen du panier si disponibles (note). Produit à levier : PAS de multiples propres — le bloc valuation porte sur son SOUS-JACENT et note le dit explicitement (« multiples du sous-jacent X pour le turbo Y »). Chaque multiple est mis en perspective avec AU MOINS une référence (médiane historique du titre 5-10 ans et/ou médiane des pairs/du secteur) dans refHist/refPairs ; sinon il reste brut et la clé tendue est OMISE (« sans référentiel » : un PER isolé n’est pas interprétable). tendue = true si les multiples ressortent AU-DESSUS de leur référentiel, false sinon.');
  L.push('');
  L.push('=== TRAÇABILITÉ (obligatoire sur TOUT texte livré — l’utilisateur lit chaque carte SEULE, sur mobile, des jours plus tard) ===');
  L.push('1. Références croisées NOMMÉES : jamais « avant l’événement binaire (13/08/26) » mais « avant les résultats trimestriels de la société X du 13/08/26 (60,7 % de la VN) » — toujours QUI + QUOI + QUAND.');
  L.push('2. Provenance de chaque chiffre identifiable : [relevé] (lu dans les documents du jour), [calcul] (formule reconstituable depuis la carte, ex. « 12 010 € = somme des 2 ordres d’achat en attente »), [consolidation] (récupéré en ligne — source + horodatage), [hypothèse] (TOUJOURS marquée « hyp. », « est. » ou « défaut, signalé », avec ce qu’il faudrait pour la lever).');
  L.push('3. Agrégats décomposés : tout montant agrégé cité est accompagné de sa décomposition sur la même carte.');
  L.push('4. Dates toujours qualifiées : une date seule est interdite — toujours accolée à son objet, cohérente avec confirmed.');
  L.push('5. Avant de livrer, relis chaque texte comme s’il était affiché SEUL et corrige toute référence qui ne s’y suffit pas.');
  L.push('');
  L.push('=== NORMALISATION DES DATES ET DES HEURES (obligatoire, aucune exception) ===');
  L.push('- Champs de date du schéma (d, pubDate, exDiv, cataDate) : ISO AAAA-MM-JJ (format machine, jamais affiché tel quel dans un texte).');
  L.push('- Toute date ÉCRITE dans un texte (lib, note, métriques, surv/arb/prat, s, releve, pub) : format JJ/MM/AA (ex. 13/08/26) — jour PUIS mois, JAMAIS MM/JJ. Piège : les sources américaines affichent MM/JJ (« 08/13 » = 13 août) — convertir SYSTÉMATIQUEMENT ; en cas de doute sur l’ordre jour/mois, re-vérifier sur une source où le mois est écrit en toutes lettres.');
  L.push('- Toute heure : HEURE DE PARIS (Europe/Paris), notée « HH h MM heure de Paris » à la première mention de chaque carte, avec l’heure locale de la place entre parenthèses quand elle éclaire (ex. « 22 h 05 heure de Paris (16 h 05 ET) »). Conversions à vérifier selon l’heure d’été en vigueur à la DATE de l’événement : ET = Paris − 6 h, Londres = Paris − 1 h, Tokyo = Paris + 7 h.');
  L.push('- Horodatages de cotation (as des quotes, preAs, postAs) : JJ/MM/AA HH:MM, heure de Paris. Exception : margin.as reprend l’heure LUE sur la capture du courtier, telle quelle.');
  L.push('');
  L.push('=== ÉCONOMIE DE LA RÉPONSE (règles strictes — cet appel est facturé au jeton) ===');

async function Fn_ErreurHttp(rep) {
  let type = 'http_' + rep.status, message = rep.statusText || ('HTTP ' + rep.status);
  try {
    const corps = await rep.json();
    if (corps && corps.error) { type = corps.error.type || type; message = corps.error.message || message; }
  } catch (e) { /* corps non JSON */ }
  return { api: true, status: rep.status, type, message };
}

function Fn_ErreurCatalogue(code) { return Cst_ErreursAPI.find(e => e.code === code) || null; }
// Message affiché : reprend le catalogue, en y ajoutant ce que seul l'appel
// connaît (statut HTTP réel, jetons déjà consommés, message brut de l'API).
function Fn_MessageErreur(err) {
  if (!err) return 'Erreur inconnue.';
  if (err.name === 'AbortError') return 'MAJ annulée par l’utilisateur.';
  const msg = String(err.message || err);
  let code = err.type || '';
  if (err.fluxIncomplet) code = 'flux_incomplet';
  else if (err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(msg)) code = 'reseau';
  else if (/credit|billing|balance|insufficient/i.test(msg)) code = 'billing_error';
  const e = Fn_ErreurCatalogue(code);
  if (!e) return (err.type ? err.type + ' — ' : '') + msg + (err.status ? ' (HTTP ' + err.status + ')' : '');
  let t = e.quoi.toUpperCase() + ' — ' + e.pourquoi;
  if (code === 'flux_incomplet' && err.jetonsRecus) {
    t += ' Reçu avant la coupure : ≈ ' + Fn_FmtNb(err.jetonsRecus, 0) + ' jetons, ' + (err.recherchesFaites || 0) + ' recherche(s).';
  }
  t += ' → ' + e.faire;
  const ref = [e.code, (err.status || e.http) ? 'HTTP ' + (err.status || e.http) : ''].filter(Boolean).join(' · ');
  t += ' [' + ref + ' — détail dans Paramètres → Codes d’erreur]';
  // Message brut de l'API : seul endroit où le champ fautif est nommé.
  if (msg && msg.length < 300 && (code === 'invalid_request_error' || code === 'api_error')) t += ' Message de l’API : « ' + msg + ' »';
  return t;
}
/* ---- Appel streaming SSE (mode BYOK) : accumulateur générique de blocs ---- */
async function Fn_AppelStream(corps, entetes, journal, signal) {
  const rep = await fetch(Cst_ApiUrl, { method: 'POST', headers: entetes, body: JSON.stringify(corps), signal });
  if (!rep.ok) throw await Fn_ErreurHttp(rep);
  const lecteur = rep.body.getReader();
  const dec = new TextDecoder();
  let tampon = '', texte = '', modele = null, entree = 0, sortie = 0, stop = null;
  const blocs = [];
  const baseRech = journal.recherches || 0, baseSortie = journal.jetonsSortie || 0;
  let rech = 0, charsSortie = 0; // charsSortie : estimation vivante (l'usage exact n'arrive qu'en fin de flux)
  // Un flux SSE complet se termine TOUJOURS par message_stop, précédé d'un
  // message_delta portant stop_reason. Sans ces marqueurs, la connexion a été
  // coupée en cours de route : crédit épuisé, coupure réseau, ou fin de session
  // côté serveur. Sans ce drapeau, la coupure passait pour une fin normale.
  let finPropre = false;
  for (;;) {
    const lu = await lecteur.read();
    Var_State._runtime.dernierSignal = Date.now();
    if (lu.done) break;
    tampon += dec.decode(lu.value, { stream: true });
    let idx;
    while ((idx = tampon.indexOf('\n')) >= 0) {
      const ligne = tampon.slice(0, idx).trim();
      tampon = tampon.slice(idx + 1);
      if (!ligne.startsWith('data:')) continue;
      const brut = ligne.slice(5).trim();
      if (!brut) continue;
      let ev;
      try { ev = JSON.parse(brut); } catch (e) { continue; }
      if (ev.type === 'message_start') {
        modele = ev.message && ev.message.model || null;
        entree = (ev.message && ev.message.usage && ev.message.usage.input_tokens) || 0;
        journal.modele = modele;
        Fn_Phase(journal, 'analyse', 'en cours', 'Analyse des documents (modèle : ' + (modele || '?') + ')');
      } else if (ev.type === 'content_block_start') {
        const b = ev.content_block ? JSON.parse(JSON.stringify(ev.content_block)) : { type: 'inconnu' };
        blocs[ev.index] = b;
        if (b.type === 'server_tool_use') {
          rech++;
          journal.recherches = baseRech + rech;
          b._json = '';
          Fn_Phase(journal, 'recherches', 'en cours', 'Recherche web n° ' + journal.recherches + ' en cours');
        } else if (b.type === 'text') {
          b.text = b.text || '';
          Fn_Phase(journal, 'redaction', 'en cours', 'Rédaction du JSON');
        } else if (b.type === 'thinking') {
          b.thinking = b.thinking || '';
          b.signature = b.signature || '';
        }
      } else if (ev.type === 'content_block_delta') {
        const b = blocs[ev.index];
        const d = ev.delta || {};
        if (b) {
          if (d.type === 'text_delta') { b.text = (b.text || '') + (d.text || ''); texte += d.text || ''; charsSortie += (d.text || '').length; }
          else if (d.type === 'input_json_delta') { b._json = (b._json || '') + (d.partial_json || ''); charsSortie += (d.partial_json || '').length; }
          else if (d.type === 'thinking_delta') { b.thinking = (b.thinking || '') + (d.thinking || ''); charsSortie += (d.thinking || '').length; }
          else if (d.type === 'signature_delta') { b.signature = (b.signature || '') + (d.signature || ''); }
          journal.jetonsSortie = baseSortie + Math.round(charsSortie / 3.6); // estimation, remplacée par l'usage exact en fin de flux
        }
      } else if (ev.type === 'content_block_stop') {
        const b = blocs[ev.index];
        if (b && b._json !== undefined) {
          try { b.input = b._json ? JSON.parse(b._json) : (b.input || {}); } catch (e) { b.input = b.input || {}; }
          delete b._json;
        }
        // La requête de chaque recherche web devient visible et reste journalisée.
        if (b && b.type === 'server_tool_use' && b.name === 'web_search' && b.input && b.input.query) {
          journal.listeRecherches = journal.listeRecherches || [];
          journal.listeRecherches.push(String(b.input.query).slice(0, 120));
          Fn_Phase(journal, 'recherches', 'en cours', 'Recherche web n° ' + journal.listeRecherches.length + ' : « ' + String(b.input.query).slice(0, 90) + ' »');
        }
      } else if (ev.type === 'message_delta') {
        if (ev.usage && ev.usage.output_tokens != null) { sortie = ev.usage.output_tokens; journal.jetonsSortie = baseSortie + sortie; }
        if (ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason;
      } else if (ev.type === 'message_stop') {
        finPropre = true;
      } else if (ev.type === 'error') {
        throw { api: true, type: (ev.error && ev.error.type) || 'api_error', message: (ev.error && ev.error.message) || 'erreur de flux SSE' };
      }
      Fn_MajCompteursDirect(journal);
    }
  }
  // Fin de flux SANS marqueur de fin : la réponse est incomplète, quoi qu'en
  // dise son contenu. Ne JAMAIS laisser passer ce cas — le parseur tolérant
  // réparerait le JSON tronqué et la MAJ serait déclarée réussie sur des
  // données amputées, sans que rien ne le signale. C'est ce que produit un
  // crédit épuisé en cours d'appel : le serveur ferme la connexion.
  if (!finPropre && !stop) {
    throw {
      api: true, type: 'flux_incomplet', fluxIncomplet: true,
      jetonsRecus: baseSortie + sortie, recherchesFaites: baseRech + rech,
      message: 'Le flux s’est interrompu avant la fin de la réponse : la connexion a été fermée sans marqueur de fin.'
    };
  }
  return { contenu: blocs.filter(Boolean), texte, modele, entree, sortie, recherches: rech, stopReason: stop };
}
/* ---- Appel direct sans flux (mode artefact — le pont ne streame pas) ---- */
async function Fn_AppelDirect(corps, entetes, journal, signal) {
  Fn_Phase(journal, 'analyse', 'en cours', 'Analyse des documents et recherches en cours (pont d’artefact, sans flux — bilan complet en fin d’appel)');
  const rep = await fetch(Cst_ApiUrl, { method: 'POST', headers: entetes, body: JSON.stringify(corps), signal });
  if (!rep.ok) throw await Fn_ErreurHttp(rep);
  const data = await rep.json();
  const contenu = data.content || [];
  const texte = contenu.filter(b => b && b.type === 'text').map(b => b.text || '').join('');
  let rech = 0;
  if (data.usage && data.usage.server_tool_use && data.usage.server_tool_use.web_search_requests != null) {
    rech = data.usage.server_tool_use.web_search_requests;
  } else {
    rech = contenu.filter(b => b && b.type === 'server_tool_use').length;
  }
  journal.modele = data.model || journal.modele;
  journal.recherches = (journal.recherches || 0) + rech;
  journal.jetonsSortie = (journal.jetonsSortie || 0) + ((data.usage && data.usage.output_tokens) || 0);
  return {
    contenu, texte, modele: data.model || null,
    entree: (data.usage && data.usage.input_tokens) || 0,
    sortie: (data.usage && data.usage.output_tokens) || 0,
    recherches: rech, stopReason: data.stop_reason || null
  };
}
/* ---- Parseur JSON tolérant aux troncatures (6.4) : réparation, jamais de rejet total ---- */
function Fn_ParseJsonTolerant(texte) {
  if (!texte) return { data: null, repare: false, erreur: 'réponse vide' };
  let t = String(texte).trim();
  t = t.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  const deb = t.indexOf('{');
  if (deb < 0) return { data: null, repare: false, erreur: 'aucun objet JSON dans la réponse' };
  const fin = t.lastIndexOf('}');
  if (fin > deb) {
    try {
      const d = JSON.parse(t.slice(deb, fin + 1));
      if (d && typeof d === 'object') return { data: d, repare: false, erreur: null };
    } catch (e) { /* → réparation */ }
  }
  const s = t.slice(deb);
  // Balayage : pile des ouvrants (en ignorant ceux situés dans des chaînes),
  // et points de coupe sûrs après chaque élément complet.
  const points = [];
  let pile = '', enChaine = false, echappe = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s.charAt(i);
    if (enChaine) {
      if (echappe) { echappe = false; }
      else if (ch === '\\') { echappe = true; }
      else if (ch === '"') { enChaine = false; points.push({ idx: i + 1, pile }); }
      continue;
    }
    if (ch === '"') enChaine = true;
    else if (ch === '{' || ch === '[') pile += ch;
    else if (ch === '}' || ch === ']') { pile = pile.slice(0, -1); points.push({ idx: i + 1, pile }); }
    else if (ch === ',') points.push({ idx: i, pile });
  }
  for (let k = points.length - 1, essais = 0; k >= 0 && essais < 400; k--, essais++) {
    const p = points[k];
    const cand = s.slice(0, p.idx).replace(/[\s,]+$/, '');
    if (!cand || cand.charAt(cand.length - 1) === ':') continue;
    let fermetures = '';
    for (let j = p.pile.length - 1; j >= 0; j--) fermetures += (p.pile.charAt(j) === '{' ? '}' : ']');
    try {
      const d = JSON.parse(cand + fermetures);
      if (d && typeof d === 'object') return { data: d, repare: true, erreur: null };
    } catch (e) { /* point de coupe précédent */ }
  }
  return { data: null, repare: false, erreur: 'JSON irrécupérable malgré la réparation (recul sur ' + Math.min(points.length, 400) + ' points de coupe)' };
}
/* ---- Orchestration de la consolidation ---- */
async function Fn_LancerConsolidation() {
  const rt = Var_State._runtime;
  if (rt.enCours) return;
  const mode = Fn_ModeAcces();
  if (mode.mode === 'aucun') { Fn_RenderMajPanel(); return; } // aucune requête vouée à l'échec
  const docs = rt.docs;
  const coursSeuls = !docs.positions;
  // Pièces réellement transmises. La capture des ordres exécutés est EXCLUE dès
  // que « aucune transaction récente » est cochée : la case la remplace, et une
  // image jointe malgré tout serait payée pour rien — avec le risque que le modèle
  // en tire des transactions contredisant la déclaration de l'utilisateur.
  const docsEnvoyes = ['ordres', 'executes', 'marge'].filter(k => docs[k] && !(k === 'executes' && rt.aucuneTransac));
  const nbEnvoyes = (docs.positions ? 1 : 0) + docsEnvoyes.length;
  const instruments = Fn_ListeInstruments();
  if (coursSeuls && !instruments.length) { Fn_RenderMajPanel(); return; }
  rt.enCours = true;
  rt.abort = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  rt.dernierSignal = (mode.mode === 'byok') ? Date.now() : null; // suivi du flux SSE (BYOK seulement)
  rt._stallAbort = false;
  // Onglet en arrière-plan : le navigateur bride les timers et peut geler la page
  // entière. Ce temps n'est PAS du silence du flux — sans ce correctif, changer
  // d'onglet plus de 5 min suffisait à faire couper la MAJ par le chien de garde.
  // Au retour au premier plan, la référence est décalée de la durée masquée (ou
  // remise à l'instant présent si cette durée est inconnue, cas du gel de page) :
  // les 5 minutes de silence ne se comptent qu'écran visible.
  rt.masqueA = null;
  rt.onVisibilite = () => {
    if (document.hidden) { rt.masqueA = Date.now(); return; }
    if (rt.dernierSignal) {
      rt.dernierSignal = rt.masqueA
        ? Math.min(Date.now(), rt.dernierSignal + (Date.now() - rt.masqueA))
        : Date.now();
    }
    rt.masqueA = null;
  };
  document.addEventListener('visibilitychange', rt.onVisibilite);
  // Garde-fou anti-perte : une requête HTTP meurt avec la page. Tant qu'une MAJ
  // tourne, le navigateur demande confirmation avant de recharger ou fermer —
  // un F5 réflexe gâche l'appel ET son coût, déjà facturé.
  rt.onQuitter = (ev) => { ev.preventDefault(); ev.returnValue = ''; return ''; };
  window.addEventListener('beforeunload', rt.onQuitter);
  const journal = Fn_NouveauJournal(mode.mode, coursSeuls);
  journal.listeRecherches = [];
  Cst_PhasesMAJ.forEach(p => journal.phases.push({ cle: p[0], statut: 'attente', message: p[1], ts: Date.now() }));
  Fn_Phase(journal, 'collecte', 'ok', 'Collecte documentaire : ' + (coursSeuls
    ? 'aucun document — MAJ partielle « cours seuls » sur ' + instruments.length + ' instrument(s)'
    : nbEnvoyes + ' pièce(s) jointe(s) transmise(s)'
      + (rt.aucuneTransac ? ' + « aucune transaction récente »' + (docs.executes ? ' (capture des ordres exécutés conservée mais NON transmise)' : '') : '')));
  // Chrono + chien de garde du flux (1 tick/s — clearInterval systématique dans finally)
  rt.timers.chrono = setInterval(() => {
    const el = document.getElementById('maj-chrono');
    if (el) el.textContent = Fn_DureeFmt(Date.now() - journal.debutTs);
    Fn_MajAfficherSante(journal); // « ça avance » / « c'est planté », chaque seconde
    if (document.hidden) return; // page masquée : ni affichage utile, ni coupure automatique
    const sig = rt.dernierSignal;
    if (sig) {
      const silence = Date.now() - sig;
      const elS = document.getElementById('maj-signal');
      if (elS) {
        elS.textContent = silence < 3000 ? 'à l’instant' : 'il y a ' + Math.round(silence / 1000) + ' s';
        elS.style.color = silence > 120000 ? 'var(--crit)' : (silence > 45000 ? 'var(--warn)' : '');
      }
      // Coupure de sécurité : 5 min sans AUCUN octet reçu = flux rompu, on ne reste
      // jamais bloqué en silence — annulation automatique signalée comme telle.
      if (silence > 300000 && rt.abort) { rt._stallAbort = true; rt.abort.abort(); }
    }
  }, 1000);
  try {
    // Sources de recherche : liste vide = web libre ; sinon l'outil est bridé aux
    // domaines cochés dans Paramètres, et le prompt en est informé (sans quoi le
    // modèle attribuerait ses recherches infructueuses à l'absence d'information).
    const sitesAutorises = Fn_SitesAutorises();
    const contenus = [];
    if (docs.positions) contenus.push({ type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: docs.positions.b64 } });
    docsEnvoyes.forEach(k => {
      contenus.push({ type: 'image', source: { type: 'base64', media_type: docs[k].media || 'image/png', data: docs[k].b64 } });
    });
    const ctxTexte = {
      coursSeuls, instruments, aucuneTransac: rt.aucuneTransac, sitesAutorises,
      // Le texte ne doit annoncer que les pièces RÉELLEMENT jointes : nommer une
      // capture absente ferait chercher au modèle une image qui n'est pas là.
      docNoms: {
        positions: docs.positions && docs.positions.nom,
        ordres: docs.ordres && docs.ordres.nom,
        executes: (docsEnvoyes.indexOf('executes') >= 0) ? docs.executes.nom : null,
        marge: docs.marge && docs.marge.nom
      }
    };
    contenus.push({ type: 'text', text: Fn_BuildPromptMAJ(ctxTexte) });
    // Le périmètre de recherche est ANNONCÉ au modèle : s'il change au cours des
    // replis, le texte doit changer avec lui — sinon le modèle croirait toujours
    // la recherche bridée et rendrait des « donnée hors périmètre » à tort.
    const reecrireTexte = sites => {
      ctxTexte.sitesAutorises = sites;
      contenus[contenus.length - 1].text = Fn_BuildPromptMAJ(ctxTexte);
    };
    const messagesApi = [{ role: 'user', content: contenus }];
    const entetes = { 'Content-Type': 'application/json' };
    if (mode.mode === 'byok') {
      entetes['x-api-key'] = Fn_GetApiKey();
      entetes['anthropic-version'] = '2023-06-01';
      entetes['anthropic-dangerous-direct-browser-access'] = 'true';
    }
    // Deux outils serveur : CHERCHER une page, puis la LIRE. Sans le second, le
    // modèle ne voyait que des extraits de résultats — d'où les pages
    // « Valorisation » jamais ouvertes et les multiples manquants.
    // Ne JAMAIS déclarer code_execution à côté : les versions 20260209 s'en
    // servent déjà en interne, et un second environnement d'exécution perturbe
    // le modèle.
    const outilRecherche = { type: Cst_OutilRecherche, name: 'web_search', max_uses: Cst_MaxRecherches };
    const outilLecture = { type: Cst_OutilLecture, name: 'web_fetch', max_uses: Cst_MaxLectures, max_content_tokens: Cst_MaxJetonsParPage };
    let outils = [outilRecherche, outilLecture];
    let domaines = sitesAutorises.slice();
    // La restriction de domaines vaut pour les DEUX outils : autoriser la
    // recherche sur un site sans autoriser sa lecture ne servirait à rien.
    const appliquerDomaines = () => {
      outils.forEach(o => {
        if (domaines.length) o.allowed_domains = domaines;
        else delete o.allowed_domains;
      });
    };
    appliquerDomaines();
    Fn_Phase(journal, 'envoi', 'ok', 'Requête envoyée (' + Cst_ModeleMAJ + ', effort ' + Cst_EffortMAJ + ', plafond ' + Fn_FmtNb(Cst_MaxTokens, 0) + ' jetons' + (mode.mode === 'byok' ? ', flux SSE' : ', pont d’artefact') + ', recherche + lecture de page (max ' + Cst_MaxRecherches + ' recherches, ' + Cst_MaxLectures + ' pages de ' + Fn_FmtNb(Cst_MaxJetonsParPage, 0) + ' jetons)' + (domaines.length ? ', limitées à ' + domaines.length + ' site(s)' : ', web libre') + ')');
    let texte = '', totalEntree = 0, totalSortie = 0, totalRech = 0, stopReason = null, continuations = 0;
    // Repli automatique et TRACÉ (jamais un abaissement choisi) : le plafond de sortie et le
    // paramètre d'effort varient d'un modèle à l'autre — plutôt qu'échouer, on réessaie une fois.
    let plafond = Cst_MaxTokens, effort = Cst_EffortMAJ, repliPlafond = false, repliEffort = false, repliDomaines = 0, repliOutils = false;
    for (;;) {
      const corps = {
        model: Cst_ModeleMAJ,
        max_tokens: plafond, // plafond maximal du modèle — la troncature ne doit jamais venir d'un plafond choisi trop bas
        thinking: { type: 'adaptive' },
        tools: outils,
        messages: messagesApi
      };
      if (effort) corps.output_config = { effort: effort };
      if (mode.mode === 'byok') corps.stream = true;
      let res;
      try {
        res = mode.mode === 'byok'
          ? await Fn_AppelStream(corps, entetes, journal, rt.abort && rt.abort.signal)
          : await Fn_AppelDirect(corps, entetes, journal, rt.abort && rt.abort.signal);
      } catch (errParam) {
        const msgP = String((errParam && errParam.message) || '');
        if (errParam && errParam.name === 'AbortError') throw errParam;
        if (!repliEffort && effort && /output_config|effort/i.test(msgP)) {
          repliEffort = true; effort = null;
          Fn_Phase(journal, 'envoi', 'en cours', 'Paramètre d’effort refusé par l’API (' + Cst_ModeleMAJ + ') — nouvelle tentative sans output_config');
          continue;
        }
        // Versions d'outils refusées : plutôt que d'échouer, on repart avec la
        // recherche seule, en ancienne version — dégradé mais fonctionnel, et
        // dit dans le journal pour que la baisse de qualité ne passe pas inaperçue.
        if (!repliOutils && /tool|web_search|web_fetch/i.test(msgP) && /not (a )?(valid|supported)|unknown|unsupported|invalid/i.test(msgP)) {
          repliOutils = true;
          outils = [{ type: Cst_OutilRechercheRepli, name: 'web_search', max_uses: Cst_MaxRecherches }];
          appliquerDomaines();
          Fn_Phase(journal, 'envoi', 'en cours', 'Outils de recherche refusés par l’API — repli sur la recherche simple (' + Cst_OutilRechercheRepli + ') SANS lecture de page : les multiples et le BPA risquent de manquer');
          continue;
        }
        if (!repliPlafond && plafond > Cst_MaxTokensRepli && /max_tokens/i.test(msgP)) {
          repliPlafond = true; plafond = Cst_MaxTokensRepli;
          Fn_Phase(journal, 'envoi', 'en cours', 'Plafond de sortie refusé par l’API (' + Cst_ModeleMAJ + ') — nouvelle tentative à ' + Fn_FmtNb(plafond, 0) + ' jetons');
          continue;
        }
        // Domaines refusés par l'outil de recherche : l'API rejette la requête en
        // 400 AVANT toute recherche — une seule case cochée dans Paramètres faisait
        // donc échouer la MAJ entière. On retire les domaines nommés, on les
        // mémorise pour les appels suivants, et on relance. Deuxième échec :
        // recherche libre, dite explicitement — mieux vaut chercher partout que
        // ne rien chercher, mais l'utilisateur doit le lire dans le journal.
        if (repliDomaines < 2 && domaines.length && /domain/i.test(msgP)) {
          const refuses = Fn_DomainesRefuses(msgP);
          repliDomaines++;
          if (refuses.length && refuses.length < domaines.length) {
            Var_State.sitesBloques = (Var_State.sitesBloques || []).concat(refuses.filter(d => (Var_State.sitesBloques || []).indexOf(d) < 0));
            domaines = domaines.filter(d => refuses.indexOf(d) < 0);
            appliquerDomaines();
            reecrireTexte(domaines);
            Fn_Phase(journal, 'envoi', 'en cours', 'Domaine(s) refusé(s) par l’outil de recherche (leur éditeur bloque les agents automatiques) : ' + refuses.join(', ') + ' — retirés et mémorisés, nouvelle tentative sur ' + domaines.length + ' site(s)');
          } else {
            if (refuses.length) Var_State.sitesBloques = (Var_State.sitesBloques || []).concat(refuses.filter(d => (Var_State.sitesBloques || []).indexOf(d) < 0));
            domaines = [];
            appliquerDomaines();
            reecrireTexte([]);
            Fn_Phase(journal, 'envoi', 'en cours', 'Tous les sites cochés sont refusés par l’outil de recherche' + (refuses.length ? ' (' + refuses.join(', ') + ')' : ' (l’API ne les nomme pas)') + ' — nouvelle tentative en RECHERCHE LIBRE sur tout le web');
          }
          continue;
        }
        throw errParam;
      }
      texte += res.texte;
      totalEntree += res.entree; totalSortie += res.sortie; totalRech += res.recherches;
      journal.jetonsEntree = totalEntree; journal.jetonsSortie = totalSortie; journal.recherches = totalRech;
      if (res.modele) journal.modele = res.modele;
      stopReason = res.stopReason;
      if (stopReason === 'pause_turn' && continuations < 3) {
        continuations++;
        messagesApi.push({ role: 'assistant', content: res.contenu });
        Fn_Phase(journal, 'recherches', 'en cours', 'Reprise automatique n° ' + continuations + ' (pause_turn : boucle d’outils serveur à poursuivre)');
        continue;
      }
      break;
    }
    journal.stopReason = stopReason;
    Fn_Phase(journal, 'analyse', 'ok');
    Fn_Phase(journal, 'recherches', 'ok', 'Recherches web : ' + totalRech);
    Fn_Phase(journal, 'redaction', 'ok');
    Fn_Phase(journal, 'reception', 'ok', 'Réponse reçue : ' + Fn_FmtNb(totalSortie, 0) + ' jetons de sortie (stop_reason : ' + (stopReason || '?') + ')');
    if (stopReason === 'refusal') {
      throw { api: true, type: 'refusal', message: 'stop_reason: refusal' };
    }
    // Fenêtre de contexte saturée : distinct de max_tokens (plafond de SORTIE).
    // Ici c'est l'ENTRÉE qui ne tient pas — la réponse est inexploitable.
    if (stopReason === 'model_context_window_exceeded') {
      throw { api: true, type: 'contexte_depasse', message: 'stop_reason: model_context_window_exceeded' };
    }
    Fn_Phase(journal, 'parsing', 'en cours');
    const parse = Fn_ParseJsonTolerant(texte);
    if (!parse.data) {
      Fn_Phase(journal, 'parsing', 'echec', 'Interprétation impossible : ' + parse.erreur);
      throw { api: true, type: 'parse', message: 'Réponse illisible malgré le parseur tolérant : ' + parse.erreur };
    }
    journal.tronque = (stopReason === 'max_tokens');
    Fn_Phase(journal, 'parsing', 'ok', 'JSON ' + (parse.repare ? 'RÉPARÉ (troncature : recul au dernier élément complet, fermetures reconstruites)' : 'valide') + (journal.tronque ? ' — réponse tronquée au plafond de jetons' : ''));
    Fn_Phase(journal, 'integration', 'en cours');
    const cartes = Fn_IntegrerConsolidation(parse.data, journal);
    journal.cartesProduites = cartes;
    Fn_Phase(journal, 'integration', 'ok', 'Données intégrées (cours, consensus, valorisation, expertise' + (parse.data.margin ? ', bloc de marge' : '') + ', ' + (journal.opportunitesProduites || 0) + ' opportunité(s)');
    Fn_Phase(journal, 'validations', 'ok', cartes + ' carte(s) « à valider » produite(s) — ' + Fn_NbAValider() + ' en attente au total');
    // Bilan + cumul : calculés dans le finally, pour TOUTE issue (voir plus bas).
    journal.finTs = Date.now();
    journal.statut = journal.tronque ? 'partielle' : 'terminee';
    journal.message = journal.tronque
      ? 'Réponse tronquée au plafond de jetons (stop_reason: max_tokens) — données partielles réparées et intégrées. Relancer une MAJ pour compléter si besoin.'
      : 'Consolidation terminée : ' + cartes + ' carte(s) à valider et ' + (journal.opportunitesProduites || 0) + ' opportunité(s) détectée(s)' + (journal.coursSeuls ? ' (MAJ partielle « cours seuls » — positions et marge inchangées)' : '') + '.';
  } catch (err) {
    journal.finTs = Date.now();
    if (err && err.name === 'AbortError' && rt._stallAbort) {
      journal.statut = 'echec';
      journal.message = 'Flux interrompu : aucun signal reçu depuis 5 minutes écran visible (le temps passé en arrière-plan n’est pas compté) — MAJ coupée automatiquement. Dernière activité : '
        + (journal.listeRecherches && journal.listeRecherches.length ? 'recherche web n° ' + journal.listeRecherches.length + ' (« ' + journal.listeRecherches[journal.listeRecherches.length - 1] + ' »)' : 'envoi de la requête')
        + '. Vérifier la connexion puis relancer.';
    } else if (err && err.name === 'AbortError') {
      journal.statut = 'interrompue';
      journal.message = Fn_MessageErreur(err);
    } else {
      journal.statut = 'echec';
      journal.message = Fn_MessageErreur(err);
      // Flux coupé : c'est la RÉCEPTION qui a échoué, pas l'étape en cours au
      // moment de la coupure. Le diagramme doit désigner le vrai point de rupture.
      if (err && err.fluxIncomplet) Fn_Phase(journal, 'reception', 'echec', 'Connexion fermée avant la fin de la réponse — rien n’a été intégré');
    }
    journal.phases.forEach(p => { if (p.statut === 'en cours') p.statut = 'echec'; });
  } finally {
    if (rt.timers.chrono) { clearInterval(rt.timers.chrono); rt.timers.chrono = null; }
    if (rt.onVisibilite) { document.removeEventListener('visibilitychange', rt.onVisibilite); rt.onVisibilite = null; }
    if (rt.onQuitter) { window.removeEventListener('beforeunload', rt.onQuitter); rt.onQuitter = null; }
    rt.masqueA = null;
    rt.abort = null;
    rt.dernierSignal = null;
    rt.enCours = false;
    // Coût et cumul arrêtés ICI : succès, échec, annulation ou coupure du flux,
    // les jetons consommés sont les mêmes et doivent être comptés une fois.
    Fn_CloturerBilan(journal);
    Fn_Save();
    Fn_RenderVigie();
    if (Var_State.onglet === 'cours') Fn_RenderCours();
    if (Var_State.onglet === 'discipline') Fn_RenderDiscipline();
    if (Var_State.onglet === 'opportunites') Fn_RenderOpportunites();
  }
}

/* ================================================================
   ÉVÉNEMENTS UI — délégation : un listener par conteneur,
   routage data-action / data-id. Suppressions en double-tap
   temporisé (~3 s) — jamais window.confirm/alert.
   ================================================================ */
function Fn_DoubleTap(cle, surConfirme, surRender) {
  const rt = Var_State._runtime;
  if (rt.armes[cle]) {
    clearTimeout(rt.armes[cle]);
    delete rt.armes[cle];
    surConfirme();
  } else {
    rt.armes[cle] = setTimeout(() => { delete rt.armes[cle]; surRender(); }, 3000);
    surRender();
  }
}
function Fn_RenderZonesEvenements() {
  Fn_RenderHero();
  Fn_RenderCalendrier();
  Fn_RenderChips();
  Fn_RenderTimeline();
}
function Fn_OnAction(e) {
  if (e.target.closest && e.target.closest('.gloss')) return; // géré par le popover glossaire
  const el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) return;
  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');
  const rt = Var_State._runtime;
  switch (action) {
    case 'toggle': {
      Var_State.panneaux[id] = !Var_State.panneaux[id];
      Fn_Save();
      if (id === 'maj' || id === 'journal') Fn_RenderMajPanel();
      else if (id === 'formAjout') Fn_RenderFormAjout();
      else if (id === 'oppoCadre') Fn_RenderOpportunites();
      else if (id === 'regles') Fn_RenderRegles();
      else Fn_RenderParametres();
      break;
    }
    case 'aller-avalider': {
      const ancre = document.getElementById('ancre-avalider') || document.getElementById('v-actions');
      if (ancre) ancre.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'maj-lancer': Fn_LancerConsolidation(); break;
    case 'maj-annuler': if (rt.abort) rt.abort.abort(); break;
    case 'docs-vider': {
      Fn_DoubleTap('docs-vider', () => { Fn_DocsVider(); Fn_RenderMajPanel(); }, () => Fn_RenderMajPanel());
      break;
    }
    case 'chip': {
      Var_State.filtreTag = id || null;
      Fn_Save(); Fn_RenderChips(); Fn_RenderTimeline();
      break;
    }
    case 'filtre-jour-clear': {
      Var_State.filtreJour = null;
      Fn_Save(); Fn_RenderCalendrier(); Fn_RenderChips(); Fn_RenderTimeline();
      break;
    }
    case 'cal-jour': {
      Var_State.filtreJour = (Var_State.filtreJour === id) ? null : id;
      Fn_Save(); Fn_RenderCalendrier(); Fn_RenderChips(); Fn_RenderTimeline();
      if (Var_State.filtreJour) {
        const zone = document.getElementById('v-timeline');
        if (zone) zone.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      break;
    }
    case 'ev-traite': {
      const ev = Var_State.events.find(x => x.id === id);
      if (ev) {
        ev.traite = !ev.traite;
        ev.traiteLe = ev.traite ? Fn_AujISO() : null;
        Fn_Save(); Fn_RenderZonesEvenements();
      }
      break;
    }
    case 'ev-suppr': {
      Fn_DoubleTap('ev-' + id, () => {
        Var_State.events = Var_State.events.filter(x => x.id !== id);
        Fn_Save(); Fn_RenderZonesEvenements();
      }, () => Fn_RenderTimeline());
      break;
    }
    case 'form-ajouter': {
      const date = (document.getElementById('f-date') || {}).value;
      const titre = ((document.getElementById('f-titre') || {}).value || '').trim();
      if (!date || !titre) break;
      const tags = ((document.getElementById('f-tags') || {}).value || '').split(',').map(s => s.trim()).filter(Boolean);
      let idEv = Fn_Slug(titre) + '-' + date;
      if (Var_State.events.some(x => x.id === idEv)) idEv += '-' + Math.random().toString(36).slice(2, 5);
      Var_State.events.push({
        id: idEv, date, titre,
        sev: (document.getElementById('f-sev') || {}).value || 'Info',
        tags, unc: !!(document.getElementById('f-unc') || {}).checked,
        metrics: [],
        surveiller: ((document.getElementById('f-surv') || {}).value || '').trim(),
        arbitrage: ((document.getElementById('f-arb') || {}).value || '').trim(),
        pratique: ((document.getElementById('f-prat') || {}).value || '').trim(),
        src: 'ajout manuel du ' + Fn_FmtDateCourt(Fn_AujISO()),
        traite: false, ajoutManuel: true
      });
      Fn_Save(); Fn_RenderZonesEvenements(); Fn_RenderFormAjout();
      break;
    }
    case 'av-accepter': case 'av-rejeter': {
      const carte = Var_State.aValider.find(x => x.id === id);
      if (carte && carte.statut === 'a_valider') {
        if (carte.type === 'evenement') Fn_AccepterEvenementPropose(carte, action === 'av-accepter');
        else Fn_AppliquerEcart(carte, action === 'av-accepter');
        Fn_Save(); Fn_RenderVigie();
      }
      break;
    }
    case 'av-tout-accepter': {
      Var_State.aValider.filter(x => x.statut === 'a_valider').forEach(carte => {
        if (carte.type === 'evenement') Fn_AccepterEvenementPropose(carte, true);
        else Fn_AppliquerEcart(carte, true);
      });
      Fn_Save(); Fn_RenderVigie();
      break;
    }
    case 'act-accepter': case 'act-rejeter': {
      const a = Var_State.actions.find(x => x.id === id);
      if (a && a.statut === 'a_valider') {
        Fn_DeciderAction(a, action === 'act-accepter');
        Fn_Save(); Fn_RenderVigie();
      }
      break;
    }
    case 'opp-filtre': {
      Var_State.filtreOpportunites = id === 'toutes' ? 'toutes' : 'recentes';
      Fn_Save(); Fn_RenderOpportunites();
      break;
    }
    case 'opp-ajouter': {
      const o = {
        id: Fn_Uid('opp'), cleModele: Fn_Uid('manuel'), ticker: '', isin: '', libelle: 'Nouvelle opportunité',
        type: 'watchlist', these: '', coherencePortefeuille: '', facteurs: [], devise: null, score: 50,
        conviction: 'moyenne', prixReference: null, asOf: Fn_FmtHeure(Date.now()), valorisation: '', catalyseurs: '',
        declencheur: '', invalidation: '', risques: '', horizon: '', allocationCiblePctVN: null, liquidite: '',
        src: 'ajout manuel', dateMaj: Var_State.derniereConsolidation || Date.now(), statut: 'a_etudier', noteUtilisateur: '',
        verrouille: true, modifieManuellement: true, modifieLe: Fn_AujISO(), versionModeleEnAttente: null
      };
      Var_State.opportunites.push(o);
      Var_State.filtreOpportunites = 'toutes';
      rt.oppEdition = o.id;
      Fn_Save(); Fn_RenderOpportunites();
      break;
    }
    case 'opp-modifier': rt.oppEdition = id; Fn_RenderOpportunites(); break;
    case 'opp-annuler': rt.oppEdition = null; Fn_RenderOpportunites(); break;
    case 'opp-enregistrer': {
      const o = Var_State.opportunites.find(x => x.id === id);
      if (!o) break;
      const val = q => ((document.getElementById(q) || {}).value || '').trim();
      o.ticker = val('o-ticker').toUpperCase();
      o.libelle = val('o-libelle') || o.ticker || 'Opportunité';
      o.score = Math.max(0, Math.min(100, Fn_Num(val('o-score')) == null ? 50 : Fn_Num(val('o-score'))));
      o.allocationCiblePctVN = Fn_Num(val('o-allocation'));
      o.statut = val('o-statut') || 'a_etudier';
      o.horizon = val('o-horizon');
      o.these = val('o-these');
      o.coherencePortefeuille = val('o-coherence');
      o.declencheur = val('o-declencheur');
      o.invalidation = val('o-invalidation');
      o.risques = val('o-risques');
      o.noteUtilisateur = val('o-note');
      o.verdictCoherence = val('o-verdict') || o.verdictCoherence || 'sous conditions';
      o.financement = val('o-financement');
      o.tailleEur = Fn_Num(val('o-taille'));
      o.dateCatalyseur = val('o-datecat') || null;
      o.modifieManuellement = true; o.modifieLe = Fn_AujISO(); o.verrouille = true;
      rt.oppEdition = null;
      Fn_OpportuniteRetenue(o);
      Fn_Save(); Fn_RenderOpportunites(); Fn_RenderZonesEvenements();
      break;
    }
    case 'opp-verrou': {
      const o = Var_State.opportunites.find(x => x.id === id);
      if (o) { o.verrouille = !o.verrouille; Fn_Save(); Fn_RenderOpportunites(); }
      break;
    }
    case 'opp-appliquer-modele': {
      const o = Var_State.opportunites.find(x => x.id === id);
      if (o && o.versionModeleEnAttente) {
        const garde = { id: o.id, cleModele: o.cleModele, statut: o.statut, noteUtilisateur: o.noteUtilisateur };
        Object.assign(o, o.versionModeleEnAttente, garde, { versionModeleEnAttente: null, verrouille: false, modifieManuellement: false });
        Fn_Save(); Fn_RenderOpportunites();
      }
      break;
    }
    case 'opp-suppr': {
      Fn_DoubleTap('opp-' + id, () => {
        Var_State.opportunites = Var_State.opportunites.filter(o => o.id !== id);
        if (rt.oppEdition === id) rt.oppEdition = null;
        Fn_Save(); Fn_RenderOpportunites();
      }, () => Fn_RenderOpportunites());
      break;
    }
    case 'inst-ajouter': {
      const ticker = ((document.getElementById('i-ticker') || {}).value || '').trim();
      if (!ticker) break;
      if (!Var_State.instruments.some(i => i.ticker === ticker)) {
        Var_State.instruments.push({
          id: Fn_Uid('inst'), ticker,
          isin: ((document.getElementById('i-isin') || {}).value || '').trim(),
          place: ((document.getElementById('i-place') || {}).value || '').trim(),
          libelle: ((document.getElementById('i-lib') || {}).value || '').trim(),
          categorie: (document.getElementById('i-cat') || {}).value || ''
        });
        Fn_Save();
      }
      Fn_RenderParametres();
      break;
    }
    case 'inst-suppr': {
      Fn_DoubleTap('inst-' + id, () => {
        Var_State.instruments = Var_State.instruments.filter(i => i.id !== id);
        Fn_Save(); Fn_RenderParametres();
      }, () => Fn_RenderParametres());
      break;
    }
    case 'seuils-reset': {
      Fn_DoubleTap('seuils-reset', () => {
        Var_State.seuils = Object.assign({}, Cst_SeuilsDefaut);
        Fn_Save(); Fn_RenderParametres();
      }, () => Fn_RenderParametres());
      break;
    }
    case 'ghtoken-voir': {
      const inp = document.getElementById('p-ghtoken');
      if (inp) inp.type = (inp.type === 'password') ? 'text' : 'password';
      break;
    }
    case 'ghtoken-enregistrer': {
      const inp = document.getElementById('p-ghtoken');
      const val = inp ? inp.value.trim() : '';
      if (val) { Fn_SetSyncToken(val); if (inp) inp.value = ''; Fn_RenderParametres(); Fn_RenderEntete(); Fn_SyncTirer(); }
      break;
    }
    case 'ghtoken-effacer': {
      Fn_DoubleTap('ghtoken-effacer', () => { Fn_SetSyncToken(''); Fn_RenderParametres(); Fn_RenderEntete(); }, () => Fn_RenderParametres());
      break;
    }
    case 'sync-maintenant': { Fn_SyncTirer(); break; }
    case 'cle-voir': {
      const inp = document.getElementById('p-cle');
      if (inp) inp.type = (inp.type === 'password') ? 'text' : 'password';
      break;
    }
    case 'cle-enregistrer': {
      const inp = document.getElementById('p-cle');
      const val = inp ? inp.value.trim() : '';
      if (val) {
        Fn_SetApiKey(val);
        if (inp) inp.value = '';
        Fn_RenderParametres(); Fn_RenderEntete();
      }
      break;
    }
    case 'cle-effacer': {
      Fn_DoubleTap('cle-effacer', () => {
        Fn_SetApiKey('');
        Fn_RenderParametres(); Fn_RenderEntete();
      }, () => Fn_RenderParametres());
      break;
    }
    case 'cumul-raz': {
      Fn_DoubleTap('cumul-raz', () => {
        Var_State.cumulApi = { appels: 0, jetonsEntree: 0, jetonsSortie: 0, recherches: 0, coutUsd: 0 };
        Fn_Save(); Fn_RenderParametres();
      }, () => Fn_RenderParametres());
      break;
    }
    case 'sites-tous': {
      const tous = [];
      Cst_SitesRecherche.forEach(g => g.sites.forEach(s => tous.push(s.d)));
      Var_State.sitesRecherche = tous;
      Fn_Save(); Fn_RenderParametres();
      break;
    }
    case 'sites-aucun': {
      Var_State.sitesRecherche = [];
      Fn_Save(); Fn_RenderParametres();
      break;
    }
    case 'sites-debloquer': {
      Var_State.sitesBloques = [];
      Fn_Save(); Fn_RenderParametres();
      break;
    }
    case 'these-revue': {
      const th = Var_State.theses[id] = Var_State.theses[id] || { ecrite: false, invalidation: false, objectif: false, derniereRevue: null };
      th.derniereRevue = Fn_AujISO();
      Fn_Save(); Fn_RenderCours();
      break;
    }
  }
}
function Fn_OnChange(e) {
  const el = e.target.closest ? e.target.closest('[data-action]') : null;
  if (!el) return;
  const action = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');
  switch (action) {
    case 'maj-doc': {
      const fichier = el.files && el.files[0];
      if (!fichier) break;
      Fn_LireFichier(fichier).then(doc => {
        doc.ts = Date.now(); // date d'ajout : sert à signaler une pièce périmée
        Var_State._runtime.docs[id] = doc;
        Fn_DocEnregistrer(id, doc); // survit au rechargement de l'onglet
        Fn_RenderMajPanel();
      }).catch(() => { Fn_RenderMajPanel(); });
      break;
    }
    case 'maj-notrans':
      Var_State._runtime.aucuneTransac = !!el.checked;
      Fn_DocEnregistrer('aucuneTransac', { valeur: !!el.checked, ts: Date.now() });
      Fn_RenderMajPanel();
      break;
    case 'site-recherche': {
      const liste = Var_State.sitesRecherche;
      const pos = liste.indexOf(id);
      if (el.checked) { if (pos < 0) liste.push(id); }
      else if (pos >= 0) liste.splice(pos, 1);
      Fn_Save();
      Fn_RenderParametres(); // le bandeau d'avertissement et le compteur du titre suivent
      break;
    }
    case 'seuil': {
      const v = Fn_Num(el.value);
      if (v != null) { Var_State.seuils[id] = v; Fn_Save(); }
      break;
    }
    case 'tarif': {
      const v = Fn_Num(el.value);
      if (v != null) { Var_State.tarifs[id] = v; Fn_Save(); }
      break;
    }
    case 'zb': Var_State.zbId = el.value.trim(); Fn_Save(); break;
    case 'rappel': Var_State.freqRappel = el.value; Fn_Save(); break;
    case 'sync-importer': {
      const fichier = el.files && el.files[0];
      if (fichier) Fn_SyncImporterFichier(fichier);
      break;
    }
    case 'these-check': {
      const th = Var_State.theses[id] = Var_State.theses[id] || { ecrite: false, invalidation: false, objectif: false, derniereRevue: null };
      th[el.getAttribute('data-champ')] = !!el.checked;
      Fn_Save();
      break;
    }
  }
}
/* ---- Popover glossaire : tap (mobile) et survol (desktop) ---- */
function Fn_OnDocumentClick(e) {
  const g = e.target.closest ? e.target.closest('.gloss') : null;
  const pop = document.getElementById('gloss-popover');
  const rt = Var_State._runtime;
  if (g) {
    const terme = g.getAttribute('data-terme');
    if (!pop.hidden && rt.glossOuvert === terme && (Date.now() - (rt.glossTs || 0)) > 600) Fn_FermerGloss();
    else { Fn_OuvrirGloss(terme, g); rt.glossTs = Date.now(); }
    return;
  }
  if (!pop.hidden && !pop.contains(e.target)) Fn_FermerGloss();
}
function Fn_OnSurvol(e) {
  const g = e.target.closest ? e.target.closest('.gloss') : null;
  if (g) {
    Fn_OuvrirGloss(g.getAttribute('data-terme'), g);
    Var_State._runtime.glossTs = Date.now();
    return;
  }
  // Aide des commandes à la souris : l'infobulle native est posée au survol,
  // une seule fois par élément. Rien n'est parcouru au rendu — un balayage de
  // toutes les commandes après chaque re-rendu coûterait bien plus.
  const cmd = e.target.closest ? e.target.closest('[data-action]') : null;
  if (cmd && !cmd.title) {
    const aide = Fn_TexteAide(cmd);
    if (aide) cmd.title = aide.t + ' — ' + aide.d;
  }
}
/* ---- Aide des commandes au tactile : appui long (~0,5 s) ---- */
// Le survol n'existe pas au doigt : sans ce geste, l'aide serait réservée au PC.
function Fn_AnnulerAideTactile() {
  const rt = Var_State._runtime;
  if (rt.timers.aide) { clearTimeout(rt.timers.aide); rt.timers.aide = null; }
}
function Fn_OnTactileDebut(e) {
  const rt = Var_State._runtime;
  Fn_AnnulerAideTactile();
  const cmd = e.target.closest ? e.target.closest('[data-action]') : null;
  // Champs de saisie exclus : l'appui long y sert à sélectionner du texte.
  if (!cmd || /^(INPUT|TEXTAREA|SELECT)$/.test(cmd.tagName || '')) return;
  const aide = Fn_TexteAide(cmd);
  if (!aide) return;
  const t = e.touches && e.touches[0];
  rt.aideDepart = t ? { x: t.clientX, y: t.clientY } : null;
  rt.timers.aide = setTimeout(() => {
    rt.timers.aide = null;
    rt.aideDeclenchee = true; // le clic de relâchement sera neutralisé
    Fn_OuvrirPopover(aide.t, aide.d, cmd, null);
  }, 500);
}
function Fn_OnTactileBouge(e) {
  const rt = Var_State._runtime;
  if (!rt.timers.aide || !rt.aideDepart) return;
  const t = e.touches && e.touches[0];
  // Un défilement n'est pas une demande d'aide : au-delà de 10 px, on renonce.
  if (t && (Math.abs(t.clientX - rt.aideDepart.x) > 10 || Math.abs(t.clientY - rt.aideDepart.y) > 10)) Fn_AnnulerAideTactile();
}
function Fn_OnFinSurvol(e) {
  const g = e.target.closest ? e.target.closest('.gloss') : null;
  if (!g) return;
  const vers = e.relatedTarget;
  const pop = document.getElementById('gloss-popover');
  if (vers && (pop.contains(vers) || (vers.closest && vers.closest('.gloss') === g))) return;
  Fn_FermerGloss();
}
/* ---- Tick des compteurs temporels (1/min) — mise à jour ciblée, pas de re-rendu ---- */
function Fn_TickCompteurs() {
  document.querySelectorAll('[data-compteur]').forEach(el => {
    const c = Fn_Compteur(el.getAttribute('data-date'), el.getAttribute('data-traite') === '1');
    el.textContent = c.label;
    el.className = 'compteur ' + c.cls;
  });
}

/* ================================================================
   INIT
   ================================================================ */
(async function Fn_Init() {
  await Fn_Load();
  // Pièces jointes du jour restaurées avant le premier rendu : un rechargement
  // d'onglet ne doit plus obliger à re-sélectionner relevé PDF et captures.
  await Fn_DocsRestaurer();
  // PWA : service worker (hors ligne) + tirage de l'état distant, borné à 4 s
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    try { navigator.serviceWorker.register('sw.js'); } catch (e) { /* hors PWA */ }
  }
  await Promise.race([Fn_SyncTirer(true), new Promise(r => setTimeout(r, 4000))]);
  document.getElementById('nav-onglets').addEventListener('click', e => {
    const b = e.target.closest('[data-action="onglet"]');
    if (b) Fn_MontrerOnglet(b.getAttribute('data-id'));
  });
  const principal = document.getElementById('principal');
  principal.addEventListener('click', Fn_OnAction);
  principal.addEventListener('change', Fn_OnChange);
  // Capture, donc AVANT tout autre gestionnaire : un appui long qui vient
  // d'ouvrir l'aide ne doit pas déclencher la commande au relâchement, ni
  // refermer aussitôt le popover qu'il vient d'ouvrir.
  document.addEventListener('click', e => {
    const rt = Var_State._runtime;
    if (!rt.aideDeclenchee) return;
    rt.aideDeclenchee = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
  document.addEventListener('touchstart', Fn_OnTactileDebut, { passive: true });
  document.addEventListener('touchmove', Fn_OnTactileBouge, { passive: true });
  document.addEventListener('touchend', Fn_AnnulerAideTactile, { passive: true });
  document.addEventListener('touchcancel', Fn_AnnulerAideTactile, { passive: true });
  document.addEventListener('click', Fn_OnDocumentClick);
  document.addEventListener('mouseover', Fn_OnSurvol);
  document.addEventListener('mouseout', Fn_OnFinSurvol);
  window.addEventListener('scroll', Fn_FermerGloss, { passive: true });
  Var_State._runtime.timers.tick = setInterval(Fn_TickCompteurs, 60000);
  // Rendu initial de tous les onglets (idempotent), puis restauration de l'onglet actif.
  Fn_RenderVigie();
  Fn_RenderCours();
  Fn_RenderDiscipline();
  Fn_RenderOpportunites();
  Fn_RenderParametres();
  Fn_MontrerOnglet(Var_State.onglet || 'vigie');
})();
</script>
